<style>

.sheet-star.hide { display: none; }
.sheet-pron.tag-mode { display: inline-block; font-size: 11px; font-weight: 700; color: #534AB7; background: #EEEDFE; border-radius: 99px; padding: 3px 10px; margin-bottom: 8px; }
.sheet-word-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }

.sheet-etym.show { display: block; }

<script>
const problems = [
{
  num: 18, type: "글의 목적 파악",
  question: "다음 글의 목적으로 가장 적절한 것은?",
  choices: ["화재 발생 시 대피 요령을 안내하려고","소형 가구의 분리 배출 방법을 공지하려고","소방 안전 규정 위반으로 벌금이 부과되었음을 알리려고","주인 없이 방치된 물품이 폐기되었음을 통보하려고","복도에 놓인 개인 물품을 치울 것을 요청하려고"],
  answer: 4,
  explanation: "'we request that any personal items placed in the hallways be removed by Monday, April 14th'에서 복도에 놓인 개인 물품을 치울 것을 요청하고 있으므로 ⑤번이 정답입니다.",
  vocab: {
    resident: { word:"resident", pron:"[레지던트]", meaning:"주민", ex:"To ensure the safety of all residents", exko:"모든 주민들의 안전을 보장하기 위해" },
    regulation: { word:"regulation", pron:"[레귤레이션]", meaning:"규정", ex:"In accordance with fire safety regulations", exko:"소방 안전 규정에 따라" },
    hallway: { word:"hallways", pron:"[홀웨이즈]", meaning:"복도", ex:"it is essential to keep all hallways free of personal belongings", exko:"모든 복도에 개인 물품이 없도록 하는 것이 중요하다" },
    belonging: { word:"belongings", pron:"[빌롱잉즈]", meaning:"물품, 소지품", ex:"personal belongings such as bicycles, boxes, and small furniture", exko:"자전거, 상자, 작은 가구와 같은 개인 물품" },
    critical: { word:"critical", pron:"[크리티컬]", meaning:"중요한", ex:"Hallways serve as critical evacuation routes.", exko:"복도는 중요한 대피 통로 역할을 한다." },
    evacuation: { word:"evacuation", pron:"[이배큐에이션]", meaning:"대피", ex:"critical evacuation routes during emergencies", exko:"비상시에 중요한 대피 통로" },
    block: { word:"block", pron:"[블락]", meaning:"막다", ex:"anything left there could block the way", exko:"그곳에 놓여 있는 것은 무엇이든 길을 막을 수 있다" },
    ensure: { word:"ensure", pron:"[인슈어]", meaning:"보장하다", ex:"To ensure the safety of all residents", exko:"모든 주민들의 안전을 보장하기 위해" },
    penalty: { word:"penalty", pron:"[페널티]", meaning:"벌금", ex:"not following this may result in penalties", exko:"이를 따르지 않는 것은 벌금으로 이어질 수 있다" },
    cooperation: { word:"cooperation", pron:"[코오퍼레이션]", meaning:"협조", ex:"We appreciate your cooperation in maintaining a safe environment.", exko:"안전한 환경을 유지하는 데 협조해 주셔서 감사합니다." }
  },
  passage: `Notice to Hilltop Apartment Residents

In accordance with fire safety [[regulation::regulations]], it is essential to keep all [[hallway::hallways]] free of personal [[belonging::belongings]] such as bicycles, boxes, and small furniture. Hallways serve as [[critical::critical]] [[evacuation::evacuation]] routes during emergencies, and anything left there could [[block::block]] the way and pose serious safety risks. To [[ensure::ensure]] the safety of all [[resident::residents]], we request that any personal items placed in the hallways be removed by Monday, April 14th. Please note that not following this may result in [[penalty::penalties]]. We appreciate your [[cooperation::cooperation]] in maintaining a safe environment.`,
  translation: `Hilltop 아파트 주민 대상 공지

소방 안전 규정에 따라 모든 복도는 자전거, 상자, 작은 가구와 같은 개인 물품이 없도록 하는 것이 중요합니다. 복도는 비상시에 중요한 대피 통로 역할을 합니다. 그곳에 놓여 있는 것은 무엇이든 길을 막아 심각한 안전상의 위험을 야기할 수 있습니다. 모든 주민들의 안전을 보장하기 위해, 복도에 놓인 모든 개인 물품들을 4월 14일 월요일까지 다 치워 주시기를 요청드립니다. 이를 따르지 않는 것은 벌금으로 이어질 수 있다는 점을 유의해 주시기 바랍니다. 안전한 환경을 유지하는 데 협조해 주셔서 감사합니다.`,
  grammar: [
    { title:"in accordance with + 명사", desc:"'~에 따라, ~에 부합하여'라는 뜻입니다.", ex:"In accordance with fire safety regulations (소방 안전 규정에 따라)" },
    { title:"request that + 주어 + (should) 동사원형", desc:"요청·제안 동사 뒤 that절에는 원형이 옵니다.", ex:"we request that any personal items ... be removed (개인 물품들이 치워지기를 요청드립니다)" }
  ],
  tips: [
    "안내문 목적 문제는 마지막 부분의 요청·공지 문장에 핵심이 담겨 있는 경우가 많습니다.",
    "'we request that ~'과 같은 요청 표현이 나오면 그것이 곧 글의 목적입니다."
  ]
},
{
  num: 19, type: "심경 변화 파악",
  question: "다음 글에 드러난 Nathan의 심경 변화로 가장 적절한 것은?",
  choices: ["embarrassed → relieved","indifferent → surprised","hopeful → disappointed","ashamed → sympathetic","bored → excited"],
  answer: 0,
  explanation: "Nathan은 표를 잘못 산 것을 깨닫고 당황함(confused, a flush of panic)을 느꼈다가, 새 표로 무사히 교환한 뒤 안도함(worries melting away, tension ease)을 느끼므로 심경 변화로 가장 적절한 것은 ①번입니다.",
  vocab: {
    board: { word:"boarded", pron:"[보디드]", meaning:"탔다, 탑승했다", ex:"Nathan boarded the train on Saturday evening.", exko:"Nathan은 토요일 저녁에 기차에 탔다." },
    confused: { word:"confused", pron:"[컨퓨즈드]", meaning:"당황한", ex:"Confused, he checked his ticket and realized his mistake.", exko:"당황하며, 그는 자신의 표를 확인하고 실수를 깨달았다." },
    flush: { word:"flush", pron:"[플러시]", meaning:"확 붉어짐, 화끈거림", ex:"A flush of panic spread across his face.", exko:"그의 얼굴에 당황함이 확 퍼졌다." },
    attendant: { word:"attendant", pron:"[어텐던트]", meaning:"승무원", ex:"He quickly approached a train attendant.", exko:"그는 서둘러 기차 승무원에게 다가갔다." },
    resolve: { word:"resolve", pron:"[리졸브]", meaning:"해결하다", ex:"Is there anything I can do to resolve this?", exko:"이 문제를 해결하기 위해 제가 할 수 있는 일이 있을까요?" },
    reassuring: { word:"reassuring", pron:"[리어슈어링]", meaning:"안심시키는", ex:"the attendant said with a reassuring smile", exko:"승무원이 안심시키는 미소를 지으며 말했다" },
    tension: { word:"tension", pron:"[텐션]", meaning:"긴장", ex:"feeling the tension in his shoulders ease", exko:"어깨의 긴장이 풀리는 것을 느끼며" }
  },
  passage: `Nathan [[board::boarded]] the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. [[confused::Confused]], he checked his ticket and realized his mistake — it was for Sunday, not Saturday! A [[flush::flush]] of panic spread across his face. He quickly approached a train [[attendant::attendant]] and explained the situation. "Is there anything I can do to [[resolve::resolve]] this?" Nathan asked. "Don't worry, sir. We still have seats available," the attendant said with a [[reassuring::reassuring]] smile. Nathan exchanged his old ticket for a new one, his worries melting away. Settling into his seat, he let out a deep breath, feeling the [[tension::tension]] in his shoulders ease as the train began to move.`,
  translation: `Nathan은 토요일 저녁에 기차에 탔다. 그가 자리로 다가갔을 때, 이미 누군가가 그곳에 앉아 있는 것을 발견했다. 당황하며, 그는 자신의 표를 확인하고 실수를 깨달았다 — 토요일이 아니라 일요일이었던 것이다! 그의 얼굴에 당황함이 확 퍼졌다. 그는 서둘러 기차 승무원에게 다가가 상황을 설명했다. "이 문제를 해결하기 위해 제가 할 수 있는 일이 있을까요?" Nathan이 물었다. "걱정 마세요, 손님. 아직 이용 가능한 자리가 있습니다," 승무원이 안심시키는 미소를 지으며 말했다. Nathan은 이전의 표를 새 표로 교환했고, 그의 걱정은 사라졌다. 그의 자리에 앉으며, 그는 깊은 숨을 내쉬었고, 기차가 움직이기 시작하자 어깨의 긴장이 풀리는 것을 느꼈다.`,
  grammar: [

  explanation: "'keeping the ball on a slope'는 본질적으로 불안정한 상태(채소 생산의 극대화)를 재배자가 계속 개입하여 억지로 유지하는 것을 의미하므로, 이는 '높은 채소 수확량을 위해 불안정한 생태계를 유지하는 것'을 뜻하는 ④번이 정답입니다.",

  passage: `The concept of [[ecosystem::ecosystem]] states should be familiar to anyone with a home vegetable garden. The garden is a small ecosystem that the grower attempts to keep in a specific state, namely the maximization of fruit and vegetable production. To achieve this, the grower is almost always [[intervene::intervening]] in the dynamics of the ecosystem; they remove unwanted plants that begin to grow and perhaps spray insecticides and fence off the patch to stop insects and other animals from [[consume::consuming]] the vegetables. Since maximizing vegetable growth is an [[inherently::inherently]] [[unstable::unstable]] state for the ecosystem, the grower is effectively ‹keeping the ball on a slope›. If the grower stops intervening, even for a day, the ecosystem, that small patch of ground, will naturally begin to shift to a more stable state. Vegetables may still grow, but [[yield::yield]] will almost certainly be lower as other plants [[crowd_out::crowd out]] the vegetables and [[wildlife::wildlife]] consume the produce.`,

  passage: `[[commitment::Commitment]] is the glue holding together characteristically human forms of social life. Commitments make individuals' behavior [[predictable::predictable]] in the face of fluctuations in their desires and interests, thereby [[facilitate::facilitating]] the planning and coordination of joint actions involving multiple [[agent::agents]]. Moreover, commitments make people willing to perform actions that they would not otherwise perform. For example, a taxi driver picks up his clients and transports them to their desired [[destination::destination]] because they are committed to paying him afterwards for the service, and a construction worker performs her job every day because her employer has made a credible commitment to pay her at the end of the month. Indeed, the taxi driver and the construction worker are willing to accept money as payment only because a network of other agents (notably the central bank) is committed to taking various measures to [[sustain::sustain]] the currency in question. Thus, social objects and [[institution::institutions]] such as jobs, money, government, scientific collaborations and marriage depend for their origin and [[stability::stability]] upon the credibility of commitments.`,
  translation: `약속은 사회생활에서의 인간 특유의 형태를 결속하는 접착제이다. 약속은 개인의 욕망과 관심이 동요하는 상황에서 그들의 행동을 예측 가능하게 만들고, 그렇게 함으로써 여러 주체가 참여하는 공동 행동의 계획과 조정을 용이하게 한다. 게다가, 약속은 사람들이 그렇지 않으면 수행하지 않을 행동을 기꺼이 수행하도록 만든다. 예를 들어, 택시 기사는 고객이 나중에 서비스에 대해 비용을 지불하겠다고 약속했기 때문에 고객을 태워 (고객이) 원하는 목적지로 운송하고, 건설 노동자는 고용주가 월말에 (급여를) 지불하겠다고 신뢰할 만한 약속을 했기 때문에 매일 업무를 수행한다. 사실, 택시 기사와 건설 노동자가 돈을 보수로 기꺼이 받아들이는 것은 오로지 다른 주체들의 네트워크(특히 중앙은행)가 해당 통화를 유지하기 위한 다양한 조치를 취할 것을 약속했기 때문이다. 따라서 일자리, 돈, 정부, 과학적 협력, 그리고 결혼과 같은 사회적 대상(객체)과 제도는 그 시작과 안정성을 위해 약속의 신뢰성에 의존한다.`,

  passage: `If the brain has already stored someone's face and name, why do we still end up remembering one and not the other? This is because the brain has something of a two-tier memory system at work when it comes to [[retrieve::retrieving]] memories, and this gives rise to a common yet infuriating [[sensation::sensation]]: [[recognise::recognising]] someone, but not being able to remember how or why, or what their name is. This happens because the brain [[differentiate::differentiates]] between [[familiarity::familiarity]] and [[recall::recall]]. To clarify, familiarity (or recognition) is when you [[encounter::encounter]] someone or something and you know you've done so before. But beyond that, you've got nothing; all you can say is this person/thing is already in your memories. Recall is when you can access the original memory of how and why you know this person; recognition is just flagging up the fact that the memory exists.`,
  translation: `만약 뇌가 이미 누군가의 얼굴과 이름을 저장했다면, 왜 우리는 여전히 하나는 기억해내고 다른 하나는 기억해내지 못하게 되는 것일까? 이는 뇌가 기억을 꺼내는 것에 있어서 일종의 2단계 기억 시스템을 가지고 작동하기 때문이며, 이것이 흔하지만 짜증 나는 감정, 즉 누군가를 알아보지만 어떻게, 왜 그런지, 또는 그 사람의 이름이 무엇인지 기억하지 못하는 감정을 유발한다. 이는 뇌가 친숙함과 회상을 구별하기 때문에 발생한다. 명확하게 하자면, 친숙함(또는 인식)은 누군가(혹은 무언가)를 마주쳤고 이전에 그런 적이 있다는 것을 아는 경우이다. 하지만 그 이상으로는, 당신은 아는 것이 없고, 당신이 말할 수 있는 것은 이 사람/사물이 이미 기억 속에 있다는 것뿐이다. 회상은 이 사람을 어떻게, 왜 알고 있는지에 대한 원래의 기억에 접근할 수 있는 경우이며, 인식은 단지 그 기억이 존재한다는 것을 표시해 줄 뿐이다.`,

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g25mar' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function markUnderlinePhrase(text) {
  var prob = problems[current];
  if (!prob || prob.type !== '밑줄 의미 추론' || text.indexOf('‹') !== -1) return text;
  var m = prob.question.match(/밑줄\s*친\s+(.+?)\s*(?:가|이)\s*(?:다음|윗)\s*글/);
  if (!m) return text;
  var pat = m[1].trim().split(/\s+/).map(function(w) {
    var esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return '(?:\\[\\[[^\\]]+?::' + esc + '\\]\\]|' + esc + ')';
  }).join('\\s+');
  var re = new RegExp('(' + pat + ')', 'i');
  return re.test(text) ? text.replace(re, '‹$1›') : text;
}

function renderPassage(text) {
  text = markUnderlinePhrase(text);
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i, skipHistory) {
  current = i; render(); window.scrollTo({top:0, behavior:'smooth'});
  if (!skipHistory) { var h = '#p' + current; if (location.hash !== h) history.pushState({pIdx:current}, '', h); }
}
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  selectProblem(current);
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
