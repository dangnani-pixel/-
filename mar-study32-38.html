<script>
const problems = [
{
  num: 32, type: "빈칸 추론",
  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
  choices: ["adopting the teacher mindset","using leisure time effectively","activating background knowledge","supporting the emotional stability","reducing the amount of studying time"],
  answer: 0,
  explanation: "가르치는 활동(상상의 학생 가르치기, 또래 가르치기, Feynman 기법, 설명 쓰기)이 표면적 익숙함을 진짜 숙달로 바꾼다고 했으므로, '가르치는 사람의 관점을 취하는 것'인 ①번이 정답입니다.",
  vocab: {
    familiarity: { word:"familiarity", pron:"[퍼밀리애러티]", meaning:"익숙함", ex:"Students mistake familiarity with true mastery.", exko:"학생들은 익숙함을 진정한 숙달로 착각한다." },
    mastery: { word:"mastery", pron:"[매스터리]", meaning:"숙달", ex:"true mastery of the subject", exko:"그 과목에 대한 진정한 숙달" },
    competence: { word:"competence", pron:"[캄피턴스]", meaning:"능력", ex:"a dangerous illusion of competence", exko:"위험한 능력의 착각", etym:"com-(함께) + pet(추구하다, Latin petere) + -ence → '함께 추구할 수 있는 능력' → '능력'. 같은 pet 어근을 쓰는 다른 접두사 단어: compete(com-함께 + pet → 함께 겨루다 → 경쟁하다), repeat(re-다시 + peat → 다시 추구하다 → 반복하다), appetite(ad-~을 향해 + pet → 향해 나아가다 → 식욕)." },
    recall: { word:"recall", pron:"[리콜]", meaning:"기억해 내다", ex:"when asked to recall or apply it", exko:"그것을 기억해 내거나 적용하라고 요구받을 때", etym:"re-(다시) + call(부르다) → '다시 불러오다' → '기억해 내다'." },
    cognitive_bias: { word:"cognitive bias", pron:"[코그니티브 바이어스]", meaning:"인지 편향", ex:"This cognitive bias leads learners astray.", exko:"이 인지 편향은 학습자를 잘못 이끈다." },
    overestimate: { word:"overestimate", pron:"[오버에스티메이트]", meaning:"과대평가하다", ex:"Learners overestimate their understanding.", exko:"학습자들은 자신의 이해를 과대평가한다.", etym:"over-(지나치게) + estimate(값을 매기다, Latin aestimare) → '지나치게 평가하다' → '과대평가하다'. 같은 계열: underestimate(under-~보다 적게 + estimate → 과소평가하다), esteem(aestimare에서 유래 → 존중하다)." },
    counters: { word:"counters", pron:"[카운터즈]", meaning:"맞서다, 반박하다", ex:"Teaching actively counters this illusion.", exko:"가르치는 것은 이 착각에 적극적으로 맞선다.", etym:"counter(반대로, Latin contra) + -s → '반대로 맞서다' → '맞서다, 반박하다'. 같은 contra/counter 어근을 쓰는 단어: contrary(contra + -ary → 반대의), encounter(en-안으로 + counter → 마주치다)." },
    surface: { word:"surface familiarity", pron:"[서피스 퍼밀리애러티]", meaning:"표면적인 익숙함", ex:"It transforms surface familiarity into real mastery.", exko:"그것은 표면적 익숙함을 진짜 숙달로 바꾼다." }
  },
  funcWords: {
    struggle: { word:"struggle", tag:"[동사 struggle · 어려움을 겪다]", meaning:"struggle을 '싸우다, 몸부림치다'로만 옮기면 어색해요. 'struggle (to/when ~)'은 '~하는 데 어려움을 겪다'라는 뜻이라서, they struggle when asked to recall or apply it은 '기억해 내거나 적용하라고 요구받으면 어려움을 겪는다'로 해석돼요.", ex:"Students often mistake familiarity with true mastery, creating a dangerous \"illusion of competence\" where recognizing information feels like genuine knowledge, but they struggle when asked to recall or apply it independently.", exko:"학생들은 종종 익숙함을 진정한 숙달과 혼동하여, 정보를 알아보는 것이 진짜 지식처럼 느껴지지만 그것을 스스로 기억해 내거나 적용하라고 요구받으면 어려움을 겪는, 위험한 '능력의 착각'을 만들어낸다." },
    leads: { word:"leads", tag:"[동사 lead · lead A to B]", meaning:"leads를 '이끈다'로만 옮기면 어색해요. 'lead + 목적어 + to부정사'는 '~가 …하게 만들다'라는 뜻이라서, leads learners to overestimate their understanding은 '학습자들이 자신의 이해도를 과대평가하게 만든다'로 해석돼요.", ex:"This cognitive bias, strengthened by passive study methods, leads learners to overestimate their understanding.", exko:"수동적인 공부 방식으로 강화되는 이 인지 편향은 학습자들이 자신의 이해도를 과대평가하게 만든다." },
    solid: { word:"solid", tag:"[형용사 solid · 탄탄한]", meaning:"solid를 '고체의, 딱딱한'으로 보면 어색해요. 지식·이해를 꾸밀 때 solid는 '탄탄한, 견고한'이라는 뜻이라서, ensuring solid, reliable understanding은 '탄탄하고 믿을 만한 이해를 보장한다'로 해석돼요.", ex:"Ultimately, __________ transforms surface familiarity into real mastery, exposing and filling gaps in knowledge and ensuring solid, reliable understanding.", exko:"궁극적으로, __________이 표면적인 익숙함을 진짜 숙달로 바꾸어, 지식의 빈틈을 드러내고 채우며 탄탄하고 믿을 만한 이해를 보장한다." },
    where: { word:"where", tag:"[관계부사 where · 추상적 상황]", meaning:"where는 장소가 아니라 앞의 'illusion of competence'라는 추상적 상황을 선행사로 받는 관계부사예요. where recognizing information feels like genuine knowledge는 '정보를 알아보는 것이 진짜 지식처럼 느껴지는 (그런 착각)'이라고 해석돼요.", ex:"Students often mistake familiarity with true mastery, creating a dangerous \"illusion of competence\" where recognizing information feels like genuine knowledge, but they struggle when asked to recall or apply it independently.", exko:"학생들은 종종 익숙함을 진정한 숙달과 혼동하여, 정보를 알아보는 것이 진짜 지식처럼 느껴지지만 그것을 스스로 기억해 내거나 적용하라고 요구받으면 어려움을 겪는, 위험한 '능력의 착각'을 만들어낸다." },
    like: { word:"like", tag:"[전치사 like]", meaning:"like는 '좋아하다'가 아니라 '~처럼, ~와 같은'이라는 뜻의 전치사로 쓰였어요. feels like genuine knowledge는 '진짜 지식처럼 느껴지다'로, methods like teaching imaginary students는 '상상 속의 학생을 가르치기와 같은 방법들'로 해석돼요.", ex:"Students often mistake familiarity with true mastery, creating a dangerous \"illusion of competence\" where recognizing information feels like genuine knowledge, but they struggle when asked to recall or apply it independently.", exko:"학생들은 종종 익숙함을 진정한 숙달과 혼동하여, 정보를 알아보는 것이 진짜 지식처럼 느껴지지만 그것을 스스로 기억해 내거나 적용하라고 요구받으면 어려움을 겪는, 위험한 '능력의 착각'을 만들어낸다." },
    even: { word:"even", tag:"[부사 even · ~이든]", meaning:"even은 '심지어'보다는 '~이든'이라는 뜻으로, informally or imaginatively 두 가지 방식을 모두 포괄해서 말할 때 쓰였어요. (even informally or imaginatively)는 '비공식적으로든 상상 속에서든'이라고 해석돼요.", ex:"Teaching materials (even informally or imaginatively) actively counters this illusion by requiring deep processing, active recall, structured organization, and revealing gaps in knowledge.", exko:"자료를 가르치는 것은 (비공식적으로든 상상 속에서든) 깊은 처리, 능동적 인출, 체계적인 조직화를 요구하고 지식의 빈틈을 드러냄으로써 이 착각에 적극적으로 맞선다." },
    by: { word:"by", tag:"[전치사 by · 수단]", meaning:"by는 '~함으로써(수단)'라는 뜻의 전치사로, 뒤에 동명사가 이어져요. by requiring deep processing, active recall, structured organization, and revealing gaps in knowledge는 '깊은 처리, 능동적 인출, 체계적인 조직화를 요구하고 지식의 빈틈을 드러냄으로써'라고 해석돼요.", ex:"Teaching materials (even informally or imaginatively) actively counters this illusion by requiring deep processing, active recall, structured organization, and revealing gaps in knowledge.", exko:"자료를 가르치는 것은 (비공식적으로든 상상 속에서든) 깊은 처리, 능동적 인출, 체계적인 조직화를 요구하고 지식의 빈틈을 드러냄으로써 이 착각에 적극적으로 맞선다." },
    mistake: { word:"mistake", tag:"[동사 mistake A with B · 품사 확인 필요]", meaning:"mistake는 '실수'라는 명사로 흔히 알려져 있지만, 여기 Students often mistake familiarity with true mastery에서는 'A를 B와 혼동하다'라는 뜻의 동사예요. '학생들은 종종 실수한다'가 아니라 '학생들은 종종 익숙함을 진정한 숙달과 혼동한다'라고 해석해야 자연스러워요.", ex:"Students often mistake familiarity with true mastery, creating a dangerous \"illusion of competence\" where recognizing information feels like genuine knowledge, but they struggle when asked to recall or apply it independently.", exko:"학생들은 종종 익숙함을 진정한 숙달과 혼동하여, 정보를 알아보는 것이 진짜 지식처럼 느껴지지만 그것을 스스로 기억해 내거나 적용하라고 요구받으면 어려움을 겪는, 위험한 '능력의 착각'을 만들어낸다." },
    employing: { word:"employing", tag:"[동사 employ · 의미 확인 필요]", meaning:"employ는 '고용하다'라는 뜻으로 흔히 알려져 있지만, 여기 employing the Feynman Technique에서는 어떤 방법을 '활용하다, 사용하다'라는 뜻이에요. 'Feynman 기법을 고용하기'가 아니라 'Feynman 기법을 활용하기'라고 해석해야 자연스러워요.", ex:"It introduces powerful methods like teaching imaginary students, peer-teaching in study groups, employing the Feynman Technique, and writing explanations for others.", exko:"그것은 상상 속의 학생을 가르치기, 스터디 그룹에서 또래 가르치기, Feynman 기법 활용하기, 다른 사람을 위해 설명 쓰기와 같은 강력한 방법들을 도입한다." }
  },
  passage: `Students often mistake [[familiarity::familiarity]] with true [[mastery::mastery]], creating a dangerous "illusion of [[competence::competence]]" where recognizing information feels like genuine knowledge, but they struggle when asked to [[recall::recall]] or apply it independently. This [[cognitive_bias::cognitive bias]], strengthened by passive study methods, leads learners to [[overestimate::overestimate]] their understanding. Teaching materials (even informally or imaginatively) actively [[counters::counters]] this illusion by requiring deep processing, active recall, structured organization, and revealing gaps in knowledge. It introduces powerful methods like teaching imaginary students, peer-teaching in study groups, employing the Feynman Technique, and writing explanations for others. Ultimately, __________ transforms [[surface::surface familiarity]] into real mastery, exposing and filling gaps in knowledge and ensuring solid, reliable understanding.`,
  translation: `학생들은 종종 익숙함을 진정한 숙달과 혼동하여, 정보를 알아보는 것이 진짜 지식처럼 느껴지지만 그것을 스스로 기억해 내거나 적용하라고 요구받으면 어려움을 겪는, 위험한 '능력의 착각'을 만들어낸다. 수동적인 공부 방식으로 강화되는 이 인지 편향은 학습자들이 자신의 이해도를 과대평가하게 만든다. 자료를 가르치는 것은 (비공식적으로든 상상 속에서든) 깊은 처리, 능동적 인출, 체계적인 조직화를 요구하고 지식의 빈틈을 드러냄으로써 이 착각에 적극적으로 맞선다. 그것은 상상 속의 학생을 가르치기, 스터디 그룹에서 또래 가르치기, Feynman 기법 활용하기, 다른 사람을 위해 설명 쓰기와 같은 강력한 방법들을 도입한다. 궁극적으로, __________이 표면적인 익숙함을 진짜 숙달로 바꾸어, 지식의 빈틈을 드러내고 채우며 탄탄하고 믿을 만한 이해를 보장한다.`,

{

  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오. [3점]",

  explanation: "물고기 그림 다섯 개 대신 '5'라는 숫자와 물고기 기호를 따로 쓴 것, 즉 숫자를 세는 대상과 분리한 것이 도약이었으므로 ②번이 정답입니다. 'an emancipated number, existing in its own right'가 결정적 단서입니다.",
  vocab: {

    emancipated: { word:"emancipated", pron:"[이맨서페이티드]", meaning:"해방된", ex:"the idea of an emancipated number", exko:"해방된 수라는 개념", etym:"e-(밖으로) + man(손, Latin manus) + cip(잡다, capere) + -ated → '손아귀에서 밖으로 잡아 빼낸' → '해방된'. 같은 어근을 쓰는 단어: manual(manus + -al → 손의), capture(cap → 붙잡다)." },

  funcWords: {
    would: { word:"would", tag:"[조동사 would · 과거의 습관]", meaning:"would를 '~할 것이다'라는 미래·추측으로 보면 시제가 꼬여요. 과거 이야기 속의 would는 '~하곤 했다'라는 과거의 반복된 습관을 나타내서, the Sumerian officials would mark ~는 '수메르의 관리들은 ~을 표시하곤 했다'로 해석돼요.", ex:"From around 3000 BC, the Sumerian officials would mark their lists of goods on clay tablets.", exko:"기원전 3000년경부터, 수메르의 관리들은 물품 목록을 점토판에 표시하곤 했다." },
    mark: { word:"mark", tag:"[동사 mark · 품사 확인 필요]", meaning:"mark를 '자국, 점수'라는 명사로만 알고 있으면 문장 구조가 풀리지 않아요. 여기서는 would 뒤에 온 동사로 '표시하다, (기호를) 새기다'라는 뜻이라서, mark their lists of goods on clay tablets는 '물품 목록을 점토판에 표시하다'로 해석돼요.", ex:"From around 3000 BC, the Sumerian officials would mark their lists of goods on clay tablets.", exko:"기원전 3000년경부터, 수메르의 관리들은 물품 목록을 점토판에 표시하곤 했다." },
    alongside: { word:"alongside", tag:"[전치사 alongside]", meaning:"alongside는 '~을 따라서'가 아니라 '~옆에, ~와 나란히'라는 뜻의 전치사예요. a numeral for the number five alongside a symbol for the fish는 '물고기를 나타내는 기호 옆에 (놓인) 숫자 5를 나타내는 기호'라고 해석돼요.", ex:"In other words, they would represent five fish with a numeral for the number five alongside a symbol for the fish.", exko:"다시 말해, 그들은 물고기 다섯 마리를 물고기를 나타내는 기호 옆에 숫자 5를 나타내는 기호를 두어 표현하게 되었다." },
    whatever: { word:"whatever", tag:"[복합관계대명사 whatever · 무엇이든]", meaning:"whatever는 '무엇이든, ~하는 것은 무엇이든지'라는 뜻의 복합관계대명사예요. or whatever else they were interested in은 '혹은 그들이 관심 있어 하는 다른 무엇이든'으로, independent of whatever it is being used to count는 '그것이 세는 데 사용되는 대상이 무엇이든 그와 독립적인'이라고 해석돼요.", ex:"If they wanted to describe five of something else, they realized they could keep the same numeral and trade the object symbol for a cow, or a jar of oil, or whatever else they were interested in.", exko:"만약 다른 무언가를 다섯 개 나타내고 싶다면, 같은 숫자 기호는 그대로 두고 사물 기호만 소나 기름 항아리, 혹은 그들이 관심 있는 다른 무엇으로 바꾸면 된다는 것을 깨달았다." },
    as: { word:"as", tag:"[접속사 as · 이유]", meaning:"as는 '~로서'나 '~할 때'가 아니라 여기서는 '~이기 때문에(이유)'라는 뜻의 접속사예요. as it is so deeply set into modern thought는 '그것이 현대의 사고에 너무나 깊이 자리 잡고 있어서(때문에)'라고 해석돼요.", ex:"It is easy to take the emancipated number for granted as it is so deeply set into modern thought, but to the earliest civilizations it was intellectually new and extremely powerful.", exko:"해방된 수는 현대의 사고에 너무나 깊이 자리 잡고 있어서 당연하게 여기기 쉽지만, 최초의 문명들에게 그것은 지적으로 새롭고 대단히 강력한 것이었다." },
    into: { word:"into", tag:"[전치사 into · 관용 표현]", meaning:"set into는 물리적으로 '~안으로'가 아니라 '~에 깊이 자리 잡다, 뿌리내리다'라는 관용적 의미로 쓰였어요. so deeply set into modern thought는 '현대의 사고에 너무나 깊이 자리 잡은'이라고 해석돼요.", ex:"It is easy to take the emancipated number for granted as it is so deeply set into modern thought, but to the earliest civilizations it was intellectually new and extremely powerful.", exko:"해방된 수는 현대의 사고에 너무나 깊이 자리 잡고 있어서 당연하게 여기기 쉽지만, 최초의 문명들에게 그것은 지적으로 새롭고 대단히 강력한 것이었다." },
    record: { word:"record", tag:"[동사 record · 품사 확인 필요]", meaning:"record는 '기록(물), 음반'이라는 명사로 흔히 알려져 있지만, 여기 If they wanted to record five fish에서는 '기록하다'라는 뜻의 동사예요. '물고기 다섯 마리라는 기록을 원했다면'이 아니라 '물고기 다섯 마리를 기록하고 싶었다면'이라고 해석해야 자연스러워요.", ex:"If they wanted to record five fish, they would mark five pictures of a fish.", exko:"만약 물고기 다섯 마리를 기록하고 싶으면, 그들은 물고기 그림을 다섯 개 그렸다." },
    goods: { word:"goods", tag:"[명사 goods · 의미 확인 필요]", meaning:"goods는 형용사 good(좋은)의 변형처럼 보이기 쉽지만, 여기 mark their lists of goods에서는 '물품, 상품'이라는 뜻의 명사예요. '좋은 것들의 목록'이 아니라 '물품 목록'이라고 해석해야 자연스러워요.", ex:"From around 3000 BC, the Sumerian officials would mark their lists of goods on clay tablets.", exko:"기원전 3000년경부터, 수메르의 관리들은 물품 목록을 점토판에 표시하곤 했다." }

  passage: `From around 3000 BC, the Sumerian [[officials::officials]] would mark their lists of goods on [[clay_tablets::clay tablets]]. If they wanted to record five fish, they would mark five pictures of a fish. Their first great [[intellectual_leap::intellectual leap]] came from __________. In other words, they would represent five fish with a [[numeral::numeral]] for the number five alongside a symbol for the fish. If they wanted to describe five of something else, they realized they could keep the same numeral and [[trade::trade]] the object symbol for a cow, or a jar of oil, or whatever else they were interested in. The Sumerians had developed the idea of an [[emancipated::emancipated]] number, existing [[in_its_own_right::in its own right]] and independent of whatever it is being used to count. It is easy to [[take_for_granted::take]] the emancipated number [[take_for_granted::for granted]] as it is so deeply set into modern thought, but to the earliest civilizations it was intellectually new and extremely powerful.`,
  translation: `기원전 3000년경부터, 수메르의 관리들은 물품 목록을 점토판에 표시하곤 했다. 만약 물고기 다섯 마리를 기록하고 싶으면, 그들은 물고기 그림을 다섯 개 그렸다. 그들의 첫 번째 위대한 지적 도약은 __________에서 나왔다. 다시 말해, 그들은 물고기 다섯 마리를 물고기를 나타내는 기호 옆에 숫자 5를 나타내는 기호를 두어 표현하게 되었다. 만약 다른 무언가를 다섯 개 나타내고 싶다면, 같은 숫자 기호는 그대로 두고 사물 기호만 소나 기름 항아리, 혹은 그들이 관심 있는 다른 무엇으로 바꾸면 된다는 것을 깨달았다. 수메르인들은 그 자체로 존재하며 그것이 세는 데 사용되는 대상이 무엇이든 그와 독립적인, '해방된 수'라는 개념을 발전시켰던 것이다. 해방된 수는 현대의 사고에 너무나 깊이 자리 잡고 있어서 당연하게 여기기 쉽지만, 최초의 문명들에게 그것은 지적으로 새롭고 대단히 강력한 것이었다.`,

  passage: `The [[emphasis::emphasis]] on learning from the [[ingroup::ingroup]] [[take_account_of::takes little account of]] individuals. Amazingly, while we may dislike some of the people in our ingroup, we still copy them. Wilks, Kirby, and Nielsen studied copying behavior in the context of observing how to open a puzzle box. Ingroups and outgroups were [[distinguished::distinguished]] in a minimal way, using simple color coding of wristbands. The children did not simply like all members of their ingroup; they disliked those who behaved in an [[antisocial::antisocial]] fashion. Indeed, they liked these antisocial ingroup members less than the [[prosocial::prosocial]] members of an outgroup. Still, their dislike did not affect their tendency to copy ingroup behavior more closely than outgroup behavior. This [[overimitation::overimitation]] reveals that we are not copying in order to learn how to open a box most efficiently. We want to learn how to do it in the proper way — in other words, __________. This will be appropriately demonstrated even by antisocial ingroup members.`,

  passage: `[[initially::Initially]] the [[catchphrase::catchphrase]] "less is more" had a simple meaning.

(A) Over time, many of their buttons became viewed as "extra" and were removed, and with each [[reduction::reduction]] these devices eventually developed into the phones in our pockets. The scale of the object became smaller, and the functions of the buttons got lost in the three-dot menus and [[multilayered::multilayered]] folders of our phones.

(B) Robert Browning의 시 'Andrea del Sarto'에서 처음 언급된 그 표현은, 단순한 모든 것이 복잡하고 뒤엉킨 것보다 더 낫고 더 아름답다는 것을 시사한다. 오늘날 이 문구는 자주 — 어쩌면 너무 자주 — 들린다.

  passage: `We first need to understand the short but hidden history behind the plastics industry and how it became deeply [[rooted::rooted in]] our daily lives. Before plastic, people lived more [[sustainably::sustainably]], with far fewer waste problems than we face today.

(A) However, the plastics industry was quick to [[counter::counter]] these concerns, [[launching::launching]] campaigns that presented recycling as the solution to all our problems. They pushed the idea that pollution was the fault of consumers, not the [[corporations::corporations]] [[flooding::flooding]] the market with plastic.

(B) This dream came with a price. Over time, people began to notice the environmental impact, and the early seeds of today's environmental movement were planted.

(C) However, after the invention of plastic, its rapid [[adoption::adoption]] during World War II, and its explosion into consumer goods, plastic was everywhere. The growing industry came to symbolize the convenience and [[prosperity::prosperity]] of the American dream.`,

(A) 그러나 플라스틱 산업계는 이러한 우려에 재빨리 대응하여, 재활용을 우리의 모든 문제에 대한 해결책으로 제시하는 캠페인을 시작했다. 그들은 오염이 플라스틱으로 시장을 넘치게 한 기업들이 아니라 소비자들의 잘못이라는 생각을 밀어붙였다.

(B) 이 꿈에는 대가가 따랐다. 시간이 지나면서 사람들은 환경에 미치는 영향을 알아차리기 시작했고, 오늘날 환경 운동의 초기 씨앗이 심어졌다.

(C) 그러나 플라스틱의 발명과, 2차 세계대전 중 그것의 급속한 도입, 그리고 소비재로의 폭발적 확산 이후, 플라스틱은 어디에나 있게 되었다. 성장하는 그 산업은 아메리칸 드림의 편리함과 번영을 상징하게 되었다.`,

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'mar' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      ph.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  var gc = document.getElementById('given-card');
  if (p.image) { gc.classList.add('show'); gc.innerHTML = '<img src="' + p.image + '" alt="문제 자료">'; }
  else { gc.classList.remove('show'); gc.innerHTML = ''; }
  var ic = document.getElementById('insert-card');
  if (p.insertSentence) {
    ic.classList.add('show');
    document.getElementById('insert-text').textContent = p.insertSentence;
    document.getElementById('insert-text-ko').textContent = p.insertSentenceKo || '';
  } else { ic.classList.remove('show'); }
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i, skipHistory) {
  current = i; render(); window.scrollTo({top:0, behavior:'smooth'});
  if (!skipHistory) { var h = '#p' + current; if (location.hash !== h) history.pushState({pIdx:current}, '', h); }
}
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  selectProblem(current);
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
