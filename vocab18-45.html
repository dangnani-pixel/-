<body>
<div class="wrap">
<div class="source-tag">📝 2025 고1 9월 모의고사 · 영어 단어장 18~45번</div>
<h1>핵심 단어 퀴즈</h1>
<p class="subtitle">문제별 핵심 단어로 퀴즈를 풀어보세요. 모르는 단어를 검색해 ⭐로 저장하면 그 단어도 함께 퀴즈에 나와요.<br><a class="home-link" href="grade1.html">← 고1 9월 학습 홈</a></p>

<div class="group-tabs" id="group-tabs"></div>

<div class="browse-wrap" id="browse-wrap">
  <div class="card">
    <div class="card-label">🔍 단어 검색해서 저장하기</div>
    <div class="search-row">
      <input class="search-input" id="search-input" type="text" placeholder="영어 단어를 입력하세요 (예: gentle)" autocomplete="off">
      <button class="search-btn" onclick="doSearch()">검색</button>
    </div>
    <div class="search-result" id="search-result">
      <button class="star-btn" id="star-btn" onclick="toggleStar()">☆</button>
      <div class="sr-word-row">
        <div class="sr-word" id="sr-word"></div>
        <button class="sr-speak" onclick="speak(currentSearch && currentSearch.word)">🔊</button>
      </div>
      <div class="sr-pron" id="sr-pron"></div>
      <div class="sr-meaning" id="sr-meaning"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">⭐ 내가 저장한 단어</div>
    <div class="chip-row" id="starred-chips"></div>
    <div class="empty-note" id="starred-empty">아직 저장한 단어가 없어요. 위에서 단어를 검색하고 별표를 눌러보세요.</div>
  </div>

  <div class="card">
    <div class="card-label">📖 이 문제의 핵심 단어 (<span id="core-count"></span>개)</div>
    <div class="chip-row" id="core-chips"></div>
  </div>

  <button class="start-btn" id="start-btn" onclick="startQuiz()">🎯 퀴즈 시작하기 (<span id="pool-count"></span>문제)</button>
</div>

<div class="quiz-wrap" id="quiz-wrap">
  <div class="card">
    <div class="q-top">
      <span class="q-prog-text" id="q-prog-text"></span>
      <div class="q-progress-bar"><div class="q-progress-fill" id="q-progress-fill"></div></div>
    </div>
    <div class="q-type-badge" id="q-type-badge"></div>
    <div class="q-prompt" id="q-prompt"></div>
    <div class="q-prompt-sub" id="q-prompt-sub"></div>
    <div id="q-choices"></div>
    <button class="q-next-btn" id="q-next-btn" onclick="nextQuestion()">다음 →</button>
  </div>
</div>

<div class="result-wrap" id="result-wrap">
  <div class="result-score" id="result-score"></div>
  <div class="result-label" id="result-label"></div>
  <button class="result-btn secondary" onclick="backToBrowse()">단어 목록으로</button>
  <button class="result-btn primary" onclick="startQuiz()">다시 풀기</button>
</div>

</div>
<script>

const allWords = groups.reduce(function(acc, g) { return acc.concat(g.words); }, []);

let currentGroupIdx = 0;
let currentSearch = null;
let quizQueue = [];
let quizIdx = 0;
let quizScore = 0;
let answered = false;

function starKey(gid) { return 'vocabStar_' + gid; }

function getStarred(gid) {
  try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; }
}

function setStarred(gid, list) {
  localStorage.setItem(starKey(gid), JSON.stringify(list));
}

function buildTabs() {
  var el = document.getElementById('group-tabs');
  el.innerHTML = groups.map(function(g, i) {
    return '<div class="g-tab" data-i="' + i + '" onclick="selectGroup(' + i + ')">' + g.label + '</div>';
  }).join('');
}

function selectGroup(i) {
  currentGroupIdx = i;
  backToBrowse();
  renderBrowse();
  document.querySelectorAll('.g-tab').forEach(function(t, idx) {
    t.classList.toggle('active', idx === i);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderBrowse() {
  var g = groups[currentGroupIdx];
  document.getElementById('search-input').value = '';
  document.getElementById('search-result').classList.remove('show');
  currentSearch = null;

  var starred = getStarred(g.id);
  var chipsEl = document.getElementById('starred-chips');
  var emptyEl = document.getElementById('starred-empty');
  if (starred.length === 0) {
    chipsEl.innerHTML = '';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    chipsEl.innerHTML = starred.map(function(w, i) {
      return '<div class="chip">⭐ ' + w.word + '<span class="x" onclick="removeStar(' + i + ')">✕</span></div>';
    }).join('');
  }

  document.getElementById('core-count').textContent = g.words.length;
  document.getElementById('core-chips').innerHTML = g.words.map(function(w) {
    return '<div class="chip plain" onclick="speak(\'' + w.word.replace(/'/g,"\\'") + '\')">🔊 ' + w.word + '</div>';
  }).join('');

  var poolSize = g.words.length + starred.length;
  document.getElementById('pool-count').textContent = poolSize;
  document.getElementById('start-btn').disabled = poolSize < 2;
}

function removeStar(i) {
  var g = groups[currentGroupIdx];
  var starred = getStarred(g.id);
  starred.splice(i, 1);
  setStarred(g.id, starred);
  renderBrowse();
}

function doSearch() {
  var input = document.getElementById('search-input');
  var raw = input.value.trim();
  if (!raw) return;
  var word = raw.toLowerCase();
  var box = document.getElementById('search-result');
  box.classList.add('show');
  document.getElementById('sr-word').textContent = raw;
  document.getElementById('sr-pron').textContent = '';
  document.getElementById('sr-meaning').textContent = '뜻을 찾는 중...';
  currentSearch = { word: raw, pron: '', meaning: '', en: '', ko: '' };
  updateStarBtn();

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (!currentSearch || currentSearch.word !== raw) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      currentSearch.pron = phonetic;
      document.getElementById('sr-pron').textContent = phonetic;
      var meaning = entry.meanings && entry.meanings[0];
      var def = meaning && meaning.definitions && meaning.definitions[0];
      if (def && def.example) {
        currentSearch.en = def.example;
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!currentSearch || currentSearch.word !== raw) return;
      var ko = data && data.responseData && data.responseData.translatedText;
      currentSearch.meaning = ko || '뜻을 찾을 수 없어요';
      currentSearch.ko = ko || '';
      document.getElementById('sr-meaning').textContent = currentSearch.meaning;
    })
    .catch(function() {
      if (!currentSearch || currentSearch.word !== raw) return;
      currentSearch.meaning = '인터넷 연결을 확인해주세요';
      document.getElementById('sr-meaning').textContent = currentSearch.meaning;
    });
}

function updateStarBtn() {
  var g = groups[currentGroupIdx];
  var starred = getStarred(g.id);
  var btn = document.getElementById('star-btn');
  var isStarred = currentSearch && starred.some(function(w) { return w.word.toLowerCase() === currentSearch.word.toLowerCase(); });
  btn.textContent = isStarred ? '★' : '☆';
  btn.classList.toggle('starred', !!isStarred);
}

function toggleStar() {
  if (!currentSearch) return;
  var g = groups[currentGroupIdx];
  var saved = currentSearch;
  var starred = getStarred(g.id);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === saved.word.toLowerCase(); });
  if (idx >= 0) {
    starred.splice(idx, 1);
  } else {
    starred.push({
      word: saved.word,
      pron: saved.pron || '',
      meaning: saved.meaning || '뜻 정보 없음',
      en: saved.en || '',
      ko: saved.ko || ''
    });
  }
  setStarred(g.id, starred);
  renderBrowse();
  currentSearch = saved;
  document.getElementById('search-input').value = saved.word;
  document.getElementById('search-result').classList.add('show');
  document.getElementById('sr-word').textContent = saved.word;
  document.getElementById('sr-pron').textContent = saved.pron;
  document.getElementById('sr-meaning').textContent = saved.meaning;
  updateStarBtn();
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function canBlank(item) {
  return item.en && item.word && item.en.toLowerCase().indexOf(item.word.toLowerCase()) !== -1;
}

function startQuiz() {
  var g = groups[currentGroupIdx];
  var pool = g.words.concat(getStarred(g.id));
  if (pool.length < 2) return;

  quizQueue = shuffle(pool).map(function(item) {
    var types = ['en2ko', 'ko2en'];
    if (canBlank(item)) types.push('blank');
    var type = types[Math.floor(Math.random() * types.length)];
    return { item: item, type: type };
  });
  quizIdx = 0;
  quizScore = 0;

  document.getElementById('browse-wrap').classList.add('hide');
  document.getElementById('result-wrap').classList.remove('show');
  document.getElementById('quiz-wrap').classList.add('show');
  renderQuestion();
}

function buildDistractorPool(currentGroupWords, exclude) {
  var localPool = currentGroupWords.filter(function(w) { return w.word !== exclude.word; });
  var pool = localPool.length >= 3 ? localPool : localPool.concat(shuffle(allWords.filter(function(w) { return w.word !== exclude.word; })));
  return pool;
}

function renderQuestion() {
  answered = false;
  var total = quizQueue.length;
  document.getElementById('q-prog-text').textContent = (quizIdx + 1) + ' / ' + total;
  document.getElementById('q-progress-fill').style.width = ((quizIdx + 1) / total * 100) + '%';

  var q = quizQueue[quizIdx];
  var g = groups[currentGroupIdx];
  var groupWords = g.words.concat(getStarred(g.id));
  var distractorSource = buildDistractorPool(groupWords, q.item);

  var badge = document.getElementById('q-type-badge');
  var prompt = document.getElementById('q-prompt');
  var sub = document.getElementById('q-prompt-sub');
  var choicesEl = document.getElementById('q-choices');
  var correctText, choiceTexts, seen;

  if (q.type === 'en2ko') {
    badge.textContent = '영어 → 한국어 뜻 찾기';
    prompt.textContent = q.item.word;
    sub.textContent = q.item.pron || '';
    correctText = q.item.meaning;
    seen = {}; seen[correctText] = true;
    choiceTexts = [correctText];
    for (var i = 0; i < distractorSource.length && choiceTexts.length < 4; i++) {
      var m = distractorSource[i].meaning;
      if (m && !seen[m]) { seen[m] = true; choiceTexts.push(m); }
    }
  } else if (q.type === 'ko2en') {
    badge.textContent = '한국어 → 영어 단어 찾기';
    prompt.textContent = q.item.meaning;
    sub.textContent = '';
    correctText = q.item.word;
    seen = {}; seen[correctText] = true;
    choiceTexts = [correctText];
    for (var j = 0; j < distractorSource.length && choiceTexts.length < 4; j++) {
      var w = distractorSource[j].word;
      if (w && !seen[w]) { seen[w] = true; choiceTexts.push(w); }
    }
  } else {
    badge.textContent = '빈칸에 알맞은 단어 찾기';
    var re = new RegExp(q.item.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
    prompt.textContent = q.item.en.replace(re, '_____');
    sub.textContent = q.item.ko || '';
    correctText = q.item.word;
    seen = {}; seen[correctText] = true;
    choiceTexts = [correctText];
    for (var k = 0; k < distractorSource.length && choiceTexts.length < 4; k++) {
      var w2 = distractorSource[k].word;
      if (w2 && !seen[w2]) { seen[w2] = true; choiceTexts.push(w2); }
    }
  }

  choiceTexts = shuffle(choiceTexts);
  choicesEl.innerHTML = choiceTexts.map(function(t, i) {
    return '<button class="q-choice" data-t="' + encodeURIComponent(t) + '" onclick="selectAnswer(this,\'' + encodeURIComponent(t) + '\',\'' + encodeURIComponent(correctText) + '\')">' + t + '</button>';
  }).join('');
  document.getElementById('q-next-btn').classList.remove('show');
}

function selectAnswer(btn, chosenEnc, correctEnc) {
  if (answered) return;
  answered = true;
  var chosen = decodeURIComponent(chosenEnc);
  var correct = decodeURIComponent(correctEnc);
  var isCorrect = chosen === correct;
  if (isCorrect) quizScore++;

  document.querySelectorAll('.q-choice').forEach(function(el) {
    el.disabled = true;
    var t = decodeURIComponent(el.getAttribute('data-t'));
    if (t === correct) el.classList.add('correct');
    else if (t === chosen) el.classList.add('wrong');
  });

  var nextBtn = document.getElementById('q-next-btn');
  nextBtn.textContent = quizIdx === quizQueue.length - 1 ? '결과 보기' : '다음 →';
  nextBtn.classList.add('show');
}

function nextQuestion() {
  quizIdx++;
  if (quizIdx >= quizQueue.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('quiz-wrap').classList.remove('show');
  document.getElementById('result-wrap').classList.add('show');
  document.getElementById('result-score').textContent = quizScore + ' / ' + quizQueue.length;
  var pct = Math.round(quizScore / quizQueue.length * 100);
  var label = pct === 100 ? '완벽해요! 🎉' : pct >= 70 ? '잘했어요! 👍' : '조금 더 복습해봐요 💪';
  document.getElementById('result-label').textContent = label;
}

function backToBrowse() {
  document.getElementById('quiz-wrap').classList.remove('show');
  document.getElementById('result-wrap').classList.remove('show');
  document.getElementById('browse-wrap').classList.remove('hide');
  renderBrowse();
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

buildTabs();
document.querySelector('.g-tab').classList.add('active');
renderBrowse();
</script>
</body>
</html>
