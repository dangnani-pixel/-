<script>
const problems = [
{
  num: 18, type: "글의 목적 파악",
  question: "다음 글의 목적으로 가장 적절한 것은?",
  choices: ["학교 운동장 사용 허가를 요청하려고","학교 행사의 진행 요원 모집을 안내하려고","지역 축제에 따른 도로 통제를 공지하려고","드론 사용 시 안전 규칙 준수를 당부하려고","행사에서 발생한 쓰레기 처리를 부탁하려고"],
  answer: 0,
  explanation: "'We kindly request your permission to use the school playground'가 핵심이므로 학교 운동장 사용 허가를 요청하는 ①번이 정답입니다.",
  vocab: {
    coordinator: { word:"coordinator", pron:"[코오디네이터]", meaning:"코디네이터, 진행자", ex:"I am the Community Event Coordinator at the Greenfield Community Center.", exko:"저는 Greenfield 주민 센터의 지역 행사 코디네이터입니다." },
    organize: { word:"organize", pron:"[오거나이즈]", meaning:"기획하다, 조직하다", ex:"We are organizing a drone show for the local community.", exko:"저희는 지역 사회를 위한 드론 쇼를 기획하고 있습니다." },
    ideal: { word:"ideal", pron:"[아이디얼]", meaning:"이상적인", ex:"Your school is the best place to ensure safety.", exko:"귀 학교가 안전을 보장할 수 있는 최적의 장소입니다." },
    accessibility: { word:"accessibility", pron:"[액세서빌리티]", meaning:"접근성", ex:"We found that your school ensures the safety and accessibility of all attendees.", exko:"저희는 귀 학교가 모든 참석자의 안전과 접근성을 보장한다는 것을 알게 되었습니다." },
    attendee: { word:"attendee", pron:"[어텐디]", meaning:"참석자", ex:"the safety and accessibility of all attendees", exko:"모든 참석자의 안전과 접근성" },
    request: { word:"request", pron:"[리퀘스트]", meaning:"요청하다", ex:"We kindly request your permission to use the school playground.", exko:"학교 운동장을 사용하는 것에 대한 허가를 정중히 요청드립니다." },
    strictly: { word:"strictly", pron:"[스트릭틀리]", meaning:"엄격하게", ex:"We will ensure that all safety rules are strictly followed.", exko:"저희는 모든 안전 수칙이 엄격하게 지켜지도록 할 것입니다." },
    efficiently: { word:"efficiently", pron:"[이피션틀리]", meaning:"효율적으로", ex:"Any cleanup will be handled efficiently.", exko:"어떠한 청소 작업도 효율적으로 처리될 것입니다." },
    approval: { word:"approval", pron:"[어프루벌]", meaning:"승인", ex:"Please let me know if there are any specific procedures for obtaining approval.", exko:"승인을 받기 위한 특정한 절차가 있으면 알려주시기 바랍니다." },
    consideration: { word:"consideration", pron:"[컨시더레이션]", meaning:"고려", ex:"Thank you for your time and consideration.", exko:"시간을 내어 고려해 주셔서 감사합니다." }
  },
  passage: `Dear Principal Smith,

My name is Kara Peterson, and I am the Community Event [[coordinator::Coordinator]] at the Greenfield Community Center. We are [[organize::organizing]] a drone show for the local community and are excited about this special event. While searching for the [[ideal::ideal]] location, we found that your school is the best place to ensure the safety and [[accessibility::accessibility]] of all [[attendee::attendees]]. I kindly [[request::request]] your permission to use the school playground on Saturday, December 6th, from 6 p.m. to 8 p.m. We will ensure that all safety rules are [[strictly::strictly]] followed, and that any cleanup will be handled [[efficiently::efficiently]]. Please let me know if there are any specific procedures for obtaining [[approval::approval]]. Thank you for your time and [[consideration::consideration]]. I will be eagerly awaiting your response.

Sincerely,
Kara Peterson`,
  translation: `Smith 교장 선생님께,

제 이름은 Kara Peterson이고, 저는 Greenfield 주민 센터의 지역 행사 코디네이터입니다. 저희는 지역 사회를 위한 드론 쇼를 기획하고 있고 이 특별한 행사에 대해 기대감이 큽니다. 이상적인 장소를 찾던 중, 귀 학교가 모든 참석자의 안전과 접근성을 보장할 수 있는 최적의 장소라는 것을 알게 되었습니다. 12월 6일 토요일 오후 6시부터 오후 8시까지 학교 운동장을 사용하는 것에 대한 허가를 정중히 요청드립니다. 저희는 모든 안전 수칙이 엄격하게 지켜지고, 어떠한 청소 작업도 효율적으로 처리될 것을 확실히 할 것입니다. 승인을 받기 위한 특정한 절차가 있으면 알려주시기 바랍니다. 시간을 내어 고려해 주셔서 감사합니다. 간절히 답변을 기다리겠습니다.

Kara Peterson 드림`,
  grammar: [
    { title:"현재완료진행 (while + 동명사)", desc:"'~하던 중에'라는 뜻으로 동시 진행 상황을 나타냅니다.", ex:"While searching for the ideal location, we found that ~ (이상적인 장소를 찾던 중, ~라는 것을 알게 되었다)" },
    { title:"ensure that + 절", desc:"'~을 확실히 하다, 보장하다'라는 뜻입니다.", ex:"We will ensure that all safety rules are strictly followed. (모든 안전 수칙이 엄격히 지켜지도록 할 것이다.)" }
  ],
  tips: [
    "안내문·이메일 유형은 'I kindly request ~' 같은 요청 표현에 목적이 담깁니다.",
    "구체적인 날짜·시간·장소가 나오면 특정 행사를 위한 허가·요청 글일 가능성이 높습니다."
  ]
},
{
  num: 19, type: "심경 변화 파악",
  question: "다음 글에 드러난 Amina의 심경 변화로 가장 적절한 것은?",
  choices: ["jealous → grateful","curious → delighted","proud → ashamed","indifferent → regretful","hopeful → disappointed"],
  answer: 1,
  explanation: "Amina는 낯선 사람들을 보고 'She wondered who they were'라며 궁금해했지만, 학교가 지어진다는 것을 알고 'Amina's eyes sparkled with joy'와 'her heart swelled with excitement'라며 기뻐했으므로 curious → delighted인 ②번이 정답입니다.",
  vocab: {
    clay: { word:"clay", pron:"[클레이]", meaning:"점토", ex:"Amina returned home from the river with her full clay water jar.", exko:"Amina는 물이 가득 찬 점토 물 항아리를 가지고 강에서 집으로 돌아왔다." },
    hut: { word:"hut", pron:"[헛]", meaning:"오두막", ex:"She noticed men with tools near her family's hut.", exko:"그녀는 그녀 가족의 오두막 근처에서 연장을 든 남자들을 발견했다." },
    spot: { word:"spot", pron:"[스팟]", meaning:"지점, 장소", ex:"Her uncle pointed to a spot beyond the baobab tree.", exko:"그녀의 삼촌은 바오밥나무 너머의 한 지점을 가리켰다." },
    mark: { word:"mark", pron:"[마크]", meaning:"표시하다", ex:"The men began clearing and marking the ground.", exko:"남자들은 땅바닥을 치우고 거기에 표시하기 시작했다." },
    proud: { word:"proud", pron:"[프라우드]", meaning:"자랑스러운", ex:"'A school!' her uncle said with a proud smile.", exko:"'학교지!' 삼촌이 자랑스러운 미소를 띠고 말했다." },
    sparkle: { word:"sparkle", pron:"[스파클]", meaning:"반짝거리다", ex:"Amina's eyes sparkled with joy.", exko:"Amina의 눈이 즐거움으로 반짝거렸다." },
    swell: { word:"swell", pron:"[스웰]", meaning:"벅차오르다, 부풀다", ex:"Her heart swelled with excitement.", exko:"그녀의 마음이 흥분으로 벅차올랐다." },
    excitement: { word:"excitement", pron:"[익사이트먼트]", meaning:"흥분", ex:"Amina imagined learning how to read and write, and her heart swelled with excitement.", exko:"Amina는 읽고 쓰는 것을 배우는 상상을 했고, 흥분으로 가슴이 벅차올랐다." }
  },
  passage: `When Amina returned home from the river with her full [[clay::clay]] water jar, she noticed men with tools near her family's [[hut::hut]]. She wondered who they were. Her uncle stood among them, pointing to a [[spot::spot]] beyond the baobab tree. She put the jar down and walked closer, wanting to know what was happening. The men began clearing and [[mark::marking]] the ground. Amina ran to her uncle with a mind full of questions. "Uncle, what's happening?" she asked. "We're preparing the land. Something important will be built. A school!" her uncle said with a [[proud::proud]] smile. Amina's eyes [[sparkle::sparkled]] with joy. The nearest school to her village was hours away on foot. "It's for all the children in the village," her uncle continued. Amina imagined learning how to read and write, and her heart [[swell::swelled]] with [[excitement::excitement]].`,
  translation: `Amina가 물이 가득 찬 점토 물 항아리를 가지고 강에서 집으로 돌아왔을 때, 그녀는 그녀 가족의 오두막 근처에서 연장을 든 남자들을 발견했다. 그녀는 그들이 누구인지 궁금했다. 그녀의 삼촌이 그들 사이에 서 있었는데, 바오밥나무 너머의 한 지점을 가리키고 있었다. 그녀는 무슨 일이 일어나고 있는 건지 알고 싶어서 항아리를 내려놓고 가까이 다가갔다. 남자들은 땅바닥을 치우고 거기에 표시하기 시작했다. Amina는 수많은 질문을 마음에 품고 삼촌에게 달려갔다. "삼촌, 무슨 일이에요?" 그녀가 물었다. "부지를 준비하고 있어. 뭔가 중요한 것이 지어질 거야. 바로 학교지!" 삼촌이 자랑스러운 미소를 띠고 말했다. Amina의 눈이 즐거움으로 반짝거렸다. 마을에서 가장 가까운 학교는 걸어서 몇 시간이나 걸리는 곳에 있었다. "이것은 마을의 모든 아이를 위한 거야." 삼촌이 말을 이었다. Amina는 읽고 쓰는 것을 배우는 상상을 했고, 흥분으로 가슴이 벅차올랐다.`,
  grammar: [

  passage: `"Tactics" is a term drawn from military usage. Strategies are plans of action directing a military force when attacking another, and tactics are responses to conditions on the ground. In this vein, time is [[impose::imposed]] on us by our cultures, by the technologies that have regimented time down to the nanosecond, and by its own [[finite::finite]] nature and the fact that we're going to live only so long. In response, we must develop [[tactics::tactics]] for dealing with time and waiting. These aren't tactics to [[eliminate::eliminate]] waiting; instead, these are tactics for teaching us how to learn from the seams. These tactics have the potential to [[reorient::reorient]] us in [[profound::profound]] ways, transforming our perspectives on our wait times. Such renewed perspectives transform waiting from a [[burden::burden]] to a [[springboard::springboard]] toward things like creativity, social critique, or reflection on our inner state and the state of our relationships.`,
  translation: `'전술'은 군사 용어에서 가져온 말이다. 전략은 다른 군대를 공격할 때 군대를 지휘하는 행동 계획이며, 전술은 전장의 상황에 대한 대응책이다. 이러한 맥락에서, 우리의 문화에 의해, 시간을 나노초 단위로 조직화한 기술에 의해, 그리고 그것의 유한한 본질과 우리가 오직 그 정도만 살 것이라는 사실에 의해 시간이 우리에게 부과된다. 이에 대응하여 우리는 시간과 기다림을 다루는 전술을 개발해야 한다. 이는 기다림을 없애기 위한 전술이 아니다. 대신에, 이는 우리에게 이음매로부터 배우는 방법을 가르치기 위한 전술이다. 이러한 전술은 우리의 기다림의 시간에 대한 우리의 관점을 변화시키면서 심오한 방식으로 우리의 방향을 바꿀 수 있는 잠재력을 가지고 있다. 이러한 새로운 관점은 기다림을 부담에서 창의성, 사회적 비판, 우리 내면의 상태와 우리 관계의 상태에 대한 성찰과 같은 것을 향한 도약의 발판으로 바꿔 준다.`,

  passage: `Mirror neurons are the hardware of [[empathy::empathy]], and so what would make more sense than to look and see which animals [[possess::possess]] these cells? And this is exactly where modern research now stands: all researchers know so far is that apes possess mirror neurons. We still need to test to see which other species are like us in this respect. Scientists often publicly [[speculate::speculate]] that we can probably expect surprises here, too. They assume that all animals that live in [[herd::herds]] or large groups possess similar brain mechanisms, because social units function only if individuals can see things from the [[perspective::perspective]] of others in the group and feel what they are feeling. I can see a goldfish waving its fin at us. As an animal that travels around in a [[tightly_knit::tightly-knit]] group, it's on board with this idea — or at least ‹swimming alongside the boat›.`,
  translation: `거울 뉴런은 공감의 하드웨어이고, 그러니 어떤 동물이 이 세포를 가지고 있는지 살펴보는 것보다 어떤 것이 더 타당하겠는가? 그리고 이것이 바로 현대 연구가 서 있는 곳으로, 현재까지 연구자들이 아는 것은 유인원이 거울 뉴런을 갖고 있다는 것뿐이다. 우리는 여전히 어떤 다른 종이 이 점에서 우리와 비슷한지 알아보기 위해 검증할 필요가 있다. 과학자들은 종종 우리가 아마도 여기서 놀라움을 기대할 수도 있을 것이라고 공공연하게 추측한다. 그들은 무리나 큰 집단으로 사는 모든 동물은 비슷한 두뇌 작동 기제를 가지고 있다고 가정하는데, 왜냐하면 사회적 (구성)단위는 개인이 집단 내 다른 이들의 관점에서 사물을 보고 그들이 느끼고 있는 것을 느낄 수 있어야만 기능하기 때문이다. 나는 우리를 향해 지느러미를 흔들고 있는 금붕어를 볼 수 있다. 긴밀하게 결속된 무리를 지어 다니는 동물로서, 그것은 이러한 생각에 부합하는 배에 올라타 있거나 적어도 그 배와 나란히 헤엄치고 있다.`,

{

  },
  passage: `The future of work depends on two forces: a harmful [[substitute::substituting]] force and a helpful [[complement::complementing]] one. Many tales have a hero and a villain fighting each other for dominance, but in our story, technology plays both roles at once, [[displace::displacing]] workers while [[simultaneously::simultaneously]] raising the demand for their efforts elsewhere in the economy. This interaction helps explain why past worries about automation were misplaced: our ancestors had predicted the wrong winner in that fight, underestimating quite how powerful the complementing force would prove to be or simply ignoring that factor altogether. It also helps to explain why economists have traditionally been [[dismissive::dismissive]] of the idea of technological [[unemployment::unemployment]]: there appeared to be firm limits to the substituting force, leaving lots of tasks that could not be performed by machines, and a growing demand for human beings to do them instead.`,
  translation: `일의 미래는 해로운 대체하는 힘과 도움이 되는 보완하는 힘이라는 두 가지 힘에 달려 있다. 많은 이야기에는 지배권을 놓고 서로 싸우는 영웅과 악당이 있지만, 우리의 이야기에서는 기술이 둘 다의 역할을 동시에 수행하는데, 노동자를 대체하는 동시에 경제의 다른 곳에서 그들의 노력에 대한 수요를 증가시킨다. 이러한 상호작용은 자동화에 대한 과거의 우려가 왜 잘못된 것인지 설명하는 데 도움이 된다. 우리 조상들은 그 싸움의 승자를 잘못 예측하며, 보완하는 힘이 얼마만큼 강력하다고 드러날지를 꽤 과소 평가하거나 혹은 단순히 그 요소를 완전히 무시했었다. 이는 또한 왜 경제학자들이 전통적으로 기술 실업이라는 개념을 무시해 왔는지를 설명하는 데 도움이 된다. 대체하는 힘에는 확고한 한계가 있어 보이고, 기계에 의해서 수행될 수 없는 많은 과업들과, 그것들을 대신 수행할 수 있는 인간에 대한 증가하는 수요를 남겼다.`,

function markUnderlinePhrase(text) {
  var prob = problems[current];
  if (!prob || prob.type !== '밑줄 의미 추론' || text.indexOf('‹') !== -1) return text;
  var m = prob.question.match(/밑줄\s*친\s+(.+?)\s*(?:가|이)\s*(?:다음|윗)\s*글/);
  if (!m) return text;
  var pat = m[1].trim().split(/\s+/).map(function(w) {
    var esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return '(?:\\[\\[[^\\]]+?::' + esc + '\\]\\]|' + esc + ')';
  }).join('\\s+');
  var re = new RegExp('(' + pat + ')', 'i');
  return re.test(text) ? text.replace(re, '‹$1›') : text;
}

function renderPassage(text) {
  text = markUnderlinePhrase(text);
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html + '</p>';
  }).join('');
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
