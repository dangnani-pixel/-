<script>
const problems = [
{
  num: 25, type: "도표 내용 불일치", image: "graph-oct-q25.png",
  question: "다음 도표의 내용과 일치하지 않는 것은?",
  choices: [
    "In each of the five age groups, the percentage of women who preferred purchasing clothes from sustainable brands was over 5%.",
    "The 25-34 and 35-44 age groups had the highest percentage of men who preferred purchasing clothes from sustainable brands.",
    "The percentage point gap between men and women in the 25-34 age group was larger than that in the 18-24 age group.",
    "In the 45-54 age group, the percentage of men was more than twice that of women who did so.",
    "The percentage of men in the 55 and up age group was 4%, which was the lowest among the five age groups."
  ],
  answer: 3,
  explanation: "45~54세 집단에서 남성은 9%, 여성은 6%입니다. 여성의 2배는 12%인데 남성은 9%이므로 '2배가 넘는다'는 ④번 진술은 도표와 일치하지 않습니다.",
  vocab: {
    sustainable: { word:"sustainable", pron:"[서스테이너블]", meaning:"지속 가능한", ex:"They prefer sustainable brands.", exko:"그들은 지속 가능한 브랜드를 선호한다." },
    consumers: { word:"consumers", pron:"[컨슈머즈]", meaning:"소비자", ex:"U.K. consumers were surveyed.", exko:"영국 소비자들이 조사되었다." },
    purchasing: { word:"purchasing", pron:"[퍼처싱]", meaning:"구매하는 것", ex:"They preferred purchasing clothes online.", exko:"그들은 옷을 온라인으로 구매하는 것을 선호했다." },
    percentage_point: { word:"percentage point", pron:"[퍼센티지 포인트]", meaning:"퍼센트포인트", ex:"The percentage point gap was large.", exko:"퍼센트포인트 격차가 컸다." },
    gap: { word:"gap", pron:"[갭]", meaning:"격차, 차이", ex:"There is a gap between men and women.", exko:"남성과 여성 사이에 격차가 있다." },
    twice: { word:"twice", pron:"[트와이스]", meaning:"두 배", ex:"It was more than twice that of women.", exko:"그것은 여성의 두 배가 넘었다." },
    among: { word:"among", pron:"[어멍]", meaning:"~중에서", ex:"It was the lowest among the five groups.", exko:"그것은 다섯 집단 중 가장 낮았다." },
    age_group: { word:"age group", pron:"[에이지 그룹]", meaning:"연령대", ex:"There are five age groups.", exko:"다섯 개의 연령대가 있다." }
  },
  funcWords: {
    who: { word:"who", tag:"[관계대명사 · 주격]", meaning:"who는 women을 선행사로 받는 주격 관계대명사예요. 'women who preferred purchasing clothes from sustainable brands'는 '지속 가능한 브랜드에서 옷 구매를 선호한 여성들'이라는 뜻으로, 도표 설명 문장마다 반복해서 나오니 구조를 한 번 익혀두면 편해요.", ex:"In each of the five age groups, the percentage of women who preferred purchasing clothes from sustainable brands was over 5 percent.", exko:"다섯 개 연령대 각각에서, 지속 가능한 브랜드에서 옷 구매를 선호한 여성의 비율은 5퍼센트를 넘었다." },
    did: { word:"did", tag:"[대동사 did]", meaning:"'who did so'에서 did so는 앞에 나온 'preferred purchasing clothes from sustainable brands'라는 동사구 전체를 대신하는 대동사 표현이에요. '그렇게 한(=지속 가능한 브랜드 구매를 선호한) 여성'이라고 해석하세요.", ex:"In the 45-54 age group, the percentage of men who preferred purchasing clothes from sustainable brands was more than twice that of women who did so.", exko:"45~54세 연령대에서, 지속 가능한 브랜드 구매를 선호한 남성의 비율은 그렇게 한 여성 비율의 두 배가 넘었다." },
    that: { word:"that", tag:"[대명사 that]", meaning:"여기서 that은 앞에 나온 명사(the percentage point gap)의 반복을 피하려고 쓰인 대명사예요. 'that in the 18-24 age group'은 '18~24세 연령대의 (격차)'라는 뜻이 됩니다.", ex:"The percentage point gap between men and women who preferred purchasing clothes from sustainable brands in the 25-34 age group was larger than that in the 18-24 age group.", exko:"25~34세 연령대에서 지속 가능한 브랜드 구매를 선호한 남성과 여성 사이의 퍼센트포인트 격차는 18~24세 연령대의 격차보다 더 컸다." },
    which: { word:"which", tag:"[관계대명사 · 계속적 용법]", meaning:"콤마 뒤 which는 앞 내용 전체(4퍼센트였다는 사실)를 받아 부연 설명하는 계속적 용법의 관계대명사예요. '그런데 이것이 다섯 연령대 중 가장 낮았다'라고 이어서 해석해요.", ex:"The percentage of men who preferred purchasing clothes from sustainable brands in the 55 and up age group was 4 percent, which was the lowest among the five age groups.", exko:"55세 이상 연령대에서 지속 가능한 브랜드 구매를 선호한 남성의 비율은 4퍼센트였고, 이는 다섯 연령대 중 가장 낮았다." },
    over: { word:"over", tag:"[전치사 over · 의미 확인]", meaning:"over는 '~위에'라는 위치를 뜻하는 것으로 잘 알려져 있지만, 여기 'was over 5 percent'에서는 '~을 넘는, 초과하는'이라는 뜻이에요. '5퍼센트를 넘었다'라고 해석하세요.", ex:"In each of the five age groups, the percentage of women who preferred purchasing clothes from sustainable brands was over 5 percent.", exko:"다섯 개 연령대 각각에서, 지속 가능한 브랜드에서 옷 구매를 선호한 여성의 비율은 5퍼센트를 넘었다." },
    by: { word:"by", tag:"[전치사 by · 기준]", meaning:"by는 '~에 의해(행위자)'라는 뜻으로 흔히 알려져 있지만, 여기 'by age and gender'에서는 '~에 따라, ~별로'라는 뜻의 전치사예요. '연령과 성별에 따라'라고 해석하세요.", ex:"The above graph shows the percentages of U.K. consumers who preferred purchasing clothes from sustainable brands by age and gender in 2020.", exko:"위 도표는 2020년 연령과 성별에 따라 지속 가능한 브랜드에서 옷을 구매하는 것을 선호한 영국 소비자의 비율을 보여준다." }
  },
  passage: `The above graph shows the percentages of U.K. [[consumers::consumers]] who preferred [[purchasing::purchasing]] clothes from [[sustainable::sustainable]] brands by age and gender in 2020. ① In each of the five [[age_group::age groups]], the percentage of women who preferred purchasing clothes from sustainable brands was over 5 percent. ② The 25-34 and 35-44 age groups had the highest percentage of men who preferred purchasing clothes from sustainable brands. ③ The [[percentage_point::percentage point]] [[gap::gap]] between men and women who preferred purchasing clothes from sustainable brands in the 25-34 age group was larger than that in the 18-24 age group. ④ In the 45-54 age group, the percentage of men who preferred purchasing clothes from sustainable brands was more than [[twice::twice]] that of women who did so. ⑤ The percentage of men who preferred purchasing clothes from sustainable brands in the 55 and up age group was 4 percent, which was the lowest [[among::among]] the five age groups.`,
  translation: `위 도표는 2020년 연령과 성별에 따라 지속 가능한 브랜드에서 옷을 구매하는 것을 선호한 영국 소비자의 비율을 보여준다. ① 다섯 개 연령대 각각에서, 지속 가능한 브랜드에서 옷 구매를 선호한 여성의 비율은 5퍼센트를 넘었다. ② 25~34세와 35~44세 연령대가 지속 가능한 브랜드에서 옷 구매를 선호한 남성의 비율이 가장 높았다. ③ 25~34세 연령대에서 지속 가능한 브랜드 구매를 선호한 남성과 여성 사이의 퍼센트포인트 격차는 18~24세 연령대의 격차보다 더 컸다. ④ 45~54세 연령대에서, 지속 가능한 브랜드 구매를 선호한 남성의 비율은 그렇게 한 여성 비율의 두 배가 넘었다. ⑤ 55세 이상 연령대에서 지속 가능한 브랜드 구매를 선호한 남성의 비율은 4퍼센트였고, 이는 다섯 연령대 중 가장 낮았다.`,

  passage: `Human beings have evolved to [[make_the_most_of::make the most of]] the resources available to them in ways that are [[subtle::subtle]] and complicated. When we change our diets, especially when we do so quickly, we are ① effectively conducting huge experiments in nutrition. We ought to have more [[humility::humility]]. Nutritional science is still young and there is so much we do not know. If we have eaten certain foods in certain ways for [[millennia::millennia]], we should assume until it is proven [[otherwise::otherwise]] ② what there is probably a good reason why. Traditional foods that don't fit neatly on the contemporary dietary food plate should generally be chosen over highly [[processed::processed]] ones that ③ do. We should assume that traditionally ④ made fatty blood sausages are [[preferable::preferable]] to lean, factory-made salamis; that spoonfuls of honey are superior to sprinkles of sweeteners. Witnessing how poorly traditional societies are faring as they undergo a nutrition [[transition::transition]] should make those who have already completed it ⑤ question whether their diets have moved too far.`,
  translation: `인간은 미묘하고 복잡한 방식으로 자신에게 이용 가능한 자원을 최대한 활용하도록 진화해 왔다. 우리가 식단을 바꿀 때, 특히 그것을 빠르게 할 때, 우리는 사실상 영양학에서 거대한 실험을 하고 있는 것이다. 우리는 더 겸손해야 한다. 영양 과학은 아직 역사가 짧고 우리가 모르는 것이 너무나 많다. 만약 우리가 수천 년 동안 특정한 방식으로 특정한 음식을 먹어 왔다면, 그렇지 않다고 증명될 때까지 우리는 아마도 그럴 만한 타당한 이유가 있다고 가정해야 한다. 현대의 식단 접시에 딱 들어맞지 않는 전통 음식이 그것에 들어맞는 고도로 가공된 음식보다 일반적으로 선택되어야 한다. 우리는 전통적으로 만들어진 기름진 순대가 기름기 없는 공장제 살라미보다 더 낫고, 꿀 한 숟가락이 감미료 가루보다 더 우수하다고 가정해야 한다. 전통 사회가 영양 전환을 겪으면서 얼마나 좋지 않게 살아가고 있는지를 목격하는 것은, 이미 그 전환을 마친 사람들이 자신의 식단이 너무 멀리 와버린 것은 아닌지 의문을 갖게 만들 것이다.`,

  passage: `While convenience and technology are [[crucial::crucial]], they are not the only factors driving Gen Z's financial decisions. This generation is incredibly [[values_driven::values-driven]], and they want to bank with institutions that match their personal beliefs and values. [[transparency::Transparency]] is vital. Gen Z is [[skeptical::skeptical]] of large corporations and institutions that ① lack [[accountability::accountability]]. They have grown up in a world where information is freely available, and they expect complete transparency from the brands they support. Banks, for example, must ② clearly communicate fees, terms, and conditions, as well as how they handle customers' data. Moreover, [[ethical::ethical]] banking practices are more ③ important than ever. Gen Z cares about the environment, social justice, and the ethical [[implications::implications]] of their financial decisions. They are interested in sustainable investing, supporting businesses that match their values, and ensuring that their money is not being used to fund ④ beneficial practices. Banks that offer socially responsible investment opportunities and are committed to environmental [[sustainability::sustainability]] will ⑤ attract Gen Z's attention.`,
  translation: `편의성과 기술이 매우 중요하기는 하지만, 그것들이 Z세대의 금융 결정을 이끄는 유일한 요인은 아니다. 이 세대는 대단히 가치 중심적이며, 자신의 개인적 신념 및 가치와 부합하는 기관과 거래하기를 원한다. 투명성이 매우 중요하다. Z세대는 책임감이 부족한 대기업과 기관에 회의적이다. 그들은 정보를 자유롭게 얻을 수 있는 세상에서 자랐고, 자신이 지지하는 브랜드로부터 완전한 투명성을 기대한다. 예를 들어 은행은 수수료, 약관, 조건뿐만 아니라 고객 데이터를 어떻게 처리하는지도 명확하게 알려야 한다. 게다가, 윤리적인 금융 관행이 그 어느 때보다 중요하다. Z세대는 환경, 사회 정의, 그리고 자신의 금융 결정이 갖는 윤리적 함의에 관심을 갖는다. 그들은 지속 가능한 투자, 자신의 가치와 맞는 기업을 지원하는 것, 그리고 자신의 돈이 유익한(→해로운) 관행에 자금을 대는 데 사용되지 않도록 하는 것에 관심이 있다. 사회적으로 책임 있는 투자 기회를 제공하고 환경 지속 가능성에 전념하는 은행은 Z세대의 관심을 끌 것이다.`,

  passage: `Myths aren't only stories. For example, a well-known myth that [[persists::persists]] today is the [[supposed::supposed]] high iron content in spinach. This is a legend that dates back to 1890 and [[originates::originates from]] a simple [[miscalculation::miscalculation]] by physiologist Gustav von Bunge. He [[accurately::accurately]] determined that 100 grams of spinach contained 35 milligrams of iron but he was analyzing dried spinach, which held ten times more iron than the same amount of fresh leafy greens. Although the error was [[swiftly::swiftly]] corrected, the correction was just as swiftly forgotten. The myth had [[taken_hold::taken hold]]. Popeye, who gained superhuman strength from the leafy greens and defended himself with iron fists, contributed to its __________ and even today, some nearly 150 years later, parents the world over use this tale to try to [[persuade::persuade]] their children into eating the healthy vegetable.`,
  translation: `신화는 단지 이야기만이 아니다. 예를 들어, 오늘날까지 지속되는 잘 알려진 신화 하나는 시금치에 철분 함량이 높다고 여겨지는 것이다. 이것은 1890년까지 거슬러 올라가는 전설이며 생리학자 Gustav von Bunge의 단순한 계산 착오에서 비롯되었다. 그는 시금치 100그램에 철분 35밀리그램이 들어 있다고 정확하게 측정했지만, 그는 말린 시금치를 분석하고 있었고, 그것은 같은 양의 신선한 잎채소보다 열 배 더 많은 철분을 함유하고 있었다. 그 오류는 신속하게 정정되었지만, 그 정정 또한 그만큼 신속하게 잊혔다. 그 신화는 이미 자리를 잡아버린 것이다. 잎채소로부터 초인적인 힘을 얻고 철 주먹으로 자신을 방어했던 뽀빠이는 그 신화의 지속에 기여했고, 심지어 오늘날 거의 150년이 지난 지금도 전 세계의 부모들은 아이들에게 그 건강한 채소를 먹게 하려고 이 이야기를 사용한다.`,
  grammar: [
    { title:"관계대명사 which (계속적 용법)", desc:"콤마 뒤 which가 앞의 명사를 부연 설명합니다.", ex:"dried spinach, which held ten times more iron (말린 시금치는, 그런데 그것은 열 배 많은 철분을 함유했다)" },
    { title:"Although + 절 (양보)", desc:"'비록 ~이지만'이라는 뜻으로 뒤에 반대되는 내용이 옵니다.", ex:"Although the error was corrected, it was forgotten. (오류가 정정되었지만 잊혔다.)" },
    { title:"persuade + 목적어 + into ~ing", desc:"'~하도록 설득하다'라는 뜻의 표현이에요.", ex:"persuade their children into eating vegetables (아이들이 채소를 먹도록 설득하다)" }
  ],
  tips: [
    "빈칸 앞뒤의 대조 구조를 보세요. '정정됐다 → 그런데 잊혔다 → 신화는 자리 잡았다'가 핵심 흐름입니다.",
    "빈칸 뒤 'even today, some nearly 150 years later'가 결정적 단서로, 신화가 계속 이어졌음을 보여줍니다.",
    "선택지에 correction, disappearance처럼 지문에 나온 단어를 그대로 쓴 오답이 있으니 문맥으로 판단하세요."
  ]
}
];

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'oct' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  var gc = document.getElementById('given-card');
  if (p.image) { gc.classList.add('show'); gc.innerHTML = '<img src="' + p.image + '" alt="문제 자료">'; }
  else { gc.classList.remove('show'); gc.innerHTML = ''; }
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i) { current = i; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  render(); window.scrollTo({top:0, behavior:'smooth'});
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
render();
</script>
<script src="study-stats.js"></script>
<script type="module" src="firebase-sync.js"></script>
</body>
