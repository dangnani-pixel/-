{ label:"3번", type:"요지 파악",
  lines:[{spk:"M", text:"Hello, everyone. Today, I am going to talk about how we can support senior citizens in the digital age. You may have heard that many seniors are struggling with digital technologies in their daily lives, such as ordering food at kiosks or using mobile banking apps. Because they are not familiar with these digital services, seniors may find it difficult to keep up with all the changes in today's world. That's why we need to provide them with digital education. By teaching seniors how to utilize digital skills, we can help them navigate modern life smoothly and they won't feel left behind."}],
  translation:"M: 안녕하세요, 여러분. 오늘은, 디지털 시대에 우리가 어떻게 노인들을 지원할 수 있는지에 대해 이야기하려고 합니다. 여러분은 많은 노인들이 키오스크에서 음식을 주문하거나 모바일 뱅킹 앱을 사용하는 것과 같은 일상 생활에서 디지털 기술로 고군분투하고 있다는 것을 들어본 적이 있을 것입니다. 그들은 이러한 디지털 서비스에 익숙하지 않기 때문에, 노인들은 오늘날 세상의 모든 변화를 따라가는 것이 어렵다고 느낄 수 있습니다. 그것이 바로 우리가 그들에게 디지털 교육을 제공해야 하는 이유입니다. 노인들에게 디지털 기술을 활용하는 법을 가르침으로써, 우리는 그들이 현대 생활을 부드럽게 항해하도록 도울 수 있고 그들은 뒤처졌다고 느끼지 않을 것입니다.",
  vocab:[
    { word:"struggle with", pron:"[스트러글 위드]", meaning:"~로 고군분투하다", ex:"many seniors are struggling with digital technologies", ko:"많은 노인들이 디지털 기술로 고군분투하고 있다" },
    { word:"utilize", pron:"[유틸라이즈]", meaning:"활용하다", ex:"teaching seniors how to utilize digital skills", ko:"노인들에게 디지털 기술을 활용하는 법을 가르치는 것" },
    { word:"navigate", pron:"[내비게이트]", meaning:"항해하다, 헤쳐나가다", ex:"help them navigate modern life smoothly", ko:"그들이 현대 생활을 부드럽게 항해하도록 돕다" },
    { word:"smoothly", pron:"[스무들리]", meaning:"부드럽게, 순조롭게", ex:"navigate modern life smoothly", ko:"현대 생활을 부드럽게 항해하다" }
  ],
  questions:[{ qNum:3, question:"다음을 듣고, 남자가 하는 말의 요지로 가장 적절한 것을 고르시오.",
    choices:["노인에게 디지털 기술 활용 교육을 제공해야 한다.","노인을 위한 맞춤형 디지털 기기를 개발해야 한다.","노인을 위한 대면 서비스를 계속 운영해야 한다.","노인을 대상으로 하는 금융 범죄를 예방해야 한다.","노인이 디지털 기술에 적응하지 못하는 이유를 이해해야 한다."],
    answer:0, explanation:"'we need to provide them with digital education. By teaching seniors how to utilize digital skills...'에서 노인에게 디지털 기술 활용 교육을 제공해야 한다는 요지를 전하고 있으므로 ①번이 정답입니다." }]
},
{ label:"4번", type:"그림 불일치", svgKey:"bandroom",
  lines:[
    {spk:"W", text:"I've just finished setting up the band rehearsal room. How does it look?"},
    {spk:"M", text:"Wow! I like that banner on the wall. It's really eye-catching."},
    {spk:"W", text:"I agree. What do you think about the position of the drum set below the banner?"},
    {spk:"M", text:"It looks good. In that position, the drummer can lead our band easily."},
    {spk:"W", text:"That's what I intended."},
    {spk:"M", text:"I also see you've set up three microphones. That should be perfect when many singers want to sing together."},
    {spk:"W", text:"Exactly. And check out this triangle-shaped guitar. Isn't it cool?"},
    {spk:"M", text:"It sure is! I've never seen a guitar like that before. It really stands out."},
    {spk:"W", text:"I think so, too. And I placed the keyboard next to the guitar so that our band members can communicate easily."},
    {spk:"M", text:"That's smart. This setup is perfect for our band."}
  ],
  translation:"W: 밴드 연습실 준비를 방금 끝냈어요. 어때 보여요?\nM: 와! 벽에 있는 현수막이 마음에 드네요. 정말 눈에 띄어요.\nW: 저도 그렇게 생각해요. 현수막 아래 드럼 세트의 위치는 어때요?\nM: 좋아 보여요. 그 위치라면, 드러머가 우리 밴드를 쉽게 이끌 수 있겠어요.\nW: 그게 제가 의도한 거예요.\nM: 마이크도 세 개 설치하셨네요. 여러 명이 함께 노래하고 싶을 때 완벽하겠어요.\nW: 맞아요. 그리고 이 삼각형 모양의 기타 좀 보세요. 멋지지 않아요?\nM: 정말 그렇네요! 저런 기타는 한 번도 본 적이 없어요. 정말 눈에 띄네요.\nW: 저도 그렇게 생각해요. 그리고 밴드 멤버들이 쉽게 소통할 수 있도록 키보드를 기타 옆에 두었어요.\nM: 똑똑하네요. 이 배치는 우리 밴드에게 완벽해요.",
  vocab:[
    { word:"rehearsal", pron:"[리허설]", meaning:"연습, 리허설", ex:"I've just finished setting up the band rehearsal room.", ko:"밴드 연습실 준비를 방금 끝냈다." },
    { word:"eye-catching", pron:"[아이 캐칭]", meaning:"눈에 띄는", ex:"I like that banner on the wall. It's really eye-catching.", ko:"벽에 있는 현수막이 마음에 든다. 정말 눈에 띈다." },
    { word:"stand out", pron:"[스탠드 아웃]", meaning:"눈에 띄다", ex:"It really stands out.", ko:"그것은 정말 눈에 띈다." }
  ],
  questions:[{ qNum:4, question:"대화를 듣고, 그림에서 대화의 내용과 일치하지 않는 것을 고르시오.",
    choices:["①","②","③","④","⑤"],
    answer:2, explanation:"대화에서는 마이크를 '세 개(three microphones)' 설치했다고 했지만, 그림에는 마이크 스탠드가 두 개만 있으므로 일치하지 않는 것은 ③번입니다." }]
},
{ label:"5번", type:"할 일 파악",
  lines:[
    {spk:"M", text:"Ms. Anderson, are we all set for the culture exchange program with the French students?"},
    {spk:"W", text:"It's going well, Mr. Grant. Do you want to go over what we've done so far?"},
    {spk:"M", text:"Sure. I've been teaching our students some basic French greetings, and they've been practicing their welcome speech."},
    {spk:"W", text:"That sounds nice. Your efforts will definitely help the exchange students feel welcome. I've prepared all the traditional craft materials for them."},
    {spk:"M", text:"It would be great if the students could work in pairs for the traditional crafts session."},
    {spk:"W", text:"Exactly. I've already made a list of pairs. I paired one student from our school with a student from France."},
    {spk:"M", text:"Good. And I've ordered keyrings to use as souvenirs. They should arrive this afternoon."},
    {spk:"W", text:"Let me know if you need any help."},
    {spk:"M", text:"Actually, there is one thing. Could you wrap the keyrings when they arrive? I think I won't have time for that."},
    {spk:"W", text:"Of course, I'd be happy to help you with that."}
  ],
  translation:"M: Anderson 선생님, 프랑스 학생들과의 문화 교류 프로그램 준비는 다 되었나요?\nW: 잘 되어가고 있어요, Grant 선생님. 지금까지 한 일을 검토해 볼까요?\nM: 좋아요. 저는 우리 학생들에게 기본적인 프랑스어 인사말을 가르쳐 왔고, 그들은 환영 연설을 연습해 왔어요.\nW: 좋네요. 선생님의 노력이 교환 학생들이 환영받는다고 느끼는 데 분명히 도움이 될 거예요. 저는 그들을 위해 전통 공예 재료를 모두 준비했어요.\nM: 전통 공예 시간에 학생들이 짝을 지어 활동할 수 있으면 좋겠어요.\nW: 맞아요. 저는 이미 짝 목록을 만들었어요. 우리 학교 학생 한 명과 프랑스 학생 한 명을 짝지었어요.\nM: 좋아요. 그리고 저는 기념품으로 쓸 열쇠고리를 주문했어요. 오늘 오후에 도착할 거예요.\nW: 도움이 필요하면 알려주세요.\nM: 사실, 한 가지 있어요. 열쇠고리가 도착하면 포장해 주실 수 있나요? 저는 그럴 시간이 없을 것 같아요.\nW: 물론이죠, 기꺼이 도와드릴게요.",
  vocab:[
    { word:"be all set", pron:"[비 올 셋]", meaning:"만반의 준비를 하다", ex:"Are we all set for the culture exchange program?", ko:"문화 교류 프로그램 준비는 다 되었나요?" },
    { word:"greeting", pron:"[그리팅]", meaning:"인사말", ex:"I've been teaching our students some basic French greetings.", ko:"저는 학생들에게 기본적인 프랑스어 인사말을 가르쳐 왔다." },
    { word:"craft", pron:"[크래프트]", meaning:"공예품", ex:"I've prepared all the traditional craft materials.", ko:"전통 공예 재료를 모두 준비했다." },
    { word:"souvenir", pron:"[수버니어]", meaning:"기념품", ex:"I've ordered keyrings to use as souvenirs.", ko:"기념품으로 쓸 열쇠고리를 주문했다." }
  ],
  questions:[{ qNum:5, question:"대화를 듣고, 여자가 할 일로 가장 적절한 것을 고르시오.",
    choices:["짝 명단 만들기","열쇠고리 포장하기","기념품 주문하기","인사말 가르치기","전통 공예 재료 준비하기"],
    answer:1, explanation:"남자가 'Could you wrap the keyrings when they arrive?'라고 부탁했고 여자가 승낙했으므로 ②번이 정답입니다." }]
},
{ label:"6번", type:"금액 계산",
  lines:[
    {spk:"W", text:"Welcome to Gardener's! How can I help you?"},
    {spk:"M", text:"Hi! I'd like to add some new flowers to my garden."},
    {spk:"W", text:"That's wonderful! What flowers do you have in mind?"},
    {spk:"M", text:"I like lilies. How much are they?"},
    {spk:"W", text:"They're $4 each."},
    {spk:"M", text:"I'll take five lilies. Can you recommend any other flowers? I was thinking of mixing a few different types."},
    {spk:"W", text:"In that case, how about pairing them with some tulips?"},
    {spk:"M", text:"Oh, that sounds great. How much are the tulips?"},
    {spk:"W", text:"They're half the price of lilies — just $2 each."},
    {spk:"M", text:"Great. I'll take five tulips, then."},
    {spk:"W", text:"Five lilies and five tulips, right? When you buy 10 flowers or more, we offer a 10% discount."},
    {spk:"M", text:"Thank you. Here's my credit card."}
  ],
  translation:"W: Gardener's에 오신 것을 환영합니다! 무엇을 도와드릴까요?\nM: 안녕하세요! 제 정원에 새로운 꽃을 좀 더하고 싶어요.\nW: 좋네요! 어떤 꽃을 생각하고 계세요?\nM: 저는 백합을 좋아해요. 얼마인가요?\nW: 하나에 4달러예요.\nM: 백합 다섯 송이 살게요. 다른 꽃도 추천해 주실 수 있나요? 몇 가지 다른 종류를 섞어볼까 생각 중이었어요.\nW: 그렇다면, 튤립과 함께 짝지어 보는 건 어떠세요?\nM: 오, 좋네요. 튤립은 얼마예요?\nW: 백합 가격의 절반이에요 — 하나에 2달러예요.\nM: 좋아요. 그럼 튤립 다섯 송이 살게요.\nW: 백합 다섯 송이랑 튤립 다섯 송이, 맞으시죠? 꽃을 10송이 이상 사시면, 10% 할인을 해드려요.\nM: 감사합니다. 여기 제 신용카드요.",
  vocab:[
    { word:"lily", pron:"[릴리]", meaning:"백합", ex:"I like lilies. How much are they?", ko:"저는 백합을 좋아해요. 얼마인가요?" },
    { word:"recommend", pron:"[레커멘드]", meaning:"추천하다", ex:"Can you recommend any other flowers?", ko:"다른 꽃도 추천해 주실 수 있나요?" },
    { word:"pair", pron:"[페어]", meaning:"짝짓다, 결합하다", ex:"How about pairing them with some tulips?", ko:"튤립과 함께 짝지어 보는 건 어떠세요?" },
    { word:"discount", pron:"[디스카운트]", meaning:"할인", ex:"we offer a 10% discount", ko:"10% 할인을 해드려요" }
  ],
  questions:[{ qNum:6, question:"대화를 듣고, 남자가 지불할 금액을 고르시오. [3점]",
    choices:["$18","$27","$30","$36","$40"],
    answer:1, explanation:"백합 5송이×$4=$20, 튤립 5송이×$2=$10로 총 $30이며, 꽃 10송이 이상 구매로 10% 할인이 적용되어 $30×0.9=$27이므로 정답은 ②번입니다." }]
},
{ label:"7번", type:"이유 파악",
  lines:[
    {spk:"M", text:"Hey, Betty. Did you get the result of the class photo contest?"},
    {spk:"W", text:"Unfortunately, my class couldn't even take part in the contest."},
    {spk:"M", text:"No way! What happened? Your classmates love taking photos."},
    {spk:"W", text:"Yeah, we often take pictures together."},
    {spk:"M", text:"Then you could have submitted one of your existing photos. Was there any unexpected problem like the size requirement of the photo?"},
    {spk:"W", text:"No, the size met the requirements. And we were okay with the fact that we should submit a photo taken outdoors."},
    {spk:"M", text:"Hmm... Then what was the problem? You didn't accidentally delete the photo for the contest, did you?"},
    {spk:"W", text:"No. The truth is I thought the deadline was 17th but it was 12th."},
    {spk:"M", text:"Oh, no. I'm sorry to hear that. But don't beat yourself up about it too much. Everyone makes mistakes sometimes."},
    {spk:"W", text:"Thanks. But I still feel so bad about it."}
  ],
  translation:"M: 안녕, Betty. 학급 사진 대회 결과 받았어?\nW: 안타깝게도, 우리 반은 대회에 참가조차 못 했어.\nM: 말도 안 돼! 무슨 일이야? 너희 반 친구들 사진 찍는 거 정말 좋아하잖아.\nW: 맞아, 우리는 종종 함께 사진을 찍어.\nM: 그럼 기존 사진 중 하나를 제출할 수도 있었잖아. 사진 크기 조건 같은 예상치 못한 문제가 있었어?\nW: 아니, 크기는 조건을 충족했어. 그리고 야외에서 찍은 사진을 제출해야 한다는 사실도 괜찮았어.\nM: 흠... 그럼 뭐가 문제였어? 대회용 사진을 실수로 삭제한 건 아니지?\nW: 아니. 사실은 마감일을 17일이라고 생각했는데 12일이었어.\nM: 오, 이런. 안타깝다. 하지만 너무 자책하지는 마. 누구나 가끔 실수하잖아.\nW: 고마워. 하지만 여전히 정말 속상해.",
  vocab:[
    { word:"take part in", pron:"[테이크 파트 인]", meaning:"~에 참여하다", ex:"my class couldn't even take part in the contest", ko:"우리 반은 대회에 참가조차 못 했다" },
    { word:"submit", pron:"[서브밋]", meaning:"제출하다", ex:"you could have submitted one of your existing photos", ko:"기존 사진 중 하나를 제출할 수도 있었다" },
    { word:"requirement", pron:"[리콰이어먼트]", meaning:"필요조건, 요건", ex:"the size met the requirements", ko:"크기는 조건을 충족했다" },
    { word:"beat oneself up", pron:"[비트 원셀프 업]", meaning:"자책하다", ex:"don't beat yourself up about it too much", ko:"그것에 대해 너무 자책하지 마라" }
  ],
  questions:[{ qNum:7, question:"대화를 듣고, 여자가 학급 사진 대회에 참가하지 못한 이유를 고르시오.",
    choices:["사진을 실수로 삭제해서","야외에서 촬영된 사진이 없어서","사진 제출 마감 날짜를 착각해서","사진의 크기가 조건에 맞지 않아서","학급 친구들이 사진 찍는 것을 싫어해서"],
    answer:2, explanation:"'I thought the deadline was 17th but it was 12th'에서 마감 날짜를 착각했음을 알 수 있으므로 ③번이 정답입니다." }]
},

{ label:"15번", type:"상황에 맞는 말",

  translation:"M: Emma는 학교 배드민턴 팀의 주장입니다. 그녀의 팀은 다가오는 대회에 참가할 계획이지만, 팀원 한 명이 최근에 부상을 당했습니다. Emma는 팀의 리더로서 대신할 사람을 찾아야 한다는 강한 책임감을 느낍니다. 그때 그녀는 예전에 배드민턴 팀원이었던 Anthony를 떠올립니다. 그래서 그녀는 Anthony에게 다시 팀에 합류해 달라고 부탁합니다. 하지만, Anthony는 다음 주 중요한 발표를 준비하느라 매우 바쁩니다. 그는 Emma의 부탁을 받아들일 수 없다고 생각하고 그녀를 도울 다른 방법을 생각합니다. 그는 대신 가까운 친구 한 명을 추천하기로 결심합니다. 그의 친구는 배드민턴을 잘할 뿐만 아니라, 항상 배드민턴 팀에 들어가고 싶어 했습니다. 이런 상황에서, Anthony는 Emma에게 뭐라고 말할까요?",

  translation:"W: 안녕하세요, 학생 여러분. 최근에 박물관을 방문한 적이 있나요? 그렇다면, 여러분은 몇 가지 주목할 만한 변화가 일어나고 있다는 것을 알아챘을지도 모릅니다. 오늘은, 박물관에서 일어나고 있는 변화에 대한 통찰을 공유하고자 합니다. 이제, 전통적인 박물관은 현대 기술에 의해 변형되고 있습니다. 제가 소개하고 싶은 첫 번째 기술은 가상 현실입니다. 전 세계 박물관들은 방문객이 역사적 유물과 상호 작용하는 방식을 바꾸기 위해 가상 현실을 채택하고 있습니다. 예를 들어, 방문객들은 이제 고대 건물이 실제인 것처럼 탐험할 수 있습니다. 박물관에서 사용되는 또 다른 기술은 3D 애니메이션입니다. 이것은 역사적 장면을 생생하게 만들어, 사람들이 과거에 어떻게 살았는지 보여줍니다. 애니메이션 디스플레이는 방문객들이 역사적 사건을 더 매력적인 방식으로 경험하게 해줍니다. 또한, 레이저 프로젝션은 갤러리 벽에 역동적인 효과를 만들어냅니다. 이 기술을 사용하여, 박물관은 특정 예술 작품을 강조하고 관람 경험을 향상시키는 매혹적인 환경을 만들 수 있습니다. 마지막으로, 3D 프린팅은 박물관에 새로운 가능성을 열어주었습니다. 이 기술은 대중에게 노출될 수 없는 깨지기 쉽거나 희귀한 물건의 정확한 복제품을 전시하는 것을 가능하게 합니다. 이러한 기술 혁신은 박물관 소장품을 그 어느 때보다 더 접근하기 쉽고, 상호작용적이며, 매력적으로 만들고 있습니다.",
  vocab:[

    { word:"accessible", pron:"[액세서블]", meaning:"접근하기 쉬운", ex:"making museum collections more accessible, interactive, and engaging", ko:"박물관 소장품을 더 접근하기 쉽고, 상호작용적이며, 매력적으로 만들고 있다" }
  ],
  questions:[
    { qNum:16, question:"여자가 하는 말의 주제로 가장 적절한 것은?",
      choices:["etiquette for using digital devices in museums","modern technologies transforming museum experiences","problems caused by rapid technological changes in museums","obstacles in integrating technologies in museum exhibitions","architectural technologies used in building museums"],
      answer:1, explanation:"여자는 박물관을 변화시키고 있는 가상 현실, 3D 애니메이션, 레이저 프로젝션, 3D 프린팅 등 현대 기술을 소개하고 있으므로 ②번이 정답입니다." },
    { qNum:17, question:"언급된 기술이 아닌 것은?",
      choices:["virtual reality","motion tracking","3D animation","laser projection","3D printing"],
      answer:1, explanation:"가상 현실, 3D 애니메이션, 레이저 프로젝션, 3D 프린팅은 언급되었지만 motion tracking(동작 추적)은 언급되지 않았으므로 ②번이 정답입니다." }
  ]
}
];

let current = 0;
let currentRate = 1;
let realAudio = null;

function formatTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function buildPlayer() {
  var card = document.getElementById('player-card');
  if (!AUDIO_URL) {
    card.innerHTML = '<div class="audio-missing">🎧 듣기 파일 주소가 아직 연결되지 않았어요. 그때까지는 아래 <b>대본 보기</b>로 학습해 주세요.</div>';
    return;
  }
  card.innerHTML =
    '<div class="player-note">🎧 듣기평가 음성 (1~17번 전체, 순서대로 재생돼요)</div>' +
    '<div class="player-row">' +
      '<button class="player-playbtn" id="player-playbtn" onclick="toggleRealAudio()">▶️</button>' +
      '<div class="player-info">' +
        '<input type="range" class="seek-bar" id="seek-bar" min="0" max="100" value="0" oninput="seekRealAudio(this.value)">' +
        '<div class="player-time"><span id="time-current">0:00</span><span id="time-total">0:00</span></div>' +
      '</div>' +
    '</div>';

  realAudio = new Audio(AUDIO_URL);
  realAudio.preload = 'none';
  realAudio.addEventListener('play', function() { document.getElementById('player-playbtn').textContent = '⏸️'; });
  realAudio.addEventListener('pause', function() { document.getElementById('player-playbtn').textContent = '▶️'; });
  realAudio.addEventListener('ended', function() { document.getElementById('player-playbtn').textContent = '▶️'; });
  realAudio.addEventListener('loadedmetadata', function() {
    document.getElementById('time-total').textContent = formatTime(realAudio.duration);
  });
  realAudio.addEventListener('timeupdate', function() {
    var bar = document.getElementById('seek-bar');
    if (realAudio.duration) bar.value = (realAudio.currentTime / realAudio.duration) * 100;
    document.getElementById('time-current').textContent = formatTime(realAudio.currentTime);
  });
}

function toggleRealAudio() {
  if (!realAudio) return;
  if (realAudio.paused) { realAudio.play(); } else { realAudio.pause(); }
}

function seekRealAudio(pct) {
  if (realAudio && realAudio.duration) realAudio.currentTime = (pct / 100) * realAudio.duration;
}

function buildRateRow() {
  var rates = [0.5, 0.7, 1, 1.2, 1.5];
  document.getElementById('rate-row').innerHTML = rates.map(function(r) {
    return '<button class="rate-btn' + (r === 1 ? ' active' : '') + '" onclick="setRate(' + r + ', this)">' + r + '배</button>';
  }).join('');
}

function setRate(r, btnEl) {
  currentRate = r;
  if (realAudio) realAudio.playbackRate = r;
  document.querySelectorAll('.rate-btn').forEach(function(b) { b.classList.remove('active'); });
  btnEl.classList.add('active');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = items.map(function(it, i) {
    return '<div class="p-tab" onclick="selectItem(' + i + ')">' + it.label + '</div>';
  }).join('');
}

const circled = ['①', '②', '③', '④', '⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

let quizState = [];

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

function renderQuiz(it) {
  quizState = it.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = it.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var q = items[current].questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var r = document.getElementById('qresult-' + qi);
  var ok = quizState[qi].selected === q.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.') + '</b><br>' + q.explanation;
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '다시 풀기';
  b.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var it = items[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(it.questions[qi], qi);
  var r = document.getElementById('qresult-' + qi);
  r.classList.remove('show','ok','no'); r.innerHTML = '';
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '정답 확인';
  b.onclick = function() { checkAnswer(qi); };
}

function render() {
  var it = items[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + items.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / items.length * 100) + '%';
  document.getElementById('type-badge').textContent = it.label + ' · ' + it.type;

  var gc = document.getElementById('given-card');
  if (it.svgKey && SVGS[it.svgKey]) { gc.classList.add('show'); gc.innerHTML = SVGS[it.svgKey]; }
  else if (it.table) {
    gc.classList.add('show');
    var t = it.table;
    var html = '<table class="given-table"><tr>' + t.headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr>';
    html += t.rows.map(function(row) { return '<tr>' + row.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('');
    html += '</table>';
    gc.innerHTML = html;
  } else { gc.classList.remove('show'); gc.innerHTML = ''; }

  document.getElementById('script-box').innerHTML = it.lines.map(function(l) {
    return '<div class="script-line"><span class="script-spk">' + l.spk + ':</span>' + l.text + '</div>';
  }).join('');
  document.getElementById('script-box').classList.remove('show');
  document.getElementById('btn-script').classList.remove('on');
  document.getElementById('btn-script').textContent = '📄 대본 보기';

  document.getElementById('translation-box').textContent = it.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 해석 보기';

  renderQuiz(it);

  document.getElementById('vocab-list').innerHTML = it.vocab.map(function(v) {
    return '<div class="example-item"><div class="example-text"><div class="example-en">' + v.word + '</div><div class="example-pron">' + v.pron + ' ' + v.meaning + '</div><div class="example-ko">' + v.ex + '<br>' + v.ko + '</div></div><button class="example-speak" onclick="speak(\'' + v.word.replace(/'/g, "\\'") + '\')">🔊</button></div>';
  }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === items.length - 1;
  document.getElementById('btn-next').textContent = current === items.length - 1 ? '처음으로' : '다음 문제 →';
}

function selectItem(i) { current = i; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function go(d) {
  if (current === items.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(items.length - 1, current + d));
  selectItem(current);
}

function toggleScript() {
  var box = document.getElementById('script-box'), btn = document.getElementById('btn-script');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📄 대본 숨기기' : '📄 대본 보기';
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 해석 보기';
}

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildPlayer();
buildRateRow();
buildTabs();
render();
</script>
<script src="study-stats.js"></script>
