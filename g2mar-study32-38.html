<script>
const problems = [
{
  num: 32, type: "빈칸 추론",
  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
  choices: ["identified aesthetic appreciation with literary convention","preferred artistic value to practical value of objects","confined aesthetic experience to sensory pleasure","advocated for the reform of artistic techniques","argued against the separation of art from life"],
  answer: 4,
  explanation: "Dewey는 미적인 것을 '자아와 사물 및 사건의 세계의 완전한 상호 침투'에서 찾았고, 일상적이고 완전한 경험에 미적인 특성이 있다고 보았으므로, 예술과 삶의 분리에 반대했다는 ⑤번이 정답입니다.",
  vocab: {
    liberation: { word:"liberation", pron:"[리버레이션]", meaning:"해방", ex:"the liberation and expansion of aesthetic experience", exko:"미적 경험의 해방과 확장" },
    prevalent: { word:"prevalent", pron:"[프레벌런트]", meaning:"지배적인, 널리 퍼진", ex:"even if degraded and dismissed by prevalent philosophical theory", exko:"지배적인 철학 이론에 의해 격하되고 무시받았다 하더라도" },
    internalize: { word:"internalized", pron:"[인터널라이즈드]", meaning:"내면화된", ex:"not in an internalized awareness of sensation and feeling", exko:"감각과 감정의 내면화된 인식이 아니라" }
  },
  passage: `Perhaps the best-known development to emerge from the [[liberation::liberation]] and expansion of aesthetic experience is the aesthetics of everyday life. Although there is presently a flowering of work on everyday aesthetics, the possibility of aesthetic gratification in ordinary objects and events has long been recognized, even if degraded and dismissed by [[prevalent::prevalent]] philosophical theory. Widely valued by poets, especially Romantic poets and those in Asian traditions, the aesthetic in everyday situations has also been recognized by novelists. It may be most convenient, though, to locate its contemporary intellectual origins in John Dewey's Art as Experience. In that book Dewey ___________ by basing aesthetic experience on the biological and cultural conditions of human life. He located the aesthetic, not in an [[internalize::internalized]] awareness of sensation and feeling but in "a complete interpenetration of self and the world of objects and events." Further, Dewey maintained that "the aesthetic is the clarified and intensified development of traits that belong to every normally complete experience."`,
  translation: `아마도 미적 경험의 해방과 확장으로부터 나타난 가장 잘 알려진 발전은 일상생활의 미학일 것이다. 현재 일상 미학에 관한 활발한 연구가 있지만, 평범한 사물과 사건 속의 미적 만족감에 대한 가능성은 오래전부터 인식되어 왔는데, 비록 지배적인 철학 이론에 의해 격하되고 무시받아 왔음에도 그러하다. 일상적 상황 속의 미적인 것들은 시인들, 특히 낭만주의 시인들과 아시아 전통에 속한 시인들에 의해 널리 가치 있게 여겨졌고, 소설가들에 의해서도 인식되어 왔다. 그럼에도 그 현대적 지적 기원을 John Dewey의 'Art as Experience'에서 찾는 것이 가장 적절할 것이다. 그 책에서 Dewey는 미적 경험을 인간 삶의 생물학적, 문화적 조건에 기반함으로써 예술과 삶의 분리에 반대하는 주장을 펼쳤다. 그는 미적인 것을 감각과 감정의 내면화된 인식이 아니라 "자아와 사물 및 사건의 세계의 완전한 상호 침투"에서 찾았다. 더 나아가, 듀이는 "미적인 것이란 모든 일상적으로 완전한 경험에 속하는 특성들이 명확해지고 강화되어 발전된 형태이다."라는 입장을 유지했다.`,
  grammar: [
    { title:"not A but B", desc:"'A가 아니라 B'라는 대조 구문입니다.", ex:"not in an internalized awareness ... but in a complete interpenetration (내면화된 인식이 아니라 완전한 상호 침투에서)" },
    { title:"by + 동명사 (수단)", desc:"'~함으로써'라는 뜻입니다.", ex:"by basing aesthetic experience on biological and cultural conditions (미적 경험을 생물학적·문화적 조건에 기반함으로써)" }
  ],
  tips: [
    "빈칸 문제는 빈칸 뒤에 이어지는 인용문(그의 주장)이 빈칸의 근거가 됩니다.",
    "'예술과 삶의 분리'에 반대하는 내용이 이어지는 흐름을 놓치지 마세요."
  ]
},
{
  num: 33, type: "빈칸 추론",
  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오. [3점]",
  choices: ["stand on the highest level of moral excellence","have sympathy for each other's moral deficiency","come to an agreement on a set of moral values","be excluded from the judgment of moral superiority","fall within the range of application of moral standards"],
  answer: 4,
  explanation: "도덕적 우월성을 판단하려면 두 존재 모두에게 동일한 도덕적 기준이 적용될 수 있어야 하므로, 두 존재 모두 도덕적 기준의 적용 범위 안에 속해야 한다는 ⑤번이 정답입니다.",
  vocab: {
    validly: { word:"validly", pron:"[밸리들리]", meaning:"타당하게", ex:"One cannot validly argue that humans are morally superior.", exko:"인간이 도덕적으로 우월하다고 타당하게 주장할 수 없다." },
    superior: { word:"superior", pron:"[수피어리어]", meaning:"우월한", ex:"humans are morally superior beings", exko:"인간이 도덕적으로 우월한 존재" },
    possess: { word:"possess", pron:"[퍼제스]", meaning:"지니다, 소유하다", ex:"They possess the capacities of a moral agent.", exko:"그들은 도덕적 행위자의 능력을 지니고 있다." },
    deficiency: { word:"deficiency", pron:"[디피션시]", meaning:"결함", ex:"Judgments are based on the comparative merits or deficiencies.", exko:"판단은 상대적인 장점이나 결함에 근거한다." }
  },
  passage: `One cannot [[validly::validly]] argue that humans are morally [[superior::superior]] beings on the ground that they [[possess::possess]], while others lack, the capacities of a moral agent. The reason is that, as far as moral standards are concerned, only beings that have the capacities of a moral agent can meaningfully be said to be either morally good or morally bad. Only moral agents can be judged to be morally better or worse than others, and the others in question must be moral agents themselves. Judgments of moral superiority are based on the comparative merits or [[deficiency::deficiencies]] of the entities being judged, and these merits and deficiencies are all moral ones, that is, ones determined by moral standards. One entity is correctly judged morally superior to another if it is the case that, when valid moral standards are applied to both entities, the first fulfills them to a greater degree than the second. Both entities, therefore, must ___________. This would not be the case, however, if humans were being judged superior to animals and plants, since the latter are not moral agents.`,
  translation: `인간이 도덕적 행위자의 능력을 지니고 있는 반면, 다른 존재들은 그러한 능력이 부족하다는 근거로 인간이 도덕적으로 우월한 존재라고 타당하게 주장할 수 없다. 그 이유는, 도덕적 기준에 관해서는, 도덕적 행위자의 능력을 지닌 존재만이 유의미하게 도덕적으로 선하거나 악하다고 말할 수 있기 때문이다. 오직 도덕적 행위자만이 다른 존재들보다 도덕적으로 더 낫거나 더 나쁘다고 판단될 수 있으며, 비교의 대상이 되는 다른 존재들도 그 자체로 도덕적 행위자여야 한다. 도덕적 우월성에 대한 판단은 판단 대상이 되는 존재들의 비교적 장점이나 결함에 근거하며, 이러한 장점과 결함은 모두 도덕적인 것들, 즉, 도덕적 기준에 의해 결정되는 것들이다. 타당한 도덕적 기준을 두 존재 모두에 적용했을 때, 첫 번째 존재가 두 번째 존재보다 그것들을 더 높은 정도로 충족하는 경우에만, 앞선 존재가 다른 존재보다 도덕적으로 우월하다고 정확히 판단된다. 따라서, 두 존재 모두 도덕적 기준의 적용 범위 안에 속해야 한다. 그러나, 인간이 동물이나 식물보다 우월하다고 판단되는 경우에는 이것이 성립되지 않는데, 왜냐하면 후자들은 도덕적 행위자가 아니기 때문이다.`,

    terminology: { word:"terminology", pron:"[터미놀러지]", meaning:"어휘 체계, 용어", ex:"languages have labels for some but not all family relationships", exko:"언어들은 일부의 가족 관계에 대해서만 명칭을 가지고 있다" },
    core: { word:"core", pron:"[코어]", meaning:"핵심의", ex:"all languages have a core set of kinship terms", exko:"모든 언어는 핵심 친족 용어를 가지고 있다" },
    typological: { word:"typological", pron:"[타이폴로지컬]", meaning:"유형학의", ex:"Comparative typological studies of kinship terminology", exko:"친족 체계에 대한 비교 유형학적 연구" }
  },
  passage: `If you are going to compare languages, it helps to start with something that you are confident you can find in all languages. Take for example signs or words for mother and father.

(B) If we add other family relationships to this category — son, grandmother, aunt, brother-in-law, cousin — we are defining the category of [[kinship::kinship]] [[terminology::terminology]]. Comparative [[typological::typological]] studies of kinship terminology have discovered that languages have labels for some but not all family relationships.

(A) And the probability that a specific kin relationship has a label is predictable based on the other kinship terms in the language. For example, all languages have a [[core::core]] set of kinship terms — like mother and father.

(C) By contrast, terms for less central category members are often built up from the core terms — like mother-in-law and step-father. If we compare languages across the world, we can ask what kinship relationships are typically expressed with core terminology, and what relationships are expressed by modifying the core terminology.`,
  translation: `언어를 비교하려면, 모든 언어에서 발견할 수 있다고 확신하는 것부터 시작하는 것이 도움이 된다. 예를 들면 '어머니'와 '아버지'를 가리키는 수어 또는 단어가 있다.

(B) 만약 이 범주에 '아들', '할머니', '이모', '형부', '사촌'과 같은 다른 가족 관계를 추가하면 우리는 '친족 어휘 체계'의 범주를 정의하게 된다. 친족 체계에 대한 비교 유형학적 연구는 언어들이 전부가 아닌 일부의 가족 관계에 대한 명칭을 가지고 있다는 것을 밝혔다.

(A) 그리고 특정 친족 관계가 명칭을 가질 확률은 해당 언어의 다른 친족 용어에도 기반하여 예측 가능하다. 예를 들어, 모든 언어에는 '어머니'와 '아버지' 같은 핵심 친족 용어가 있다.

(C) 반면, 덜 중심적인 범주 구성원들에 대한 용어는 종종 핵심 용어를 기반으로 구성되는데, 예를 들어 '시어머니'나 '의붓아버지'가 그러하다. 전 세계 언어를 비교해 보면, 우리는 어떤 친족 관계가 일반적으로 핵심 어휘 체계로 표현되는지, 그리고 어떤 관계가 핵심 어휘 체계를 변형하여 표현되는지 물을 수 있다.`,
  grammar: [
    { title:"by contrast (반면에)", desc:"앞 내용과 대조되는 내용을 이어주는 접속부사입니다.", ex:"By contrast, terms for less central members are built up from core terms. (반면, 덜 중심적인 구성원의 용어는 핵심 용어에서 만들어진다.)" },
    { title:"like + 명사(예시)", desc:"'~와 같은'이라는 뜻으로 구체적 예시를 듭니다.", ex:"a core set of kinship terms — like mother and father (어머니·아버지 같은 핵심 친족 용어)" }
  ],
  tips: [
    "순서 배열은 지시어(this category)가 가리키는 대상을 앞 단락에서 먼저 찾으세요.",
    "By contrast로 시작하는 단락은 반드시 대조되는 앞 내용 뒤에 와야 합니다."
  ]
},
{
  num: 38, type: "문장의 위치 파악",
  question: "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.",
  choices: ["①","②","③","④","⑤"],
  answer: 3,

  explanation: "주어진 문장은 '역할에 충실한 행동만으로는 불충분할 수 있다'는 내용으로, ③ 앞의 '이것으로 충분할 수도 있다(This might be sufficient)'는 내용과 대조를 이루며, ④ 뒤의 '이럴 때 참가자들은 역할에서 벗어난다'는 내용과 자연스럽게 이어지므로 ④번이 정답입니다.",
  vocab: {
    in_character: { word:"in character", pron:"[인 캐릭터]", meaning:"역할에 충실한", ex:"something said or done by a player while in character", exko:"참가자가 역할에 충실한 상태에서 말하거나 행동한 것" },
    insufficient: { word:"insufficient", pron:"[인서피션트]", meaning:"불충분한", ex:"These in-character behaviors can be insufficient.", exko:"이러한 역할에 충실한 행동은 불충분할 수 있다." },
    common_ground: { word:"common ground", pron:"[커먼 그라운드]", meaning:"공통된 이해", ex:"the necessary amount of common ground about what is fictional", exko:"무엇이 허구인지에 대해 필요한 만큼의 공통된 이해" },
    emit: { word:"emit", pron:"[이밋]", meaning:"발산하다, 내다", ex:"these messages are emitted naturally", exko:"이러한 메시지는 자연스럽게 나온다" }
  },
  passage: `There are several ways that participants in a make-believe can communicate things about the fictional world to other participants. ( ① ) Sometimes these messages are [[emit::emitted]] naturally as a result of full participation in the fictional world — i.e., something said or done by a player while [[in_character::in character]] communicates some things that are fictional of that world. ( ② ) For example, a child pretending to be Peter Pan might gasp and draw a plastic knife. ( ③ ) This might be sufficient to communicate that fictionally one of Peter's enemies, such as Captain Hook, is approaching. ( ④ ) At these times participants often come at least partly out of character to give other participants the information they need. ( ⑤ ) For example, it would be important to avoid confusion about who is playing which character: "No, you're Captain Hook, and I'm Peter Pan!"`,
  translation: `가상 역할 놀이의 참가자들이 허구의 세계에 관한 것들을 다른 참가자들에게 전달할 수 있는 여러 방법이 있다. 때때로 이러한 메시지는 허구 세계에 대한 완전한 참여의 결과로 자연스럽게 나오는데 — 즉, 역할에 충실한 상태에서 어떤 참가자가 말하거나 행동한 것이 그 세계의 허구적인 어떤 것을 전달한다. 예를 들어, Peter Pan 흉내를 내는 아이는 숨을 헐떡이며 플라스틱 칼을 뽑을 수도 있다. 이것은 Peter의 적, 이를테면 Captain Hook이 다가오고 있다는 것을 허구적으로 전달하기에 충분할 수도 있다. 하지만 이렇게 역할에 충실한 행동만으로는 가상 역할 놀이의 세계에서 무엇이 허구인지에 대해 필요한 만큼의 공통된 이해를 유지하기에 불충분할 수 있다. 이럴 때 참가자들은 다른 참가자에게 필요한 정보를 전달하기 위해 최소한 부분적으로라도 종종 역할에서 벗어난다. 예를 들어, 누가 어떤 역할을 연기하는지에 대한 혼란을 피하는 것이 중요할 수 있다. "아니야, 네가 Captain Hook이고, 내가 Peter Pan이야!"`,
  grammar: [
    { title:"as a result of ~ (~의 결과로)", desc:"원인·결과 관계를 나타내는 전치사구입니다.", ex:"emitted naturally as a result of full participation (완전한 참여의 결과로 자연스럽게 나오는)" },
    { title:"come out of character", desc:"'역할에서 벗어나다'라는 뜻의 관용 표현입니다.", ex:"participants often come at least partly out of character (참가자들은 종종 최소한 부분적으로는 역할에서 벗어난다)" }
  ],
  tips: [
    "문장 삽입 문제는 however·역접 신호가 있는 주어진 문장이 어디서 흐름을 바꾸는지 찾으세요.",
    "'충분할 수도 있다(sufficient)' 다음에 '불충분할 수 있다(insufficient)'는 대조가 이어지는 지점을 찾으면 됩니다."
  ]
}
];

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g2mar' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  document.getElementById('given-area').innerHTML = p.given ? '<div class="given-box">' + p.given + '</div>' : '';
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i, skipHistory) {
  current = i; render(); window.scrollTo({top:0, behavior:'smooth'});
  if (!skipHistory) { var h = '#p' + current; if (location.hash !== h) history.pushState({pIdx:current}, '', h); }
}
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  selectProblem(current);
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
