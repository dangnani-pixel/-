    <div class="sheet-word" id="sheet-word"></div>

</div>

<script>
const problems = [
{
  num: 32, type: "빈칸 추론",
  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
  choices: ["the size of the numbers matters","counting skills improve over time","results depend on what the rewards are","their emotional states influence the result","the pattern of errors is not easily monitored"],
  answer: 0,
  explanation: "수가 커질수록 구별이 부정확해지고(원숭이는 5 이상부터 실패, 쥐는 수가 커질수록 부정확), 이는 모든 종에서 동일하게 나타나므로 '수의 크기가 중요하다'는 ①번이 정답입니다.",
  vocab: {
    approximate: { word:"approximate number system", pron:"[어프락시밋 넘버 시스템]", meaning:"근사 수 체계", ex:"Animals use an approximate number system.", exko:"동물들은 근사 수 체계를 사용한다.", etym:"ap-(ad-, ~에) + proxim(=proximus, 가까운) + -ate(형용사형) → ~에 가까이 다가간 → 근사한, 대략의. 같은 proxim 어근을 쓰는 단어: approach(ap-+proch(proximare에서) → 가까이 다가가다), proximity(proxim+ity → 근접함)." },
    precision: { word:"precision", pron:"[프리시전]", meaning:"정밀함, 정확성", ex:"What it does not provide is precision.", exko:"그것이 제공하지 못하는 것은 정밀함이다.", etym:"pre-(미리, 앞서) + cis(=caedere, 자르다) + -ion(명사형) → 미리 잘라내어 다듬음 → 정밀함. 같은 cis 어근을 쓰는 다른 접두사 단어: incisive(in-안으로 + cis + ive → 안으로 파고드는 → 예리한), concise(con-함께 + cis → 잘라서 함께 모은 → 간결한)." },
    discrimination: { word:"discrimination", pron:"[디스크리미네이션]", meaning:"구별, 식별", ex:"Discrimination becomes less accurate.", exko:"구별이 덜 정확해진다.", etym:"dis-(따로) + crimin(=cernere, 구별하다) + -ation(명사형) → 따로따로 구별함 → 구별, 식별. 같은 cern/crimin 어근을 쓰는 다른 접두사 단어: discern(dis-따로 + cern → 구별하다), incriminate(in-안으로 + crimin + ate → 죄를 안으로 씌우다 → 유죄를 암시하다)." },
    quantities: { word:"quantities", pron:"[콴터티즈]", meaning:"양, 수량", ex:"as the quantities get bigger", exko:"수량이 커질수록", etym:"quant(=quantus, 라틴어 '얼마나 많은') + -ity + -es(명사·복수형) → 얼마만큼 되는 것 → 양, 수량. 같은 어근을 쓰는 단어: quantify(quant + ify → 수량화하다), quantum(같은 어근 → 양자)." },
    lever: { word:"lever", pron:"[레버]", meaning:"레버, 손잡이", ex:"Rats learned to press a lever.", exko:"쥐들은 레버 누르는 법을 배웠다.", etym:"lev(=levare, 들어올리다) → 들어올리는 도구 → 레버, 지렛대. 같은 lev 어근을 쓰는 다른 접두사 단어: elevate(e-밖으로 + lev + ate → 위로 들어올리다 → 높이다), relieve(re-다시 + lieve(=lev) → 짐을 다시 가볍게 하다 → 완화하다)." },
    markedly: { word:"markedly", pron:"[마크드리]", meaning:"현저하게", ex:"They became markedly less precise.", exko:"그것들은 현저하게 덜 정확해졌다." },
    spread: { word:"spread", pron:"[스프레드]", meaning:"분포, 퍼짐", ex:"They produce a spread of numbers.", exko:"그것들은 수의 분포를 만들어낸다." },
    accuracy: { word:"accuracy", pron:"[애큐러시]", meaning:"정확도", ex:"when testing the accuracy of number sense", exko:"수 감각의 정확도를 시험할 때", etym:"ac-(ad-, ~에) + cur(=cura, 주의·돌봄) + -acy(명사형) → 세심히 주의를 기울인 상태 → 정확도. 같은 cur 어근을 쓰는 다른 단어: curious(cur + ious → 호기심 있는), secure(se-떨어져(근심이) + cure → 근심 없는 → 안전한)." }
  },
  funcWords: {
    what: { word:"what", tag:"[관계대명사 what]", meaning:"'What it does not provide'는 '그것이 제공하지 못하는 것'이라는 뜻으로, 관계대명사 what이 이끄는 명사절이 문장의 주어 역할을 해요. what절은 '~하는 것'으로 해석하면 됩니다.", ex:"What it does not provide is precision.", exko:"그것이 제공하지 못하는 것은 정밀함이다." },
    that: { word:"that", tag:"[관계대명사 · 주격 / 명사절 접속사]", meaning:"that는 Rats를 선행사로 받는 주격 관계대명사예요. 'Rats that learned to press a lever ~'는 '레버를 누르도록 학습한 쥐들'이라고 해석돼요. 마지막 문장의 'It is a common observation that ~'의 that은 이와 달리 observation의 내용을 설명하는 명사절 접속사예요.", ex:"Rats that learned to press a lever a given number of times, from four up to twenty-four, became markedly less and less precise in their responses as the number increased: by the top end of the range they would merely produce a spread of numbers around the target.", exko:"4번부터 24번까지 정해진 횟수만큼 레버를 누르도록 학습한 쥐들은 그 수가 증가함에 따라 반응이 현저하게 점점 덜 정확해졌다. 범위의 최상단에서 그것들은 그저 목표치 주변으로 흩어진 수들을 만들어낼 뿐이었다." },
    from: { word:"from", tag:"[tell A from B / 전치사 from]", meaning:"'tell A from B'는 'A와 B를 구별하다'라는 뜻의 표현으로, from을 '~로부터'라고 단순히 해석하면 안 돼요. 뒤의 'fail from five upwards'에서 from은 '~부터'라는 뜻으로 시작 지점을 나타내요.", ex:"Rhesus monkeys can tell one from two, two from three, three from four, four from five ... but start to fail from five upwards.", exko:"붉은털원숭이는 1과 2, 2와 3, 3과 4, 4와 5를 구별할 수 있지만... 5부터는 실패하기 시작한다." },
    by: { word:"by", tag:"[전치사 by · 시점]", meaning:"'by the top end of the range'에서 by는 '~에 의해'가 아니라 '~즈음에는, ~에 이르러서는'이라는 뜻으로 시점을 나타내는 전치사예요. '범위의 최상단에 이르러서는'이라고 해석하세요.", ex:"Rats that learned to press a lever a given number of times, from four up to twenty-four, became markedly less and less precise in their responses as the number increased: by the top end of the range they would merely produce a spread of numbers around the target.", exko:"4번부터 24번까지 정해진 횟수만큼 레버를 누르도록 학습한 쥐들은 그 수가 증가함에 따라 반응이 현저하게 점점 덜 정확해졌다. 범위의 최상단에서 그것들은 그저 목표치 주변으로 흩어진 수들을 만들어낼 뿐이었다." },

  passage: `The technical term often used to describe animals' judgement of numbers is the [[approximate::approximate number system]]. What it does not provide is [[precision::precision]]. It shows — and this is the same in every species tested — a characteristic pattern of errors, with [[discrimination::discrimination]] becoming less accurate as the [[quantities::quantities]] get bigger. Rhesus monkeys can tell one from two, two from three, three from four, four from five ... but start to fail from five upwards. Rats that learned to press a [[lever::lever]] a given number of times, from four up to twenty-four, became [[markedly::markedly]] less and less precise in their responses as the number increased: by the top end of the range they would merely produce a [[spread::spread]] of numbers around the target. It is a common observation that when testing the [[accuracy::accuracy]] of animals' number sense, __________.`,
  translation: `동물의 수 판단을 설명하는 데 흔히 사용되는 전문 용어는 '근사 수 체계'이다. 그것이 제공하지 못하는 것은 정밀함이다. 그것은 — 그리고 이는 시험된 모든 종에서 동일한데 — 특징적인 오류 패턴을 보이는데, 수량이 커질수록 구별이 덜 정확해진다. 붉은털원숭이는 1과 2, 2와 3, 3과 4, 4와 5를 구별할 수 있지만... 5부터는 실패하기 시작한다. 4번부터 24번까지 정해진 횟수만큼 레버를 누르도록 학습한 쥐들은 그 수가 증가함에 따라 반응이 현저하게 점점 덜 정확해졌다. 범위의 최상단에서 그것들은 그저 목표치 주변으로 흩어진 수들을 만들어낼 뿐이었다. 동물의 수 감각의 정확도를 시험할 때 __________는 것은 흔히 관찰되는 사실이다.`,

    how: { word:"how", tag:"[명사절 접속사 how]", meaning:"how는 여기서 '어떻게'라는 의문사가 아니라 '~하는 방식'이라는 뜻의 명사절을 이끌어요. 'How we think about our circumstances'는 문장의 주어로 쓰여 '우리가 상황에 대해 생각하는 방식(이)'이라고 해석돼요. 뒤의 'influence how we think'도 같은 구조로, influence의 목적어예요.", ex:"How we think about our circumstances shapes the emotions we experience; then those emotions echo back to influence how we think.", exko:"우리가 자신의 상황에 대해 어떻게 생각하는지가 우리가 경험하는 감정을 형성하고, 그다음 그 감정들이 되돌아와 우리가 어떻게 생각하는지에 영향을 미친다." },

    still: { word:"still", tag:"[부사 still · 의미 확인]", meaning:"still을 '여전히'로만 해석하면 어색해요. 앞에 but이 있으면 '그래도, 그럼에도'라는 양보의 뜻이 돼요. 'but I'm still a good test taker'는 '그래도 나는 시험을 잘 보는 사람이야'로 해석돼요.", ex:"By thinking differently — I get nervous sometimes, but I'm still a good test taker, or that nervous feeling is just excitement and anticipation, it means I'm ready — you can work those pathways to your advantage.", exko:"다르게 생각함으로써 — '나는 가끔 긴장하지만, 그래도 나는 시험을 잘 보는 사람이야', 혹은 '그 긴장되는 느낌은 그저 흥분과 기대일 뿐이고, 그건 내가 준비되었다는 뜻이야' — 당신은 그 경로들을 자신에게 유리하게 활용할 수 있다." },

  passage: `Despite the cultural [[trope::trope]] [[depicting::depicting]] emotions as the opposite of [[rational::rational]] thought, [[cognition::cognition]] — what we commonly refer to as thinking — is actually a key building block of emotion. How we think about our circumstances shapes the emotions we experience; then those emotions [[echo_back::echo back]] to influence how we think. For instance, if you walk into a test thinking you are bad at taking tests, your [[anxiety::anxiety]] will be increased. Then you don't feel good about your performance on the test, and that becomes evidence for continuing to think that you're bad at test taking. In this way __________. This [[bi_directionality::bi-directionality]] of cognition and emotion allows us to adjust difficult emotions by changing the way we think. By thinking differently — I get nervous sometimes, but I'm still a good test taker, or that nervous feeling is just excitement and [[anticipation::anticipation]], it means I'm ready — you can work those pathways to your advantage.`,
  translation: `감정을 이성적 사고의 반대로 묘사하는 문화적 통념에도 불구하고, 인지 — 우리가 흔히 사고라고 부르는 것 — 는 사실 감정의 핵심 구성 요소이다. 우리가 자신의 상황에 대해 어떻게 생각하는지가 우리가 경험하는 감정을 형성하고, 그다음 그 감정들이 되돌아와 우리가 어떻게 생각하는지에 영향을 미친다. 예를 들어, 만약 당신이 시험을 잘 못 본다고 생각하면서 시험장에 들어간다면, 당신의 불안은 증가할 것이다. 그러면 당신은 시험에서의 자신의 수행에 대해 좋게 느끼지 못하고, 그것이 자신은 시험을 잘 못 본다고 계속 생각하게 되는 증거가 된다. 이런 식으로 __________. 이러한 인지와 감정의 양방향성은 우리가 생각하는 방식을 바꿈으로써 어려운 감정을 조절할 수 있게 해준다. 다르게 생각함으로써 — '나는 가끔 긴장하지만, 그래도 나는 시험을 잘 보는 사람이야', 혹은 '그 긴장되는 느낌은 그저 흥분과 기대일 뿐이고, 그건 내가 준비되었다는 뜻이야' — 당신은 그 경로들을 자신에게 유리하게 활용할 수 있다.`,
  grammar: [

  funcWords: {
    as: { word:"as", tag:"[접속사 as / 전치사 as]", meaning:"'as do some other popular theoretical approaches'에서 as는 '~하듯이'라는 뜻의 접속사이고, 뒤에서 주어(some other approaches)와 동사(do)가 도치되어 있어요. do는 앞의 'rank animals by likeness ~'를 대신하는 대동사예요. 뒤에 나오는 'picture animals as lesser humans'의 as는 다른 용법으로 '~로(서)'라는 뜻이에요.", ex:"The CA does not rank animals by likeness to humans or seek special privileges for those considered most \"like us,\" as do some other popular theoretical approaches.", exko:"CA는 다른 몇몇 인기 있는 이론적 접근법들이 그러하듯 인간과의 유사성으로 동물의 순위를 매기거나 가장 '우리와 비슷하다'고 여겨지는 동물에게 특별한 특권을 추구하지 않는다." },
    so: { word:"so", tag:"[Just as A, so B]", meaning:"'Just as A, so B'에서 so는 '그래서'가 아니라 '마찬가지로'라는 뜻으로 앞 절과의 유사성을 이어줘요. so 뒤에 결과가 아니라 비교되는 내용이 온다는 점에 주의하세요.", ex:"Just as humans seek to be able to enjoy the characteristic goods of a human life, so a finch seeks a finch's life and the whale a whale's life.", exko:"인간이 인간다운 삶의 특징적인 좋은 것들을 누릴 수 있기를 추구하듯이, 핀치새는 핀치새의 삶을, 고래는 고래의 삶을 추구한다." },

    what: { word:"what", tag:"[관계대명사 what]", meaning:"what은 관계대명사로 say의 목적어절을 이끌어요. 'what it is not'은 '그것이 무엇이 아닌지'라는 뜻이에요. 뒤에 나오는 'What is relevant is their own forms of life'의 what도 마찬가지로 '~하는 것(관련 있는 것)'이라는 뜻으로 문장의 주어 역할을 해요.", ex:"It is easy to say what it is not.", exko:"그것이 무엇이 아닌지를 말하기는 쉽다." },
    care: { word:"care", tag:"[동사 · 품사 확인]", meaning:"care는 '보살핌'이라는 명사로도 잘 쓰이지만, 여기 'why would lawyers ... care about it'에서는 조동사 would 뒤에 오는 동사로 '관심을 가지다, 신경 쓰다'라는 뜻이에요. care about은 '~에 관심을 갖다'라고 해석하세요.", ex:"What is the Capabilities Approach (CA), and why would lawyers passionate about animal justice care about it?", exko:"역량 접근법(CA)이란 무엇이며, 동물 정의에 열정적인 변호사들이 왜 그것에 관심을 가질까?" },
    goods: { word:"goods", tag:"[명사 · 의미 확인]", meaning:"goods는 '상품, 물품'이라는 뜻으로 흔히 쓰이지만, 여기 'the characteristic goods of a human life'에서는 '좋은 것들, 가치 있는 것들'이라는 더 넓은 뜻으로 쓰였어요. 물건을 가리키는 것이 아니라 인간다운 삶이 주는 좋은 요소들을 뜻해요.", ex:"Just as humans seek to be able to enjoy the characteristic goods of a human life, so a finch seeks a finch's life and the whale a whale's life.", exko:"인간이 인간다운 삶의 특징적인 좋은 것들을 누릴 수 있기를 추구하듯이, 핀치새는 핀치새의 삶을, 고래는 고래의 삶을 추구한다." },

  passage: `What is the [[capabilities::Capabilities Approach]] (CA), and why would lawyers [[passionate::passionate]] about animal justice care about it? It is easy to say what it is not. The CA does not [[rank::rank]] animals by [[likeness::likeness]] to humans or seek special [[privileges::privileges]] for those considered most "like us," as do some other popular theoretical approaches. The CA has concern for the finch and the pig as much as the whale and the elephant. And it argues that the human form of life is simply [[irrelevant::irrelevant]] when we think about what each type of animal needs and [[deserves::deserves]]. What is relevant is their own forms of life. Just as humans seek to be able to enjoy the characteristic goods of a human life, so a finch seeks a finch's life and the whale a whale's life. We should extend ourselves and learn, not lazily picture animals as lesser humans, seeking a life sort of like our own. According to the CA, each sentient creature should have the opportunity to [[flourish::flourish]] __________.`,
  translation: `역량 접근법(CA)이란 무엇이며, 동물 정의에 열정적인 변호사들이 왜 그것에 관심을 가질까? 그것이 무엇이 아닌지를 말하기는 쉽다. CA는 다른 몇몇 인기 있는 이론적 접근법들이 그러하듯 인간과의 유사성으로 동물의 순위를 매기거나 가장 '우리와 비슷하다'고 여겨지는 동물에게 특별한 특권을 추구하지 않는다. CA는 고래와 코끼리만큼이나 핀치새와 돼지에게도 관심을 갖는다. 그리고 CA는 각 종류의 동물이 무엇을 필요로 하고 무엇을 받을 자격이 있는지 생각할 때 인간의 삶의 형태는 전혀 무관하다고 주장한다. 관련이 있는 것은 그들 자신의 삶의 형태이다. 인간이 인간다운 삶의 특징적인 좋은 것들을 누릴 수 있기를 추구하듯이, 핀치새는 핀치새의 삶을, 고래는 고래의 삶을 추구한다. 우리는 스스로를 확장하고 배워야 하며, 게으르게 동물을 우리 자신과 비슷한 삶을 추구하는 열등한 인간으로 그려서는 안 된다. CA에 따르면, 지각 능력이 있는 각 생명체는 __________ 번성할 기회를 가져야 한다.`,

  passage: `Social media serves as an important context to [[facilitate::facilitate]] [[autobiographical::autobiographical]] remembering. ① Personal events posted on social media platforms are better remembered and less forgotten than those not posted, [[independent_of::independent of]] the characteristics of the events. ② This may be because sharing memories online allows individuals to [[rehearse::rehearse]] and make sense of what happened, thus facilitating long-term memory [[retention::retention]]. ③ Online feedback such as comments and likes as well as technological features such as algorithms and periodic reminders can further serve as memory [[cues::cues]] for the posted event details. ④ Upward social comparisons on social media are particularly harmful for low [[self_esteem::self-esteem]] individuals, who tend to make more frequent comparisons when browsing. ⑤ As a result, event details shared on social media are likely stabilized and remembered over time, whereas those not shared may become [[inaccessible::inaccessible]] or forgotten.`,

  passage: `As children, the [[principle::principle]] of [[opposites::opposites]] is [[foreign::foreign]]. Children [[perceive::perceive]] words and their meanings separately from each other. It is only in later development that we understood that individual words directly connect to one another.

(A) The same [[applies::applies to]] the logical connection between 'Yes' and 'No' as perceived by parents. When we were children and were told, for example, "No, don't eat with your hands," we were confused and didn't know what our parents expected from us.

(B) For many children, for instance, it is not clear that 'Right' is the opposite of 'Left'. A [[vivid::vivid]] example of this can be seen when children learn to ride a bicycle. If parents tell their child "Don't go to the left," they will often find that the child will continue riding straight ahead and not automatically turn to the right.

(C) Our [[confusion::confusion]] was about whether we should continue eating or not and if so, how? Only later did we [[recognize::recognize]] the connection and understand that we should continue eating, but not with our hands but with a fork or a spoon.`,
  translation: `어린 시절에는 반대 개념의 원리가 낯설다. 아이들은 단어와 그 의미를 서로 별개로 인식한다. 개별 단어들이 서로 직접적으로 연결된다는 것을 우리가 이해한 것은 나중의 발달 단계에 이르러서였다.

(A) 부모가 인식하는 '예'와 '아니오' 사이의 논리적 연결에도 똑같은 것이 적용된다. 우리가 어렸을 때 예를 들어 "안 돼, 손으로 먹지 마"라는 말을 들었을 때, 우리는 혼란스러웠고 부모님이 우리에게 무엇을 기대하는지 알지 못했다.

(B) 예를 들어, 많은 아이들에게 '오른쪽'이 '왼쪽'의 반대라는 것이 명확하지 않다. 이것의 생생한 예는 아이들이 자전거 타는 법을 배울 때 볼 수 있다. 만약 부모가 아이에게 "왼쪽으로 가지 마"라고 말하면, 그들은 종종 아이가 계속 앞으로 곧장 달리고 자동으로 오른쪽으로 돌지는 않는다는 것을 발견하게 된다.

(C) 우리의 혼란은 우리가 계속 먹어야 하는지 아닌지, 그리고 만약 그렇다면 어떻게 먹어야 하는지에 관한 것이었다. 나중에서야 우리는 그 연결을 알아차렸고 우리가 계속 먹되 손이 아니라 포크나 숟가락으로 먹어야 한다는 것을 이해했다.`,

  passage: `Humans are not the most social animal. Ants, bees, and termites put humanity to shame on many [[metrics::metrics]] of [[sociality::sociality]]. A wide variety of relatives live together with perfectly [[harmonious::harmonious]] behavior and collectively care for their young. ① But while insect [[colonies::colonies]] are impressively social places, it's not our kind of social life. ② Bees always build [[hexagonal::hexagonal]] hives, ants march in lines, and termites move in zigzag formations. ③ We humans are more free, less tightly programmed genetically, so our social patterns can be more diverse and dynamic. ④ Every group dances a slightly different dance, and these choreographies change across generations. ⑤ We still think and act in ways that are in harmony with others around us, but it is through patterns that are more shaped by [[nurture::nurture]], not just nature.`,

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'oct' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      ph.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  var gc = document.getElementById('given-card');
  if (p.image) { gc.classList.add('show'); gc.innerHTML = '<img src="' + p.image + '" alt="문제 자료">'; }
  else { gc.classList.remove('show'); gc.innerHTML = ''; }
  var ic = document.getElementById('insert-card');
  if (p.insertSentence) {
    ic.classList.add('show');
    document.getElementById('insert-text').textContent = p.insertSentence;
    document.getElementById('insert-text-ko').textContent = p.insertSentenceKo || '';
  } else { ic.classList.remove('show'); }
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i, skipHistory) {
  current = i; render(); window.scrollTo({top:0, behavior:'smooth'});
  if (!skipHistory) { var h = '#p' + current; if (location.hash !== h) history.pushState({pIdx:current}, '', h); }
}
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  selectProblem(current);
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
