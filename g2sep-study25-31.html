<script>
const problems = [
{
  num: 25, type: "도표의 내용 파악",
  question: "다음 도표의 내용과 일치하지 않는 것은?",
  choices: ["① Overall, the percentage of respondents who used cash exceeded 60% in three out of the four countries.","② The percentage of respondents who used credit or debit cards in Germany was the same as that in India, at 56%.","③ The percentage of respondents who used credit or debit cards in the United States was more than double that in China.","④ The percentage of respondents who used mobile devices in Germany was 3 percentage points lower than that in the United States.","⑤ Among the four countries, China recorded the highest percentage of respondents who used mobile devices, followed by India."],
  answer: 2,
  explanation: "미국에서 신용 또는 직불 카드를 사용한 응답자 비율(65%)은 중국(36%)의 두 배(72%)보다 많지 않으므로, '두 배보다 많다'는 ③번 설명이 도표와 일치하지 않습니다.",
  chart: `<div class="chart-title">Methods of Payment Used by Respondents in Four Countries (April 2022 – March 2023)</div>
<table class="chart-table"><tr><th>Country</th><th>Cash</th><th>Credit / Debit Card</th><th>Mobile Device</th></tr>
<tr><td>Germany</td><td>73%</td><td>56%</td><td>18%</td></tr>
<tr><td>India</td><td>64%</td><td>56%</td><td>25%</td></tr>
<tr><td>United States</td><td>61%</td><td>65%</td><td>21%</td></tr>
<tr><td>China</td><td>45%</td><td>36%</td><td>67%</td></tr>
</table>`,
  vocab: {
    respondent: { word:"respondent", pron:"[리스판던트]", meaning:"응답자", ex:"the percentages of respondents in four countries who used different methods of payment", exko:"여러 가지 결제 수단을 사용한 4개국 응답자의 비율" },
    exceed: { word:"exceed", pron:"[익시드]", meaning:"넘다, 초과하다", ex:"the percentage of respondents who used cash exceeded 60%", exko:"현금을 사용한 응답자의 비율이 60%를 넘었다" },
    debit_card: { word:"debit card", pron:"[데빗 카드]", meaning:"직불 카드", ex:"credit or debit cards", exko:"신용 또는 직불 카드" },
    percentage_point: { word:"percentage point", pron:"[퍼센티지 포인트]", meaning:"퍼센트포인트", ex:"3 percentage points lower than that in the United States", exko:"미국에서보다 3퍼센트포인트 낮은" }
  },
  passage: `The above graph, which was based on a survey conducted from April of 2022 to March of 2023, shows the percentages of [[respondent::respondents]] in four countries who used different methods of payment. ‹①Overall, the percentage of respondents who used cash [[exceed::exceeded]] 60% in three out of the four countries.› ‹②The percentage of respondents who used credit or [[debit_card::debit cards]] in Germany was the same as that in India, at 56%.› ‹③The percentage of respondents who used credit or debit cards in the United States was more than double that in China.› ‹④The percentage of respondents who used mobile devices in Germany was 3 [[percentage_point::percentage points]] lower than that in the United States.› ‹⑤Among the four countries, China recorded the highest percentage of respondents who used mobile devices, followed by India.›`,
  translation: `위 그래프는, 2022년 4월부터 2023년 3월까지 진행된 조사에 근거하여, 여러 가지 결제 수단을 사용한 4개국 응답자의 비율을 보여준다. 전반적으로, 4개국 중 3개국에서 현금을 사용한 응답자의 비율이 60%를 넘었다. 독일에서 신용 또는 직불 카드를 사용한 응답자의 비율은 56%로 인도에서의 그것과 같았다. 미국에서 신용 또는 직불 카드를 사용한 응답자의 비율은 중국에서의 그것의 두 배보다 많았다. 독일에서 모바일 기기를 사용한 응답자의 비율은 미국에서의 그것보다 3퍼센트포인트 낮았다. 4개국 중, 중국이 모바일 기기를 사용한 응답자의 가장 높은 비율을 기록했고, 인도가 그 다음이었다.`,
  grammar: [
    { title:"관계대명사 which (계속적 용법)", desc:"콤마 뒤에서 앞 명사구 전체를 부연 설명합니다.", ex:"the above graph, which was based on a survey (위 그래프는, 그런데 그것은 조사에 근거했다)" },
    { title:"more than double (~의 두 배가 넘는)", desc:"비교 대상의 정확히 두 배를 넘는지 확인하는 표현입니다.", ex:"more than double that in China (중국에서의 그것의 두 배보다 많은)" }
  ],
  tips: [
    "도표 문제는 각 선택지의 수치를 표와 하나씩 직접 대조하세요.",
    "'두 배가 넘는다'는 표현은 반드시 실제로 ×2를 계산해서 검산하세요."
  ]
},
{
  num: 26, type: "내용 불일치",
  question: "Barry Commoner에 관한 다음 글의 내용과 일치하지 않는 것은?",
  choices: ["유대인 이민자의 아들이었다.","Harvard University에서 박사 학위를 받았다.","Missouri로 이주한 후 해군에서 복무했다.","핵무기 실험을 반대한 것으로 널리 알려졌다.","1980년에 Citizens Party를 설립했다."],
  answer: 2,
  explanation: "'After serving in the US Navy during World War II, Commoner moved to Missouri'라고 했으므로 해군에서 복무한 후에 Missouri로 이주한 것이지, 이주한 후에 복무한 것이 아닙니다. 따라서 일치하지 않는 것은 ③번입니다.",
  vocab: {
    leading: { word:"leading", pron:"[리딩]", meaning:"선도적인", ex:"Commoner was a leading ecologist.", exko:"Commoner는 선도적인 생태학자였다." },
    ecologist: { word:"ecologist", pron:"[이콜러지스트]", meaning:"생태학자", ex:"one of the founders of the modern environmental movement", exko:"현대 환경 운동의 창시자 중 한 명" },
    doctoral: { word:"doctoral", pron:"[닥터럴]", meaning:"박사의", ex:"He earned his doctoral degree in cellular biology from Harvard University.", exko:"그는 Harvard University에서 세포 생물학 박사 학위를 받았다." },
    physiology: { word:"physiology", pron:"[피지올러지]", meaning:"생리학", ex:"a professor of plant physiology", exko:"식물 생리학 교수" },
    oppose: { word:"opposition", pron:"[아퍼지션]", meaning:"반대", ex:"Commoner became widely known for his opposition to nuclear weapons testing.", exko:"Commoner는 핵무기 실험에 대한 그의 반대로 널리 알려졌다." },
    atmospheric: { word:"atmospheric", pron:"[애트머스페릭]", meaning:"대기의", ex:"the negative ecological effects of atmospheric nuclear testing", exko:"대기권 핵실험의 부정적인 생태학적 영향" },
    vehicle: { word:"vehicle", pron:"[비이클]", meaning:"전달 수단", ex:"Commoner founded the Citizens Party to serve as a vehicle for his ecological message.", exko:"Commoner는 그의 생태학적 메시지의 전달 수단으로서 Citizens Party를 설립했다." },
    awareness: { word:"awareness", pron:"[어웨어니스]", meaning:"인식", ex:"Commoner continued his efforts to raise awareness about the impact human activity has on the environment.", exko:"Commoner는 인간 활동이 환경에 미치는 영향에 대한 인식을 높이기 위해 계속 노력했다." }
  },
  passage: `Barry Commoner, born in Brooklyn in 1917, was the son of Jewish immigrants from Russia. Commoner was a [[leading::leading]] [[ecologist::ecologist]] and one of the founders of the modern environmental movement. He earned his [[doctoral::doctoral]] degree in cellular biology from Harvard University in 1941. After serving in the US Navy during World War II, Commoner moved to Missouri, and became a professor of plant [[physiology::physiology]] at Washington University in 1947, where he taught for 34 years. In the late 1950s, Commoner became widely known for his [[oppose::opposition]] to nuclear weapons testing and went on to write several books about the negative ecological effects of [[atmospheric::atmospheric]] nuclear testing. In 1980, Commoner founded the Citizens Party to serve as a [[vehicle::vehicle]] for his ecological message. In his later years, Commoner continued his efforts to raise [[awareness::awareness]] about the impact that human activity has on the environment.`,
  translation: `1917년에 브루클린에서 태어난 Barry Commoner는 러시아에서 온 유대인 이민자의 아들이었다. Commoner는 선도적인 생태학자이자 현대 환경 운동의 창시자 중 한 명이었다. 그는 1941년에 Harvard University에서 세포 생물학 박사 학위를 받았다. 2차 세계대전 중 미 해군에서 복무한 후, Commoner는 Missouri로 이주하였고, 1947년에 Washington University에서 식물 생리학 교수가 되었으며, 그곳에서 34년 동안 가르쳤다. 1950년대 후반에, Commoner는 핵무기 실험에 대한 그의 반대로 널리 알려졌고 나아가 대기권 핵실험의 부정적인 생태학적 영향에 관한 여러 권의 책을 썼다. 1980년에, Commoner는 그의 생태학적 메시지의 전달 수단으로서 역할을 하는 Citizens Party를 설립했다. 말년에, Commoner는 인간 활동이 환경에 미치는 영향에 대한 인식을 높이기 위해 계속해서 노력했다.`,

  passage: `All human cultures mark the passing of time by the differences they observe in the world around ‹①them›. Our choice of which differences to mark ‹②depend› firstly on what we can observe and secondly on what is important in our lives. How we mark the differences — the shapes of our calendars and our rituals — depends on the connections we make between those two things. In the agricultural society of pre-modern Europe, where higher [[latitude::latitudes]] make the seasons easily ‹③observable›, it was natural to monitor the solar cycle. Conversely, among the largely [[nomadic::nomadic]] peoples of Arabia, ‹④for whom› seasonal changes were less significant, the lunar calendar was a more sensible choice. That did not make it [[inevitable::inevitable]] that Islam would use a lunar calendar and Roman Christianity a solar one, but political and religious decisions were made from options limited by geography and lifestyle, ‹⑤[[filter::filtered]]› through tradition.`,
  translation: `인류의 모든 문화들은 그것들을 둘러싼 세계에서 그것들이 관찰하는 차이에 따라 시간의 흐름을 표시한다. 어떤 차이를 표시할지에 대한 우리의 선택은 첫째로 우리가 무엇을 관찰할 수 있는지와 둘째로 우리 삶에서 무엇이 중요한지에 따라 달라진다. 우리의 달력과 의식의 형태처럼 우리가 그 차이들을 표시하는 방법은 그 두 가지 사이에 우리가 만드는 연결에 따라 달라진다. 위도가 높아 계절을 쉽게 관찰할 수 있었던 전근대 유럽의 농경 사회에서는 태양의 주기를 관찰하는 것은 자연스러운 일이었다. 반대로, 계절 변화가 덜 중요한 아라비아의 대체로 유목 생활을 하는 민족들에게는 음력이 더 합리적인 선택이었다. 그렇다고 해서 이슬람교가 음력을, 로마 기독교가 양력을 사용하는 것이 필연적인 것은 아니었지만, 지리와 생활 방식에 의해 제한된 선택지 중에서 전통을 통해 걸러져 정치적, 종교적 결정이 이루어졌다.`,

    burnout: { word:"burnout", pron:"[번아웃]", meaning:"소진, 번아웃", ex:"empathy can be exhausting and lead to burnout or insensitivity", exko:"공감은 소모적일 수 있으며, 번아웃 또는 무감각으로 이어질 수 있다" },

    compassion: { word:"compassion", pron:"[컴패션]", meaning:"연민", ex:"other tools ... such as rational compassion or moral emotions", exko:"이성적 연민 또는 도덕적 감정 같은 다른 도구들" }
  },
  passage: `Although empathy is widely praised by scholars and public figures, not everyone is an empathy [[booster::booster]]. Critics of empathy argue that empathy will not save us from [[interpersonal::interpersonal]] and intergroup conflict. In fact, they argue, empathy makes such conflicts ‹①worse›. These critics maintain that empathy can be exhausting and lead to [[burnout::burnout]] or insensitivity to suffering. They argue that we tend to empathize strongly with our in-group and ‹②resist› empathizing with out-groups, and even enjoy the suffering of out-groups in competitive or threatening contexts. Thus, the prescription for more empathy is often ‹③efficient› in cases of conflict. Empathy, they argue, can further encourage conflict and force us into an us vs. them mentality. Finally, even when we try to empathize with others who are [[dissimilar::dissimilar]] from us or in unfamiliar contexts, sometimes we are ‹④unable› to accurately empathize with their experiences, causing further misunderstandings and frustration. Critics of empathy argue that we should give up on empathy and employ other tools in ‹⑤pursue› of social harmony, e.g., rational [[compassion::compassion]] or moral emotions like fear, anger, and shame.`,
  translation: `공감은 학자들과 유명 인사들에 의해 널리 칭송받지만, 모든 사람이 공감을 지지하는 사람인 것은 아니다. 공감에 대해 비판하는 사람들은 공감이 사람 간 그리고 집단 간 갈등으로부터 우리를 구해주지 않을 것이라고 주장한다. 사실, 그들은 공감이 그러한 갈등을 더 악화시킨다고 주장한다. 이런 비평가들은 공감은 소모적일 수 있으며, 번아웃 또는 고통에 대한 무감각으로 이어질 수 있다고 주장한다. 그들은 우리가 내집단에는 강하게 공감하고 외집단에 대한 공감에는 저항하며, 심지어 경쟁적이거나 위협적인 상황에서는 외집단의 고통을 즐기는 경향이 있다고 주장한다. 따라서, 더 많은 공감을 처방하는 것은 갈등 상황에서 종종 효율적이다(→ 역효과를 낸다). 그들이 주장하기로는, 공감은 더 나아가 갈등을 조장하고 우리를 우리 대 그들이라는 사고방식으로 몰아넣을 수 있다. 마지막으로, 우리와 다르거나 낯선 상황에 있는 타인에게 공감하려고 할 때조차도, 때때로 우리는 그들의 경험을 정확하게 공감하지 못하고, 그 이상의 오해와 좌절을 유발한다. 공감을 비판하는 사람들은 우리가 공감을 포기하고 사회적 조화를 얻기 위해 다른 도구를 이용해야 한다고 주장하는데, 예를 들면 이성적 연민 또는 두려움, 분노, 수치심과 같은 도덕적 감정들이다.`,
  grammar: [
    { title:"force A into B (A를 B로 몰아넣다)", desc:"'A가 B 상태에 놓이게 강제하다'라는 뜻입니다.", ex:"force us into an us vs. them mentality (우리를 우리 대 그들이라는 사고방식으로 몰아넣다)" },
    { title:"even when + 절 (양보)", desc:"'~할 때조차도'라는 뜻입니다.", ex:"even when we try to empathize with others who are dissimilar from us (우리와 다른 타인에게 공감하려고 할 때조차도)" }
  ],
  tips: [
    "어휘 문맥 문제는 앞뒤 문장이 부정적 결과를 이야기하는데 밑줄 단어만 긍정적이면 의심하세요.",
    "'더 많은 공감의 처방'이 갈등을 '악화시킨다'는 전체 논지와 'efficient(효율적)'가 모순됩니다."
  ]
},
{
  num: 31, type: "빈칸 추론",
  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
  choices: ["failure","uncertainty","repetition","dependence","vulnerability"],
  answer: 1,
  explanation: "결혼식, 발표, 낯선 곳 방문처럼 일상을 벗어나는 예상치 못한 사건들이 우리를 가장 생생하게 느끼도록 만든다는 내용이 이어지므로, 빈칸에는 ②번 uncertainty(불확실성)가 가장 적절합니다.",

    engaged: { word:"engaged", pron:"[인게이지드]", meaning:"몰입한, 참여한", ex:"you feel more fully engaged", exko:"여러분은 더 온전히 몰입한다고 느낀다" },
    sharpen: { word:"sharpen", pron:"[샤픈]", meaning:"예민해지다, 날카로워지다", ex:"Your senses are sharper.", exko:"여러분의 감각들이 더 예민해진다." },
    astonishing: { word:"astonishing", pron:"[어스토니싱]", meaning:"놀라운", ex:"unexpected plot twists and astonishing endings", exko:"예기치 않은 줄거리의 반전과 놀라운 결말" }
  },
  passage: `[[paradoxically::Paradoxically]], it's ___________ that makes us feel most alive. Think of events that shake you out of your everyday routine: maybe attending a family wedding, making a big presentation, or going somewhere you've never been. It's on those occasions that time seems to slow down a little, and you feel more fully [[engaged::engaged]]. The same holds true if the experience is risky, like mountain climbing or parasailing. Your senses are [[sharpen::sharper]]. You notice more. Thanks to the release of a feel-good chemical in the brain called dopamine, you get a greater rush of pleasure from chance encounters with people than planned meetings. Good news, financial rewards, and gifts are more enjoyable if they are surprises. It's why the most popular television shows and movies are the ones with unexpected plot twists and [[astonishing::astonishing]] endings.`,
  translation: `역설적으로, 우리가 가장 살아있다고 느끼게 만드는 것은 바로 불확실성이다. 여러분을 일상적인 삶에서 벗어나게 만드는 사건들을 생각해 보아라. 아마도 가족 결혼식에 참석하거나, 중대한 발표를 하거나, 한 번도 가보지 못한 곳에 가는 것 같은 일들 말이다. 시간이 약간 느려지는 것 같고, 여러분이 더 온전히 몰입한다고 느끼는 때는 바로 그러한 순간들이다. 등산이나 패러세일링처럼 그 경험이 위험한 경우에도 마찬가지이다. 여러분의 감각들이 더 예민해진다. 여러분은 더 많은 것을 알아차린다. '도파민'이라고 불리는 기분 좋게 하는 화학 물질이 뇌 안에서 분비되는 덕분에, 여러분은 계획된 만남보다 사람들과의 우연한 만남에서 더 크게 몰려오는 즐거움을 얻게 된다. 좋은 소식, 금전적 보상, 그리고 선물은 뜻밖의 일일 때 더 즐겁다. 그것이 가장 인기 있는 텔레비전 쇼와 영화가 예기치 않은 줄거리의 반전과 놀라운 결말을 가진 것들인 이유다.`,
  grammar: [
    { title:"강조구문 it is ~ that", desc:"'바로 ~인 것이다'라는 뜻으로 강조하는 대상을 it과 that 사이에 둡니다.", ex:"it's uncertainty that makes us feel most alive (바로 불확실성이 우리를 가장 살아있다고 느끼게 만든다)" },
    { title:"the same holds true if ~", desc:"'~인 경우에도 마찬가지이다'라는 뜻입니다.", ex:"The same holds true if the experience is risky. (그 경험이 위험한 경우에도 마찬가지이다.)" }
  ],
  tips: [
    "빈칸 문제는 이어지는 예시(결혼식, 발표, 낯선 곳, 등산)들의 공통점을 찾으면 정답이 보입니다.",
    "'예상치 못한(surprise)', '우연한(chance)'이 반복되는 것이 빈칸어(uncertainty)의 핵심 근거입니다."
  ]
}

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g2sep' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  document.getElementById('chart-area').innerHTML = p.chart || '';
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i, skipHistory) {
  current = i; render(); window.scrollTo({top:0, behavior:'smooth'});
  if (!skipHistory) { var h = '#p' + current; if (location.hash !== h) history.pushState({pIdx:current}, '', h); }
}
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  selectProblem(current);
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
