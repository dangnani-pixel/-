<script>

  num: "39", label: "39번", type: "문장 삽입",
  insertSentence: "Yet a few hours later, after the sun has warmed the greenhouses above freezing, the second visit presents a miraculous contrast.",
  insertSentenceKo: "그러나 몇 시간 뒤, 태양이 온실을 영상으로 데워 놓은 후의 두 번째 방문은 기적 같은 대조를 보여준다.",
  vocab: {

    dawn: { word:"dawn", pron:"[돈]", meaning:"새벽", ex:"one at dawn after a below-zero night", exko:"영하의 밤을 지낸 새벽에 한 번" },
    striking: { word:"striking", pron:"[스트라이킹]", meaning:"인상적인", ex:"a striking introduction to the winter harvest", exko:"겨울 수확에 대한 인상적인 소개" },
    frozen_solid: { word:"frozen solid", pron:"[프로즌 솔리드]", meaning:"꽁꽁 언", ex:"All the crops are frozen solid.", exko:"모든 작물이 꽁꽁 얼어 있다." },

    bleak: { word:"bleak", pron:"[블리크]", meaning:"황량한", ex:"leaves bleak enough to convince anyone", exko:"누구든 납득시킬 만큼 황량한 잎들" },
    vigorous: { word:"vigorous", pron:"[비거러스]", meaning:"생기가 넘치는", ex:"closely spaced rows of vigorous, healthy leaves", exko:"촘촘히 배치된 생기 넘치고 건강한 잎들의 줄", etym:"vig(활기차다, Latin vigere) + -or + -ous → '활기가 넘치는' → '생기가 넘치는'. 같은 vig 어근을 쓰는 단어: invigorate(in-안으로 + vig → 활기를 불어넣다), vigilant(vig → 깨어 활기찬 → 경계하는)." },
    maroons: { word:"maroons", pron:"[머룬즈]", meaning:"적갈색", ex:"greens, reds, maroons, and yellows", exko:"초록, 빨강, 적갈색, 노랑" }
  },
  funcWords: {
    sight: { word:"sight", tag:"[명사 sight · 광경]", meaning:"sight를 '시력, 보는 것'으로만 알고 있으면 어색해요. 여기 a sight of ~는 눈앞에 펼쳐진 '광경, 장면'을 뜻해서, reveals a sight of hard, frost-coated leaves는 '딱딱하고 서리 내려앉은 잎들의 광경이 드러난다'로 해석돼요.", ex:"Raising the inner covers, which is difficult because they too are frozen, reveals a sight of hard, frost-coated leaves bleak enough to convince anyone that this idea is foolish.", exko:"내부 덮개를 걷어 올리는 것은 그것들 역시 얼어 있어서 어렵기도 한데, 그렇게 하면 이 발상이 어리석다고 누구든 납득시킬 만큼 황량한, 딱딱하고 서리 내려앉은 잎들의 광경이 드러난다." },

    which: { word:"which", tag:"[관계대명사 · 계속적 용법]", meaning:"콤마 뒤에 오는 which는 앞 문장 전체(내부 덮개를 걷어 올리는 것)를 받아 '그런데 그것이 ~하다'라고 덧붙여 설명하는 계속적 용법의 관계대명사예요. 여기서는 '내부 덮개를 걷어 올리는 것'이 어렵다는 사실을 이어서 설명해요.", ex:"Raising the inner covers, which is difficult because they too are frozen, reveals a sight of hard, frost-coated leaves bleak enough to convince anyone that this idea is foolish.", exko:"내부 덮개를 걷어 올리는 것은 그것들 역시 얼어 있어서 어렵기도 한데, 그렇게 하면 이 발상이 어리석다고 누구든 납득시킬 만큼 황량한, 딱딱하고 서리 내려앉은 잎들의 광경이 드러난다." },
    too: { word:"too", tag:"[부사 too · 역시]", meaning:"too는 '너무'가 아니라 '역시, 또한'이라는 뜻으로 쓰였어요. because they too are frozen은 '그것들(내부 덮개) 역시 얼어 있기 때문에'라고 해석돼요.", ex:"Raising the inner covers, which is difficult because they too are frozen, reveals a sight of hard, frost-coated leaves bleak enough to convince anyone that this idea is foolish.", exko:"내부 덮개를 걷어 올리는 것은 그것들 역시 얼어 있어서 어렵기도 한데, 그렇게 하면 이 발상이 어리석다고 누구든 납득시킬 만큼 황량한, 딱딱하고 서리 내려앉은 잎들의 광경이 드러난다." },

  passage: `Making two visits to one of our cold [[greenhouses::greenhouses]] — one at [[dawn::dawn]] after a below-zero night, and the other a few hours later — provides a [[striking::striking]] introduction to the winter harvest. ( ① ) During the dawn visit all the crops are [[frozen_solid::frozen solid]]. ( ② ) Raising the inner covers, which is difficult because they too are frozen, reveals a sight of hard, [[frost_coated::frost-coated]] leaves [[bleak::bleak]] enough to convince anyone that this idea is foolish. ( ③ ) Under the inner covers are closely spaced rows of [[vigorous::vigorous]], healthy leaves that stretch the length of the greenhouse. ( ④ ) The leaf colors in different shades of greens, reds, [[maroons::maroons]], and yellows stand bright against the dark soil. ( ⑤ ) It looks like a never-ending spring.`,

  passage: `Parenting experts say children need to learn [[independence::independence]] and [[resilience::resilience]]. But cities and [[suburbs::suburbs]] don't offer safe walk and bike routes to school, malls kick teenagers out on the weekends, and free time disappears under a spreadsheet of activities. All of those "musts" take more of the parents' time or money to [[navigate::navigate]], because the child can't do it on their own. As Darby Saxbe, a clinical psychologist, recently wrote in the New York Times, "[[underparenting::underparenting]] requires [[structural::structural]] change." Unlike most political experts, she's not just talking about economic policies like family leave and government-supported childcare. She's talking about actual physical structures, and the cultural change required to populate them. We need to "build back our [[tolerance::tolerance]] for children in public spaces," she writes, "and create safe environments where lightly [[supervised::supervised]] kids can move around freely."`,
  translation: `육아 전문가들은 아이들이 독립성과 회복 탄력성을 배울 필요가 있다고 말한다. 그러나 도시와 교외는 학교까지 안전하게 걷거나 자전거로 갈 수 있는 경로를 제공하지 않고, 쇼핑몰은 주말에 십 대들을 내쫓으며, 자유 시간은 빽빽한 활동 일정표 아래로 사라진다. 그 모든 '반드시 해야 할 것들'은 부모의 시간이나 돈을 더 많이 들여야 헤쳐 나갈 수 있는데, 아이가 스스로 할 수 없기 때문이다. 임상심리학자 Darby Saxbe가 최근 New York Times에 썼듯이, "덜 개입하는 양육에는 구조적 변화가 필요하다." 대부분의 정치 전문가들과 달리, 그녀는 육아 휴직이나 정부 지원 보육 같은 경제 정책만을 말하는 것이 아니다. 그녀는 실제 물리적 구조물과, 그것을 채우기 위해 필요한 문화적 변화에 대해 말하고 있다. 우리는 "공공장소에서 아이들에 대한 관용을 되살리고, 가볍게 감독받는 아이들이 자유롭게 돌아다닐 수 있는 안전한 환경을 만들어야 한다"고 그녀는 쓴다.`,

  passage: `It's fair to say that patience has a terrible name. For one thing, the [[prospect::prospect]] of doing anything that you've been told will require patience simply seems unattractive. More specifically, though, it's [[disturbingly::disturbingly]] (a) ‹passive›. It is the [[virtue::virtue]] that has traditionally been urged upon housewives, while their husbands led more exciting lives outside the home; or on racial minorities, told to wait just a few more decades for their full civil rights. The talented but [[self_effacing::self-effacing]] employee who "waits patiently" for a promotion, we tend to feel, will be waiting a long time: she ought to be [[trumpeting::trumpeting]] her (b) ‹achievements› instead. In all such cases, patience is a way of psychologically [[accommodating::accommodating]] yourself to a lack of power, an attitude intended to help you to [[resign::resign yourself to]] your (c) ‹lowly› position, in theoretical hopes of better days to come. But as society accelerates, something (d) ‹shifts›. In more and more contexts, patience becomes a form of power. In a world [[geared_for::geared for]] hurry, the capacity to (e) ‹feed› the urge to hurry — to allow things to take the time they take — is a way to gain purchase on the world, to do the work that counts, and to derive satisfaction from the doing itself, instead of putting off all your fulfillment to the future.`,
  translation: `인내가 형편없는 평판을 갖고 있다고 말하는 것은 타당하다. 우선, 인내가 필요할 것이라고 들어온 무언가를 한다는 전망은 그저 매력적이지 않게 보인다. 그러나 더 구체적으로 말하면, 그것은 불편할 만큼 (a)수동적이다. 그것은 전통적으로 주부들에게 권장되어 온 미덕인데, 그동안 그들의 남편은 집 밖에서 더 신나는 삶을 살았다. 또는 완전한 시민권을 위해 몇십 년만 더 기다리라는 말을 들은 인종적 소수자들에게 권장된 미덕이기도 하다. 승진을 위해 "참을성 있게 기다리는" 재능 있지만 자신을 내세우지 않는 직원은 오랫동안 기다리게 될 것이라고 우리는 느끼는 경향이 있다. 그녀는 대신 자신의 (b)성과를 널리 알려야 한다. 그러한 모든 경우에, 인내는 힘의 부재에 심리적으로 자신을 맞추는 방식이며, 앞으로 나아질 날에 대한 이론적인 희망 속에서 자신의 (c)낮은 지위를 단념하고 받아들이도록 돕기 위해 의도된 태도이다. 그러나 사회가 가속화되면서, 무언가가 (d)달라진다. 점점 더 많은 맥락에서, 인내는 '힘'의 한 형태가 된다. 서두름에 맞춰진 세상에서, 서두르려는 충동을 (e)먹여 살리는(→억제하는) 능력 — 즉 일이 걸리는 시간만큼 걸리도록 허용하는 능력 — 은 세상에 대한 발판을 얻고, 중요한 일을 해내고, 모든 성취감을 미래로 미루는 대신 그 행위 자체에서 만족을 얻는 방법이다.`,

    appreciate: { word:"appreciate", tag:"[동사 appreciate · 소중히 여기다]", meaning:"appreciate를 '감사하다'로만 알고 있으면 어색해요. 여기서는 가치를 알아보고 '소중히 여기다, 진가를 인정하다'라는 뜻이라서, chose to appreciate what he already had는 '이미 가진 것을 소중히 여기기로 했다'로 해석돼요.", ex:"The king called off the invasion and chose to appreciate what he already had.", exko:"왕은 침략을 취소하고 이미 가진 것을 소중히 여기기로 했다." },
    since: { word:"Since", tag:"[접속사 since · 이유]", meaning:"since는 '~이후로(시간)'가 아니라 '~때문에(이유)'라는 뜻의 접속사로 쓰였어요. Since he lived simply and had no need for it은 '그는 소박하게 살았고 그것이 필요하지 않았기 때문에'라고 해석돼요.", ex:"Since he lived simply and had no need for it, he told his disciple (a) he hoped to give it to someone who truly required it.", exko:"그는 소박하게 살았고 그것이 필요하지 않았기 때문에, 제자에게 그것을 진정으로 필요로 하는 사람에게 주고 싶다고 말했다." },

  passage: `(A) One day, a [[sage::sage]] was traveling with his [[disciple::disciple]] through the capital of a [[prosperous::prosperous]] kingdom. As they walked along a busy road, the sage noticed a coin on the ground. Since he lived simply and had no need for it, he told his disciple (a) ‹he› hoped to give it to someone who truly required it. The two men searched the streets, but found no one in [[genuine::genuine]] need of the coin.

(B) The king, [[puzzled::puzzled]] and slightly annoyed at what he did, asked, "What is the meaning of this coin? I am the richest king in the land. Why would I need a single coin?" The sage replied calmly, "Oh, Great King, I found this coin yesterday while walking through your capital. I had no need for it, so I planned to give it to someone who did. Yet everyone (b) ‹I› met seemed [[content::content]] and lacked any urgent need."

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'mar' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      ph.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

let quizState = [];

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

function renderQuiz(p) {
  quizState = p.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = p.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var q = problems[current].questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var r = document.getElementById('qresult-' + qi);
  var ok = quizState[qi].selected === q.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.') + '</b><br>' + q.explanation;
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '다시 풀기';
  b.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var p = problems[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(p.questions[qi], qi);
  var r = document.getElementById('qresult-' + qi);
  r.classList.remove('show','ok','no'); r.innerHTML = '';
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '정답 확인';
  b.onclick = function() { checkAnswer(qi); };
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {

  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
