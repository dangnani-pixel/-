<script>
const problems = [
{
  num: 32, type: "빈칸 추론",
  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오. [3점]",
  choices: ["inseparable from consistent efforts","attributed to talented collaborators","dependent on financial resources","driven by societal recognition","indicative of a hidden talent"],
  answer: 4,
  explanation: "위대한 과학자들이 여러 번 성공하는 것은 이전 성공이 주는 이점 때문이 아니라 단지 그들이 유난히 재능이 있기 때문이라는 대안적 설명이 이어지므로, 이전의 성공이 '숨겨진 재능을 나타내는 것'이라는 ⑤번이 정답입니다.",
  vocab: {
    one_hit_wonder: { word:"one-hit wonders", pron:"[원 힛 원더즈]", meaning:"반짝 스타(단 한 번의 성공만 거둔 사람)", ex:"Great scientists are seldom one-hit wonders.", exko:"위대한 과학자가 반짝 스타인 경우는 드물다." },
    mechanics: { word:"mechanics", pron:"[머캐닉스]", meaning:"역학", ex:"beyond the Newtonian mechanics, he developed the theory of gravitation", exko:"뉴턴 역학을 넘어서 그는 중력 이론을 발전시켰다" },
    phenomenon: { word:"phenomenon", pron:"[퍼나머넌]", meaning:"현상", ex:"a phenomenon potentially explained by the Matthew effect", exko:"아마도 매튜 효과로 설명되는 현상" },
    legitimacy: { word:"legitimacy", pron:"[리지티머시]", meaning:"정당성", ex:"an initial success may offer a scientist legitimacy", exko:"최초의 성공은 과학자에게 정당성을 부여할 수 있다" },
    payoff: { word:"payoffs", pron:"[페이오프스]", meaning:"보상", ex:"each of these payoffs further increasing her odds of scoring another win", exko:"이러한 각각의 보상은 또 다른 성공을 거둘 가능성을 더욱 높여 준다" },
    endeavor: { word:"endeavors", pron:"[인데버즈]", meaning:"노력", ex:"consistently succeed in their scientific endeavors", exko:"자신의 과학적 노력에서 지속적으로 성공하다" },
    posit: { word:"posits", pron:"[파짓츠]", meaning:"상정하다", ex:"The Matthew effect posits that success alone increases the future probability of success.", exko:"매튜 효과는 성공 그 자체만으로 미래의 성공 확률을 높인다고 상정한다." },
    dictate: { word:"dictate", pron:"[딕테이트]", meaning:"좌우하다, 명령하다", ex:"Does status dictate outcomes?", exko:"지위가 결과를 좌우하는가?" }
  },
  passage: `Great scientists are seldom [[one_hit_wonder::one-hit wonders]]. Newton is a prime example: beyond the Newtonian [[mechanics::mechanics]], he developed the theory of gravitation, calculus, laws of motion, and optimization. In fact, well-known scientists are often involved in multiple discoveries, a [[phenomenon::phenomenon]] potentially explained by the Matthew effect. Indeed, an initial success may offer a scientist [[legitimacy::legitimacy]], improve peer perception, provide knowledge of how to score and win, enhance social status, and attract resources and quality collaborators, each of these [[payoff::payoffs]] further increasing her odds of scoring another win. Yet, there is an appealing alternative explanation: Great scientists have multiple hits and consistently succeed in their scientific [[endeavor::endeavors]] simply because they're exceptionally talented. Therefore, future success again goes to those who have had success earlier, not because of advantages offered by the previous success, but because the earlier success was ___________. The Matthew effect [[posit::posits]] that success alone increases the future probability of success, raising the question: Does status [[dictate::dictate]] outcomes, or does it simply reflect an underlying talent or quality? In other words, is there really a Matthew effect after all?`,
  translation: `위대한 과학자가 반짝 스타인 경우는 드물다. 뉴턴이 이 대표적인 예인데, 그는 뉴턴 역학을 넘어서 중력 이론, 미적분학, 운동 법칙 및 최적화를 발전시켰다. 실제로, 잘 알려진 과학자들은 종종 여러 발견에 관여하는데, 이는 아마도 매튜 효과로 설명되는 현상일 것이다. 실제로, 최초의 성공은 과학자에게 정당성을 부여하고, 동료들의 평가를 향상시키며, 어떻게 성과를 내고 성공하는지에 대한 지식을 제공하고, 사회적 지위를 높이며, 자원과 우수한 협력자를 끌어들일 수 있는데, 이러한 각각의 보상은 다른 성공을 거둘 가능성을 더욱 높여 준다. 그러나, 매력적인 대안이 되는 설명이 있는데, 위대한 과학자들이 여러 차례 성공을 거두고 자신의 과학적 노력에서 지속적으로 성공하는 것은 단지 그들이 유난히 재능이 있기 때문이라는 것이다. 따라서, 미래의 성공은 이전에 성공한 적이 있는 사람에게 다시 돌아가는데, 이는 이전의 성공이 주는 이점 때문이 아니라, 이전의 성공이 (그) 숨겨진 재능을 나타내는 것이기 때문이다. 매튜 효과는 성공 그 자체만으로 미래의 성공 확률을 높인다고 상정하며, 다음과 같은 의문을 제기한다: 지위가 결과를 좌우하는 것일까, 아니면 그것은 근본적인 재능이나 자질을 단순히 반영하는 것일까? 다시 말하면, 결론적으로 매튜 효과가 정말로 존재하는 것일까?`,
  grammar: [
    { title:"not because of A, but because B", desc:"'A 때문이 아니라 B 때문에'라는 대조 구문입니다.", ex:"not because of advantages offered by the previous success, but because the earlier success was indicative of a hidden talent (이전 성공이 주는 이점 때문이 아니라, 숨겨진 재능을 나타내는 것이기 때문에)" },
    { title:"raising the question (분사구문, 결과)", desc:"'그 결과 ~라는 의문을 제기하며'라는 뜻입니다.", ex:"The Matthew effect posits ~, raising the question: Does status dictate outcomes? (매튜 효과는 ~라고 상정하며, 지위가 결과를 좌우하는지 의문을 제기한다)" }
  ],
  tips: [
    "빈칸 문제는 'Yet(그러나)' 뒤에 제시된 대안적 설명(재능 때문이라는 설명)의 논리를 끝까지 따라가세요.",
    "빈칸 앞의 'not because of ~, but because ~' 구조에서 but 뒤에 들어갈 말이 정답의 핵심입니다."
  ]
},
{
  num: 33, type: "빈칸 추론",
  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
  choices: ["interrupts the rhythm of our narrative","represents the leading edge of our thought","illustrates the afterthoughts of our speaking","conceals the deep-seated intention of our speech","operates independently of our cognitive functions"],
  answer: 1,
  explanation: "몸짓이 없으면 정보를 잘 기억하지 못하고, 문제를 잘 해결하지 못하며, 생각을 잘 설명하지 못한다는 내용에 이어, 몸짓이 말의 서투른 동반자가 아니라 오히려 우리의 생각을 이끈다는 흐름이므로, '우리 생각의 선두에 선다'는 ②번이 정답입니다.",
  vocab: {
    startling: { word:"startling", pron:"[스타틀링]", meaning:"놀라운", ex:"Such sequences suggest the startling notion that our hands 'know' what we're going to say.", exko:"이러한 순서는 우리의 손이 우리가 무엇을 말할지 '안다'는 놀라운 개념을 암시한다." },
    prime: { word:"prime", pron:"[프라임]", meaning:"준비시키다, 촉발하다", ex:"Gesture can mentally prime a word so that the right term comes to our lips.", exko:"몸짓은 정신적으로 단어를 준비시켜 정확한 용어가 입술에 도달하도록 할 수 있다." },
    fluently: { word:"fluently", pron:"[플루언틀리]", meaning:"유창하게", ex:"they talk less fluently", exko:"그들은 덜 유창하게 말한다" },
    halting: { word:"halting", pron:"[홀팅]", meaning:"더듬거리는", ex:"their speech becomes halting", exko:"그들의 말은 더듬거리게 된다" },
    deleterious: { word:"deleterious", pron:"[델러티어리어스]", meaning:"해로운", ex:"Not being able to gesture has other deleterious effects.", exko:"몸짓을 할 수 없는 것은 또 다른 해로운 영향을 갖는다." },

  passage: `When we realize we've said something in error and we pause to go back to correct it, we stop gesturing a couple of hundred milliseconds before we stop speaking. Such sequences suggest the [[startling::startling]] notion that our hands "know" what we're going to say before our conscious minds do, and in fact this is often the case. Gesture can mentally [[prime::prime]] a word so that the right term comes to our lips. When people are prevented from gesturing, they talk less [[fluently::fluently]]; their speech becomes [[halting::halting]] because their hands are no longer able to supply them with the next word, and the next. Not being able to gesture has other [[deleterious::deleterious]] effects: without gesture to help our mental processes along, we remember less useful information, we solve problems less well, and we are less able to explain our thinking. Far from tagging along as speech's [[clumsy::clumsy]] companion, gesture ___________.`,
  translation: `우리가 무언가를 잘못 말한 것을 깨닫고 다시 수정하려 돌아가려고 할 때, 우리는 말을 멈추기 수백 밀리세컨드(0.001초) 전에 손짓을 멈춘다. 이러한 순서는 우리의 손이 의식적인 마음이 알아채기 전에(먼저) 우리가 무엇을 말할 것인지 '알고' 있다는 놀라운 개념을 암시하며, 실제로 이런 경우가 종종 있다. 손짓은 정신적으로 단어를 준비시키고 정확한 용어가 입술에 도달하도록 할 수 있다. 사람들이 손짓을 하지 못하게 되면 덜 유창하게 말하게 되는데, 이는 그들의 손이 더 이상 다음 단어와 또 그 다음 단어를 제공할 수 없어서 말이 더듬거리게 되기 때문이다. 손짓을 할 수 없게 되는 것은 또 다른 해로운 영향을 갖는다. 정신적 과정을 쭉 도와주는 손짓이 없으면, 유용한 정보를 잘 기억하지 못하고, 문제를 잘 해결하지 못하며, 우리의 생각을 잘 설명하지 못한다. 손짓은 말의 서투른 동반자로 뒤따라가는 것이 아니라, 우리의 사고를 선도하는 역할을 나타낸다.`,

  passage: `Despite the difference between the past and the future, between what has happened and what is to come, it can be suggested, that our sense of the past has always been influenced by our view of the future. [[revolutionary::Revolutionaries]] have always looked to the past to frame their future cause, as is amply illustrated by examples from nationalism to communism. The future has often been seen as variously a recovery of a lost time, as a [[replication::replication]] of what is established, or as a model [[bequeath::bequeathed]] by a heroic age long gone. The writing of history is based on understanding or explaining future outcomes that were not known to contemporaries, since the historian has the benefit of [[hindsight::hindsight]] and the past is nothing more than the [[accumulation::accumulation]] of futures that are now our past. So, rather than see the hand of the past always shaping the future, perhaps it can be seen in reverse, with the past — in the sense of our understanding of it — being ___________.`,
  translation: `과거와 미래, 즉 이미 일어난 일과 (앞으로) 일어날 일 사이의 차이에도 불구하고, 과거에 대한 우리의 인식이 항상 미래에 대한 우리의 관점에 의해 영향을 받아 왔다고 말할 수 있다. 민족주의에서 공산주의에 이르는 예시에 의해 충분히 입증되듯이, 혁명가들은 자신들의 미래 대의를 구성하기 위해 항상 과거를 참고해 왔다. 미래는 종종 잃어버린 시간의 회복, 이미 확립된 것의 복제, 또는 오래전에 없어진 영웅시대에 의해 후세에 전해진 모델로 다양하게 여겨져 왔다. 역사의 서술은 동시대의 사람들에게는 알려지지 않은 결과를 이해하거나 설명하는 데 기초하고 있는데, 그 이유는 역사가는 지난 일에 대한 통찰의 이점을 가지고 있고 과거란 지금은 우리의 과거인 것의 축적에 불과하기 때문이다. 따라서, 과거의 손길이 항상 미래를 형성한다고 보기보다는, 오히려 그 반대인 것으로, 즉 과거가 — 그것(과거)에 대한 우리의 이해라는 — 미래에 대한 우리의 방향성에 의해 형성된다고 볼 수도 있는 것이다.`,

  passage: `Dictionaries are relatively good resources for anyone interested in finding out what a word means. Using one set of words to define another word is called a [[lexical::lexical]] definition. But it's important to understand the limits of dictionary definitions. ‹①More often than not, a definition in a dictionary requires readers to have a fairly [[robust::robust]] understanding of the language already [[at_disposal::at their disposal]].› ‹②In other words, a dictionary functions in many cases as a [[cross_reference::cross-reference]] or translator between words one knows and words that one doesn't yet know.› ‹③However, there are words that may be defined not through other words but only by pointing to something in our experience.› ‹④Even the most [[obscure::obscure]] words in a dictionary, say, for example, "pulchritudinous" or "kalokagathia," must be defined using words that the reader already knows and understands.› ‹⑤Otherwise, the dictionary isn't very helpful.›`,
  translation: `사전은 단어가 무슨 의미인지 찾는 데 관심이 있는 모든 사람에게 비교적 좋은 자료이다. 하나의 단어 집합을 사용하여 다른 단어를 정의하는 것을 어휘적 정의라고 한다. 하지만 사전적 정의의 한계를 이해하는 것이 중요하다. 대부분, 사전 속의 정의는 독자가 이미 자유롭게 사용할 수 있는 언어에 대해 상당히 탄탄한 이해력을 가지도록 요구한다. 다시 말해, 사전은 많은 경우 아는 단어와 아직 모르는 단어 사이의 상호 참조 또는 번역기 역할을 한다. (하지만, 다른 단어를 통해서가 아니라 우리 경험 속에 있는 무언가를 가리키는 것에 의해서만 정의될 것 같은 단어가 있다.) 사전에서 가장 난해한 어휘, 예를 들면, 'pulchritudinous'나 'kalokagathia'조차도, 독자가 이미 알고 이해하고 있는 단어를 사용하여 정의되어야 한다. 그렇지 않으면, 사전은 그다지 도움이 되지 않는다.`,

  passage: `The governments of [[virtually::virtually]] every country on the planet attach great importance to achieving food security and a wide variety of mechanisms have been developed to realize this goal.

(B) The first issue governments face in achieving national food security is the problem of insuring that [[adequate::adequate]] amounts of food are available to the resident population. Some governments have set goals of food [[self_sufficiency::self-sufficiency]], which means most if not all of the food available in a country comes from the [[domestic::domestic]] farming system.

  translation: `사실상 전 세계 모든 국가의 정부는 식량 안보를 달성하는 것에 큰 중요성을 부여하며, 이 목표를 실현하기 위해 다양한 메커니즘이 개발되어 왔다.

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g25mar' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  document.getElementById('given-area').innerHTML = p.given ? '<div class="given-box">' + p.given + '</div>' : '';
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i, skipHistory) {
  current = i; render(); window.scrollTo({top:0, behavior:'smooth'});
  if (!skipHistory) { var h = '#p' + current; if (location.hash !== h) history.pushState({pIdx:current}, '', h); }
}
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  selectProblem(current);
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
