<script>
const problems = [
{
  num: "39", label: "39번", type: "문장 삽입",
  insertSentence: "But with more permanent things, companies must invent reasons for their customers to continue to consume them.",
  insertSentenceKo: "그러나 더 오래가는 물건의 경우, 기업은 고객이 그것을 계속 소비할 이유를 만들어내야 한다.",
  vocab: {
    purchase: { word:"purchase", pron:"[퍼처스]", meaning:"구매하다", ex:"Those who purchase goods are called customers.", exko:"물건을 구매하는 사람들은 고객이라 불린다." },
    consume: { word:"consume", pron:"[컨슘]", meaning:"소비하다", ex:"Individuals who consume goods are consumers.", exko:"물건을 소비하는 개인은 소비자이다." },
    permanent: { word:"permanent", pron:"[퍼머넌트]", meaning:"영구적인, 오래가는", ex:"with more permanent things", exko:"더 오래가는 물건의 경우" },
    quantities: { word:"quantities", pron:"[콴터티즈]", meaning:"양, 수량", ex:"in larger and larger quantities", exko:"점점 더 많은 양으로" },
    literally: { word:"literally", pron:"[리터럴리]", meaning:"말 그대로", ex:"Food is literally consumed.", exko:"음식은 말 그대로 소비된다." },
    outdated: { word:"outdated", pron:"[아웃데이티드]", meaning:"구식의", ex:"make the stuff people have outdated", exko:"사람들이 가진 물건을 구식으로 만들다" },
    functionable: { word:"functionable", pron:"[펑셔너블]", meaning:"쓸 수 있는", ex:"the old is still perfectly functionable", exko:"낡은 것도 여전히 완벽하게 쓸 수 있다" },
    indefinitely: { word:"indefinitely", pron:"[인데퍼니틀리]", meaning:"무한정", ex:"The list is extended indefinitely.", exko:"그 목록은 무한정 늘어난다." }
  },
  funcWords: {
    those: { word:"those", tag:"[대명사 those]", meaning:"those는 '사람들'을 뜻하는 대명사이고, 뒤의 관계대명사 who와 함께 'Those who ~'는 '~하는 사람들'이라는 뜻이 돼요. 뒤에 나오는 'Those who sell food'도 같은 구조예요.", ex:"Those who purchase the goods of a company are called customers.", exko:"어떤 회사의 상품을 구매하는 사람들은 고객이라고 불린다." },
    for: { word:"for", tag:"[등위접속사 for · 이유]", meaning:"여기서 for는 '~을 위해'라는 전치사가 아니라 '왜냐하면 ~이기 때문이다'라는 뜻의 등위접속사예요. because와 비슷하지만 문어체에서 앞 문장 뒤에 이유를 덧붙일 때 콤마와 함께 쓰여요.", ex:"Those who sell food have an easy time, for food is literally consumed, so there is always a need to purchase new food.", exko:"음식을 파는 사람들은 수월하다. 왜냐하면 음식은 말 그대로 소비되어서 새 음식을 구매할 필요가 항상 있기 때문이다." },
    though: { word:"though", tag:"[even though]", meaning:"'even though'는 '비록 ~이지만, ~인데도'라는 뜻의 양보 접속사예요. though 하나만 있어도 비슷한 뜻이지만, even이 붙으면 그 양보의 의미가 더 강조돼요.", ex:"The entire fashion industry is built to convince people that fashion matters, so they must purchase new clothing, even though the old is still perfectly functionable.", exko:"패션 산업 전체는 패션이 중요하다고 사람들을 설득하도록 만들어져 있어서, 낡은 옷이 여전히 완벽하게 쓸 수 있는데도 사람들은 새 옷을 사야만 한다." },
    by: { word:"by", tag:"[전치사 by · 수단]", meaning:"'by convincing them'에서 by는 '~함으로써(수단)'이라는 뜻의 전치사예요. by 뒤에 동명사(convincing)가 와서 '그들을 설득함으로써'라고 해석돼요.", ex:"One approach is to make the stuff that people already have outdated by convincing them that it is no longer fashionable.", exko:"한 가지 접근법은 사람들이 이미 가지고 있는 물건이 더 이상 유행하지 않는다고 설득함으로써 그것을 구식으로 만드는 것이다." },
    matters: { word:"matters", tag:"[동사 · 품사 확인]", meaning:"matters는 '사안들, 문제들'이라는 명사의 복수형으로 보이기 쉽지만, 여기 'convince people that fashion matters'에서는 that절의 주어(fashion) 뒤에 오는 동사로 '중요하다'라는 뜻이에요. 명사가 아니라 동사로 해석하세요.", ex:"The entire fashion industry is built to convince people that fashion matters, so they must purchase new clothing, even though the old is still perfectly functionable.", exko:"패션 산업 전체는 패션이 중요하다고 사람들을 설득하도록 만들어져 있어서, 낡은 옷이 여전히 완벽하게 쓸 수 있는데도 사람들은 새 옷을 사야만 한다." }
  },
  passage: `Those who [[purchase::purchase]] the goods of a company are called customers. Individuals who purchase goods for personal use are called consumers: beings who [[consume::consume]]. ( ① ) Therefore, companies have invented multiple ways to ensure that their customers consume the produced items in larger and larger [[quantities::quantities]] and more and more frequently. ( ② ) Those who sell food have an easy time, for food is [[literally::literally]] consumed, so there is always a need to purchase new food. ( ③ ) One approach is to make the stuff that people already have [[outdated::outdated]] by convincing them that it is no longer fashionable. ( ④ ) The entire fashion industry is built to convince people that fashion matters, so they must purchase new clothing, even though the old is still perfectly [[functionable::functionable]]. ( ⑤ ) Fashion today extends to far more things than clothes: automobiles, mobile phones, computers — the list is extended [[indefinitely::indefinitely]], limited only by the limits of the creative minds of the marketing divisions of companies.`,
  translation: `어떤 회사의 상품을 구매하는 사람들은 고객이라고 불린다. 개인적인 사용을 위해 물건을 구매하는 개인은 소비자라고 불리는데, 이는 소비하는 존재를 뜻한다. ( ① ) 따라서 기업들은 고객이 생산된 물품을 점점 더 많은 양으로, 점점 더 자주 소비하도록 보장하기 위한 여러 방법을 고안해 왔다. ( ② ) 음식을 파는 사람들은 수월하다. 왜냐하면 음식은 말 그대로 소비되어서 새 음식을 구매할 필요가 항상 있기 때문이다. ( ③ ) 한 가지 접근법은 사람들이 이미 가지고 있는 물건이 더 이상 유행하지 않는다고 설득함으로써 그것을 구식으로 만드는 것이다. ( ④ ) 패션 산업 전체는 패션이 중요하다고 사람들을 설득하도록 만들어져 있어서, 낡은 옷이 여전히 완벽하게 쓸 수 있는데도 사람들은 새 옷을 사야만 한다. ( ⑤ ) 오늘날 패션은 옷보다 훨씬 더 많은 것으로 확장된다. 자동차, 휴대전화, 컴퓨터 — 그 목록은 기업 마케팅 부서의 창의적인 두뇌의 한계에 의해서만 제한될 뿐 무한정 늘어난다.`,
  grammar: [
    { title:"ensure that + 절", desc:"'~하도록 확실히 하다'라는 뜻으로 뒤에 완전한 절이 옵니다.", ex:"ensure that customers consume more (고객이 더 많이 소비하도록 확실히 하다)" },
    { title:"for (이유의 등위접속사)", desc:"'왜냐하면 ~이기 때문이다'라는 뜻으로 앞 문장의 이유를 덧붙입니다.", ex:"They have an easy time, for food is consumed. (그들은 수월한데, 음식은 소비되기 때문이다.)" },
    { title:"make + 목적어 + 형용사 (5형식)", desc:"'~을 …하게 만들다'라는 뜻이에요.", ex:"make the stuff outdated (그 물건을 구식으로 만들다)" }

  passage: `Kivetz, Urminsky, and Zheng partnered with a café to test the motivating effect of [[illusory::illusory]] progress in an experiment. Customers received a [[reward_card::reward card]] that offered one free coffee after they'd bought ten. While half of the customers received a card with ten open [[slots::slots]], the other half got a card with twelve open slots. Yet the twelve-slot card had two [[preexisting::preexisting]] "bonus" stamps, so, [[strictly::strictly speaking]], these were [[identical::identical]] reward programs. Every customer who got a card needed to make ten coffee purchases (and collect ten stamps) to get their free coffee. But the appeal of the free stamps was high. People who thought they'd gotten a [[head_start::head start]] came back to the café more often, filling in their reward card more quickly than the others. When the card came with two out of twelve slots already filled, it felt to customers like they were already 16 percent finished with the goal before they'd even started. Believing they were closer to the reward, they were more [[motivated::motivated]] to reach the finish line.`,
  translation: `Kivetz, Urminsky, Zheng은 한 카페와 협력하여 착각된 진전이 주는 동기 부여 효과를 실험으로 검증했다. 고객들은 커피 열 잔을 사면 한 잔을 무료로 주는 적립 카드를 받았다. 고객의 절반은 빈칸이 열 개 있는 카드를 받았고, 나머지 절반은 빈칸이 열두 개 있는 카드를 받았다. 그런데 열두 칸짜리 카드에는 이미 '보너스' 도장이 두 개 찍혀 있었으므로, 엄밀히 말하면 이 둘은 동일한 적립 프로그램이었다. 카드를 받은 모든 고객은 무료 커피를 받기 위해 열 번의 커피 구매를 해야(그리고 도장 열 개를 모아야) 했다. 하지만 무료 도장의 매력은 컸다. 유리하게 출발했다고 생각한 사람들은 카페에 더 자주 돌아왔고, 다른 사람들보다 더 빠르게 적립 카드를 채웠다. 카드에 열두 칸 중 두 칸이 이미 채워져 있을 때, 고객들은 시작도 하기 전에 이미 목표의 16퍼센트를 끝낸 것처럼 느꼈다. 자신이 보상에 더 가까이 있다고 믿었기에, 그들은 결승선에 도달하려는 동기가 더 강했다.`,

  passage: `Creativity is the ability to generate [[novel::novel]] and valuable ideas. It involves [[divergent::divergent thinking]], imagination, and a willingness to experiment and take risks. While AI can be a powerful tool for creative efforts, it also (a) carries the risk of limiting [[originality::originality]] and innovation. AI algorithms are trained on (b) existing datasets, often identifying patterns and trends in past creations. While this can be useful for generating new content in similar styles or formats, it can also lead to [[derivative::derivative]] works that lack genuine originality. If artists and designers rely too heavily on AI for inspiration and content generation, they may find themselves (c) trapped in a cycle of imitation, unable to break free from the [[constraints::constraints]] of the AI's training data. Moreover, the ease with which AI can generate content can discourage the kind of struggle and experimentation that often leads to [[breakthroughs::breakthroughs]]. The creative process is often messy and repetitive, involving numerous failures and [[setbacks::setbacks]]. It is through these (d) challenges that we refine our skills, develop our unique perspectives, and push the boundaries of what is possible. If AI provides instant solutions, it can (e) enhance this essential process of learning through trial and error, ultimately [[inhibiting::inhibiting]] the development of true creative talent.`,
  translation: `창의성은 참신하고 가치 있는 아이디어를 만들어내는 능력이다. 그것은 확산적 사고, 상상력, 그리고 실험하고 위험을 감수하려는 의지를 포함한다. AI가 창의적 노력에 강력한 도구가 될 수 있지만, 그것은 또한 독창성과 혁신을 제한할 위험도 (a)지닌다. AI 알고리즘은 (b)기존의 데이터셋으로 훈련되며, 종종 과거 창작물의 패턴과 경향을 식별한다. 이것이 비슷한 스타일이나 형식의 새로운 콘텐츠를 생성하는 데는 유용할 수 있지만, 진정한 독창성이 결여된 모방적 작품으로 이어질 수도 있다. 만약 예술가와 디자이너가 영감과 콘텐츠 생성을 AI에 지나치게 의존한다면, 그들은 AI 훈련 데이터의 제약에서 벗어나지 못한 채 모방의 순환에 (c)갇힌 자신을 발견하게 될지도 모른다. 게다가, AI가 콘텐츠를 생성할 수 있는 그 용이함은 종종 돌파구로 이어지는 종류의 분투와 실험을 위축시킬 수 있다. 창작 과정은 흔히 지저분하고 반복적이며, 수많은 실패와 좌절을 수반한다. 우리가 기술을 다듬고, 고유한 관점을 발전시키며, 가능성의 경계를 넓히는 것은 바로 이러한 (d)어려움을 통해서이다. 만약 AI가 즉각적인 해결책을 제공한다면, 그것은 시행착오를 통한 이 필수적인 학습 과정을 (e)강화하여(→약화시켜), 궁극적으로 진정한 창의적 재능의 발달을 억제할 수 있다.`,

  passage: `(A) When [[billionaire::billionaire]] James Walker was once asked by a journalist, "Is there anyone richer than you?", he replied, "Yes, there is one young man I'll never forget." He told the story of when he first met David at a New York airport. Years ago, James was [[broke::broke]] and stuck at the airport, [[killing_time::killing time]] reading newspaper headlines at the [[newsstand::newsstand]]. One headline caught (a) his eye, but he had no money to buy the paper.

(B) Years passed and James became a [[wealthy::wealthy]] businessman, but he never forgot the young man he had met at the airport. He found David running a small bookstore and visited him there. (b) He introduced himself, saying, "David, you helped me twice when you had almost nothing. I want to give you anything you wish." He looked at (c) him and said, "You can't truly [[compensate::compensate]] me."

(C) James asked, "Why not?" David replied, "Because I gave to you when I had almost nothing. You're offering me something now that you have everything. That's just [[generosity::generosity]] at convenience. So, I can't accept your offer." James realized that money doesn't make someone rich. Remembering that moment, (d) he said to the journalist, "It's the willingness to give even when you have very little that makes you wealthy. And so, David is the richest person I have ever met."

(D) Just then, David, working at the newsstand noticed James. (e) He asked, "Would you like to buy this, sir?" But, James [[hesitated::hesitated]], saying he had no money. David smiled and said, "Me, too. But I have enough for this. Take it as a gift." Three months later, James, still broke, met him at the newsstand once more. Again, David gave him a newspaper without expecting anything in return.`,
  translation: `(A) 억만장자 James Walker가 언젠가 한 기자에게 "당신보다 더 부유한 사람이 있습니까?"라는 질문을 받았을 때, 그는 "네, 제가 결코 잊지 못할 젊은이가 한 명 있습니다."라고 답했다. 그는 뉴욕의 한 공항에서 David를 처음 만났을 때의 이야기를 들려주었다. 몇 년 전, James는 빈털터리로 공항에 발이 묶여 신문 가판대에서 신문 기사 제목을 읽으며 시간을 때우고 있었다. 한 기사 제목이 (a)그의 눈길을 사로잡았지만, 그는 신문을 살 돈이 없었다.

(B) 세월이 흘러 James는 부유한 사업가가 되었지만, 공항에서 만났던 그 젊은이를 결코 잊지 않았다. 그는 David가 작은 서점을 운영하고 있다는 것을 알아내고 그곳으로 그를 찾아갔다. (b)그는 자신을 소개하며 말했다. "David, 당신은 거의 아무것도 없을 때 나를 두 번이나 도와주었습니다. 당신이 원하는 것은 무엇이든 드리고 싶습니다." 그는 (c)그를 바라보며 말했다. "당신은 나에게 진정으로 보상할 수 없습니다."

(C) James가 물었다. "왜 안 되죠?" David가 답했다. "제가 거의 아무것도 없을 때 당신에게 주었기 때문입니다. 당신은 모든 것을 가진 지금에서야 저에게 무언가를 제안하고 있습니다. 그건 그저 편할 때의 관대함일 뿐입니다. 그래서 저는 당신의 제안을 받아들일 수 없습니다." James는 돈이 사람을 부유하게 만드는 것이 아니라는 것을 깨달았다. 그 순간을 회상하며, (d)그는 기자에게 말했다. "아주 적게 가졌을 때조차 기꺼이 베풀려는 마음, 그것이 당신을 부유하게 만듭니다. 그래서 David는 제가 만나본 사람 중 가장 부유한 사람입니다."

(D) 바로 그때, 신문 가판대에서 일하던 David가 James를 알아차렸다. (e)그가 물었다. "이거 사시겠어요, 손님?" 하지만 James는 돈이 없다며 망설였다. David는 미소 지으며 말했다. "저도요. 하지만 이건 살 만큼은 있어요. 선물로 받으세요." 세 달 후, 여전히 빈털터리였던 James는 신문 가판대에서 그를 다시 한번 만났다. 다시 한번, David는 아무런 대가도 바라지 않고 그에게 신문을 주었다.`,

      answer:3,
      explanation:"David는 'So, I can't accept your offer.'라며 James의 제안을 거절했으므로, 제안을 받아들였다는 ④번은 글의 내용과 일치하지 않습니다." }
  ]
}
];

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'oct' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      ph.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.label + '</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

let quizState = [];

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

function renderQuiz(p) {
  quizState = p.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = p.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var q = problems[current].questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var r = document.getElementById('qresult-' + qi);
  var ok = quizState[qi].selected === q.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.') + '</b><br>' + q.explanation;
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '다시 풀기';
  b.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var p = problems[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(p.questions[qi], qi);
  var r = document.getElementById('qresult-' + qi);
  r.classList.remove('show','ok','no'); r.innerHTML = '';
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '정답 확인';
  b.onclick = function() { checkAnswer(qi); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.label + ' · ' + p.type;
  var gc = document.getElementById('given-card');
  if (p.image) { gc.classList.add('show'); gc.innerHTML = '<img src="' + p.image + '" alt="문제 자료">'; }
  else { gc.classList.remove('show'); gc.innerHTML = ''; }
  var ic = document.getElementById('insert-card');
  if (p.insertSentence) {
    ic.classList.add('show');
    document.getElementById('insert-text').textContent = p.insertSentence;
    document.getElementById('insert-text-ko').textContent = p.insertSentenceKo || '';
  } else { ic.classList.remove('show'); }
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i) { current = i; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  render(); window.scrollTo({top:0, behavior:'smooth'});
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
render();
</script>
