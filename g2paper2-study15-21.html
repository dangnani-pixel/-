<script>
const problems = [
{
  num: "15", label: "15번", type: "빈칸 추론",
  vocab: {
    boundary: { word:"boundary", pron:"[바운더리]", meaning:"경계", ex:"Relationship boundaries are the invisible lines that we put in place.", exko:"관계에서의 경계란 우리가 설정해 두는 보이지 않는 선이다." },
    invisible: { word:"invisible", pron:"[인비저블]", meaning:"보이지 않는", ex:"the invisible lines that we put in place, consciously or not", exko:"우리가 의식적으로든 아니든 설정해 두는 보이지 않는 선" },
    consciously: { word:"consciously", pron:"[칸셔슬리]", meaning:"의식적으로", ex:"the invisible lines that we put in place, consciously or not", exko:"우리가 의식적으로든 아니든 설정해 두는 보이지 않는 선" },
    differentiation: { word:"differentiation", pron:"[디퍼렌시에이션]", meaning:"분화", ex:"Murray Bowen used the term differentiation.", exko:"Murray Bowen은 ‘분화’라는 용어를 사용했다." },
    crisis: { word:"crisis", pron:"[크라이시스]", meaning:"위기", ex:"When someone else is in crisis, it doesn't become our crisis.", exko:"다른 누군가가 위기에 처했을 때, 그것이 우리의 위기가 되지는 않는다." },
    indifferent: { word:"indifferent", pron:"[인디퍼런트]", meaning:"무관심한", ex:"That doesn't mean that they're cold or indifferent to other people's needs or wants.", exko:"그렇다고 해서 그들이 냉담하다거나 타인의 필요나 욕구에 무관심하다는 뜻은 아니다." }
  },
  funcWords: {
    place: { word:"place", tag:"[숙어 put ~ in place · ~을 설정하다, 마련하다]", meaning:"place는 '장소'이지만, 'put ~ in place'는 '~을 (제자리에) 마련하다, 설정하다'라는 숙어예요. the invisible lines that we put in place는 '우리가 설정해 두는 보이지 않는 선'이에요.", ex:"the invisible lines that we put in place, consciously or not", exko:"우리가 의식적으로든 아니든 설정해 두는 보이지 않는 선" },
    icon: { word:"icon", tag:"[명사 icon · 대표적 인물, 우상]", meaning:"icon은 컴퓨터의 '아이콘'이 먼저 떠오르지만, 여기서는 어떤 분야를 대표하는 '상징적 인물'이에요.", ex:"Murray Bowen, an icon for marriage and family therapists", exko:"결혼 및 가족 치료의 대표적 인물인 Murray Bowen" },
    degree: { word:"degree", tag:"[숙어 to the degree that · ~할 정도로]", meaning:"degree는 '(온도의) 도, 학위'라는 뜻도 있지만, 'to the degree that ~'은 '~할 정도로'라는 표현이에요.", ex:"they don't make themselves overly responsible for others to the degree that they ________.", exko:"그들은 (빈칸)할 정도로 타인을 지나치게 책임지려 들지 않는다." },
    distinguish: { word:"distinguish", tag:"[숙어 distinguish A from B · A를 B와 구별하다]", meaning:"'distinguish A from B'는 'A를 B와 구별하다'예요. 여기서는 '우리 자신을 다른 모든 사람과 구별하다'예요.", ex:"that allow us to distinguish ourselves from everyone else.", exko:"우리가 우리 자신을 다른 모든 사람과 구별할 수 있게 해 주는" }
  },
  passage: `Relationship [[boundary::boundaries]] are the [[invisible::invisible]] lines that we put in place, [[consciously::consciously]] or not, that allow us to distinguish ourselves (our thoughts, feelings, opinions, needs, expectations, and standards) from everyone else. Murray Bowen, an icon for marriage and family therapists, used the term ‹[[differentiation::differentiation]]› — how it's necessary, while exploring togetherness, that we are still able to see ourselves as separate/different from others. So just because they react, we don't have to react. When we have a bad day, we don't expect others to also have a bad day. When someone else is in [[crisis::crisis]], it doesn't become our crisis. Those who are able to relationally differentiate don't naturally expect others to think the way that they do, or feel what they feel. That doesn't mean that they're cold or [[indifferent::indifferent]] to other people's needs or wants, but they don't make themselves overly responsible for others to the degree that they ________.`,
  translation: `관계에서의 경계란 우리가 의식적으로든 아니든 설정해 두는, 우리가 우리 자신(우리의 생각, 감정, 의견, 욕구, 기대, 기준)을 다른 모든 사람과 구분할 수 있도록 해 주는 보이지 않는 선이다. 결혼 및 가족 치료의 대표적 인물인 Murray Bowen은, 함께함의 의미를 탐색하면서도 우리가 여전히 자신을 타인과 구별된 다른 존재로 이해할 수 있는 것이 얼마나 필요한지를 말하기 위해 ‘분화’라는 용어를 사용했다. 그러므로 다른 사람이 반응한다고 해서, 우리가 반응해야 하는 것은 아니다. 우리가 힘든 하루를 보낼 때, 다른 사람들도 또한 힘든 하루를 보낼 거라고 기대하지는 않는다. 다른 누군가가 위기에 처했을 때, 그것이 우리의 위기가 되지는 않는다. 관계적으로 분화할 수 있는 사람들은 타인이 자기가 생각하는 방식으로 생각하거나 자신이 느끼는 것을 느낄 거라고 당연히 기대하지 않는다. 그렇다고 해서 그들이 냉담하다거나 타인의 필요나 욕구에 무관심하다는 뜻은 아니지만, 그들은 자신의 균형감을 잃어버릴 정도로 타인을 지나치게 책임지려 들지 않는다.`,
  syntax: [

  passage: `Consider what we do when we go to the supermarket to buy food. Let's say we walk into the store with a list of a [[dozen::dozen]] items we need to buy. We rush through the [[aisle::aisles]], and 15 minutes later we walk out of the store with our dozen items. In this scenario, how many decisions had we made? Our first guess is to say 12 decisions. But what about all the items we decided not to buy? The [[average::average]] supermarket today has about 40,000 items on its shelves. So we actually made 40,000 decisions in the [[relatively::relatively]] short time we were in the supermarket — 12 decisions to buy a product and 39,988 decisions not to buy a product. That is 45 decisions for each and every second we were in the store; that is indeed some fast thinking! Of course, we did not consider each product, [[weigh::weigh]] its [[merit::merits]] relative to other products, and pick the best option. Instead, we relied on automatic programs running in our minds that guided us to certain products and brands while ignoring all others. These automatic programs ________.`,
  translation: `우리가 식품을 사기 위해 슈퍼마켓에 갈 때 무엇을 하는지를 생각해 보라. 우리가 사야 할 12개의 물품 목록을 가지고 상점에 들어간다고 가정해 보자. 우리는 통로를 빠르게 지나가고, 15분 후에 12개의 물품을 들고 상점을 나선다. 이 시나리오에서 우리는 몇 번의 결정을 내렸을까? 우리의 첫 번째 추측은 12번의 결정이라고 말하는 것이다. 하지만 우리가 사지 않기로 결정한 모든 물품은 어떠한가? 오늘날 평균적인 슈퍼마켓에는 약 40,000개의 물품이 선반에 진열되어 있다. 따라서 우리는 슈퍼마켓에 머무는 비교적 짧은 시간 동안 실제로 40,000번의 결정, 즉 제품을 사기 위한 12번의 결정과 사지 않기 위한 39,988번의 결정을 내렸다. 그것은 우리가 상점에 있는 동안 매초마다 45번의 결정을 내린 셈이며, 그것은 정말로 빠른 사고이다! 물론 우리는 각각의 제품을 고려하고, 다른 제품들과 비교해 장점을 따져 본 뒤, 최선의 선택을 한 것은 아니다. 대신, 우리는 우리 머릿속에서 작동하고 있는 특정 제품과 브랜드로 우리를 이끌면서 다른 모든 것들은 무시하게 하는 자동화된 프로그램에 의존했다. 이러한 자동화된 프로그램은 우리의 머릿속이 그렇게 빠르고 효율적으로 작동할 수 있게 해 주는 것이다.`,

  passage: `The nature of the web will [[favor::favor]] some [[commonality::commonalities]] over others. [[specifically::Specifically]], it favors commonalities that ________. For instance, if you meet a group of people in person, it might be possible to [[construct::construct]] a small coalition of members who are whimsical in a very [[particular::particular]] yet hard-to-describe way. You know such people when you see them, and you can all go off and take a short pedal boat ride together. But constructing the same coalition with a web search would be much more difficult. Maybe I know what [[notion::notion]] of “whimsical” I have in mind, but I can't write it down exactly in a way that anyone else would understand. What I have in mind is “the kind of whimsical like that girl Alison Murray I used to know.” I typed that into a search engine and really didn't get anything useful. But type in “blogs about model trains” or “Victorian collectibles” and you will be busy for the rest of the day.`,

  passage: `Interestingly, the owners and [[executive::executives]] of sport organizations initially felt wary about television because they feared that it might decrease [[attendance::attendance]] at sport events. This turned out to be a classical case of organizations [[underestimate::underestimating]] the potential of new technology. ①Their fears of television [[vanish::vanished]] once they realized that televised sport would open a veritable gold mine of potential wealth. ②Not only did it greatly increase the sport fan base; it also opened [[unanticipated::unanticipated]] streams of revenue from advertising. ③Tens of millions of people who seldom went to sport events became sport fans. ④This shift dramatically made it harder for people to relate to sport unless they attended sport events [[in_person::in person]]. ⑤In fact, televised sport became the primary mechanism behind the development and expansion of sport social capital in modern urban societies.`,
  translation: `흥미롭게도, 스포츠 조직의 소유주들과 경영진은 처음에는 텔레비전에 대해 경계심을 느꼈는데, 그들은 그것이 스포츠 경기 참석자 수를 줄일까 봐 두려워했기 때문이다. 이것은 새로운 기술의 잠재력을 조직이 과소평가한 전형적인 사례로 드러났다. ① 텔레비전에 대한 그들의 두려움은 그들이 텔레비전으로 중계되는 스포츠가 잠재적인 부의 진정한 보고(寶庫)를 열어 줄 것임을 깨닫자마자 사라졌다. ② 그것은 스포츠 팬층을 크게 확장시켰을 뿐만 아니라 광고를 통한 예상치 못한 끊임없는 수익도 열어 주었다. ③ 스포츠 경기에 거의 가지 않았던 수천만 명의 사람들이 스포츠 팬이 되었다. ④ (이러한 변화는 극적일 정도로 사람들이 스포츠 행사에 직접 참석하지 않으면 스포츠를 이해하기 더 어렵게 만들었다.) ⑤ 사실 텔레비전으로 중계되는 스포츠는 현대 도시 사회에서 스포츠 사회 자본의 발전과 확산 뒤에 있는 주요 메커니즘이 되었다.`,

  passage: `In many cultures throughout much of history, those who produced, decorated, painted, and built were not considered to be artists as we think of them now.

(A) At the end of that period, an apprentice became a [[journeyman::journeyman]] and was allowed to become a member of the craft guild that [[supervise::supervised]] training and standards for those working in that trade. To achieve full [[status::status]] in the guild, a journeyman had to complete their “[[masterpiece::masterpiece]],” demonstrating sufficient skill and craftsmanship to be named a master.

(B) In Medieval Europe, or the Middle Ages (fifth–fifteenth centuries), for example, an artisan generally began around the age of twelve as an apprentice, that is, a student who learned all aspects of a [[profession::profession]] from a master who had their own workshop. Apprenticeships lasted five to nine years or more, and included learning trades ranging from painting to baking, and masonry to candle making.

(C) They were artisans and craftspeople, and their role was to make the objects and build the structures for which they were hired, according to the design (their own or another's) agreed upon with those for whom they were working. That is not to say they were [[untrained::untrained]].`,
  translation: `역사의 많은 부분 동안 내내 많은 문화에서, 생산하고 장식하고 색칠하고 건축했던 사람들은 우리가 지금 그들에 대해 생각하는 것처럼 예술가로 여겨지지 않았다.

(C) 그들은 장인과 공예가였고, 그들의 역할은 그들이 일하고 있는 사람들과 (자신의 혹은 또 다른 사람의) 합의된 설계에 따라 그들이 고용된 (목적의) 물건을 만들고 구조물을 건축하는 것이었다. 그것이 그들이 훈련받지 않았다는 것을 말하는 것은 아니다.

(B) 예를 들어, 중세 유럽이나 중세 시대(5세기~15세기)에 장인은 열두 살 무렵에 보통 견습생, 즉, 자신의 작업장을 가진 장인으로부터 직업의 모든 측면을 배웠던 학생으로서 시작했다. 수습 기간은 5년에서 9년 혹은 그 이상 지속되었고 범위가 회화에서 굽기 그리고 석공에서 양초 제작에 이르는 학습 직종을 포함했다.

(A) 그 기간이 끝날 때, 견습생은 숙련 기술자가 되고 그 직종에서 일하는 사람들을 위한 훈련과 기준을 감독하는 기능 조합의 구성원이 되는 것이 허용되었다. 그 조합에서 정식 지위를 얻기 위해 숙련 기술자는 자신의 ‘걸작’을 완성하여, 장인으로 명명되기 위해 충분한 기술과 솜씨를 보여 주어야 했다.`,

  passage: `When we focus on the [[sensation::sensations]] produced by food and drink, or on hearing a symphony, we misunderstand what is going on if we think of this in terms of [[bodily::bodily]] functions only. Our taste, our hearing, our vision — these are all [[aspect::aspects]] of the mind.

(A) Of course, in addition to inter-species differences in such processing, there are smaller intra-species differences. The [[variation::variation]] in types of processing, [[cognition::cognition]], and understanding between people is increasingly well-known today.

(B) And not only do we know that the information from the senses does not come purely from the world as if given, it is processed by our brains in certain ways. Thus, we experience the world differently than does a bird or a cat. Our bodies are different, the senses are different, and the way those senses are processed in our brains is different.

(C) These are all produced by the mind, and we can prove this in myriad ways. Brain damage or ingestion of mind-altering drugs will change the sensations of these things, as will illness or other [[intervention::interventions]] affecting the brain. Our experience is created wholly by the mind, from the information of the senses, yes, but still by the mind.`,
  translation: `음식과 음료가 만들어 내는 감각이나 교향곡을 듣는 것에 집중할 때, 이를 신체 기능의 관점에서만 생각하면 우리는 무슨 일이 일어나고 있는지 잘못 이해하게 된다. 우리의 미각, 청각, 시각, 이 모든 것은 정신의 측면이다.

(C) 이 모든 것은 정신에 의해 만들어지며, 우리는 무수한 방법으로 이를 증명할 수 있다. 뇌 손상이나 정신을 변화시키는 약물의 복용은 뇌에 영향을 미치는 질병이나 다른 치료 행위와 마찬가지로 이러한 것들에 대한 감각을 변화시킨다. 우리의 경험은 전적으로 정신에 의해 만들어지며, 감각의 정보에서 비롯되는 것은 사실이지만, 여전히 정신에 의해서이다.

(B) 그리고 우리는 감각으로부터의 정보가 주어진 것처럼 순전히 세상으로부터 오는 것이 아니라는 것뿐 아니라 우리의 뇌에서 특정한 방식으로 처리된다는 것도 알고 있다. 따라서 우리는 새나 고양이와 다르게 세상을 경험한다. 우리의 몸도 다르고, 감각도 다르고, 그 감각이 뇌에서 처리되는 방식도 다르다.

(A) 물론 이러한 처리 방식에는 종 간 차이 외에도 더 작은 종 내 차이가 있다. 사람 간의 처리, 인지, 이해 유형의 차이는 오늘날 점점 더 잘 알려져 있다.`,

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g2paper2' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      ph.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.label + '</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

let quizState = [];

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

function renderQuiz(p) {
  quizState = p.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = p.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var q = problems[current].questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var r = document.getElementById('qresult-' + qi);
  var ok = quizState[qi].selected === q.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.') + '</b><br>' + q.explanation;
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '다시 풀기';
  b.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var p = problems[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(p.questions[qi], qi);
  var r = document.getElementById('qresult-' + qi);
  r.classList.remove('show','ok','no'); r.innerHTML = '';
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '정답 확인';
  b.onclick = function() { checkAnswer(qi); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.label + ' · ' + p.type;
  var gc = document.getElementById('given-card');
  if (p.image) { gc.classList.add('show'); gc.innerHTML = '<img src="' + p.image + '" alt="문제 자료">'; }
  else { gc.classList.remove('show'); gc.innerHTML = ''; }
  var ic = document.getElementById('insert-card');
  if (p.insertSentence) {
    ic.classList.add('show');
    document.getElementById('insert-text').textContent = p.insertSentence;
    document.getElementById('insert-text-ko').textContent = p.insertSentenceKo || '';
  } else { ic.classList.remove('show'); }
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  renderSyntax(p);
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i, skipHistory) {
  current = i; render(); window.scrollTo({top:0, behavior:'smooth'});
  if (!skipHistory) { var h = '#p' + current; if (location.hash !== h) history.pushState({pIdx:current}, '', h); }
}
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  selectProblem(current);
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');

  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

var SYN_LABEL = { S:'주어', V:'동사', O:'목적어', C:'보어', M:'수식어', J:'연결어' };
function synLabel(r) {
  return r.split('+').map(function(x) { return SYN_LABEL[x.toUpperCase()] || x; }).join('+');
}
function renderSyntax(p) {
  var el = document.getElementById('syntax-list');
  if (!p.syntax || !p.syntax.length) { el.innerHTML = '<div class="syn-legend-note">이 지문의 구문분석은 준비 중이에요.</div>'; return; }
  var legend = '<div class="syn-legend">' +
    ['S','V','O','C','M','J'].map(function(r) { return '<span class="r-' + r + '">' + SYN_LABEL[r] + ' ' + r + '</span>'; }).join('') + '</div>' +
    '<div class="syn-legend-note">점선 밑줄과 * 표시는 종속절·준동사구 안의 성분이에요. 수식어(M)는 문장 성분이 아닌 꾸미는 말, 연결어(J)는 접속사·연결 표현이에요.</div>';
  el.innerHTML = legend + p.syntax.map(function(s, i) {
    var line = s.c.map(function(c) {
      var first = c[0].split('+')[0];
      var sub = first === first.toLowerCase();
      return '<span class="syn-ch r-' + first.toUpperCase() + (sub ? ' sub' : '') + '"><span class="t">' + c[1] + '</span><span class="l">' + synLabel(c[0]) + '</span></span>';
    }).join('');
    var slash = s.c.map(function(c) { return c[1].replace(/\s+$/, ''); }).join(' <b>/</b> ');
    var ko = s.c.map(function(c) { return c[2]; }).join(' <b>/</b> ');
    return '<div class="syn-card"><div class="syn-num">문장 ' + (i + 1) + '</div><div class="syn-line">' + line + '</div>' +
      '<div class="syn-slash">' + slash + '</div><div class="syn-ko">' + ko + '</div>' +
      '<div class="syn-note">💡 ' + s.n + '</div></div>';
  }).join('');
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-syntax').classList.toggle('active', name === 'syntax');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
