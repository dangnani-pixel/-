<script>
const problems = [
{
  num: 18, type: "글의 목적 파악",
  question: "다음 글의 목적으로 가장 적절한 것은?",
  choices: ["신간 도서 구입을 건의하려고", "도서관 프로그램 확대를 부탁하려고", "도서관 운영 시간 연장을 요청하려고", "도서 대출 시스템 개선에 감사하려고", "도서관 열람실 공간 확대를 제안하려고"],
  answer: 2,
  explanation: "편지 후반부의 'I'd like to ask you to extend the library's operating hours to 7 p.m.'에서 필자의 목적이 도서관 운영 시간 연장 요청임이 명확히 드러나므로 정답은 ③번입니다.",
  vocab: {
    reach_out: { word:"reach out", pron:"[리치 아웃]", meaning:"연락하다, 손을 내밀다", ex:"I am reaching out to ask for help.", exko:"도움을 요청하기 위해 연락드립니다." },
    regarding: { word:"regarding", pron:"[리가딩]", meaning:"~에 관하여", ex:"I have a question regarding the schedule.", exko:"일정에 관해 질문이 있습니다." },
    operating_hours: { word:"operating hours", pron:"[오퍼레이팅 아워즈]", meaning:"운영 시간", ex:"What are the library's operating hours?", exko:"도서관 운영 시간이 어떻게 되나요?" },
    limits: { word:"limits", pron:"[리미츠]", meaning:"제한하다", ex:"The rule limits how long we can stay.", exko:"그 규칙은 우리가 머무를 수 있는 시간을 제한한다." },
    resources: { word:"resources", pron:"[리소시즈]", meaning:"자원, 자료", ex:"Students should use all available resources.", exko:"학생들은 이용 가능한 모든 자료를 활용해야 한다." },
    particularly: { word:"particularly", pron:"[퍼티큘러리]", meaning:"특히", ex:"This is particularly true in winter.", exko:"이는 겨울에 특히 그렇다." },
    challenging: { word:"challenging", pron:"[챌린징]", meaning:"힘든, 도전적인", ex:"The exam was very challenging.", exko:"그 시험은 매우 어려웠다." },
    entrance_exams: { word:"entrance exams", pron:"[엔트런스 이그잼즈]", meaning:"입학시험", ex:"She is preparing for college entrance exams.", exko:"그녀는 대학 입학시험을 준비하고 있다." },
    demand: { word:"demand", pron:"[디맨드]", meaning:"요구하다, 필요로 하다", ex:"This project demands a lot of time.", exko:"이 프로젝트는 많은 시간을 필요로 한다." },
    extend: { word:"extend", pron:"[익스텐드]", meaning:"연장하다, 늘리다", ex:"Can you extend the deadline?", exko:"마감을 연장해 주실 수 있나요?" },
    additional: { word:"additional", pron:"[어디셔널]", meaning:"추가의", ex:"We need additional time to finish.", exko:"끝내려면 추가 시간이 필요하다." },
    consider: { word:"consider", pron:"[컨시더]", meaning:"고려하다", ex:"Please consider my proposal.", exko:"제 제안을 고려해 주세요." },
    proposal: { word:"proposal", pron:"[프러포절]", meaning:"제안", ex:"The board accepted the proposal.", exko:"이사회는 그 제안을 받아들였다." },
    supporting: { word:"supporting", pron:"[서포팅]", meaning:"지원하는, 뒷받침하는", ex:"This data is supporting evidence.", exko:"이 자료는 뒷받침하는 증거이다." }
  },
  funcWords: {
    which: { word:"which", tag:"[관계대명사 · 계속적 용법]", meaning:"콤마(,) 뒤에 오는 which는 앞 문장 전체 내용을 받아 '그런데 그것이 ~하다'라고 덧붙여 설명하는 계속적 용법의 관계대명사예요. 여기서는 '도서관이 5시에 문을 닫는다는 사실'을 받아서, 그것이 학생들의 자료 이용 능력을 제한한다고 이어주고 있어요.", ex:"At present, the library closes at 5 p.m., which many students feel limits their ability to fully use its resources for study and research after regular class hours.", exko:"현재 도서관은 오후 5시에 문을 닫는데, 많은 학생들은 이것이 정규 수업 시간 이후에 학습과 연구를 위해 도서관 자료를 충분히 활용하는 능력을 제한한다고 느끼고 있습니다." },
    that: { word:"that", tag:"[관계대명사 · 주격]", meaning:"여기서 that은 academic projects를 선행사로 받는 주격 관계대명사예요. 'that demand a quiet and resourceful environment'가 뒤에서 academic projects를 꾸며주면서 '조용하고 자료가 풍부한 환경을 필요로 하는 (학업 프로젝트)'라고 해석돼요.", ex:"This is particularly challenging for those preparing for college entrance exams or working on academic projects that demand a quiet and resourceful environment.", exko:"이는 대학 입학시험을 준비하거나 조용하고 자료가 풍부한 환경을 필요로 하는 학업 프로젝트를 수행하는 학생들에게 특히 힘든 문제입니다." },
    to: { word:"to", tag:"[to부정사]", meaning:"동사원형 앞의 to는 to부정사예요. 'reaching out to discuss'에서는 '논의하기 위해(목적)'로 해석되고, 'ability to fully use'에서는 앞의 명사 ability를 꾸며주는 형용사적 용법으로 쓰여 '충분히 활용할 능력'이라는 뜻이 돼요. 문맥에 따라 '~하기 위해' 또는 '~할'로 자연스럽게 해석하면 돼요.", ex:"As student council president, I am reaching out to discuss an important matter regarding our school library's current operating hours.", exko:"학생회장으로서, 저는 우리 학교 도서관의 현재 운영 시간에 관한 중요한 사안을 논의하기 위해 연락드립니다." },
    as: { word:"as", tag:"[전치사 as]", meaning:"as는 문장 맨 앞 'As student council president'에서는 '~로서(자격·신분)'라는 뜻이고, 뒤쪽의 'consider this proposal as a step'에서는 'consider A as B(A를 B로 여기다)' 구문에 쓰여 '~로(서)'라고 해석돼요. 같은 단어지만 위치에 따라 뜻이 달라지니 문맥으로 구분하세요.", ex:"As student council president, I am reaching out to discuss an important matter regarding our school library's current operating hours.", exko:"학생회장으로서, 저는 우리 학교 도서관의 현재 운영 시간에 관한 중요한 사안을 논의하기 위해 연락드립니다." },
    those: { word:"those", tag:"[대명사 those]", meaning:"'those preparing for college entrance exams'에서 those는 '사람들'을 뜻하는 대명사이고, 바로 뒤에 온 현재분사 preparing이 those를 꾸며서 '대학 입학시험을 준비하는 사람들'이라는 뜻이 돼요. (= those who are preparing ~)", ex:"This is particularly challenging for those preparing for college entrance exams or working on academic projects that demand a quiet and resourceful environment.", exko:"이는 대학 입학시험을 준비하거나 조용하고 자료가 풍부한 환경을 필요로 하는 학업 프로젝트를 수행하는 학생들에게 특히 힘든 문제입니다." },
    by: { word:"by", tag:"[전치사 by · 수단]", meaning:"'by providing additional time'에서 by는 '~함으로써(수단)'를 나타내는 전치사예요. by 뒤에 동명사(providing)가 와서 '추가 시간을 제공함으로써'라고 해석돼요.", ex:"This change would greatly benefit students by providing additional time to focus on their academic goals.", exko:"이러한 변화는 학생들이 학업 목표에 집중할 수 있는 추가 시간을 제공함으로써 큰 도움이 될 것입니다." },
    fully: { word:"fully", tag:"[부사 · 문맥 확인 필요]", meaning:"fully는 여기서 동사 use를 꾸며주는 부사예요. 사전에는 '완전히'로 많이 나오지만, 이 문장에서는 '충분히'로 해석하는 것이 지문 전체 흐름과 맞아요. to fully use its resources는 '자료를 충분히 활용하다'라는 뜻으로, ability(능력)와 이어져 '충분히 활용할 수 있는 능력'이 됩니다. 이렇게 단어 하나만 사전에서 찾으면 문장 전체 해석과 어긋날 수 있으니 항상 문장 속 쓰임을 함께 확인하세요.", ex:"At present, the library closes at 5 p.m., which many students feel limits their ability to fully use its resources for study and research after regular class hours.", exko:"현재 도서관은 오후 5시에 문을 닫는데, 많은 학생들은 이것이 정규 수업 시간 이후에 학습과 연구를 위해 도서관 자료를 충분히 활용하는 능력을 제한한다고 느끼고 있습니다." },
    needs: { word:"needs", tag:"[명사 · 품사 확인]", meaning:"needs는 여기서 '필요하다'라는 동사 need의 3인칭 단수형이 아니라, '요구, 필요(한 것)'라는 뜻의 명사(복수형)예요. 바로 앞에 소유격 our가 있고 동명사 supporting의 목적어로 쓰였기 때문에 명사로 봐야 해요. better supporting our needs는 '우리의 필요를 더 잘 지원하다'라는 뜻입니다. 사전 API는 needs를 동사로 먼저 보여줄 수 있으니 이 문장에서는 명사라는 점에 주의하세요.", ex:"I hope you will consider this proposal as a step toward improving our academic environment and better supporting our needs.", exko:"이 제안을 우리의 학업 환경을 개선하고 우리의 필요를 더 잘 지원하기 위한 하나의 방안으로 고려해 주시기를 바랍니다." }
  },
  passage: `Dear Principal Jones,

I hope this message finds you well. As student council president, I am [[reach_out::reaching out]] to discuss an important matter [[regarding::regarding]] our school library's current [[operating_hours::operating hours]]. At present, the library closes at 5 p.m., which many students feel [[limits::limits]] their ability to fully use its [[resources::resources]] for study and research after regular class hours. This is [[particularly::particularly]] [[challenging::challenging]] for those preparing for college [[entrance_exams::entrance exams]] or working on academic projects that [[demand::demand]] a quiet and resourceful environment. Therefore, I'd like to ask you to [[extend::extend]] the library's operating hours to 7 p.m. This change would greatly benefit students by providing [[additional::additional]] time to focus on their academic goals. I hope you will [[consider::consider]] this [[proposal::proposal]] as a step toward improving our academic environment and better [[supporting::supporting]] our needs.

Sincerely,
Eric Park
Student Council President`,
  translation: `Jones 교장선생님께,

이 메시지가 잘 전달되기를 바랍니다. 학생회장으로서, 저는 우리 학교 도서관의 현재 운영 시간에 관한 중요한 사안을 논의하기 위해 연락드립니다. 현재 도서관은 오후 5시에 문을 닫는데, 많은 학생들은 이것이 정규 수업 시간 이후에 학습과 연구를 위해 도서관 자료를 충분히 활용하는 능력을 제한한다고 느끼고 있습니다. 이는 대학 입학시험을 준비하거나 조용하고 자료가 풍부한 환경을 필요로 하는 학업 프로젝트를 수행하는 학생들에게 특히 힘든 문제입니다. 따라서 저는 도서관 운영 시간을 오후 7시까지 연장해 주실 것을 요청드리고 싶습니다. 이러한 변화는 학생들이 학업 목표에 집중할 수 있는 추가 시간을 제공함으로써 큰 도움이 될 것입니다. 이 제안을 우리의 학업 환경을 개선하고 우리의 필요를 더 잘 지원하기 위한 하나의 방안으로 고려해 주시기를 바랍니다.

Eric Park 드림
학생회장`,
  grammar: [
    { title:"I'd like to ask you to + 동사원형", desc:"'~해 주시기를 부탁드립니다'라는 뜻의 매우 정중한 요청 표현이에요. 격식체 이메일·편지에서 자주 등장합니다.", ex:"I'd like to ask you to review this document. (이 문서를 검토해 주시기를 부탁드립니다.)" },

  tips: [

  ]

    that: { word:"that", tag:"[접속사 that · 동격]", meaning:"여기서 that은 앞의 'knowing I was in'과 연결되어, '합격했다'는 것이 구체적으로 어떤 의미인지 다시 풀어서 설명해 주는 접속사예요. '즉, 무슨 일이 있어도 ~할 수 있다는 것'으로 이어서 해석하면 자연스러워요.", ex:"I got a little rush of excitement, knowing I was in -- that whatever happened I could be involved in one of the productions.", exko:"나는 합격했다는 것을 알고 약간의 흥분이 밀려왔다 — 무슨 일이 있어도 나는 그 공연들 중 하나에 참여할 수 있게 된 것이었다." },
    as: { word:"as", tag:"[접속사 as · 시간]", meaning:"As가 문장 맨 앞에 오면서 '~했을 때(시간)'라는 뜻으로 쓰였어요. '~로서(자격)'나 '~때문에(이유)'로 헷갈리기 쉽지만, 여기서는 계단 끝에 다다른 것과 아빠가 전화를 끊으려던 것이 거의 동시에 일어났다는 시간적 의미예요.", ex:"As I got to the bottom of the stairs, he was just putting the phone down.", exko:"내가 계단 아래에 다다랐을 때, 아빠는 막 전화를 끊으려던 참이었다." },

  passage: `I [[glanced::glanced]] at the clock on the wall. 10:00. That meant the [[casting_director::casting director]] would call very soon with the results of my first [[audition::audition]] for a musical part in The Wizard of Oz. I felt [[shaky::shaky]] all over, [[chewing::chewing]] my thumbnail and [[jiggling::jiggling]] my feet. Finally, the telephone rang. While I was [[come_round::coming round]], Dad answered. I heard him say, "Ahh, thank you. I'll let her know ..." As I got to the bottom of the stairs, he was just putting the phone down. "That was The Wizard of Oz. You're second senior munchkin," he [[announced::announced]]. I got a little [[rush_of_excitement::rush of excitement]], knowing I was in -- that whatever happened I could be [[involved::involved]] in one of the [[production::productions]].`,
  translation: `나는 벽에 걸린 시계를 힐끗 보았다. 10시. 그것은 곧 캐스팅 감독이 '오즈의 마법사' 뮤지컬 배역을 위한 나의 첫 오디션 결과를 가지고 전화할 것이라는 의미였다. 나는 온몸이 떨렸고, 엄지손톱을 물어뜯으며 발을 흔들었다. 마침내 전화벨이 울렸다. 내가 정신을 가다듬는 동안, 아빠가 전화를 받으셨다. 나는 아빠가 "아, 감사합니다. 딸에게 전해줄게요..."라고 말하는 것을 들었다. 내가 계단 아래에 다다랐을 때, 아빠는 막 전화를 끊으려던 참이었다. "오즈의 마법사 쪽이었어. 너는 2학년 먼치킨 역이야."라고 아빠가 알려주었다. 나는 합격했다는 것을 알고 약간의 흥분이 밀려왔다 — 무슨 일이 있어도 나는 그 공연들 중 하나에 참여할 수 있게 된 것이었다.`,

  passage: `[[inefficient::Inefficient]] teachers [[overlook::overlook]] the [[potential::potential]] power of the opening minutes of class. Often, if students are quiet enough and if there are many [[pressing::pressing]] demands on a teacher's time at that moment, more than ten minutes can [[disappear::disappear]] before class starts. It's no wonder that students are late for class; they have little reason to be on time. You can use the first ten minutes to get your class [[off_to_a_start::off to a great start]], or you can choose to waste this time. The first minutes set the [[tone::tone]] for the rest of the class. If you are prepared for class and have taught your students an opening routine, they can use this brief time to make mental and emotional [[transitions::transitions]] from the last class or subject and prepare to focus on learning new material. In summary, you should [[establish::establish]] an opening [[routine::routine]] to develop your class with an [[effective::effective]] start.`,

    present: { word:"present", tag:"[형용사 · 품사 확인]", meaning:"present는 명사로 '선물'이나 동사로 '제시하다'라는 뜻이 먼저 떠오르지만, 여기서는 명사 caretaker를 꾸미는 형용사로 쓰여 '현재의'라는 뜻이에요. 'the present caretaker'는 '현재의 관리자'로 해석되며, 공식 해석에서도 '당신은 현재 당신 몸속 원자들의 관리자일 뿐이다'로 옮겨졌어요.", ex:"You're the present caretaker of the atoms in your body.", exko:"당신은 현재 당신 몸속 원자들의 관리자일 뿐이다." },
    cycle: { word:"cycle", tag:"[동사 · 품사 확인]", meaning:"cycle은 명사로 '자전거'나 '주기'라는 뜻이 먼저 떠오르지만, 여기서는 '순환하다'라는 뜻의 동사로 쓰였어요. 'Atoms cycle from person to person'은 '원자들은 사람에서 사람으로 순환한다'는 뜻입니다.", ex:"Atoms cycle from person to person as we breathe and as our sweat is evaporated.", exko:"원자들은 우리가 숨을 쉬고 땀이 증발함에 따라 사람에서 사람으로 순환한다." },
    share: { word:"share", tag:"[동사 · 품사 확인]", meaning:"share는 명사로 '몫, 주식'이라는 뜻이 먼저 떠오르지만, 여기서는 '공유하다'라는 뜻의 동사로 쓰였어요. 'We all share from the same atom pool'은 '우리는 모두 같은 원자 풀을 공유한다'는 뜻입니다.", ex:"We all share from the same atom pool because atoms forever travel around, within, and among us.", exko:"원자들은 영원히 우리 주위를, 우리 안을, 우리 사이를 이동하기 때문에 우리는 모두 같은 원자 풀을 공유한다." }
  },
  passage: `Many [[atoms::atoms]] in your body are nearly as old as the universe itself. When you breathe, for example, only some of the atoms that you [[inhale::inhale]] are [[exhale::exhaled]] in your next breath. The [[remaining::remaining]] atoms are taken into your body to become part of you, and they later leave your body by [[various_means::various means]]. You don't "[[own::own]]" the atoms that make up your body; you borrow them. We all share from the same atom [[pool::pool]] because atoms forever travel around, within, and among us. Atoms cycle from person to person as we breathe and as our sweat is [[evaporated::evaporated]]. We [[recycle::recycle]] atoms on a [[grand_scale::grand scale]]. The [[origin::origin]] of the lightest atoms goes back to the origin of the universe, and most heavier atoms are older than the Sun and Earth. There are atoms in your body that have existed since the first moments of time, recycling throughout the universe among [[limitless::limitless]] forms, both nonliving and living. You're the present [[caretaker::caretaker]] of the atoms in your body. There will be many who will follow you.`,
  translation: `당신 몸속의 많은 원자들은 우주 자체만큼이나 거의 오래되었다. 예를 들어, 당신이 숨을 쉴 때 당신이 들이마신 원자들 중 일부만이 다음 숨에서 내쉬어진다. 나머지 원자들은 당신의 몸속으로 들어가 당신의 일부가 되었다가 이후 다양한 방식으로 몸을 떠난다. 당신은 자신의 몸을 이루는 원자들을 '소유'하는 것이 아니라 빌리는 것이다. 원자들은 영원히 우리 주위를, 우리 안을, 우리 사이를 이동하기 때문에 우리는 모두 같은 원자 풀을 공유한다. 원자들은 우리가 숨을 쉬고 땀이 증발함에 따라 사람에서 사람으로 순환한다. 우리는 엄청난 규모로 원자를 재활용하고 있는 것이다. 가장 가벼운 원자의 기원은 우주의 기원으로 거슬러 올라가며, 더 무거운 대부분의 원자들은 태양과 지구보다도 오래되었다. 당신의 몸속에는 시간이 시작된 최초의 순간부터 존재해 온, 무생물과 생물 가리지 않고 우주 전체를 순환해 온 원자들이 있다. 당신은 현재 당신 몸속 원자들의 관리자일 뿐이다. 당신의 뒤를 이을 사람들이 많을 것이다.`,
  grammar: [
    { title:"부분부정 (only some ~)", desc:"'모두가 아니라 일부만'이라는 뜻으로, only some / not all은 전체가 아닌 일부를 나타내는 부분부정 표현이에요.", ex:"Only some of them agreed. (그들 중 일부만 동의했다.)" },
    { title:"현재분사구 (recycling ~, both A and B)", desc:"콤마 뒤의 -ing는 부대상황(동시에 일어나는 상황)을 설명하는 분사구문이에요.", ex:"Atoms exist, recycling throughout the universe. (원자들은 존재하며, 우주를 순환한다.)" },
    { title:"as + 주어 + 동사 (~함에 따라)", desc:"'~할 때, ~함에 따라'라는 뜻의 접속사로, 동시에 일어나는 두 상황을 연결해요.", ex:"Atoms cycle as we breathe. (우리가 숨 쉼에 따라 원자가 순환한다.)" }
  ],
  tips: [
    "밑줄 함축 의미 문제는 밑줄 문장을 문자 그대로 해석하지 말고, 글 전체의 비유(원자=빌린 것, caretaker=관리인)를 파악한 뒤 그 의미로 재구성해야 해요.",

  funcWords: {
    those: { word:"those", tag:"[대명사 those · 관계대명사 who]", meaning:"'those who ~'는 '~하는 사람들'이라는 뜻의 관용적 표현이에요. those는 '그것들'이 아니라 '사람들'을 가리키는 대명사이고, 뒤의 관계대명사 who가 이를 꾸며줘요. 여기서는 '전통적인 운동을 힘들어하는 사람들'로 해석돼요.", ex:"Gardening is particularly beneficial for those who find traditional exercise challenging.", exko:"정원 가꾸기는 전통적인 운동을 힘들어하는 사람들에게 특히 유익하다." },
    like: { word:"like", tag:"[전치사 like · ~와 같은]", meaning:"like는 '좋아하다(동사)'가 아니라 '~와 같은(전치사)'이라는 뜻으로 쓰였어요. 'tasks like weeding'은 '잡초 뽑기와 같은 작업들'로 해석하며, 뒤에 나오는 예시들을 이끄는 역할을 해요.", ex:"You might not realize it, but small tasks like weeding or turning compost can burn many calories.", exko:"깨닫지 못할 수도 있지만, 잡초 뽑기나 퇴비 뒤집기 같은 작은 일들도 많은 칼로리를 소모할 수 있다." },
    involved: { word:"involved", tag:"[과거분사 · 축약 관계절]", meaning:"'tasks involved in gardening'은 'tasks (that are) involved in gardening'이 줄어든 형태로, involved가 뒤에서 tasks를 꾸며주는 과거분사예요. '정원 가꾸기에 포함된/수반된 (작업들)'이라고 해석하며, involve를 '참여시키다'로만 알고 있으면 헷갈릴 수 있어요.", ex:"The repetitive tasks involved in gardening can induce a state of mindfulness, similar to meditation.", exko:"정원 가꾸기에 포함된 반복적인 작업들은 명상과 비슷한 마음챙김 상태를 유도할 수 있다." },
    even: { word:"even", tag:"[부사 even · 문맥 확인 필요]", meaning:"even은 흔히 '심지어'로 알고 있지만, 공식 해석에서는 'even in a small garden'을 '작은 정원에서라도', 즉 '~에서일지라도, ~에서조차'라는 양보의 의미로 옮겼어요. '심지어'라고 직역하면 문장이 어색해지니 '~에서라도'로 자연스럽게 해석하세요.", ex:"Studies have shown that spending time in nature, even in a small garden, can elevate mood, improve cognition, and reduce depression symptoms.", exko:"연구에 따르면, 작은 정원에서라도 자연 속에서 시간을 보내는 것은 기분을 좋게 하고, 인지 능력을 향상시키며, 우울 증상을 줄일 수 있다고 한다." },
    from: { word:"from", tag:"[전치사 from · 원인/출처]", meaning:"'sense of accomplishment from watching ~'에서 from은 '~로부터'라는 위치 이동의 의미가 아니라 '~함으로써 생기는, ~에서 오는(원인·출처)'이라는 뜻이에요. 공식 해석은 이를 '지켜보며 느끼는'으로 자연스럽게 풀어서 옮겼어요.", ex:"The sense of accomplishment from watching your plants grow and thrive can also boost self-esteem and overall well-being.", exko:"식물이 자라고 번성하는 것을 지켜보며 느끼는 성취감 또한 자존감과 전반적인 행복감을 높여줄 수 있다." },
    present: { word:"present", tag:"[형용사 · 품사 확인]", meaning:"present는 명사 '선물'이나 동사 '제시하다'로 먼저 떠올리기 쉽지만, 여기서는 명사 moment를 꾸미는 형용사로 쓰여 '현재의'라는 뜻이에요. 'the present moment'는 '현재 순간'으로 해석돼요.", ex:"It allows you to focus on the present moment, reducing stress and anxiety.", exko:"그것은 현재 순간에 집중하게 하여 스트레스와 불안을 줄여준다." },
    fit: { word:"fit", tag:"[형용사 · 품사 확인]", meaning:"fit은 동사로 '맞다, 적합하다'라는 뜻이 먼저 떠오르지만, 여기서는 '건강한, 몸이 탄탄한'이라는 뜻의 형용사로 쓰였어요. 'stay active and fit'은 '활동적이고 건강하게 지내다'로 해석되며, 공식 해석에서도 '활동적이고 건강하게 지낼 수 있게'로 옮겨졌어요.", ex:"It's a low-impact way to stay active and fit, making it accessible for people of all ages and physical abilities.", exko:"그것은 몸에 무리가 적게 가는 방식으로 활동적이고 건강하게 지낼 수 있게 해주어, 모든 연령대와 신체 능력을 가진 사람들이 쉽게 할 수 있다." }

  passage: `The act of [[gardening::gardening]] itself is a fantastic form of physical activity. It involves [[a_range_of::a range of]] motions, from digging and planting to watering and [[harvesting::harvesting]]. These activities help improve strength, flexibility, and [[endurance::endurance]]. You might not realize it, but small tasks like [[weeding::weeding]] or turning compost can burn many calories. Gardening is particularly beneficial for those who find traditional exercise challenging. It's a [[low_impact::low-impact]] way to stay active and fit, making it [[accessible::accessible]] for people of all ages and physical abilities. Besides physical health, gardening has [[profound::profound]] mental health benefits. [[tending::Tending]] to plants can be incredibly calming and [[meditative::meditative]]. It allows you to focus on the present moment, reducing stress and anxiety. The repetitive tasks involved in gardening can [[induce::induce]] a state of [[mindfulness::mindfulness]], similar to meditation. Studies have shown that spending time in nature, even in a small garden, can elevate mood, improve cognition, and reduce depression symptoms. The sense of accomplishment from watching your plants grow and thrive can also boost [[self_esteem::self-esteem]] and overall well-being.`,
  translation: `정원 가꾸기 그 자체는 훌륭한 형태의 신체 활동이다. 그것은 땅파기와 심기부터 물주기와 수확까지 다양한 동작을 포함한다. 이러한 활동들은 근력, 유연성, 지구력을 향상시키는 데 도움이 된다. 깨닫지 못할 수도 있지만, 잡초 뽑기나 퇴비 뒤집기 같은 작은 일들도 많은 칼로리를 소모할 수 있다. 정원 가꾸기는 전통적인 운동을 힘들어하는 사람들에게 특히 유익하다. 그것은 몸에 무리가 적게 가는 방식으로 활동적이고 건강하게 지낼 수 있게 해주어, 모든 연령대와 신체 능력을 가진 사람들이 쉽게 할 수 있다. 신체 건강 외에도, 정원 가꾸기는 깊은 정신적 건강상의 이점을 지닌다. 식물을 돌보는 것은 매우 차분하고 명상적인 일이 될 수 있다. 그것은 현재 순간에 집중하게 하여 스트레스와 불안을 줄여준다. 정원 가꾸기에 포함된 반복적인 작업들은 명상과 비슷한 마음챙김 상태를 유도할 수 있다. 연구에 따르면, 작은 정원에서라도 자연 속에서 시간을 보내는 것은 기분을 좋게 하고, 인지 능력을 향상시키며, 우울 증상을 줄일 수 있다고 한다. 식물이 자라고 번성하는 것을 지켜보며 느끼는 성취감 또한 자존감과 전반적인 행복감을 높여줄 수 있다.`,

  passage: `For many centuries, humans have [[take_advantage_of::taken advantage of]] tools that translate and bring into our [[perception::perception]] natural [[phenomena::phenomena]] that we can't [[perceive::perceive]] with our senses. In some cases, this consists of simply [[amplifying::amplifying]] signals that feed into our normal [[sensory_inputs::sensory inputs]] (e.g., [[telescope::telescopes]] can bring into clear view that which is too far away for our eyes to perceive on their own). Other [[instruments::instruments]] turn signals that we cannot perceive into ones that we can observe. Some of these take the form of [[expanding::expanding]] the reach of our current senses, such as creating visible images based on the ultraviolet [[spectrum::spectrum]] of light or changing sounds that are normally outside the range of what human ears can hear into [[audible::audible]] signals. Alternatively, some instruments measure properties for which we have no sensory [[capacity::capacity]] at all and change them into that which we can observe.`,

let current = 0;
let activeVocabKey = null;
let currentSpeakWord = null;
let activeSheetWord = null;
let currentSheetWordData = null;
let selectedChoice = null;
let answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) {
  try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; }
}
function setStarred(gid, list) {
  localStorage.setItem(starKey(gid), JSON.stringify(list));
}
function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var gid = String(problems[current].num);
  var starred = getStarred(gid);
  var isStarred = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = isStarred ? '★' : '☆';
  btn.classList.toggle('starred', isStarred);
}
function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = String(problems[current].num);
  var starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) {
    starred.splice(idx, 1);
  } else {
    starred.push({
      word: currentSheetWordData.word,
      pron: currentSheetWordData.pron || '',
      meaning: currentSheetWordData.meaning || '뜻 정보 없음',
      en: currentSheetWordData.en || '',
      ko: currentSheetWordData.ko || ''
    });
  }
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var placeholders = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      placeholders.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '' + (placeholders.length - 1) + '';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/(\d+)/g, function(m, idx) { return placeholders[idx]; });
    html = html.replace(/\n/g, '<br>');
    return '<p>' + html + '</p>';
  }).join('');
}

function buildTabs() {
  var el = document.getElementById('problem-tabs');
  el.innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" data-i="' + i + '" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①', '②', '③', '④', '⑤'];

function renderQuiz(p) {
  selectedChoice = null;
  answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" id="choice-' + i + '" onclick="selectChoice(' + i + ')"><span class="quiz-num">' + circled[i] + '</span><span>' + c + '</span></div>';
  }).join('');
  document.getElementById('quiz-check-btn').textContent = '정답 확인';
  document.getElementById('quiz-check-btn').disabled = false;
  var result = document.getElementById('quiz-result');
  result.classList.remove('show', 'ok', 'no');
  result.textContent = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) {
    document.getElementById('quiz-q').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var result = document.getElementById('quiz-result');
  var isCorrect = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', isCorrect);
  result.classList.add('show', isCorrect ? 'ok' : 'no');
  var head = isCorrect ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.';
  result.innerHTML = '<b>' + head + '</b><br>' + p.explanation;
  document.getElementById('quiz-check-btn').textContent = '다시 풀기';
  document.getElementById('quiz-check-btn').disabled = false;
  document.getElementById('quiz-check-btn').onclick = function() { renderQuiz(p); document.getElementById('quiz-check-btn').onclick = checkAnswer; };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  var keys = Object.keys(p.vocab);
  vg.innerHTML = keys.map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');

  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) {
    return '<div class="tip-item"><p>' + t + '</p></div>';
  }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) {
    t.classList.toggle('active', i === current);
  });

  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';

  switchTab('grammar');
}

function selectProblem(i) {
  current = i;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function go(delta) {
  if (current === problems.length - 1 && delta === 1) {
    current = 0;
  } else {
    current = Math.max(0, Math.min(problems.length - 1, current + delta));
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleTranslation() {
  var box = document.getElementById('translation-box');
  var btn = document.getElementById('btn-trans');
  var show = !box.classList.contains('show');
  box.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var grid = document.getElementById('vocab-grid');
  var btn = document.getElementById('btn-vocab');
  var show = !grid.classList.contains('show');
  grid.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-t') === name);
  });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key;
  activeSheetWord = null;
  currentSpeakWord = v.word;
  currentSheetWordData = { word: v.word, pron: v.pron, meaning: v.meaning, en: v.ex, ko: v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() {
  if (currentSpeakWord) speak(currentSpeakWord);
}

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var loadTtsVoices = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  loadTtsVoices();
  window.speechSynthesis.onvoiceschanged = loadTtsVoices;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var synth = window.speechSynthesis;
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  var voices = (ttsVoices && ttsVoices.length) ? ttsVoices : synth.getVoices();
  if (voices && voices.length) {
    var enVoice = voices.find(function(v) { return v.lang === 'en-US'; }) || voices.find(function(v) { return v.lang && v.lang.indexOf('en') === 0; });
    if (enVoice) utter.voice = enVoice;
  }
  synth.cancel();
  setTimeout(function() { synth.speak(utter); }, 80);
}

buildTabs();
render();
</script>
<script src="study-stats.js"></script>
