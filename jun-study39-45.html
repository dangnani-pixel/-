<script>
const problems = [
{
  num: "39", label: "39번", type: "문장 삽입",
  insertSentence: "Unfortunately, deforestation is preventing this process from being fully accomplished.",
  insertSentenceKo: "불행하게도, 삼림 벌채는 이러한 과정이 온전히 이루어지는 것을 막고 있다.",
  vocab: {
    emissions: { word:"emissions", pron:"[이미션즈]", meaning:"배출", ex:"Approximately 15-20% of global greenhouse gas emissions are caused by degradation and deforestation.", exko:"전 세계 온실가스 배출의 약 15-20%는 환경 악화와 삼림 벌채로 인해 비롯된다.", etym:"e-(밖으로) + miss(보내다, Latin mittere) + -ion + -s → '밖으로 보내진 것' → '배출'. 같은 mit/miss 어근을 쓰는 단어: transmit(trans-건너 + mit → 전송하다), permit(per-완전히 + mit → 허락하다)." },
    degradation: { word:"degradation", pron:"[데그러데이션]", meaning:"(환경) 악화", ex:"Approximately 15-20% of global greenhouse gas emissions are caused by degradation and deforestation.", exko:"전 세계 온실가스 배출의 약 15-20%는 환경 악화와 삼림 벌채로 인해 비롯된다." },
    deforestation: { word:"deforestation", pron:"[디포리스테이션]", meaning:"삼림 벌채", ex:"deforestation is a major issue when it comes to global warming", exko:"삼림 벌채는 지구 온난화와 관련하여 주요한 문제이다" },
    photosynthesis: { word:"photosynthesis", pron:"[포토신써시스]", meaning:"광합성", ex:"They convert the CO2 in the air to oxygen through the process of photosynthesis", exko:"그것들은 광합성 과정을 통해 공기 중의 이산화탄소를 산소로 전환하며", etym:"photo(빛, Greek phos) + syn(함께, Greek syn) + thesis(놓음, Greek tithenai) → '빛으로 함께 합성함' → '광합성'. 같은 thesis 어근을 쓰는 단어: synthesis(syn+thesis→합성), hypothesis(hypo-아래에+thesis→가설)." },
    regulator: { word:"regulator", pron:"[레귤레이터]", meaning:"조절자", ex:"they are viewed as a natural regulator of carbon dioxide", exko:"이산화탄소의 자연적인 조절자로 여겨진다", etym:"regul(규칙, Latin regula) + -ator → '규칙에 따라 조절하는 것' → '조절자'. 같은 regul 어근을 쓰는 단어: regulate(regul+ate→규제하다), regular(regul+ar→규칙적인)." },
    atmosphere: { word:"atmosphere", pron:"[앳모스피어]", meaning:"대기", ex:"The existence of a larger amount of trees will no doubt lead to the reduced presence of carbon dioxide in the atmosphere and the increased existence of oxygen.", exko:"더 많은 양의 나무의 존재는 의심할 여지 없이 대기 중 이산화탄소의 감소와 산소의 증가로 이어질 것이다.", etym:"atmo(증기, Greek atmos) + sphere(구, Greek sphaira) → '증기로 이루어진 구체' → '대기'. 같은 sphere 어근을 쓰는 단어: hemisphere(hemi-반+sphere→반구), stratosphere(strato+sphere→성층권)." },
    radiation: { word:"radiation", pron:"[레이디에이션]", meaning:"복사 (에너지)", ex:"more of the sun's radiation is being reflected back to Earth instead of being released into space", exko:"더 많은 태양 복사 (에너지)가 우주로 방출되는 대신 지구로 다시 반사되고 있으며" },
    accordingly: { word:"accordingly", pron:"[어코딩리]", meaning:"따라서", ex:"Accordingly, deforestation is a major issue when it comes to global warming.", exko:"따라서, 삼림 벌채는 지구 온난화와 관련하여 주요한 문제이다." }
  },
  funcWords: {
    play: { word:"play", tag:"[동사구 play a role · 역할을 하다]", meaning:"play를 '놀다'로만 알고 있으면 어색해요. 'play a role in ~'은 '~에서 역할을 하다'라는 뜻이라서, Trees play a huge role in the carbon cycle는 '나무들은 탄소 순환에서 막대한 역할을 한다'로 해석돼요.", ex:"Trees play a huge role in the carbon cycle.", exko:"나무들은 탄소 순환에서 막대한 역할을 한다." },
    gone: { word:"gone", tag:"[독립분사구문 with + 목적어 + 분사]", meaning:"gone은 여기서 'with + 목적어 + 분사' 구문의 분사로 쓰여 '~가 …된 채로'라는 동시상황을 나타내요. with half of the Earth's forests gone은 '지구 삼림의 절반이 사라진 채로'라고 해석돼요.", ex:"And with half of the Earth's forests gone, the amount of carbon dioxide is progressively rising.", exko:"그리고 지구 삼림의 절반이 사라지면서, 이산화탄소의 양은 점점 증가하고 있다." },
    viewed: { word:"viewed", tag:"[수동태 be viewed as · ~로 여겨지다]", meaning:"view를 '보다, 경치'로만 알고 있으면 어색해요. 'be viewed as ~'는 '~로 여겨지다, 간주되다'라는 뜻이라서, they are viewed as a natural regulator of carbon dioxide는 '그것들은 이산화탄소의 자연적인 조절자로 여겨진다'로 해석돼요.", ex:"They convert the CO2 in the air to oxygen through the process of photosynthesis, and consequently, they are viewed as a natural regulator of carbon dioxide.", exko:"그것들은 광합성 과정을 통해 공기 중의 이산화탄소를 산소로 전환하며, 그 결과, 이산화탄소의 자연적인 조절자로 여겨진다." },
    when: { word:"when", tag:"[관용 표현 when it comes to · ~에 관한 한]", meaning:"when it comes to는 '~할 때'가 아니라 '~에 관한 한, ~에 있어서는'이라는 뜻의 관용 표현이에요. deforestation is a major issue when it comes to global warming는 '삼림 벌채는 지구 온난화와 관련하여 주요한 문제이다'로 해석돼요.", ex:"Accordingly, deforestation is a major issue when it comes to global warming.", exko:"따라서, 삼림 벌채는 지구 온난화와 관련하여 주요한 문제이다." },
    causing: { word:"causing", tag:"[동사 cause + 목적어 + to부정사 · ~가 …하게 하다]", meaning:"cause A to B는 'A가 B하게 하다, 야기하다'라는 뜻이에요. this is causing the planet's average temperature to rise는 '이는 지구의 평균 기온이 상승하도록 유발하고 있다'로 해석돼요.", ex:"With more carbon dioxide in the atmosphere, more of the sun's radiation is being reflected back to Earth instead of being released into space, and this is causing the planet's average temperature to rise.", exko:"대기 중 이산화탄소가 더 많아지면서, 더 많은 태양 복사 (에너지)가 우주로 방출되는 대신 지구로 다시 반사되고 있으며, 이는 지구의 평균 기온이 상승하도록 유발하고 있다." }

  passage: `Approximately 15-20% of global greenhouse gas [[emissions::emissions]] are caused by [[degradation::degradation]] and [[deforestation::deforestation]]. Trees play a huge role in the carbon cycle. ( ① ) They convert the CO2 in the air to oxygen through the process of [[photosynthesis::photosynthesis]], and consequently, they are viewed as a natural [[regulator::regulator]] of carbon dioxide. ( ② ) The existence of a larger amount of trees will no doubt lead to the reduced presence of carbon dioxide in the [[atmosphere::atmosphere]] and the increased existence of oxygen. ( ③ ) And with half of the Earth's forests gone, the amount of carbon dioxide is progressively rising. ( ④ ) With more carbon dioxide in the atmosphere, more of the sun's [[radiation::radiation]] is being reflected back to Earth instead of being released into space, and this is causing the planet's average temperature to rise. ( ⑤ ) [[accordingly::Accordingly]], deforestation is a major issue when it comes to global warming.`,

  passage: `We go out in the world every day and make decisions about what is safe or not and what is appropriate or not. It is what [[psychologist::psychologist]] Joseph LeDoux has suggested is an [[unconscious::unconscious]] "danger detector" that [[determines::determines]] whether or not something or someone is safe before we can even begin to consciously make a determination. When the object, animal, or person is [[assessed::assessed]] to be dangerous, a fear response, which has been called "fight or flight," occurs. On a conscious level we may correct a mistake in this "danger detector" when we notice it, but often, of course, we simply begin to generate reasons for why it was [[accurate::accurate]] in the first place. We are generally [[convinced::convinced]] that our decisions are "rational," but in reality, most human decisions are made emotionally, and then we collect or generate the facts to [[justify::justify]] these decisions. When we see something or someone who "feels" dangerous, we have already [[launched::launched]] into action internally before we have even started "thinking."`,

  passage: `Commercial businesses aim for [[predictability::predictability]] and [[certainty::certainty]], especially when it comes to product quality. But predictability and certainty are not always (a)valued in the sporting world, especially when it comes to the delivery of professional sport competitions. From a [[spectator::spectator]]'s perspective the sport experience is better experienced when unpredictable. Sport events actually depend on that [[unpredictability::unpredictability]] in order to (b)attract people to the game. When the results of games cannot be predicted, [[attendances::attendances]] at sporting contests are likely to be higher, as are the profits of leagues. However, the (c)presence of predictability also leads to significant [[variability::variability]] in the quality of sporting performances. Many factors can contribute to the variability of the sport product, including the weather, player injuries, the venue, the quality of the [[opponents::opponents]], the closeness of the scores and even the size of the crowd. A cricket match can be [[exhilarating::exhilarating]], boring or even frustrating, but fans still have to pay the same price. Sport marketers may attempt to (d)overcome this by 'improving' the product in systematic ways, such as including a star player, offering premium seating or providing other forms of entertainment and inviting facilities. The uncertain nature of sport contests is just one element of a total experience, although it is an important element for (e)financial success.`,
  translation: `상업적 기업은, 특히 제품 품질에 있어, 예측 가능성과 확실성을 추구한다. 그러나 예측 가능성과 확실성이 스포츠계, 특히 프로 스포츠 경기 운영에서는 항상 가치 있게 여겨지지는 않는다. 관중의 관점에서 스포츠 경험은 예측 불가능할 때 더 잘 경험된다. 실제로 스포츠 경기는 사람들을 경기로 끌어들이기 위해 그 예측 불가능성에 의존한다. 경기 결과가 예측될 수 없을 때, 스포츠 경기의 관중은 더 늘어날 가능성이 있으며, 리그의 수익도 그렇다. 그러나, 예측 가능성의 존재(→ 결여)는 또한 스포츠 수행(실적)의 질에 있어 상당한 변동성으로 이어진다. 날씨, 선수 부상, 경기장, 상대 팀의 실력, 점수의 근접성과 심지어 관중의 규모를 포함하여, 많은 요인들이 스포츠 상품의 변동성의 원인이 될 수 있다. 크리켓 경기는 짜릿할 수도, 지루할 수도, 심지어 좌절감을 줄 수도 있지만, 팬들은 여전히 동일한 가격을 지불해야 한다. 스포츠 마케팅 담당자들은 스타 선수 영입, 프리미엄 좌석 제공 또는 다른 형태의 오락거리와 편의 시설 제공과 같이, 체계적인 방식으로 (스포츠) 상품을 '개선'함으로써 이를 극복하려 시도할지 모른다. 스포츠 경기의 불확실한 속성은 전체 경험의 단지 한 요소일 뿐이지만, 재정적 성공을 위한 중요한 요소이다.`,

  passage: `(A) Emma was a talented [[vocalist::vocalist]] but struggled to gain [[recognition::recognition]]. Lisa, who went to the same high school with her, had quickly become famous with powerful performances. Emma felt [[jealous::jealous]] watching Lisa's success. One day, Emma decided to enter a major vocal competition in the capital city. (a)She spent months preparing her masterpiece of a performance, hoping this would finally be her opportunity to shine.

(B) Moments later, Lisa came over to congratulate Emma with a warm smile. She said, "Your hard work and dedication really paid off. I'm so happy for you." (b)She didn't seem bothered by the results. "I'm proud that your singing brings joy to people," said Lisa. Emma felt grateful for Lisa's kindness. Lisa added, "I've always been moved by your effort and have been supporting (c)you all along."

(C) When the competition day arrived, Emma felt [[nervous::nervous]]. Walking into the concert hall, Emma saw a large [[audience::audience]] cheering for Lisa. She couldn't help but compare herself to Lisa. On her turn, Emma performed with all her heart, pouring (d)her months of preparation into every note. The judges then [[evaluated::evaluated]] each vocalist's performance carefully. Finally, the results were announced. To her surprise, Emma got first place, not Lisa.

(D) These words made Emma feel [[embarrassed::embarrassed]] at her jealousy. At the same time, (e)she got [[inspired::inspired]] to find a better path forward. They hugged warmly, their bond strengthened. From that day on, they supported each other and even sang on the same stage together. Emma became more confident and, finally, got a chance to have her solo concert.`,
  translation: `(A) Emma는 재능 있는 성악가였지만 인정받기 위해 고군분투했다. Lisa는, 그녀와 같은 고등학교에 다녔는데, 뛰어난 공연으로 금세 유명해졌다. Emma는 Lisa의 성공을 보며 질투를 느꼈다. 어느 날, Emma는 수도에서 열리는 주요 성악 대회에 참가하기로 결심했다. 그녀는 이것이 마침내 빛날 기회가 될 거라고 희망하면서, 완벽한 공연을 준비하는 데 몇 달을 보냈다.

(B) 잠시 후, Lisa가 따뜻한 미소를 지으며 Emma에게 다가와 축하해 주었다. 그녀는 "네 노력과 헌신이 정말 결실을 얻었구나. 나는 정말 기뻐."라고 말했다. 그녀는 결과에 연연하지 않는 듯했다. "너의 노래가 사람들에게 기쁨을 준다는 게 자랑스러워."라고 Lisa는 말했다. Emma는 Lisa의 친절에 감사함을 느꼈다. Lisa는 "난 항상 너의 노력에 감동 받았고 늘 너를 응원해 왔어."라고 덧붙였다.

(C) 대회 날이 되었을 때, Emma는 긴장했다. 콘서트홀로 걸어 들어갈 때, Emma는 Lisa를 응원하는 많은 청중을 보았다. 그녀는 자기 자신을 Lisa와 비교할 수 밖에 없었다. 그녀의 차례에, Emma는 모든 음에 그녀의 몇 달 간의 연습을 쏟아부으며, 온 마음을 다해 공연했다. 그러고 나서 심사위원들은 각 성악가의 공연을 주의 깊게 평가했다. 마침내, 결과가 발표되었다. 놀랍게도, Lisa가 아니라, Emma가 1등을 차지했다.

(D) 이 말은 Emma가 자신의 질투심에 부끄러움을 느끼게 했다. 동시에, 그녀는 앞으로 더 나은 길을 찾도록 영감을 받았다. 그들은 따뜻하게 포옹했고, 그들의 유대감은 강해졌다. 그날 이후로, 그들은 서로를 응원했고 심지어 같은 무대에서 함께 노래했다. Emma는 더욱 자신감을 얻게 되었고, 마침내, 단독 콘서트를 할 기회를 얻었다.`,

      choices:["(B) - (D) - (C)","(C) - (B) - (D)","(C) - (D) - (B)","(D) - (B) - (C)","(D) - (C) - (B)"],
      answer:1,

    { qNum:45, question:"윗글에 관한 내용으로 적절하지 않은 것은?",
      choices:["Lisa는 Emma와 같은 고등학교에 다녔다.","Lisa는 Emma에게 다가와 축하해 주었다.","Emma는 Lisa를 응원하는 많은 청중을 보았다.","Emma는 대회에서 2등을 차지했다.","Emma는 단독 콘서트를 할 기회를 얻었다."],

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'jun' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\{\{u\}\}/g, '\u0001').replace(/\{\{\/u\}\}/g, '\u0002');
    html = html.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      ph.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/\u0001/g, '<u class="uw">').replace(/\u0002/g, '</u>');
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.label + '</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

let quizState = [];

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

function renderQuiz(p) {
  quizState = p.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = p.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var q = problems[current].questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var r = document.getElementById('qresult-' + qi);
  var ok = quizState[qi].selected === q.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.') + '</b><br>' + q.explanation;
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '다시 풀기';
  b.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var p = problems[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(p.questions[qi], qi);
  var r = document.getElementById('qresult-' + qi);
  r.classList.remove('show','ok','no'); r.innerHTML = '';
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '정답 확인';
  b.onclick = function() { checkAnswer(qi); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.label + ' · ' + p.type;
  var gc = document.getElementById('given-card');
  if (p.image) { gc.classList.add('show'); gc.innerHTML = '<img src="' + p.image + '" alt="문제 자료">'; }
  else { gc.classList.remove('show'); gc.innerHTML = ''; }
  var ic = document.getElementById('insert-card');
  if (p.insertSentence) {
    ic.classList.add('show');
    document.getElementById('insert-text').textContent = p.insertSentence;
    document.getElementById('insert-text-ko').textContent = p.insertSentenceKo || '';
  } else { ic.classList.remove('show'); }
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i) { current = i; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  render(); window.scrollTo({top:0, behavior:'smooth'});
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
