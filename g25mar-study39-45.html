<script>
const problems = [
{
  num: "39", label: "39번", type: "문장 삽입",
  insertSentence: "For example, we do not have a term in ordinary language that describes a memory that is not necessarily a memory of something the person having it has experienced.",
  insertSentenceKo: "예를 들어, 우리는 그것을 가진 사람이 경험한 것에 대한 기억이 반드시 아닐 수도 있는 기억을 설명하는 용어를 일상 언어에서 가지고 있지 않다.",
  vocab: {
    pertinent: { word:"pertinent", pron:"[퍼티넌트]", meaning:"관련 있는", ex:"the kinds of debates to which your claims are pertinent", exko:"당신의 주장과 관련 있는 종류의 논의" },
    coin: { word:"coin", pron:"[코인]", meaning:"(새 용어를) 만들다", ex:"to coin special uses through what philosophers call stimulative definition", exko:"철학자들이 자극적 정의라고 부르는 것을 통해 특별한 용법을 만들다" },
    lexicon: { word:"lexicon", pron:"[렉시콘]", meaning:"어휘 목록", ex:"the current lexicon is not able to make distinctions", exko:"현재의 어휘로는 구분을 할 수 없다" },
    distinction: { word:"distinctions", pron:"[디스팅션즈]", meaning:"구별, 구분", ex:"distinctions that you think are philosophically important", exko:"당신이 철학적으로 중요하다고 생각하는 구분" },
    misleading: { word:"misleading", pron:"[미스리딩]", meaning:"오해의 소지가 있는", ex:"To call this a memory would be misleading.", exko:"이것을 기억이라고 부르는 것은 오해의 소지가 있을 것이다." },
    hypothetical: { word:"hypothetical", pron:"[하이퍼세티컬]", meaning:"가상의", ex:"these hypothetical memory-like experiences", exko:"이러한 가상의 기억과 유사한 경험들" }
  },
  passage: `As a general rule, it's better if your definition corresponds as closely as possible to the way in which the term is ordinarily used in the kinds of debates to which your claims are [[pertinent::pertinent]]. ( ① ) There will be, however, occasions where it is appropriate, even necessary, to [[coin::coin]] special uses through what philosophers call stimulative definition. ( ② ) This would be the case where the current [[lexicon::lexicon]] is not able to make [[distinction::distinctions]] that you think are philosophically important. ( ③ ) Such a thing would occur, for example, if I could somehow share your memories: I would have a memory-type experience, but this would not be of something that I had actually experienced. ( ④ ) To call this a memory would be [[misleading::misleading]]. ( ⑤ ) For this reason, philosophers have coined the special term 'quasi-memory' to refer to these [[hypothetical::hypothetical]] memory-like experiences.`,
  translation: `일반적으로, 당신의 (용어) 정의가 자신의 주장과 관련 있는 종류의 논의에서 일반적으로 사용되는 방식과 가능한 비슷하게 일치하면 좋다. 하지만, 철학자들이 '자극적 정의'라고 부르는 것을 통해 특별한 용법을 만드는 것이 적절하고, 심지어 필요한 경우도 있을 것이다. 현재의 어휘로는 당신이 철학적으로 중요하다고 생각하는 구분을 할 수 없는 경우가 이에 해당한다. 예를 들어, 우리는 그것을 가진 사람이 경험한 것에 대한 기억이 반드시 아닐 수도 있는 기억을 설명하는 용어를 일상 언어에서 가지고 있지 않다. 예를 들어, 내가 당신의 기억을 공유할 수 있다면 그러한 상황이 생길 수 있다. 즉, 나는 기억 유형의 경험을 갖고 있지만, 이것이 내가 실제로 경험했던 것이 아닐 수도 있다. 이것을 기억이라고 부르는 것은 오해의 소지가 있을 것이다. 이러한 이유로, 철학자들은 이러한 가상의 기억과 유사한 경험들을 지칭하기 위해 '유사 기억'이라는 특별한 용어를 만들어 냈다.`,
  grammar: [
    { title:"correspond to ~ (~와 일치하다)", desc:"'~에 부합하다, 일치하다'라는 뜻입니다.", ex:"your definition corresponds as closely as possible to the way ~ (당신의 정의가 ~하는 방식에 가능한 한 가깝게 일치하다)" },
    { title:"the case where + 절", desc:"'~하는 경우'라는 뜻으로 where가 상황을 나타내는 선행사를 수식합니다.", ex:"This would be the case where the current lexicon is not able to make distinctions. (이는 현재의 어휘로 구분을 할 수 없는 경우일 것이다.)" }
  ],
  tips: [
    "주어진 문장은 '일상 언어에 특정 용어가 없다'는 구체적 사례이므로, 그 사례가 뒷받침하는 일반적 진술(현재 어휘로는 구분할 수 없다) 바로 뒤에 위치해야 합니다.",
    "②의 '어휘로 구분할 수 없는 경우'라는 일반적 진술 다음, ③의 '기억을 공유하는 구체적 상황' 앞인 ③ 자리에 주어진 문장이 들어가는 것이 논리적으로 자연스럽습니다."
  ],
  questions: [{ qNum:39, question:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오. [3점]",
    choices:["①","②","③","④","⑤"], answer:2,
    explanation:"주어진 문장은 '경험하지 않은 기억을 가리키는 용어가 없다'는 구체적 예시로, ②의 '현재 어휘로는 철학적으로 중요한 구분을 할 수 없다'는 일반적 진술 바로 뒤, 그리고 '기억을 공유하는 구체적 상황(if I could somehow share your memories)'이 이어지는 문장 앞인 ③에 들어가는 것이 가장 자연스러우므로 ③번이 정답입니다." }]
},
{
  num: "40", label: "40번", type: "요약문 완성",
  insertSentence: "Language borrowing from dominant to subordinate groups reflects social _____(A)_____, where the language systems of the latter often _____(B)_____ even though they may have provided some terms, as exemplified by Dharug in Australia.",
  insertSentenceKo: "지배적인 집단에서 종속된 집단으로의 언어 차용은 사회적 (A)를 반영하는데, 호주의 Dharug어의 예에서와 같이, 후자의 언어 체계는 비록 몇몇 용어를 제공했을 수도 있지만 종종 (B)한다.",
  vocab: {
    prestigious: { word:"prestigious", pron:"[프레스티저스]", meaning:"권위 있는, 명망 있는", ex:"from the more powerful or prestigious group to the less favored one", exko:"더 강력하거나 권위 있는 집단에서 덜 선호되는 집단으로" },
    subordinate: { word:"subordinated", pron:"[서보디네이티드]", meaning:"종속된", ex:"The languages of socially subordinated groups may provide terminology.", exko:"사회적으로 종속된 집단의 언어는 용어를 제공할 수도 있다." },
    terminology: { word:"terminology", pron:"[터미놀러지]", meaning:"용어", ex:"provide terminology for objects or practices", exko:"사물이나 관습에 대한 용어를 제공하다" },
    obliteration: { word:"obliteration", pron:"[오블리터레이션]", meaning:"소멸, 말살", ex:"the fate of the language system is extinction after the obliteration of many of its speakers", exko:"많은 화자들이 소멸된 후 그 언어 체계의 운명은 멸종이다" },
    remainder: { word:"remainder", pron:"[리메인더]", meaning:"남은 사람들, 나머지", ex:"The remainder shifted to varieties of English.", exko:"남은 사람들은 영어의 여러 변형으로 옮겨 갔다." },
    suppress: { word:"suppressed", pron:"[서프레스트]", meaning:"억압했다", ex:"the language of the people who had suppressed them", exko:"그들을 억압했던 사람들의 언어" }
  },
  passage: `Quite often the interaction between groups is socially unequal, and this is reflected in the fact that in many cases borrowing of words or constructions goes mostly or entirely in one direction, from the more powerful or [[prestigious::prestigious]] group to the less favored one. The languages of socially [[subordinate::subordinated]] groups may from quite an early period of contact provide [[terminology::terminology]] for objects or practices with which speakers of the more powerful group were previously unfamiliar, but the effects of contact in that direction may not progress any further than this. In some cases, as with the Dharug language of Sydney, Australia, the source of some of the earliest loans from Indigenous Australian languages into English, the fate of the language system is extinction after the [[obliteration::obliteration]] of many of its speakers. The [[remainder::remainder]] shifted to varieties of English, the language of the people who had [[suppress::suppressed]] them.`,
  translation: `종종 집단 간의 상호 작용은 사회적으로 불평등하며, 이는 많은 경우에 단어 또는 구조의 차용이 대부분 혹은 완전히 한 방향, 즉 더 강력하거나 권위 있는 집단에서 덜 선호되는 집단 쪽으로 이동한다는 사실에 반영된다. 사회적으로 종속된 집단의 언어는 접촉 초기부터, 더 강력한 집단의 화자들이 이전에 잘 몰랐던 사물이나 관습에 대한 용어를 제공할 수도 있지만, 그런 방향으로의 접촉의 결과는 이것 이상 진전되지는 않을 수도 있다. 호주 시드니의 Dharug 언어와 같은 몇몇 경우에는(이는 호주 토착 언어에서 영어로의 몇몇 최초의 차용 출처인데), 화자들 중 다수가 소멸되고 나면 그 언어 체계의 운명은 멸종하는 것이다. 남은 사람들은 그들을 억압했던 사람들의 언어인 영어의 다양한 변종으로 옮겨 갔다.`,
  grammar: [

  tips: [
    "요약문 문제는 (A)(B)가 본문의 어느 표현을 바꿔 쓴 것인지 대응시켜 보세요.",
    "'더 강력한 집단 쪽으로만 차용이 이동한다'는 (A) inequality(불평등)에, '화자가 소멸된 후 언어 체계가 멸종한다'는 (B) vanish(사라지다)에 대응됩니다."

  passage: `Many animals pursue a mixed strategy of [[accumulate::accumulating]] both body fat and food, which leads one to ask, "What are the relative advantages and disadvantages of these two forms of energy storage?" Maximum fat [[deposition::deposition]] ‹(a)increases› with body mass whereas maximum food storage is not [[constrain::constrained]] by body size. This means that animals, especially small animals, can accumulate much greater energy [[reserves::reserves]] in the form of stored food than they can in the form of body fat. Further, stored food is more ‹(b)economical› than body fat because fat contributes to body mass, and [[metabolic::metabolic]] rate increases with body mass. In other words, there is a metabolic expense to maintaining fat. [[excessive::Excessive]] fat accumulations may also have a ‹(c)negative› effect on an animal's ability to avoid predators. And, if maintaining a high body temperature is advantageous, animals might be expected to accumulate more energy in the form of a food store than as body fat. On the other hand, stored food may rot over time, may be removed by robbers, or may simply be lost. Many animals must expend energy managing and protecting their food stores. Eating food and converting it to fat ‹(d)intensifies› these types of losses and the energetic costs of managing stored food. A large accumulation of body fat adds to an animal's fasting capacity, especially large animals, permitting some animals to enter prolonged [[dormancy::dormancy]] in the relative security of a [[hibernaculum::hibernaculum]]. Thus, both fat accumulation and food storage have some decided ‹(e)advantages›.`,
  translation: `많은 동물은 체지방과 식량 둘 다 축적하는 혼합 전략을 추구하는데, 이는 우리가 "이 두 가지 에너지 저장 형태의 상대적인 장점과 단점은 무엇인가?"라고 질문하게 한다. 최대 지방 축적량은 체질량에 따라 증가하는 반면 최대 식량 저장량은 신체 크기에 제한을 받지 않는다. 이는 동물, 특히 작은 동물은 그들이 체지방 형태로 축적할 수 있는 것보다 훨씬 더 많은 에너지 비축량을 저장된 식량의 형태로 축적할 수 있다는 것을 의미한다. 게다가, 지방은 체질량에 기여하고, 신진대사율도 체질량에 따라 높아지기 때문에 저장된 식량은 체지방보다 더 경제적이다. 다시 말해, 체지방을 유지하는 데 신진대사 비용이 존재한다. 과도한 체지방 축적은 또한 포식자를 피하는 동물의 능력에 부정적인 영향을 미칠지도 모른다. 그리고, 만약 높은 체온을 유지하는 것이 유리하다면, 동물은 체지방으로 보다 저장된 식량의 형태로 더 많은 에너지를 축적할 것으로 예상될 수 있다. 반면에 저장된 식량은 시간이 지남에 따라 상할 수 있고, 도둑에 의해 제거되거나, 단순히 분실될 수 있다. 많은 동물은 저장된 식량을 관리하고 보호하는 데 에너지를 소비해야 한다. 식량을 먹고 그것을 지방으로 전환하는 것은 이러한 손실의 유형과 저장된 식량을 관리하는 데 드는 에너지 비용을 강화한다(→ 피한다). 체지방의 많은 축적은 동물의 금식 능력을 높여주는데, 특히 큰 동물에게 그러하며, 어떤 동물들이 동면 장소의 상대적인 안전한 속에서 장기간의 휴면 상태에 들게 해 준다. 따라서 지방 축적과 식량 저장 둘 다 몇 가지 결정적인 이점이 있다.`,

  },
  passage: `(A) Collin's dad had a 15-year-old car, which was the same age as Collin. He decided it was finally time to replace it with a newer model. One evening at dinner, ‹(a)he› shared his plan to buy a new car with his family. Excited by the news, Collin became [[determined::determined]] to [[contribute::contribute]] to his dad's big purchase. Over the past several years, Collin had saved his [[allowance::allowance]] money. He felt that this was the perfect [[opportunity::opportunity]] to do something special for his dad.

(B) That afternoon, Collin's dad went to the car [[dealership::dealership]] and purchased a car that was only one year old. He picked a red car because that was Collin's favorite color. The money that his son had left for ‹(b)him› was enough to cover the [[remaining::remaining]] cost, and he even had some funds left over! Collin's dad decided to buy his son a small gift with the extra money. That evening, when Collin came home, he was amazed to see the new car parked in the driveway.

(C) His dad thanked him sincerely, and told Collin how proud ‹(c)he› was of his [[thoughtful::thoughtful]] [[gesture::gesture]]. Then, he handed Collin a small box with a bow on top of it, and a brand-new baseball was inside. Collin loved it! ‹(d)He› beamed with excitement and said, "Not only do we have a new car, but I also got an awesome new baseball!" His dad smiled warmly and hugged him. Collin's kind and [[generous::generous]] heart had created a beautiful moment for his family.

(D) The next morning, before heading to school, Collin put an [[envelope::envelope]] on the kitchen table. When his dad came into the kitchen, ‹(e)he› noticed the envelope and asked his wife about it. She explained that Collin had left it there before leaving for school. Collin's dad opened the envelope and saw a thick stack of money. "There's $1,000 in here!" he [[exclaimed::exclaimed]], after counting it. His wife smiled and said, "Collin wanted to help you pay for the new car."`,
  translation: `(A) Collin의 아버지는 15년 된 차를 가지고 있었는데, 그것은 Collin과 같은 나이였다. 그는 그것을 마침내 새로운 모델로 교체할 때라고 결정했다. 어느 날 밤 저녁 식사에서 (a)그는 새 차를 사려는 그의 계획을 그의 가족들과 공유했다. 그 소식에 기뻐하며, Collin은 그의 아버지의 큰 구매에 기여하겠다고 결심하게 되었다. 지난 수년 동안, Collin은 그의 용돈을 모아 왔다. 그는 이번에 아버지를 위해 특별한 무언가를 할 완벽한 기회라고 느꼈다.

(B) 그날 오후, Collin의 아버지는 자동차 판매 대리점에 가서 1년밖에 안 된 차를 구입했다. 그는 빨간색이 Collin이 가장 좋아하는 색깔이기 때문에 빨간 차를 골랐다. 그의 아들이 (b)그를 위해 놓아두었던 돈은 나머지 금액을 충당하기에 충분했고, 그는 심지어 약간의 돈을 남겼다! Collin의 아버지는 그 돈으로 그의 아들에게 작은 선물을 사 주기로 결심했다. 그날 저녁, Collin이 집에 왔을 때, 그는 진입로에 새로운 차가 주차된 것을 보고 놀랐다.

(C) 그의 아버지는 그에게 진심으로 고마워했고, (c)그가 Collin의 사려 깊은 행동을 얼마나 자랑스러워하는지 Collin에게 말했다. 그러고 나서 Collin에게 리본이 위에 달린 작은 상자를 건넸고, 새 야구공이 그 안에 있었다. Collin은 그것을 좋아했다! (d)그는 기쁨으로 얼굴이 환히 빛났고 "우리가 새 차를 가지게 됐을 뿐만 아니라, 저도 아주 멋진 새 야구공을 받았어요!"라고 말했다. 그의 아버지는 따뜻하게 미소 짓고 그를 안아 주었다. Collin의 친절하고 너그러운 마음이 그의 가족에게 아름다운 순간을 만들었다.

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g25mar' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      ph.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];

let quizState = [];

function renderQuiz(p) {
  quizState = p.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = p.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var q = problems[current].questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var r = document.getElementById('qresult-' + qi);
  var ok = quizState[qi].selected === q.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.') + '</b><br>' + q.explanation;
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '다시 풀기';
  b.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var p = problems[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(p.questions[qi], qi);
  var r = document.getElementById('qresult-' + qi);
  r.classList.remove('show','ok','no'); r.innerHTML = '';
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '정답 확인';
  b.onclick = function() { checkAnswer(qi); };
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
