<script>
const problems = [
{
  num: 18, type: "글의 목적 파악",
  question: "다음 글의 목적으로 가장 적절한 것은?",
  choices: ["광고 공모전 참가를 독려하려고","고객 감사 행사 상품을 홍보하려고","여행 상품 이용 경험 공유를 요청하려고","여행 상품 일정 변경 사항을 공지하려고","우수 고객을 위한 추가 혜택을 안내하려고"],
  answer: 2,
  explanation: "'I would like to kindly ask if you would be willing to share a few words about your experience.'에서 여행 경험을 광고에 담기 위해 후기를 공유해 달라고 요청하고 있으므로 정답은 ③번입니다.",
  vocab: {
    appreciation: { word:"appreciation", pron:"[어프리시에이션]", meaning:"감사", ex:"I express our sincere appreciation.", exko:"진심 어린 감사를 표합니다.", etym:"ap-(ad-, ~에) + preci(=preti, price와 동근인 '가치') + -ation(명사형) → 가치를 알아보다 → 감사, 인정. 같은 preci 어근을 쓰는 다른 접두사 단어: depreciate(de-아래로 + preci → 가치를 낮추다 → 평가절하하다), appreciate(원형, ~쪽으로 가치를 두다 → 감사하다)." },
    loyalty: { word:"loyalty", pron:"[로열티]", meaning:"충성, 애용", ex:"Thank you for your continued loyalty.", exko:"계속 애용해 주셔서 감사합니다.", etym:"loy(=leg, 법 lex의 변형) + -al(형용사형) + -ty(명사형) → 법을 잘 따르는 성질 → 충성심. 같은 leg 어근을 쓰는 다른 접두사 단어: illegal(il-(in-, 부정) + leg → 법에 어긋나는 → 불법의), legal(접두사 없이 leg 어근 그대로 → 법의)." },
    promotional: { word:"promotional", pron:"[프로모셔널]", meaning:"홍보의", ex:"This is part of a promotional campaign.", exko:"이것은 홍보 캠페인의 일부이다.", etym:"pro-(앞으로) + mot(=movere, 움직이다) + -ion/-al(명사·형용사형) → 앞으로 움직이게 하다 → 촉진하다, 홍보하다. 같은 mot 어근을 쓰는 다른 접두사 단어: demote(de-아래로 + mote → 강등시키다), remote(re-멀리 + mote → 멀리 움직인 → 외딴)." },
    airing: { word:"airing", pron:"[에어링]", meaning:"방영하는", ex:"They will be airing an advertisement.", exko:"그들은 광고를 방영할 것이다." },
    valued: { word:"valued", pron:"[밸류드]", meaning:"소중한", ex:"You are one of our most valued clients.", exko:"당신은 우리의 가장 소중한 고객 중 한 분입니다.", etym:"val(=valere, 힘·가치가 있다) + -ue(명사형) + -d → 가치가 있는. 같은 val 어근을 쓰는 다른 접두사 단어: evaluate(e-밖으로 + val + ate → 가치를 끌어내다 → 평가하다), prevail(pre-먼저 + vail → 먼저 힘을 발휘하다 → 우세하다)." },
    willing: { word:"willing", pron:"[윌링]", meaning:"기꺼이 ~하는", ex:"Would you be willing to help?", exko:"기꺼이 도와주시겠어요?" },
    invaluable: { word:"invaluable", pron:"[인밸류어블]", meaning:"매우 귀중한", ex:"Your feedback would be invaluable.", exko:"당신의 의견은 매우 귀중할 것입니다.", etym:"in-(불가능) + valu(=val, 가치) + -able(~할 수 있는) → 가치를 매길 수 없을 만큼 (큰) → 매우 귀중한. in-이 '불가능'을 나타내는 다른 접두사 단어: incredible(in-불가능 + cred(믿다) → 믿을 수 없을 정도의), inevitable(in-불가능 + e-vit(피하다) → 피할 수 없는)." },
    contributions: { word:"contributions", pron:"[컨트리뷰션즈]", meaning:"기여, 도움", ex:"Thank you for your contributions.", exko:"도움을 주셔서 감사합니다.", etym:"con-(함께) + tribute(=tribuere, 나누어 바치다) + -ion(명사형) → 함께 바치다 → 기여, 공헌. 같은 tribute 어근을 쓰는 다른 접두사 단어: distribute(dis-널리 + tribute → 나누어 분배하다), attribute(at-(ad-, ~에게) + tribute → ~탓으로 돌리다)." }
  },
  funcWords: {
    as: { word:"as", tag:"[전치사 as]", meaning:"'as part of a new promotional campaign'에서 as는 '~의 일환으로'라는 뜻의 전치사예요. 뒤에 명사구(part of ~)가 이어져 새로운 홍보 캠페인의 한 부분임을 나타내요.", ex:"Next year, as part of a new promotional campaign, Lomos Tours will be airing an advertisement.", exko:"내년에 새로운 홍보 캠페인의 일환으로 Lomos Tours는 광고를 방영할 예정입니다." },
    since: { word:"since", tag:"[접속사 since · 이유]", meaning:"여기서 since는 '~ 이후로(시간)'가 아니라 '~하기 때문에, ~했으므로'라는 뜻의 이유를 나타내는 접속사예요. 문장 맨 앞에서 '지난여름 저희와 함께 여행하셨기에'라고 이유를 밝히고 있어요.", ex:"Since you traveled with us last summer, I would like to kindly ask if you would be willing to share a few words about your experience.", exko:"지난여름 저희와 함께 여행하셨기에, 그 경험에 대해 몇 마디 나눠주실 의향이 있으신지 정중히 여쭙고 싶습니다." },
    if: { word:"if", tag:"[명사절 접속사 if]", meaning:"'ask if you would be willing to share'에서 if는 '만약 ~라면'이 아니라 '~인지 아닌지'라는 뜻의 명사절 접속사(=whether)예요. ask의 목적어 역할을 해서 '기꺼이 나눠주실 의향이 있으신지 여쭙다'로 해석돼요.", ex:"Since you traveled with us last summer, I would like to kindly ask if you would be willing to share a few words about your experience.", exko:"지난여름 저희와 함께 여행하셨기에, 그 경험에 대해 몇 마디 나눠주실 의향이 있으신지 정중히 여쭙고 싶습니다." },
    in: { word:"in", tag:"[전치사 in + 동명사]", meaning:"'invaluable in helping us promote our services'에서 in은 '~하는 데 있어'라는 뜻으로, 뒤에 동명사(helping)가 와서 '우리 서비스를 홍보하는 데 있어 매우 귀중하다'라고 해석돼요.", ex:"Your feedback would be invaluable in helping us promote our services.", exko:"귀하의 의견은 저희 서비스를 홍보하는 데 매우 귀중할 것입니다." },
    to: { word:"to", tag:"[to부정사]", meaning:"동사원형 앞의 to는 to부정사예요. 'I would like to kindly ask'에서는 like의 목적어로 쓰인 명사적 용법('부탁드리고 싶다')이고, 'willing to share'에서는 willing 뒤에 와서 '기꺼이 나누다'라는 뜻을 완성해요. 둘 다 '~하는 것을'로 자연스럽게 해석하면 됩니다.", ex:"Since you traveled with us last summer, I would like to kindly ask if you would be willing to share a few words about your experience.", exko:"지난여름 저희와 함께 여행하셨기에, 그 경험에 대해 몇 마디 나눠주실 의향이 있으신지 정중히 여쭙고 싶습니다." },
    share: { word:"share", tag:"[동사 · 품사 확인]", meaning:"share는 사전에서 '몫, 주식, 지분' 같은 명사로 먼저 나오는 경우가 많지만, 여기서는 'willing to share a few words' 구조 속에서 to 뒤에 오는 동사원형, 즉 '(말을) 나누다, 공유하다'라는 뜻의 동사예요. 명사가 아니라 동사라는 점에 주의하며 '몇 마디 나눠주다'로 해석하세요.", ex:"Since you traveled with us last summer, I would like to kindly ask if you would be willing to share a few words about your experience.", exko:"지난여름 저희와 함께 여행하셨기에, 그 경험에 대해 몇 마디 나눠주실 의향이 있으신지 정중히 여쭙고 싶습니다." },

  passage: `Dear Mr. Kelly,

Mark Smith`,
  translation: `Kelly 씨께,

Mark Smith 드림`,

  passage: `After finishing my shopping, I walked out of the [[grocery_store::grocery store]] and [[headed::headed to]] the [[spot::spot]] where I'd parked my car. But it wasn't there. I wasn't the kind of person to forget where I'd parked. I knew I was in the right place — so where was my car? I looked around, but nothing [[made_sense::made sense]]. Not knowing what to do, I called my husband at home and said, "My car is [[missing::missing]]! I can't find my car." I heard him laughing on the other end of the line. "Your car is here outside the house! You took mine today, remember?" I turned around — and there it was. I [[couldnt_help::couldn't help but]] laugh at myself. With a [[sigh_of_relief::sigh of relief]], I walked over to the car. Everything was fine [[after_all::after all]].`,
  translation: `장을 다 보고 나서, 나는 식료품점을 나와 내가 차를 주차했던 자리로 향했다. 그런데 차가 거기 없었다. 나는 주차한 곳을 잊어버리는 그런 사람이 아니었다. 나는 내가 제대로 된 장소에 있다는 것을 알고 있었다 — 그런데 내 차는 어디에 있는 걸까? 주위를 둘러봤지만, 아무것도 이해가 되지 않았다. 어떻게 해야 할지 몰라서, 나는 집에 있는 남편에게 전화해서 말했다. "내 차가 없어졌어! 차를 못 찾겠어." 전화기 너머에서 그가 웃는 소리가 들렸다. "당신 차는 여기 집 앞에 있어! 오늘 내 차 가져갔잖아, 기억 안 나?" 나는 뒤를 돌아봤고 — 거기에 차가 있었다. 나는 스스로를 보고 웃지 않을 수 없었다. 안도의 한숨을 쉬며, 나는 차 쪽으로 걸어갔다. 결국 모든 것이 괜찮았다.`,

  passage: `One of the most important aspects of [[sustaining::sustaining]] long-term relationships is communication. It's easy to connect with someone and then let the relationship get [[stuck::stuck]] due to a lack of [[follow_up::follow-up]]. To keep the connection alive, make a [[conscious::conscious]] effort to [[stay_in_touch::stay in touch]]. This doesn't mean constantly reaching out with requests or updates but rather maintaining a friendly and [[consistent::consistent]] line of communication. A simple message to check in or share something of value can go a long way in [[reinforcing::reinforcing]] your relationship. For example, if you come across an article or resource that you think might interest a connection, share it with them, even if you haven't spoken in a while. This shows that you're thinking of them and are [[invested::invested]] in maintaining the relationship.`,
  translation: `장기적인 관계를 지속하는 데 있어 가장 중요한 측면 중 하나는 소통이다. 누군가와 연결되었다가 후속 연락의 부재로 인해 그 관계가 정체되게 두는 것은 쉬운 일이다. 그 연결을 살아 있게 하려면, 연락을 유지하려는 의식적인 노력을 기울여라. 이것은 부탁이나 근황을 알리려고 끊임없이 연락하라는 뜻이 아니라, 오히려 친근하고 꾸준한 소통의 창구를 유지하라는 뜻이다. 안부를 묻거나 가치 있는 무언가를 공유하는 간단한 메시지 하나가 관계를 강화하는 데 큰 도움이 될 수 있다. 예를 들어, 어떤 지인이 관심 있어 할 것 같은 기사나 자료를 우연히 발견하면, 한동안 이야기를 나누지 않았더라도 그것을 그들과 공유하라. 이것은 당신이 그들을 생각하고 있고 관계 유지에 공을 들이고 있다는 것을 보여준다.`,

  passage: `Currently, urban [[regeneration::regeneration]] projects in [[degraded::degraded]] areas have been promoted as improving the wellbeing of residents and solving environmental [[injustice::injustice]] problems. However, such environmental improvements in [[ethnic::ethnic]] communities and/or low-income households can create an urban green space paradox. The creation of new, high-quality green spaces can increase [[attractiveness::attractiveness]], making these neighbourhood more desirable. By contrast, the cost of housing can rise, and residents may not be able to [[afford::afford]] the rent. This results in the exclusion or [[displacement::displacement]] of the poor neighbourhood's residents, who were intended to benefit from the ecosystem services provided by the new green space. In turn, the residents may only be able to afford to live in a similar degraded neighbourhood to the one they left, with low access to green [[infrastructure::infrastructure]].`,
  translation: `현재, 낙후된 지역의 도시 재생 사업은 주민들의 웰빙을 향상시키고 환경 불평등 문제를 해결하는 것으로 홍보되어 왔다. 그러나 소수 민족 공동체 그리고/또는 저소득 가구에서의 그러한 환경 개선은 '도시 녹지 공간의 역설'을 만들어낼 수 있다. 새롭고 질 높은 녹지 공간의 조성은 매력도를 높여, 이 동네들을 더 살고 싶은 곳으로 만들 수 있다. 반면에, 주거 비용이 오를 수 있고, 주민들은 임대료를 감당하지 못할 수도 있다. 이는 새로운 녹지 공간이 제공하는 생태계 서비스로부터 혜택을 받도록 의도되었던 가난한 동네 주민들이 배제되거나 쫓겨나는 결과를 낳는다. 결국, 그 주민들은 자신들이 떠나온 곳과 비슷한, 녹지 기반시설에 대한 접근성이 낮은 낙후된 동네에서 살 형편밖에 되지 않을 수 있다.`,

  passage: `An increasing [[awareness::awareness]] of our effect on the ocean is slowly [[seeping::seeping]] into the public agenda, dragging behind it a conversation that is decades [[overdue::overdue]]. But this conversation faces a massive [[obstacle::obstacle]]. It's almost impossible to discuss what to do about something changing if you don't initially know how it works. If a doctor tells a patient that they have a problem with their [[kidneys::kidneys]], the patient probably already has at least a [[vague::vague]] idea about where their kidneys are and what they're up to. They learned about that part of their own personal life-support system at school. But that's not the case for the oceans. When we see a news story about the long-term [[decline::decline]] in the numbers of krill in the Southern Ocean, it sounds generally like a bad thing. But there's far more to it than the risk of whales going hungry. Krill are a part of the ocean engine. We need to understand at least some of the [[context::context]] before we can discuss the change and take appropriate action.`,

  passage: `Rome was said to have been a [[melting_pot::melting pot]] from the very start. The historian Livy claimed the city's original population was [[comprised::comprised of]] immigrants flooding in from all directions, attracted by Romulus's [[deliberate::deliberate]] policy of [[nondiscrimination::nondiscrimination]]. It was this initial openness, Livy [[asserts::asserts]], that laid the foundations for the later strength and success of the city. Romans described their city as multicultural in the generations after its foundation. Tradition held that only a minority of the city's legendary kings were Roman-born, with the others all arriving as immigrants before being chosen for the throne for their [[virtues::virtues]] and [[merits::merits]]. As the empire expanded across three continents, Rome eagerly adopted new cultural influences and [[absorbed::absorbed]] incoming groups — perhaps a little too eagerly for some, who, like the poet Juvenal, complained about the rapid rate of cultural change.`,
  translation: `로마는 아주 처음부터 용광로였다고 전해진다. 역사가 Livy는 그 도시의 초기 인구가 Romulus의 의도적인 무차별 정책에 이끌려 사방에서 밀려 들어온 이민자들로 구성되어 있었다고 주장했다. Livy가 단언하기를, 바로 이 초기의 개방성이 이후 그 도시의 힘과 성공의 토대를 놓았다는 것이다. 로마인들은 건국 이후 여러 세대에 걸쳐 자신들의 도시를 다문화적이라고 묘사했다. 전해지는 바에 따르면 그 도시의 전설적인 왕들 중 소수만이 로마 태생이었고, 나머지는 모두 이민자로 도착한 뒤 그들의 미덕과 공로로 왕좌에 선택되었다. 제국이 세 대륙에 걸쳐 확장되면서, 로마는 새로운 문화적 영향을 열렬히 받아들이고 유입되는 집단들을 흡수했다 — 어떤 이들에게는 아마도 조금 지나치게 열렬했을지도 모르는데, 시인 Juvenal 같은 이들은 급격한 문화 변화 속도에 대해 불평했다.`,

    by: { word:"by", tag:"[전치사 by · 수단]", meaning:"'by permitting'에서 by는 '~함으로써(수단)'이라는 뜻의 전치사예요. by 뒤에 동명사(permitting)가 와서 '먼지와 기체 입자의 응집을 허용함으로써'라고 해석돼요.", ex:"For instance, the precise value of gravity has enabled our universe to arise by permitting the aggregation of dust and gas particles to proto-stars around which planets later came to orbit, including the Earth around the Sun.", exko:"예를 들어, 중력의 정밀한 값은 먼지와 기체 입자들이 원시별로 응집되는 것을 허용함으로써 우리 우주가 생겨날 수 있게 했고, 그 원시별 주위를 나중에 행성들이 돌게 되었으며, 여기에는 태양 주위를 도는 지구도 포함된다." },
    for: { word:"for", tag:"[for + 목적격 + to부정사]", meaning:"'designed for us to evolve'에서 for us는 to evolve(진화하다)의 의미상 주어를 나타내요. '우리를 위해'라고 해석하기보다는 '우리가 진화하도록'이라고 통째로 해석하는 것이 자연스러워요.", ex:"The universe was not designed for us to evolve, we have no privileged position in the universe; however, the laws and constants of physics allowed advanced life to evolve.", exko:"우주는 우리가 진화하도록 설계된 것이 아니며, 우리는 우주에서 특별한 위치를 차지하고 있지 않다. 그러나 물리학의 법칙과 상수는 고등한 생명이 진화할 수 있게 해주었다." },
    ever: { word:"ever", tag:"[ever so slightly]", meaning:"'ever so slightly'는 '언제나'라는 뜻이 아니라 '아주 조금이라도'라는 뜻을 강조하는 관용 표현이에요. ever가 slightly(아주 조금)를 한층 더 강조해 준다고 생각하면 됩니다.", ex:"If the value of the electron had been ever so slightly larger or smaller, chemistry, as we know it, would not have been possible and life, which is based on organic chemistry, could not have started.", exko:"만약 전자의 값이 아주 조금이라도 더 크거나 작았다면, 우리가 아는 화학은 가능하지 않았을 것이고, 유기화학에 기반한 생명은 시작될 수 없었을 것이다." },
    values: { word:"values", tag:"[명사 · 의미 확인]", meaning:"values는 '가치관, 도덕적 가치'라는 뜻으로 흔히 쓰이지만, 여기 'precise forms and values'에서는 물리학의 '(수치상의) 값'을 뜻해요. 도덕적 가치가 아니라 물리량의 값이라는 점에 주의하세요.", ex:"The laws and constants of physics and the fundamental forces in our universe have very precise forms and values.", exko:"물리학의 법칙과 상수, 그리고 우리 우주의 기본적인 힘들은 매우 정밀한 형태와 값을 가지고 있다." }
  },
  passage: `The laws and [[constants::constants]] of physics and the [[fundamental::fundamental]] forces in our universe have very [[precise::precise]] forms and values. This means that, if they were only very slightly different, life would not have been possible. For instance, the precise value of [[gravity::gravity]] has enabled our universe to arise by [[permitting::permitting]] the aggregation of dust and gas particles to proto-stars around which planets later came to [[orbit::orbit]], including the Earth around the Sun. If the value of the [[electron::electron]] had been ever so slightly larger or smaller, chemistry, as we know it, would not have been possible and life, which is based on organic chemistry, could not have started. The universe was not designed for us to evolve, we have no [[privileged::privileged]] position in the universe; however, the laws and constants of physics allowed advanced life to evolve.`,
  translation: `물리학의 법칙과 상수, 그리고 우리 우주의 기본적인 힘들은 매우 정밀한 형태와 값을 가지고 있다. 이는 만약 그것들이 아주 조금만 달랐더라도 생명이 가능하지 않았을 것이라는 뜻이다. 예를 들어, 중력의 정밀한 값은 먼지와 기체 입자들이 원시별로 응집되는 것을 허용함으로써 우리 우주가 생겨날 수 있게 했고, 그 원시별 주위를 나중에 행성들이 돌게 되었으며, 여기에는 태양 주위를 도는 지구도 포함된다. 만약 전자의 값이 아주 조금이라도 더 크거나 작았다면, 우리가 아는 화학은 가능하지 않았을 것이고, 유기화학에 기반한 생명은 시작될 수 없었을 것이다. 우주는 우리가 진화하도록 설계된 것이 아니며, 우리는 우주에서 특별한 위치를 차지하고 있지 않다. 그러나 물리학의 법칙과 상수는 고등한 생명이 진화할 수 있게 해주었다.`,
  grammar: [
    { title:"가정법 과거완료: If + had p.p., would have p.p.", desc:"과거 사실과 반대되는 상상을 나타냅니다.", ex:"If the value had been different, life could not have started. (그 값이 달랐다면 생명은 시작될 수 없었을 것이다.)" },
    { title:"전치사 + 관계대명사 (around which)", desc:"'그 주위를'이라는 뜻으로 앞의 명사를 받아 자세히 설명합니다.", ex:"proto-stars around which planets came to orbit (행성들이 그 주위를 돌게 된 원시별들)" },

  ],

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'oct' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i) { current = i; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  render(); window.scrollTo({top:0, behavior:'smooth'});
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
render();
</script>
<script src="study-stats.js"></script>
<script type="module" src="firebase-sync.js"></script>
