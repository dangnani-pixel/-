    { qNum:17, question:"언급된 물건이 아닌 것은?",
      choices:["a notebook","a camera","a raincoat","a flashlight","a map"],
      answer:3, explanation:"노트, 카메라, 우비, 지도는 언급되었지만 손전등(a flashlight)은 언급되지 않았으므로 정답은 ④번입니다." }
  ]
}
];

let current = 0;
let currentRate = 1;

const realAudio = new Audio('https://wdown.ebsi.co.kr/W61001/01exam/20250903/go1/eng_1_mp3_821718YB.mp3');
realAudio.preload = 'none';

function formatTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function toggleRealAudio() {
  if (realAudio.paused) { realAudio.play(); } else { realAudio.pause(); }
}

function seekRealAudio(pct) {
  if (realAudio.duration) realAudio.currentTime = (pct / 100) * realAudio.duration;
}

realAudio.addEventListener('play', function() { document.getElementById('player-playbtn').textContent = '⏸️'; });
realAudio.addEventListener('pause', function() { document.getElementById('player-playbtn').textContent = '▶️'; });
realAudio.addEventListener('ended', function() { document.getElementById('player-playbtn').textContent = '▶️'; });
realAudio.addEventListener('loadedmetadata', function() {
  document.getElementById('time-total').textContent = formatTime(realAudio.duration);
});
realAudio.addEventListener('timeupdate', function() {
  var bar = document.getElementById('seek-bar');
  if (realAudio.duration) bar.value = (realAudio.currentTime / realAudio.duration) * 100;
  document.getElementById('time-current').textContent = formatTime(realAudio.currentTime);
});

function buildRateRow() {
  var rates = [0.5, 0.7, 1, 1.2, 1.5];
  document.getElementById('rate-row').innerHTML = rates.map(function(r) {
    return '<button class="rate-btn' + (r === 1 ? ' active' : '') + '" onclick="setRate(' + r + ', this)">' + r + '배</button>';
  }).join('');
}

function setRate(r, btnEl) {
  currentRate = r;
  realAudio.playbackRate = r;
  document.querySelectorAll('.rate-btn').forEach(function(b) { b.classList.remove('active'); });
  btnEl.classList.add('active');
}

function buildTabs() {
  var el = document.getElementById('problem-tabs');
  el.innerHTML = items.map(function(it, i) {
    return '<div class="p-tab" data-i="' + i + '" onclick="selectItem(' + i + ')">' + it.label + '</div>';
  }).join('');
}

const circled = ['①', '②', '③', '④', '⑤'];

function choiceLabel(c, i) {
  return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c;
}

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

let quizState = [];

function renderQuiz(it) {
  quizState = it.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = it.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var it = items[current];
  var q = it.questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var result = document.getElementById('qresult-' + qi);
  var isCorrect = quizState[qi].selected === q.answer;
  result.classList.add('show', isCorrect ? 'ok' : 'no');
  var head = isCorrect ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.';
  result.innerHTML = '<b>' + head + '</b><br>' + q.explanation;
  var btn = document.getElementById('qcheck-' + qi);
  btn.textContent = '다시 풀기';
  btn.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var it = items[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(it.questions[qi], qi);
  var result = document.getElementById('qresult-' + qi);
  result.classList.remove('show', 'ok', 'no');
  result.innerHTML = '';
  var btn = document.getElementById('qcheck-' + qi);
  btn.textContent = '정답 확인';
  btn.onclick = function() { checkAnswer(qi); };
}

function renderGiven(it) {
  var card = document.getElementById('given-card');
  if (it.image) {
    card.classList.add('show');
    card.innerHTML = '<img src="' + it.image + '" alt="문제 자료 그림">';
  } else if (it.table) {
    card.classList.add('show');
    var thead = '<tr>' + it.table.headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr>';
    var rows = it.table.rows.map(function(r) {
      return '<tr>' + r.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
    }).join('');
    card.innerHTML = '<table class="given-table">' + thead + rows + '</table>';
  } else {
    card.classList.remove('show');
    card.innerHTML = '';
  }
}

function render() {
  var it = items[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + items.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / items.length * 100) + '%';
  document.getElementById('type-badge').textContent = it.label + ' · ' + it.type;

  renderGiven(it);
  renderQuiz(it);

  document.getElementById('script-box').innerHTML = it.lines.map(function(l) {
    return '<div class="script-line"><span class="script-spk">' + l.spk + ':</span>' + l.text + '</div>';
  }).join('');
  document.getElementById('script-box').classList.remove('show');
  document.getElementById('btn-script').classList.remove('on');
  document.getElementById('btn-script').textContent = '📄 대본 보기';

  document.getElementById('translation-box').textContent = it.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 해석 보기';

  document.getElementById('vocab-list').innerHTML = it.vocab.map(function(v) {
    return '<div class="example-item"><div class="example-text"><div class="example-en">' + v.word + '</div><div class="example-pron">' + v.pron + ' ' + v.meaning + '</div><div class="example-ko">' + v.ex + '<br>' + v.ko + '</div></div><button class="example-speak" onclick="speak(\'' + v.word.replace(/'/g, "\\'") + '\')">🔊</button></div>';
  }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) {
    t.classList.toggle('active', i === current);
  });

  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === items.length - 1;
  document.getElementById('btn-next').textContent = current === items.length - 1 ? '처음으로' : '다음 문제 →';
}

function selectItem(i) {
  current = i;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function go(delta) {
  if (current === items.length - 1 && delta === 1) {
    current = 0;
  } else {
    current = Math.max(0, Math.min(items.length - 1, current + delta));
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleScript() {
  var box = document.getElementById('script-box');
  var btn = document.getElementById('btn-script');
  var show = !box.classList.contains('show');
  box.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '📄 대본 숨기기' : '📄 대본 보기';
}

function toggleTranslation() {
  var box = document.getElementById('translation-box');
  var btn = document.getElementById('btn-trans');
  var show = !box.classList.contains('show');
  box.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '🇰🇷 해석 숨기기' : '🇰🇷 해석 보기';
}

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var loadTtsVoices = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  loadTtsVoices();
  window.speechSynthesis.onvoiceschanged = loadTtsVoices;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var synth = window.speechSynthesis;
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  var voices = (ttsVoices && ttsVoices.length) ? ttsVoices : synth.getVoices();
  if (voices && voices.length) {
    var enVoice = voices.find(function(v) { return v.lang === 'en-US'; }) || voices.find(function(v) { return v.lang && v.lang.indexOf('en') === 0; });
    if (enVoice) utter.voice = enVoice;
  }
  synth.cancel();
  setTimeout(function() { synth.speak(utter); }, 80);
}

buildRateRow();
buildTabs();
render();
</script>
</body>
</html>
