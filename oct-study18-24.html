<script>
const problems = [
{
  num: 18, type: "글의 목적 파악",
  question: "다음 글의 목적으로 가장 적절한 것은?",
  choices: ["광고 공모전 참가를 독려하려고","고객 감사 행사 상품을 홍보하려고","여행 상품 이용 경험 공유를 요청하려고","여행 상품 일정 변경 사항을 공지하려고","우수 고객을 위한 추가 혜택을 안내하려고"],
  answer: 2,
  explanation: "'I would like to kindly ask if you would be willing to share a few words about your experience.'에서 여행 경험을 광고에 담기 위해 후기를 공유해 달라고 요청하고 있으므로 정답은 ③번입니다.",
  vocab: {
    appreciation: { word:"appreciation", pron:"[어프리시에이션]", meaning:"감사", ex:"I express our sincere appreciation.", exko:"진심 어린 감사를 표합니다." },
    loyalty: { word:"loyalty", pron:"[로열티]", meaning:"충성, 애용", ex:"Thank you for your continued loyalty.", exko:"계속 애용해 주셔서 감사합니다." },
    promotional: { word:"promotional", pron:"[프로모셔널]", meaning:"홍보의", ex:"This is part of a promotional campaign.", exko:"이것은 홍보 캠페인의 일부이다." },
    airing: { word:"airing", pron:"[에어링]", meaning:"방영하는", ex:"They will be airing an advertisement.", exko:"그들은 광고를 방영할 것이다." },
    valued: { word:"valued", pron:"[밸류드]", meaning:"소중한", ex:"You are one of our most valued clients.", exko:"당신은 우리의 가장 소중한 고객 중 한 분입니다." },
    willing: { word:"willing", pron:"[윌링]", meaning:"기꺼이 ~하는", ex:"Would you be willing to help?", exko:"기꺼이 도와주시겠어요?" },
    invaluable: { word:"invaluable", pron:"[인밸류어블]", meaning:"매우 귀중한", ex:"Your feedback would be invaluable.", exko:"당신의 의견은 매우 귀중할 것입니다." },
    contributions: { word:"contributions", pron:"[컨트리뷰션즈]", meaning:"기여, 도움", ex:"Thank you for your contributions.", exko:"도움을 주셔서 감사합니다." }
  },
  passage: `Dear Mr. Kelly,

My name is Mark Smith, and I am the manager of Lomos Tours. I express our sincere [[appreciation::appreciation]] for your continued trust and [[loyalty::loyalty]]. Next year, as part of a new [[promotional::promotional]] campaign, Lomos Tours will be [[airing::airing]] an advertisement. We plan to include the experiences of some of our most [[valued::valued]] clients. Since you traveled with us last summer, I would like to kindly ask if you would be [[willing::willing]] to share a few words about your experience. Your feedback would be [[invaluable::invaluable]] in helping us promote our services. A member of our team will be in touch with you shortly. Thank you in advance for your [[contributions::contributions]].

Warm regards,
Mark Smith`,
  translation: `Kelly 씨께,

제 이름은 Mark Smith이고, Lomos Tours의 관리자입니다. 계속해서 보내주신 신뢰와 애용에 진심으로 감사드립니다. 내년에 새로운 홍보 캠페인의 일환으로 Lomos Tours는 광고를 방영할 예정입니다. 저희는 가장 소중한 고객 몇 분의 경험을 광고에 담을 계획입니다. 지난여름 저희와 함께 여행하셨기에, 그 경험에 대해 몇 마디 나눠주실 의향이 있으신지 정중히 여쭙고 싶습니다. 귀하의 의견은 저희 서비스를 홍보하는 데 매우 귀중할 것입니다. 저희 팀원이 곧 연락드릴 예정입니다. 도움을 주셔서 미리 감사드립니다.

따뜻한 안부를 전하며,
Mark Smith 드림`,
  grammar: [
    { title:"ask if + 주어 + 동사 (~인지 묻다)", desc:"if절이 '~인지 아닌지'라는 뜻의 명사절로 쓰여 ask의 목적어가 됩니다.", ex:"I would like to ask if you would be willing. (당신이 기꺼이 해주실지 여쭙고 싶습니다.)" },
    { title:"be willing to + 동사원형", desc:"'기꺼이 ~하다'라는 뜻으로 상대의 의향을 물을 때 정중하게 쓰입니다.", ex:"Would you be willing to share your experience? (경험을 공유해 주실 의향이 있나요?)" },
    { title:"as part of + 명사 (~의 일환으로)", desc:"어떤 활동이 더 큰 계획의 일부임을 나타냅니다.", ex:"as part of a new promotional campaign (새로운 홍보 캠페인의 일환으로)" }
  ],
  tips: [
    "이메일·편지 유형은 'I would like to ask ~', 'I would like to request ~' 같은 요청 표현에 진짜 목적이 담깁니다.",
    "앞부분의 감사 인사는 예의상의 도입부일 뿐이니, 중반 이후 요청 문장을 찾으세요.",
    "선택지에 '홍보하려고'와 '요청하려고'가 함께 있으면, 글쓴이가 상대에게 무엇을 '부탁'하는지를 기준으로 고르세요."
  ]
},
{
  num: 19, type: "심경 변화 파악",
  question: "다음 글에 드러난 'I'의 심경 변화로 가장 적절한 것은?",
  choices: ["bored → surprised","confused → relieved","anxious → indifferent","joyful → regretful","hopeful → embarrassed"],
  answer: 1,
  explanation: "차가 사라져 'nothing made sense'라며 혼란스러워했지만, 남편의 말을 듣고 'With a sigh of relief'라며 안도했으므로 confused → relieved인 ②번이 정답입니다.",
  vocab: {
    headed: { word:"headed to", pron:"[헤디드 투]", meaning:"~로 향했다", ex:"I headed to the parking spot.", exko:"나는 주차 자리로 향했다." },
    spot: { word:"spot", pron:"[스팟]", meaning:"장소, 자리", ex:"This is the spot where I parked.", exko:"여기가 내가 주차한 자리이다." },
    made_sense: { word:"made sense", pron:"[메이드 센스]", meaning:"말이 되다, 이해가 되다", ex:"Nothing made sense to me.", exko:"나에게는 아무것도 이해가 되지 않았다." },
    missing: { word:"missing", pron:"[미싱]", meaning:"없어진, 사라진", ex:"My car is missing!", exko:"내 차가 없어졌어요!" },
    sigh_of_relief: { word:"sigh of relief", pron:"[사이 오브 릴리프]", meaning:"안도의 한숨", ex:"With a sigh of relief, I sat down.", exko:"안도의 한숨을 쉬며 나는 앉았다." },
    couldnt_help: { word:"couldn't help but", pron:"[쿠든트 헬프 벗]", meaning:"~하지 않을 수 없었다", ex:"I couldn't help but laugh.", exko:"나는 웃지 않을 수 없었다." },
    after_all: { word:"after all", pron:"[애프터 올]", meaning:"결국", ex:"Everything was fine after all.", exko:"결국 모든 것이 괜찮았다." },
    grocery_store: { word:"grocery store", pron:"[그로서리 스토어]", meaning:"식료품점", ex:"I walked out of the grocery store.", exko:"나는 식료품점에서 걸어 나왔다." }
  },
  passage: `After finishing my shopping, I walked out of the [[grocery_store::grocery store]] and [[headed::headed to]] the [[spot::spot]] where I'd parked my car. But it wasn't there. I wasn't the kind of person to forget where I'd parked. I knew I was in the right place — so where was my car? I looked around, but nothing [[made_sense::made sense]]. Not knowing what to do, I called my husband at home and said, "My car is [[missing::missing]]! I can't find my car." I heard him laughing on the other end of the line. "Your car is here outside the house! You took mine today, remember?" I turned around — and there it was. I [[couldnt_help::couldn't help but]] laugh at myself. With a [[sigh_of_relief::sigh of relief]], I walked over to the car. Everything was fine [[after_all::after all]].`,
  translation: `장을 다 보고 나서, 나는 식료품점을 나와 내가 차를 주차했던 자리로 향했다. 그런데 차가 거기 없었다. 나는 주차한 곳을 잊어버리는 그런 사람이 아니었다. 나는 내가 제대로 된 장소에 있다는 것을 알고 있었다 — 그런데 내 차는 어디에 있는 걸까? 주위를 둘러봤지만, 아무것도 이해가 되지 않았다. 어떻게 해야 할지 몰라서, 나는 집에 있는 남편에게 전화해서 말했다. "내 차가 없어졌어! 차를 못 찾겠어." 전화기 너머에서 그가 웃는 소리가 들렸다. "당신 차는 여기 집 앞에 있어! 오늘 내 차 가져갔잖아, 기억 안 나?" 나는 뒤를 돌아봤고 — 거기에 차가 있었다. 나는 스스로를 보고 웃지 않을 수 없었다. 안도의 한숨을 쉬며, 나는 차 쪽으로 걸어갔다. 결국 모든 것이 괜찮았다.`,

  passage: `Currently, urban [[regeneration::regeneration]] projects in [[degraded::degraded]] areas have been promoted as improving the wellbeing of residents and solving environmental [[injustice::injustice]] problems. However, such environmental improvements in [[ethnic::ethnic]] communities and/or low-income households can create an urban green space paradox. The creation of new, high-quality green spaces can increase [[attractiveness::attractiveness]], making these neighbourhood more desirable. By contrast, the cost of housing can rise, and residents may not be able to [[afford::afford]] the rent. This results in the exclusion or [[displacement::displacement]] of the poor neighbourhood's residents, who were intended to benefit from the ecosystem services provided by the new green space. In turn, the residents may only be able to afford to live in a similar degraded neighbourhood to the one they left, with low access to green [[infrastructure::infrastructure]].`,
  translation: `현재, 낙후된 지역의 도시 재생 사업은 주민들의 웰빙을 향상시키고 환경 불평등 문제를 해결하는 것으로 홍보되어 왔다. 그러나 소수 민족 공동체 그리고/또는 저소득 가구에서의 그러한 환경 개선은 '도시 녹지 공간의 역설'을 만들어낼 수 있다. 새롭고 질 높은 녹지 공간의 조성은 매력도를 높여, 이 동네들을 더 살고 싶은 곳으로 만들 수 있다. 반면에, 주거 비용이 오를 수 있고, 주민들은 임대료를 감당하지 못할 수도 있다. 이는 새로운 녹지 공간이 제공하는 생태계 서비스로부터 혜택을 받도록 의도되었던 가난한 동네 주민들이 배제되거나 쫓겨나는 결과를 낳는다. 결국, 그 주민들은 자신들이 떠나온 곳과 비슷한, 녹지 기반시설에 대한 접근성이 낮은 낙후된 동네에서 살 형편밖에 되지 않을 수 있다.`,

  passage: `An increasing [[awareness::awareness]] of our effect on the ocean is slowly [[seeping::seeping]] into the public agenda, dragging behind it a conversation that is decades [[overdue::overdue]]. But this conversation faces a massive [[obstacle::obstacle]]. It's almost impossible to discuss what to do about something changing if you don't initially know how it works. If a doctor tells a patient that they have a problem with their [[kidneys::kidneys]], the patient probably already has at least a [[vague::vague]] idea about where their kidneys are and what they're up to. They learned about that part of their own personal life-support system at school. But that's not the case for the oceans. When we see a news story about the long-term [[decline::decline]] in the numbers of krill in the Southern Ocean, it sounds generally like a bad thing. But there's far more to it than the risk of whales going hungry. Krill are a part of the ocean engine. We need to understand at least some of the [[context::context]] before we can discuss the change and take appropriate action.`,

  },
  passage: `Rome was said to have been a [[melting_pot::melting pot]] from the very start. The historian Livy claimed the city's original population was [[comprised::comprised of]] immigrants flooding in from all directions, attracted by Romulus's [[deliberate::deliberate]] policy of [[nondiscrimination::nondiscrimination]]. It was this initial openness, Livy [[asserts::asserts]], that laid the foundations for the later strength and success of the city. Romans described their city as multicultural in the generations after its foundation. Tradition held that only a minority of the city's legendary kings were Roman-born, with the others all arriving as immigrants before being chosen for the throne for their [[virtues::virtues]] and [[merits::merits]]. As the empire expanded across three continents, Rome eagerly adopted new cultural influences and [[absorbed::absorbed]] incoming groups — perhaps a little too eagerly for some, who, like the poet Juvenal, complained about the rapid rate of cultural change.`,
  translation: `로마는 아주 처음부터 용광로였다고 전해진다. 역사가 Livy는 그 도시의 초기 인구가 Romulus의 의도적인 무차별 정책에 이끌려 사방에서 밀려 들어온 이민자들로 구성되어 있었다고 주장했다. Livy가 단언하기를, 바로 이 초기의 개방성이 이후 그 도시의 힘과 성공의 토대를 놓았다는 것이다. 로마인들은 건국 이후 여러 세대에 걸쳐 자신들의 도시를 다문화적이라고 묘사했다. 전해지는 바에 따르면 그 도시의 전설적인 왕들 중 소수만이 로마 태생이었고, 나머지는 모두 이민자로 도착한 뒤 그들의 미덕과 공로로 왕좌에 선택되었다. 제국이 세 대륙에 걸쳐 확장되면서, 로마는 새로운 문화적 영향을 열렬히 받아들이고 유입되는 집단들을 흡수했다 — 어떤 이들에게는 아마도 조금 지나치게 열렬했을지도 모르는데, 시인 Juvenal 같은 이들은 급격한 문화 변화 속도에 대해 불평했다.`,
  grammar: [
    { title:"It was ~ that ... (강조구문)", desc:"강조하고 싶은 말을 It was와 that 사이에 넣어 강조합니다.", ex:"It was this initial openness that laid the foundations. (토대를 놓은 것은 바로 이 초기의 개방성이었다.)" },

  ],

    "강조구문(It was ~ that)에 담긴 문장이 주제문인 경우가 매우 많습니다.",

},

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'oct' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i) { current = i; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  render(); window.scrollTo({top:0, behavior:'smooth'});
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function showPlain(raw) {
  var clean = raw.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase(), p = problems[current];
  for (var k in p.vocab) { if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; } }
  activeVocabKey = null; currentSpeakWord = clean; activeSheetWord = lower;
  currentSheetWordData = { word:clean, pron:'', meaning:'뜻을 찾는 중...', en:'', ko:'' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = '';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower);
}

function lookupWord(lower) {
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      if (activeSheetWord !== lower) return;
      var e = d[0], ph = e.phonetic || '';
      if (!ph && e.phonetics) for (var i=0;i<e.phonetics.length;i++) if (e.phonetics[i].text) { ph = e.phonetics[i].text; break; }
      if (ph) document.getElementById('sheet-pron').textContent = ph;
      if (currentSheetWordData) currentSheetWordData.pron = ph;
      var m = e.meanings && e.meanings[0], def = m && m.definitions && m.definitions[0];
      if (def) {
        document.getElementById('sheet-example').innerHTML = (def.example ? def.example + '<br>' : '') + '(영영풀이) ' + def.definition;
        if (currentSheetWordData && def.example) currentSheetWordData.en = def.example;
      }
    }).catch(function(){});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (activeSheetWord !== lower) return;
      var ko = d && d.responseData && d.responseData.translatedText;
      var t = ko ? ko : '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
      document.getElementById('sheet-meaning').textContent = t;
      if (currentSheetWordData) { currentSheetWordData.meaning = t; currentSheetWordData.ko = ko || ''; }
    }).catch(function() {
      if (activeSheetWord !== lower) return;
      var t = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
      document.getElementById('sheet-meaning').textContent = t;
      if (currentSheetWordData) currentSheetWordData.meaning = t;
    });
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
render();
</script>
</body>
</html>
