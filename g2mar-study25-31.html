<script>
const problems = [
{
  num: 25, type: "도표의 내용 파악",
  question: "다음 도표의 내용과 일치하지 않는 것은?",
  choices: ["① In each year, the percentage of consumers who were likely to respond in an email was the highest among the four methods.","② In 2025, the percentages of consumers who were likely to respond to each review request method were the same except for those who were likely to respond in an email.","③ In 2024, consumers were more likely to respond to review requests made in person than to those made through social media.","④ The gap between the percentages of consumers who were likely to respond in an email and in person was smaller in 2024 than in 2023.","⑤ The percentages of the consumers who were likely to respond in a text message increased every year from 2023 to 2025."],
  answer: 3,
  explanation: "이메일과 대면 응답 의향 비율의 차이는 2023년에는 34-33=1%p였지만 2024년에는 32-28=4%p로 오히려 더 커졌으므로, '2024년이 2023년보다 작았다'는 ④번 설명이 도표와 일치하지 않습니다.",
  chart: `<div class="chart-title">The Percentages of Consumers in the U.S. Who Were Likely to Respond, by Review Request Methods</div>
<table class="chart-table"><tr><th>Method</th><th>2023</th><th>2024</th><th>2025</th></tr>
<tr><td>In an email</td><td>34</td><td>32</td><td>40</td></tr>
<tr><td>In person</td><td>33</td><td>28</td><td>27</td></tr>
<tr><td>Through social media</td><td>31</td><td>27</td><td>27</td></tr>
<tr><td>In a text message</td><td>23</td><td>25</td><td>27</td></tr>
</table>`,
  vocab: {
    respond: { word:"respond", pron:"[리스판드]", meaning:"응답하다", ex:"consumers who were likely to respond to review request methods", exko:"후기 요청 방식에 응답할 의향이 있는 소비자들" },
    except_for: { word:"except for", pron:"[익셉트 포]", meaning:"~을 제외하고", ex:"the percentages were the same except for those who responded in an email.", exko:"이메일에 응답한 사람들을 제외하고는 비율이 같았다." },
    gap: { word:"gap", pron:"[갭]", meaning:"차이, 격차", ex:"The gap between the two percentages was smaller in 2024.", exko:"두 비율 간의 차이는 2024년에 더 작았다." }
  },
  passage: `The graph above shows the percentages of consumers in the U.S. who were likely to [[respond::respond]] to four different review request methods in 2023, 2024, and 2025. ‹①In each year, the percentage of consumers who were likely to respond in an email was the highest among the four methods.› ‹②In 2025, the percentages of consumers who were likely to respond to each review request method were the same [[except_for::except for]] those who were likely to respond in an email.› ‹③In 2024, consumers were more likely to respond to review requests made in person than to those made through social media.› ‹④The [[gap::gap]] between the percentages of consumers who were likely to respond in an email and in person was smaller in 2024 than in 2023.› ‹⑤The percentages of the consumers who were likely to respond in a text message increased every year from 2023 to 2025.›`,
  translation: `위 그래프는 2023년, 2024년, 그리고 2025년에 네 가지 서로 다른 후기 요청 방식에 응답할 의향이 있는 미국 소비자들의 비율을 보여준다. 매년, 이메일에 응답할 의향이 있는 소비자들의 비율이 네 가지 방식 중 가장 높았다. 2025년에, 이메일에 응답할 의향이 있는 소비자들을 제외하고는 각 후기 요청 방식에 응답할 의향이 있는 소비자들의 비율이 같았다. 2024년에 소비자들이 소셜 미디어를 통해 이루어진 후기 요청보다 대면으로 이루어진 후기 요청에 응답할 의향이 더 있었다. 이메일에 응답할 의향이 있는 소비자들과 대면으로 응답할 의향이 있는 소비자들의 비율 간의 차이는 2023년보다 2024년에 더 작았다. 문자 메시지에 응답할 의향이 있는 소비자들의 비율은 2023년부터 2025년까지 매년 증가했다.`,
  grammar: [
    { title:"비교급 + than (~보다 더)", desc:"두 대상의 정도를 비교할 때 씁니다.", ex:"more likely to respond in person than through social media (소셜 미디어보다 대면으로 응답할 의향이 더 있는)" },
    { title:"except for (~을 제외하고)", desc:"전체 중 일부를 제외할 때 쓰는 표현입니다.", ex:"the same except for those who responded in an email (이메일 응답자를 제외하고는 동일한)" }
  ],
  tips: [
    "도표 문제는 각 선택지를 표의 실제 수치와 하나씩 직접 대조하세요.",
    "'~보다 작았다/컸다'처럼 두 수치의 차이를 비교하는 문장은 반드시 직접 뺄셈으로 검산하세요."
  ]
},
{
  num: 26, type: "내용 불일치",
  question: "Dennis William Sciama에 관한 다음 글의 내용과 일치하지 않는 것은?",
  choices: ["Malvern College에서 수학과 물리학 교육을 받았다.","1953년에 물리학 박사 학위를 취득했다.","자신의 견해를 바꾸어 Big Bang model에 반대했다.","실험 물리학에 대한 탁월한 기여로 Guthrie Medal을 받았다.","Stephen Hawking에 관한 영화에서 소개되었다."],
  answer: 2,
  explanation: "'he changed his view and accepted the Big Bang model'이라고 했으므로 Sciama는 빅뱅 모델에 반대한 것이 아니라 받아들인 것입니다. 따라서 일치하지 않는 것은 ③번입니다.",
  vocab: {
    take_over: { word:"take over", pron:"[테이크 오버]", meaning:"물려받다, 이어받다", ex:"Despite his father's wish for him to take over the family business.", exko:"가업을 물려받기를 바란 아버지의 뜻에도 불구하고." },
    pursue: { word:"pursue", pron:"[퍼수]", meaning:"추구하다", ex:"Sciama chose to continue pursuing his academic career.", exko:"Sciama는 자신의 학업을 계속 추구하는 것을 선택했다." },
    doctoral: { word:"doctoral", pron:"[닥터럴]", meaning:"박사의", ex:"He earned a doctoral degree in physics.", exko:"그는 물리학 박사 학위를 취득했다." },
    outstanding: { word:"outstanding", pron:"[아웃스탠딩]", meaning:"탁월한, 눈에 띄는", ex:"He was awarded the medal for outstanding contributions.", exko:"그는 탁월한 기여로 메달을 수여받았다." }
  },
  passage: `Dennis William Sciama was born in Manchester, England, in 1926. He received an education in mathematics and physics at Malvern College. Despite his father's wish for him to [[take_over::take over]] the family business, Sciama chose to continue [[pursue::pursuing]] his academic career. After earning a [[doctoral::doctoral]] degree in physics from the University of Cambridge in 1953, he became famous for his research on the universe. Early in his career, Sciama supported the steady-state theory, which argued that the universe had no beginning. However, when new evidence against the theory appeared in the 1960s, he changed his view and accepted the Big Bang model. In 1991, he was awarded the Guthrie Medal for [[outstanding::outstanding]] contributions to experimental physics by the British Institute of Physics. Sciama's role as a mentor became known even outside academic circles. Later, he was introduced in films about his most famous student, Stephen Hawking, which made Sciama known to a wider audience.`,
  translation: `Dennis William Sciama는 1926년에 잉글랜드(영국) Manchester에서 태어났다. 그는 Malvern College에서 수학과 물리학 교육을 받았다. 아버지가 가업을 물려받기를 바랐음에도 불구하고, Sciama는 자신의 학업을 계속 추구하는 것을 선택했다. 1953년에 University of Cambridge에서 물리학 박사 학위를 취득한 후에, 그는 우주에 관한 연구로 유명해졌다. 그의 경력 초기에, Sciama는 정상 우주론을 지지했는데, 그것(이론)은 우주에는 시작이 없었다고 주장하였다. 그러나, 1960년대에 그 이론에 반하는 새로운 증거가 나타났을 때, 그는 자신의 견해를 바꾸어 빅뱅 모델(Big Bang model)을 받아들였다. 1991년에, 그는 British Institute of Physics로부터 실험 물리학에 대한 탁월한 기여로 Guthrie Medal을 받았다. 멘토로서의 Sciama의 역할은 학계 밖에서도 알려지게 되었다. 후에, 그는 자신의 가장 유명한 제자였던 Stephen Hawking에 관한 영화에서 소개되었고, 이는 Sciama를 더 많은 대중에게 알려지도록 만들었다.`,
  grammar: [

  answer: 3,
  explanation: "'The development of a true piano factory ④occurring first in the United States'에서 문장에 본동사가 없으므로, occurring을 본동사 occurred로 고쳐야 합니다. 따라서 어법상 틀린 것은 ④번입니다.",

    apprentice: { word:"apprentice", pron:"[어프렌티스]", meaning:"견습생", ex:"most piano shops used an apprentice system", exko:"대부분의 피아노 가게들은 견습생 제도를 사용했다" },
    specialist: { word:"specialist", pron:"[스페셜리스트]", meaning:"전문가", ex:"The larger piano shops did have specialists.", exko:"더 큰 피아노 가게들은 전문가를 확실히 두고 있었다." },

    casting: { word:"casting", pron:"[캐스팅]", meaning:"주조", ex:"One of the factories had its own iron casting facility.", exko:"한 공장은 자체 철 주조 시설을 가지고 있었다." }
  },
  passage: `The Industrial Revolution did more than just invent new materials or machines. It invented a new [[process::process]] for manufacturing: the modern factory. Prior to around 1850, most piano shops used an [[apprentice::apprentice]] system ‹①in which› a master builder taught younger workers the skills of the trade, usually over the course of many years. The larger piano shops ‹②did› have [[specialist::specialists]] — for example, one person who specialized in soundboards, another who made hammers, and so on. But even the largest piano makers of that time produced no more than 5-10 pianos per year per worker, as pianos were still ‹③made› essentially one at a time. The development of a true piano factory ‹④occurring› first in the United States, led by Jonas Chickering in Boston and later the Steinway family in New York City. These factories led to improvements in both [[efficiency::efficiency]] and quality. For example, one of the factories of the time had ‹⑤its› own iron [[casting::casting]] facility where it made its metal plates, which were thought to be the best available.`,
  translation: `산업 혁명은 단순히 새로운 재료나 기계를 만들어내는 것 이상이었다. 그것은 제조의 새로운 '과정', 즉 현대적인 공장을 발명했다. 1850년경 이전에, 대부분의 피아노 가게들은 견습생 제도를 사용했는데, 이는 숙련된 제작자가 젊은 노동자들에게 대개 수년에 걸쳐 그 업계의 기술을 가르치는 것이었다. 더 큰 피아노 가게들은 전문가를 확실히 두고 있었는데 — 예를 들어, 소리판을 전문으로 하는 한 사람, 망치를 만드는 또 다른 사람 등이 있었다. 하지만 그 당시 가장 큰 피아노 제작자들조차도 노동자 한 명당 연간 5~10대 이상의 피아노를 만들어내지 못했는데, 피아노가 여전히 본질적으로 한 번에 하나씩 만들어졌기 때문이다. 진정한 피아노 공장의 발전은 미국에서 처음 일어났는데, 보스턴의 Jonas Chickering이 이끌었고 후에 뉴욕시의 Steinway 가문이 이끌었다. 이 공장들은 효율성과 품질 모두의 향상으로 이어졌다. 예를 들어, 당시의 한 공장은 금속판을 만드는 자체 철 주조 시설을 가지고 있었고, 이것은 구할 수 있는 것 중 최고로 여겨졌다.`,
  grammar: [

{

  answer: 2,
  explanation: "논문 기반 박사 과정의 단일한 연구 초점은 학생들이 다양한 진로에 적응하는 능력을 촉진하는(facilitating) 것이 아니라 저해하는(hindering) 것이 문맥상 자연스러우므로, 낱말 쓰임이 적절하지 않은 것은 ③번입니다.",
  vocab: {
    thorough: { word:"thorough", pron:"[써로우]", meaning:"철저한", ex:"This allows for thorough exploration and understanding.", exko:"이것은 철저한 탐구와 이해를 가능하게 한다." },
    absorbed_in: { word:"absorbed in", pron:"[업소어브드 인]", meaning:"~에 몰두한", ex:"As students become deeply absorbed in their research", exko:"학생들이 자신의 연구에 깊이 몰두함에 따라" },
    breadth: { word:"breadth", pron:"[브레드쓰]", meaning:"폭, 너비", ex:"This may limit the breadth of knowledge and skills.", exko:"이것은 지식과 기술의 폭을 제한할 수 있다." },
    transferable: { word:"transferable", pron:"[트랜스퍼러블]", meaning:"전이 가능한", ex:"training in transferable skills", exko:"전이 가능한 기술에 대한 훈련" }
  },
  passage: `In a thesis-based doctoral programme, students typically spend a significant amount of time and effort researching a specific topic. While this deep dive into a particular area allows for ‹①thorough› exploration and understanding, it can also result in narrowing the focus. As students become deeply [[absorbed_in::absorbed in]] their research, they may spend ‹②less› time exploring related fields or acquiring skills outside their immediate area of study. Consequently, this singular focus may limit the [[breadth::breadth]] of knowledge and skills developed during the programme, potentially ‹③facilitating› students' ability to adapt to diverse career paths or address interdisciplinary challenges. Some universities in Europe have ‹④recognised› the limitations of traditional thesis-based doctoral programmes and have started to implement more structured approaches. These structured programmes often combine research with coursework and training in ‹⑤transferable› skills. By incorporating coursework, seminars, workshops and internships into the curriculum, they aim to provide students with a broader skill set and better prepare them for a variety of career paths beyond academia.`,
  translation: `논문 기반 박사 과정에서는, 학생들은 일반적으로 특정 주제를 연구하는 데 상당한 시간과 노력을 들인다. 특정 분야에 이처럼 깊이 몰두하는 것은 철저한 탐구와 이해를 가능하게 하지만, 이것은 또한 초점을 좁히는 결과를 가져올 수도 있다. 학생들이 자신의 연구에 깊이 몰두함에 따라, 그들은 관련 분야를 탐색하거나 자신의 연구 분야 밖의 기술을 습득하는 데는 더 적은 시간을 보내게 될 수도 있다. 결과적으로, 이러한 단일한 초점은 과정 동안 개발되는 지식과 기술의 폭을 제한할 수 있고, 잠재적으로 학생들이 다양한 진로에 적응하거나 학제 간 도전 과제를 처리하는 능력을 촉진할(→저해할) 수 있다. 유럽의 몇몇 대학들은 전통적인 논문 기반 박사 과정의 한계를 인식하게 되어 더 구조화된 접근을 시행하기 시작했다. 이러한 구조화된 과정은 흔히 연구와 전이 가능한 기술에 대한 수업 및 훈련을 결합한다. 수업, 세미나, 워크숍, 인턴십을 교육 과정에 통합함으로써, 이 과정들은 학생들에게 더 폭넓은 기술 세트를 제공하고 학계를 넘어 다양한 진로에 더 잘 대비시키는 것을 목표로 한다.`,
  grammar: [
    { title:"현재완료 have + p.p.", desc:"과거에 시작되어 현재까지 이어지는 인식·경험을 나타냅니다.", ex:"Some universities in Europe have recognised the limitations. (유럽의 몇몇 대학들은 한계를 인식해 왔다.)" },
    { title:"by + 동명사 (수단)", desc:"'~함으로써'라는 뜻으로 방법을 나타냅니다.", ex:"By incorporating coursework, seminars, workshops and internships (수업·세미나·워크숍·인턴십을 통합함으로써)" }
  ],
  tips: [
    "어휘 문맥 문제는 글의 논리 흐름과 반대로 쓰인 단어를 찾는 것이 핵심입니다.",
    "'초점을 좁히는 것의 부정적 결과'를 이야기하는 문맥에서 '능력을 촉진한다'는 흐름과 어긋납니다."
  ]
},
{
  num: 31, type: "빈칸 추론",
  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
  choices: ["emotion","curiosity","familiarity","memory","ignorance"],
  answer: 0,
  explanation: "아이들은 괴물이 실제가 아님을 알면서도(인지적으로는 이해하면서도) 두려움이라는 감정 때문에 상상과 현실을 구분하는 이해의 '표현'이 방해받는다는 내용이 이어지므로, 빈칸에는 ①번 emotion이 가장 적절합니다.",

    imaginary: { word:"imaginary", pron:"[이매지너리]", meaning:"상상의", ex:"Children understand that imaginary objects do not come to life.", exko:"아이들은 상상의 사물이 살아나지 않는다는 것을 이해한다." },
    disrupt: { word:"disrupt", pron:"[디스럽트]", meaning:"방해하다", ex:"Emotion can sometimes disrupt this understanding.", exko:"감정은 때때로 이러한 이해를 방해할 수 있다." },
    causal_relation: { word:"causal relation", pron:"[코절 릴레이션]", meaning:"인과 관계", ex:"their understanding of the causal relations between imagination and reality", exko:"상상과 현실 간의 인과 관계에 대한 그들의 이해" },
    avoidance: { word:"avoidance", pron:"[어보이던스]", meaning:"회피", ex:"They exhibited fear and avoidance of it.", exko:"그들은 그것에 대한 두려움과 회피를 보였다." }
  },
  passage: `Research shows that, by age three, children understand that [[imaginary::imaginary]] objects do not come to life. This is especially clear with respect to everyday objects — children know that even though they imagine a pencil in an empty box, the box will remain empty. However, ___________ can sometimes [[disrupt::disrupt]] this understanding, or at least its expression. That is, even though a child knows that monsters are not real, the thought of a monster under a bed might be enough to make a child refuse to go into his room at night. Indeed, research shows that children have a more difficult time displaying their understanding of the [[causal_relation::causal relations]] between imagination and reality when they are asked to pretend or imagine scary things, like monsters. In one study, preschool children were shown an empty box and were asked to imagine a monster inside. All children agreed that the box was empty. However, when they were left alone with the box they exhibited fear and [[avoidance::avoidance]] of it.`,
  translation: `연구에서는 아이들이 세 살이 되면, 상상의 사물이 살아나서 움직이지 않는다는 것을 이해한다는 것을 보여준다. 이는 일상적인 사물에 관해 특히 명백하다. 즉, 아이가 빈 상자 안에 연필을 상상하더라도, 상자는 여전히 비어 있을 것임을 안다. 그러나, 감정은 때때로 이러한 이해를, 혹은 적어도 그 표현을 방해할 수 있다. 즉, 비록 아이가 괴물이 실제가 아니라는 것을 안다고 하더라도, 침대 밑에 괴물이 있을 거라는 생각만으로도 아이가 밤에 자기 방에 들어가기를 거부하도록 만들기에 충분할 수 있다. 실제로, 아이들이 괴물과 같이 무서운 것을 가장하거나 상상하도록 요청받을 때 상상과 현실 간의 인과 관계에 대한 이해를 드러내는 데 더 어려움을 겪는다는 것을 연구에서 보여준다. 한 연구에서, 유치원생들은 빈 상자를 보고 그 안에 괴물을 상상해 보라는 요청을 받았다. 모든 아이들은 그 상자가 비어 있다는 데 동의했다. 그러나, 그들이 상자와 함께 혼자 남겨졌을 때 그들은 그것(상자)에 대한 두려움과 회피를 보였다.`,
  grammar: [
    { title:"even though + 절 (양보)", desc:"'비록 ~일지라도'라는 뜻으로 뒤에 완전한 절이 옵니다.", ex:"even though a child knows that monsters are not real (비록 아이가 괴물이 실제가 아니라는 것을 알지라도)" },
    { title:"make + 목적어 + 동사원형 (사역)", desc:"'~가 …하게 만들다'라는 뜻입니다.", ex:"enough to make a child refuse to go into his room (아이가 방에 들어가기를 거부하게 만들기에 충분한)" }
  ],
  tips: [
    "빈칸 문제는 빈칸 뒤에 이어지는 예시(괴물을 무서워하는 아이)가 빈칸 단어의 근거가 됩니다.",
    "'알고 있다(인지)'와 '두려워한다(감정)'가 대비되는 구조임을 파악하면 정답을 쉽게 찾을 수 있습니다."
  ]

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g2mar' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  document.getElementById('chart-area').innerHTML = p.chart || '';
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i, skipHistory) {
  current = i; render(); window.scrollTo({top:0, behavior:'smooth'});
  if (!skipHistory) { var h = '#p' + current; if (location.hash !== h) history.pushState({pIdx:current}, '', h); }
}
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  selectProblem(current);
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
