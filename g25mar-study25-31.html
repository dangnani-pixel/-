<script>
const problems = [
{
  num: 25, type: "도표의 내용 파악",
  question: "다음 도표의 내용과 일치하지 않는 것은?",
  choices: ["① In Germany, recreational purpose accounted for the highest percentage of reasons for E-bike purchase, which was also the case in the Netherlands and Belgium.","② In Austria, the percentage of sporting activity was the highest at 41%, which was three times higher than that of commute to work.","③ Switzerland was the only country where the percentage of recreational purpose was below 30%.","④ The gap between the percentage of recreational purpose and that of sporting activity was smaller in Germany than in the Netherlands.","⑤ The Netherlands and Belgium showed the same ranking order for reasons for E-bike purchase, where recreational purpose ranked first, followed by commute to work, while sporting activity ranked lowest."],
  answer: 1,
  explanation: "오스트리아에서 스포츠 활동을 이유로 든 비율(41%)은 통근(18%)의 세 배(54%)보다 낮으므로, '세 배 더 높다'는 ②번 설명이 도표와 일치하지 않습니다.",
  chart: `<div class="chart-title">Primary Reasons for E-bike Purchase in European Countries, 2022</div>
<table class="chart-table"><tr><th>Country</th><th>Recreational Purpose</th><th>Sporting Activity</th><th>Commute to Work</th></tr>
<tr><td>Germany</td><td>33%</td><td>27%</td><td>22%</td></tr>
<tr><td>Austria</td><td>31%</td><td>41%</td><td>18%</td></tr>
<tr><td>Switzerland</td><td>22%</td><td>31%</td><td>34%</td></tr>
<tr><td>Netherlands</td><td>36%</td><td>12%</td><td>30%</td></tr>
<tr><td>Belgium</td><td>33%</td><td>18%</td><td>31%</td></tr>
</table>`,
  vocab: {
    primary: { word:"primary", pron:"[프라이머리]", meaning:"주요한", ex:"Primary Reasons for E-bike Purchase in European Countries", exko:"유럽 국가의 전기 자전거 구매 주요 이유" },
    recreational: { word:"recreational", pron:"[레크리에이셔널]", meaning:"레크리에이션의, 오락의", ex:"recreational purpose accounted for the highest percentage", exko:"레크리에이션 목적이 가장 높은 비율을 차지했다" },
    commute: { word:"commute", pron:"[커뮤트]", meaning:"통근(하다)", ex:"followed by commute to work", exko:"그 뒤를 통근이 이었다" },
    account_for: { word:"account for", pron:"[어카운트 포]", meaning:"차지하다, 설명하다", ex:"recreational purpose accounted for the highest percentage of reasons", exko:"레크리에이션 목적이 이유 중 가장 높은 비율을 차지했다" },
    ranking: { word:"ranking order", pron:"[랭킹 오더]", meaning:"순위", ex:"showed the same ranking order for reasons for E-bike purchase", exko:"전기 자전거 구매 이유에 대해 같은 순위를 보였다" }
  },
  passage: `The graph above shows the percentages of the [[primary::primary]] reasons for E-bike purchase in five European countries in 2022. ‹①In Germany, [[recreational::recreational]] purpose [[account_for::accounted for]] the highest percentage of reasons for E-bike purchase, which was also the case in the Netherlands and Belgium.› ‹②In Austria, the percentage of sporting activity was the highest at 41%, which was three times higher than that of [[commute::commute]] to work.› ‹③Switzerland was the only country where the percentage of recreational purpose was below 30%.› ‹④The gap between the percentage of recreational purpose and that of sporting activity was smaller in Germany than in the Netherlands.› ‹⑤The Netherlands and Belgium showed the same [[ranking::ranking order]] for reasons for E-bike purchase, where recreational purpose ranked first, followed by commute to work, while sporting activity ranked lowest.›`,
  translation: `위 그래프는 2022년 다섯 개 유럽 국가에서의 전기 자전거 구매의 주요 이유의 비율을 보여 준다. 독일에서는, 레크리에이션 목적이 전기 자전거 구매 이유 중 가장 높은 비율을 차지했는데, 이는 네덜란드와 벨기에에서도 마찬가지였다. 오스트리아에서는, 스포츠 활동의 비율이 41%로 가장 높았는데, 이것은 통근의 비율보다 세 배 더 높았다. 스위스는 레크리에이션 목적의 비율이 30%보다 낮은 유일한 국가였다. 레크리에이션 목적의 비율과 스포츠 활동의 비율 간의 차이는 네덜란드에서보다 독일에서 더 작았다. 네덜란드와 벨기에는 전기 자전거 구매 이유에 대해 같은 순위를 보였는데, 레크리에이션 목적이 1위, 통근이 그 뒤를 이었으며, 스포츠 활동이 가장 낮은 순위였다.`,
  grammar: [
    { title:"which was also the case in ~ (계속적 용법)", desc:"'~에서도 마찬가지였다'라는 뜻입니다.", ex:"which was also the case in the Netherlands and Belgium (이는 네덜란드와 벨기에에서도 마찬가지였다)" },
    { title:"배수 비교 (three times higher than)", desc:"'~보다 세 배 더 높은'이라는 배수 비교 표현입니다.", ex:"three times higher than that of commute to work (통근의 비율보다 세 배 더 높은)" }
  ],
  tips: [
    "도표 문제는 각 선택지의 수치를 표와 하나씩 직접 대조하세요.",
    "'몇 배 더 높다/낮다'는 표현은 반드시 실제로 곱해서 검산하세요."
  ]
},
{
  num: 26, type: "내용 불일치",
  question: "Friedrich Mohs에 관한 다음 글의 내용과 일치하지 않는 것은?",
  choices: ["어린 시절 과학에 뚜렷한 흥미를 보였다.","University of Halle에서 화학, 수학, 물리학을 공부했다.","전통적인 방식을 따르는 많은 광물학자들과 협력했다.","1812년에 Joanneum의 광물학 교수로 임명되었다.","이탈리아에서 66세의 나이로 사망했다."],
  answer: 2,
  explanation: "'This new classification system of his led to conflicts with many mineralogists who followed the conventional methods.'라고 했으므로 Mohs는 전통적인 방식을 따르는 광물학자들과 협력한 것이 아니라 갈등을 겪었습니다. 따라서 일치하지 않는 것은 ③번입니다.",
  vocab: {
    mineralogist: { word:"mineralogist", pron:"[미너랄러지스트]", meaning:"광물학자", ex:"Friedrich Mohs, a well-known mineralogist", exko:"잘 알려진 광물학자인 Friedrich Mohs" },
    marked: { word:"marked", pron:"[마크트]", meaning:"뚜렷한, 현저한", ex:"He displayed a marked interest in science at an early age.", exko:"그는 어린 시절 과학에 뚜렷한 흥미를 보였다." },
    mineralogy: { word:"mineralogy", pron:"[미너랄러지]", meaning:"광물학", ex:"he also studied mineralogy at the Mining Academy", exko:"그는 또한 Mining Academy에서 광물학을 공부했다" },
    classify: { word:"classified", pron:"[클래시파이드]", meaning:"분류했다", ex:"he went to Austria and classified minerals by their physical attributes", exko:"그는 오스트리아로 가서 물리적 속성에 따라 광물을 분류했다" },
    attribute: { word:"attributes", pron:"[애트리뷰츠]", meaning:"속성, 특징", ex:"classified minerals by their physical attributes", exko:"물리적 속성에 따라 광물을 분류했다" },
    conventional: { word:"conventional", pron:"[컨벤셔널]", meaning:"전통적인, 관습적인", ex:"many mineralogists who followed the conventional methods", exko:"전통적인 방식을 따르는 많은 광물학자들" },
    appoint: { word:"appointed", pron:"[어포인티드]", meaning:"임명했다", ex:"Mohs was appointed Professor of Mineralogy at the Joanneum.", exko:"Mohs는 Joanneum의 광물학 교수로 임명되었다." }

  passage: `Friedrich Mohs, a well-known [[mineralogist::mineralogist]], was born on January 29, 1773, in Gernrode, Germany. He displayed a [[marked::marked]] interest in science at an early age. He studied chemistry, mathematics, and physics at the University of Halle and also studied [[mineralogy::mineralogy]] at the Mining Academy. In his late twenties, he went to Austria and [[classify::classified]] minerals by their physical [[attribute::attributes]]. This new classification system of his led to conflicts with many mineralogists who followed the [[conventional::conventional]] methods. In 1812, Mohs was [[appoint::appointed]] Professor of Mineralogy at the Joanneum, where he developed the Mohs Scale of Mineral Hardness. Mohs ended his remarkable career at the Mining University in Leoben and died at the age of 66 in Italy.`,
  translation: `잘 알려진 광물학자인 Friedrich Mohs는 1773년 1월 29일 독일의 Gernrode에서 태어났다. 그는 어린 시절 과학에 뚜렷한 흥미를 보였다. 그는 University of Halle에서 화학, 수학, 물리학을 공부했고, 또한 Mining Academy에서 광물학을 공부했다. 20대 후반에, 그는 오스트리아로 가서 물리적 속성에 따라 광물을 분류했다. 그의 이러한 새로운 분류 체계는 전통적인 방식을 따르는 많은 광물학자들과의 갈등으로 이어졌다. 1812년에, Mohs는 Joanneum의 광물학 교수로 임명되었고, 그곳에서 모스 굳기계를 개발했다. 그는 Leoben의 Mining University에서 그의 훌륭한 경력을 마무리했고 이탈리아에서 66세의 나이로 사망했다.`,

  },
  passage: `The [[prominence::prominence]] of the social dimension in food writing might suggest that the flavor of food is taking a back seat. I suspect ‹①that› most people view flavor as of secondary importance in social settings where food is served. Although our social gatherings [[coalesce::coalesce]] around food, the meaning of these gatherings does not seem to depend on flavor. Flavor ‹②assisting› with the narrow purpose of filling the belly, and once that is accomplished it provides the [[backdrop::backdrop]] for whatever social dynamics characterize the gathering. These can be understood independently of the flavor of the food on offer, the appreciation of ‹③which› is understood to be personal and [[subjective::subjective]]. According to this conventional wisdom, the ceremonies and [[ritual::rituals]] around food, the social events that supply food with its meaning, ‹④does› not depend on the quality of sensations provided by the food. To focus ‹⑤excessively› on flavor is to miss the larger significance of these social relations.`,
  translation: `음식에 관한 글에서 사회적 측면이 부각되는 것은 음식의 맛이 뒷전으로 밀려나 있음을 시사할지도 모른다. 나는 대부분의 사람들이 음식이 제공되는 사교적 상황에서 맛을 부수적인 중요성을 띤 것으로 여긴다고 생각한다. 우리의 사교 모임이 음식을 중심으로 모이더라도, 이러한 모임의 의미는 맛에 의존하지 않는 듯하다. 맛은 배를 채운다는 좁은(의미의) 목적에 도움이 되고, 그 목적이 달성되면 (맛은) 모임을 특징짓는 사회적 역학 관계가 어떤 것이든 간에 그 배경을 제공한다. 이(사회적 역학 관계)는 음식의 맛과는 별개로 이해될 수 있으며, 그것(음식의 맛)에 대한 감상은 개인적이고 주관적인 것으로 이해된다. 이러한 통념에 따르면, 음식을 중심으로 한 의식과 의례, 즉 음식에 의미를 부여하는 사교 행사는, 음식이 제공하는 감각의 질에 의존하지 않는다. 맛에 지나치게 집중하는 것은 이러한 사회적 관계의 더 큰 중요성을 놓치는 것이다.`,

  passage: `There are reasons why science is not fully trusted and why healthy [[skepticism::skepticism]] and critical thinking are essential. In spite of professional standards, claims of objectivity, and the peer review process, the conduct of science can be ‹①biased›. All experts are not the same, nor do they submit their work to the same [[scrutiny::scrutiny]]. Knowing the source of funding can be ‹②important› in evaluating scientific claims. For example, the Harvard researchers who made claims in the late 1960s about the problems with dietary fat, leading the nation away from perceiving sugar as one of the main causes in health problems, were funded in part by the sugar industry. The authors did not reveal their funding source to the New England Journal of Medicine, where their ‹③influential› article appeared. Their article shaped a generation of changes in eating patterns that appears to have ‹④discouraged› higher use of sugar, now widely [[implicate::implicated]] as a source of the rise in obesity and diabetes. Stories such as this one fuel suspicion — but also lead to further safeguards in the scientific process. Funding ‹⑤disclosures›, although not required five decades ago, have since been made [[compulsory::compulsory]].`,

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null, selectedChoice = null, answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g25mar' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {

}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

function renderQuiz(p) {
  selectedChoice = null; answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '정답 확인'; b.onclick = checkAnswer;
  var r = document.getElementById('quiz-result');
  r.classList.remove('show','ok','no'); r.innerHTML = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) { el.classList.toggle('selected', idx === i); });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) { document.getElementById('quiz-q').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var r = document.getElementById('quiz-result');
  var ok = selectedChoice === p.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {

  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
