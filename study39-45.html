<script>
const problems = [
{
  num: "39", label: "39번", type: "문장 삽입",
  note: "A person who always tries to prevent harm but never does, is not generally thought of as morally good.",
  noteKo: "항상 해를 막으려 하지만 결코 그렇게 하지 못하는 사람은 일반적으로 도덕적으로 선하다고 여겨지지 않는다.",
  noteLabel: "📌 삽입할 문장",
  vocab: {
    morally: { word:"morally", pron:"[모럴리]", meaning:"도덕적으로", ex:"Act morally in all situations.", exko:"모든 상황에서 도덕적으로 행동해라.", etym:"mor(관습, 도덕; Latin mos/moralis) + ally → '도덕에 따라' → '도덕적으로'. 관련 단어: moral(도덕적인), morale(사기), demoralize(de-떨어뜨려 + moral → 사기를 꺾다)." },
    significantly: { word:"significantly", pron:"[시그니피컨틀리]", meaning:"훨씬, 상당히", ex:"Prices increased significantly.", exko:"가격이 상당히 올랐다.", etym:"sign(표시; Latin signum) + ific + ant + ly → '표시할 만큼 두드러지게' → '훨씬, 상당히'. 같은 sign 어근: signal(신호), signify(sign + fy → 의미하다), design(de-+sign → 설계하다)." },
    intentions: { word:"intentions", pron:"[인텐션즈]", meaning:"의도들", ex:"Good intentions are important.", exko:"좋은 의도가 중요하다.", etym:"in-(안으로) + tend(뻗다; Latin tendere) + ion → '마음을 안으로 뻗음' → '의도'. 같은 tend 어근: attend(참석하다), extend(연장하다), pretend(pre-미리 + tend → ~인 척하다)." },
    motives: { word:"motives", pron:"[모티브즈]", meaning:"동기", ex:"Her motives were unclear.", exko:"그녀의 동기는 불분명했다.", etym:"mot(움직이다; Latin movere) + ive → '움직이게 하는 것' → '동기'. 같은 mot/mov 어근: motion(움직임), promote(pro-앞으로 + mot → 촉진하다), remove(re-다시 + mov → 제거하다)." },
    relevant: { word:"relevant", pron:"[렐러번트]", meaning:"관련 있는", ex:"That information is not relevant.", exko:"그 정보는 관련이 없다.", etym:"re-(다시) + lev(들어올리다; Latin levare) + ant → '다시 들어 관련짓는' → '관련 있는'. 같은 lev 어근: elevate(e-위로 + lev → 끌어올리다), alleviate(al-~쪽으로 + lev → 가볍게 하다, 완화하다)." },
    unintentionally: { word:"unintentionally", pron:"[언인텐셔널리]", meaning:"의도치 않게", ex:"He unintentionally offended her.", exko:"그는 의도치 않게 그녀를 기분 상하게 했다.", etym:"un-(부정) + in-(안으로) + tend(뻗다; Latin tendere) + ionally → '의도를 뻗지 않은 채로' → '의도치 않게'. 같은 tend 어근: extend(연장하다), attend(참석하다), intend(의도하다)." },
    consequences: { word:"consequences", pron:"[컨시퀀시즈]", meaning:"결과", ex:"Actions have consequences.", exko:"행동에는 결과가 따른다.", etym:"con-(함께) + sequ(따르다; Latin sequi) + ence → '뒤따라오는 것' → '결과'. 같은 sequ 어근: subsequent(sub-바로 뒤에 + sequ → 그 다음의), sequence(순서), pursue(pro-앞으로 + sequ → 추구하다)." },
    regarded: { word:"regarded as", pron:"[리가딛 애즈]", meaning:"~로 여겨지는", ex:"She is regarded as an expert.", exko:"그녀는 전문가로 여겨진다.", etym:"re-(다시) + gard(보다, 지키다; 고대 프랑스어 garder) → '되돌아보다' → '~로 여기다'. 같은 gard 어근: regard(여기다, 존중하다), guard(지키다), reward(re-다시 + ward(보다) → 보상하다)." }
  },
  funcWords: {
    one: { word:"one", tag:"[대명사 one · 사람]", meaning:"one은 숫자 '하나'가 아니라 앞에 나온 person을 대신하는 대명사로 '사람'이라는 뜻이에요. is one who does는 '~하는 사람이다'라고 해석해요.", ex:"A morally good person is one who does morally bad actions significantly less often than most and does morally good ones significantly more often than most.", exko:"도덕적으로 좋은 사람은 대부분의 사람들보다 훨씬 드물게 도덕적으로 나쁜 행동을 하고, 대부분의 사람들보다 훨씬 자주 도덕적으로 좋은 행동을 하는 사람이다." },
    who: { word:"who", tag:"[관계대명사 who · 주격]", meaning:"who는 A person을 선행사로 받는 주격 관계대명사예요. A person who unintentionally prevents harm ~은 '의도치 않게 해를 막는 사람'이라고 해석해요.", ex:"A person who unintentionally prevents harm to others and does not harm them simply because things do not turn out as she intends is not morally good.", exko:"의도치 않게 다른 사람에게 해를 끼치는 것을 막고, 단지 자신이 의도한 대로 일이 되지 않아서 그들에게 해를 끼치지 않는 사람은 도덕적으로 선한 것이 아니다." },
    as: { word:"as", tag:"[접속사 as · ~하는 대로]", meaning:"as she intends는 '그녀가 의도하는 대로'라는 뜻이에요. as가 '~로서'가 아니라 '~하는 대로, ~한 것처럼'이라는 양태를 나타내는 접속사로 쓰였어요.", ex:"A person who unintentionally prevents harm to others and does not harm them simply because things do not turn out as she intends is not morally good.", exko:"의도치 않게 다른 사람에게 해를 끼치는 것을 막고, 단지 자신이 의도한 대로 일이 되지 않아서 그들에게 해를 끼치지 않는 사람은 도덕적으로 선한 것이 아니다." },
    that: { word:"that", tag:"[명사절 접속사 that / it ~ that 강조구문]", meaning:"이 문장에는 that이 두 번 나와요. 첫 번째 that(impression that ~)은 impression의 내용을 설명하는 명사절 접속사이고, 두 번째 'it is the actual consequences ~ that count'는 'it is ~ that ...' 강조구문으로 'count하는 것은 바로 실제 결과이다'라고 강조해서 해석해요.", ex:"Although this kind of situation generally occurs only in slapstick movies, it is worth mentioning to avoid the false impression that it is the actual consequences of a person's actions that count toward her being judged morally good or bad.", exko:"이런 상황은 일반적으로 슬랩스틱 영화에서만 발생하지만, 어떤 사람이 도덕적으로 선하거나 나쁘다고 판단되는 데 있어 중요한 것이 그 사람 행동의 실제 결과라는 잘못된 인상을 피하기 위해 언급할 가치가 있다." },
    means: { word:"means", tag:"[숙어 mean well · 선의를 가지다]", meaning:"mean well은 '의미하다'라는 뜻이 아니라 '선의를 가지다, 좋은 뜻으로 그러다'라는 관용 표현이에요. she means well은 '그녀는 선의를 가지고 있다'라고 해석해요.", ex:"Of such a person, it may be said that she means well; but, contrary to Kant, some results are necessary before she is regarded as morally good.", exko:"그런 사람에 대해, 그녀는 선의를 가지고 있다고 말할 수는 있지만, 칸트와는 달리, 그녀가 도덕적으로 선하다고 여겨지기 전에 일부 결과가 필요하다." },
    count: { word:"count", tag:"[동사 · 의미 확인]", meaning:"count는 '(숫자를) 세다'라는 뜻이 먼저 떠오르지만, 'count toward'는 '~에 있어 중요하다, ~에 기여하다'라는 뜻으로 쓰여요. 'consequences that count toward her being judged'는 '그녀가 판단되는 데 있어 중요한 결과'로 해석되며, 숫자를 세는 것과는 관계가 없어요.", ex:"Although this kind of situation generally occurs only in slapstick movies, it is worth mentioning to avoid the false impression that it is the actual consequences of a person's actions that count toward her being judged morally good or bad.", exko:"이런 상황은 일반적으로 슬랩스틱 영화에서만 발생하지만, 어떤 사람이 도덕적으로 선하거나 나쁘다고 판단되는 데 있어 중요한 것이 그 사람 행동의 실제 결과라는 잘못된 인상을 피하기 위해 언급할 가치가 있다." },
    most: { word:"most", tag:"[대명사 most · 대부분의 사람들]", meaning:"most를 '가장'이라는 최상급 표시로 읽으면 than most가 해석되지 않아요. 여기서 most는 '대부분의 사람들'을 뜻하는 대명사(most people)예요. less often than most는 '대부분의 사람들보다 덜 자주'라고 해석해요.", ex:"A morally good person is one who does morally bad actions significantly less often than most and does morally good ones significantly more often than most.", exko:"도덕적으로 좋은 사람은 대부분의 사람들보다 훨씬 드물게 도덕적으로 나쁜 행동을 하고, 대부분의 사람들보다 훨씬 자주 도덕적으로 좋은 행동을 하는 사람이다." },
    turn: { word:"turn", tag:"[동사 turn · 관용구 turn out]", meaning:"turn을 '돌다, 돌리다'로 해석하면 뜻이 통하지 않아요. 'turn out'은 '(일이) ~로 되어가다, 결과가 ~로 나오다'라는 뜻의 관용 표현이에요. things do not turn out as she intends는 '일이 그녀가 의도한 대로 되지 않는다'라고 해석해요.", ex:"A person who unintentionally prevents harm to others and does not harm them simply because things do not turn out as she intends is not morally good.", exko:"의도치 않게 다른 사람에게 해를 끼치는 것을 막고, 단지 자신이 의도한 대로 일이 되지 않아서 그들에게 해를 끼치지 않는 사람은 도덕적으로 선한 것이 아니다." },
    contrary: { word:"contrary", tag:"[숙어 contrary to · ~와는 달리]", meaning:"contrary를 '반대되는'이라는 형용사로만 보면 어색해요. 'contrary to + 명사'는 '~와는 달리, ~와는 반대로'라는 뜻의 숙어예요. contrary to Kant는 '칸트와는 달리'라고 해석해요.", ex:"Of such a person, it may be said that she means well; but, contrary to Kant, some results are necessary before she is regarded as morally good.", exko:"그런 사람에 대해, 그녀는 선의를 가지고 있다고 말할 수는 있지만, 칸트와는 달리, 그녀가 도덕적으로 선하다고 여겨지기 전에 일부 결과가 필요하다." },
  },
  passage: `A [[morally::morally]] good person is one who does morally bad actions [[significantly::significantly]] less often than most and does morally good ones significantly more often than most. In judging a person not only her actions but also her [[intentions::intentions]] and [[motives::motives]] are [[relevant::relevant]]. ① A morally good person must intend to do morally good actions and intend to avoid morally bad ones. ② A person who [[unintentionally::unintentionally]] prevents harm to others and does not harm them simply because things do not turn out as she intends is not morally good. ③ Although this kind of situation generally occurs only in slapstick movies, it is worth mentioning to avoid the false impression that it is the actual [[consequences::consequences]] of a person's actions that count toward her being judged morally good or bad. ④ But actual consequences are important. ⑤ Of such a person, it may be said that she means well; but, contrary to Kant, some results are necessary before she is [[regarded::regarded as]] morally good.`,
  translation: `도덕적으로 좋은 사람은 대부분의 사람들보다 훨씬 드물게 도덕적으로 나쁜 행동을 하고, 대부분의 사람들보다 훨씬 자주 도덕적으로 좋은 행동을 하는 사람이다. 어떤 사람을 판단할 때 그 사람의 행동뿐만 아니라 의도와 동기도 관련이 있다. ① 도덕적으로 좋은 사람은 도덕적으로 좋은 행동을 하려는 의도가 있어야 하고 도덕적으로 나쁜 행동을 피하려는 의도가 있어야 한다. ② 의도치 않게 다른 사람에게 해를 끼치는 것을 막고, 단지 자신이 의도한 대로 일이 되지 않아서 그들에게 해를 끼치지 않는 사람은 도덕적으로 선한 것이 아니다. ③ 이런 상황은 일반적으로 슬랩스틱 영화에서만 발생하지만, 어떤 사람이 도덕적으로 선하거나 나쁘다고 판단되는 데 있어 중요한 것이 그 사람 행동의 실제 결과라는 잘못된 인상을 피하기 위해 언급할 가치가 있다. ④ 하지만 실제 결과는 중요하다. ⑤ 그런 사람에 대해, 그녀는 선의를 가지고 있다고 말할 수는 있지만, 칸트와는 달리, 그녀가 도덕적으로 선하다고 여겨지기 전에 일부 결과가 필요하다.`,

    { title:"not only A but also B", desc:"'A뿐만 아니라 B도'라는 뜻이에요.", ex:"not only her actions but also her intentions (그녀의 행동뿐만 아니라 의도도)" },

  tips: [

    indifference: { word:"indifference", pron:"[인디퍼런스]", meaning:"무관심", ex:"She treated the news with indifference.", exko:"그녀는 그 소식을 무관심하게 대했다.", etym:"in-(부정) + differ(다르다; Latin differre, dis-+ferre) + ence → '차이를 두지 않음' → '무관심'. 관련 단어: different(다른), differentiate(구별하다)." },

  funcWords: {
    that: { word:"that", tag:"[관계대명사 that · 주격]", meaning:"that은 hierarchies를 선행사로 받는 주격 관계대명사예요. hierarchies that reflect ~는 '~을 반영하는 위계'라고 해석해요. 이 지문에는 that이 여러 번 나오는데(expectations that interfere, a lens that is similar, areas that appear), 모두 바로 앞 명사를 꾸며주는 관계대명사예요.", ex:"In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities.", exko:"한 장면을 볼 때, 우리는 대상과의 기능적 관계와 순간적인 우선순위를 반영하는 무의식적인 위계를 확립한다." },
    one: { word:"one", tag:"[대명사 One · 일반인 지칭]", meaning:"문장 맨 앞의 One은 숫자가 아니라 '(일반적으로) 사람은, 누구나'라는 뜻의 총칭 대명사예요. One would probably not visualize는 '사람들은 아마 시각화하지 않을 것이다'라고 해석해요.", ex:"One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer's head.", exko:"손잡이가 망치의 머리에 가려지도록 위에서 본 모습으로 망치를 시각화하지는 않을 것이다." },
    like: { word:"like", tag:"[전치사 like · ~처럼]", meaning:"like는 '좋아하다'가 아니라 '~처럼'이라는 뜻의 전치사예요. like the human eye는 '인간의 눈처럼'이라고 해석해요. 앞부분의 'see \"like a camera\"'도 같은 뜻으로 쓰였어요.", ex:"The camera, like the human eye, sees only shapes and colors.", exko:"카메라는 인간의 눈처럼 오직 형태와 색깔만을 본다." },
    serve: { word:"serve", tag:"[구동사 serve up · 제공하다]", meaning:"serve up은 '봉사하다'가 아니라 '(그대로) 제공하다, 내놓다'라는 뜻의 구동사예요. simply serve them up to us는 '단지 그것들을 우리에게 (그대로) 제공하다'라고 해석해요.", ex:"When we look at them carefully, photographs are often surprising because they don't interpret confusing details but simply serve them up to us with a mechanical indifference.", exko:"우리가 사진을 자세히 볼 때, 사진은 종종 놀라운데, 왜냐하면 사진은 혼란스러운 세부사항을 해석하지 않고 단지 기계적인 무관심으로 우리에게 그것을 제공하기 때문이다." },
    so: { word:"so", tag:"[so that · 결과]", meaning:"so that은 '그래서 ~하도록'이라는 결과를 나타내요. so that the handle is hidden은 '그래서 손잡이가 가려지도록'이라고 해석해요.", ex:"One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer's head.", exko:"손잡이가 망치의 머리에 가려지도록 위에서 본 모습으로 망치를 시각화하지는 않을 것이다." },
    documents: { word:"documents", tag:"[동사 · 품사 확인]", meaning:"documents는 '문서들'이라는 명사의 복수형처럼 보이지만, 여기서는 주어 It(카메라)의 3인칭 단수 동사로 쓰여 '기록하다'라는 뜻이에요. 'It documents the world impartially'는 '그것은 세상을 공정하게 기록한다'로 해석돼요. needs, demands와 같은 유형의 단어이니 주의하세요.", ex:"It documents the world impartially through a lens that is similar to the eye.", exko:"그것은 눈과 비슷한 렌즈를 통해 세상을 공정하게 기록한다." },
    profile: { word:"profile", tag:"[명사 · 의미 확인]", meaning:"profile은 '프로필, 개요'라는 뜻이 먼저 떠오르지만, 여기서는 '옆모습'이라는 뜻의 명사예요. 'see it in profile'은 '그것을 옆모습으로 보다'로 해석되며, SNS의 '프로필'과는 관계가 없어요.", ex:"For example, when visualizing a hammer in our mind's eye, we tend to \"see\" it in profile or at some other \"ready for use\" angle.", exko:"예를 들어, 마음속으로 망치를 시각화할 때, 우리는 그것을 옆모습이나 어떤 '사용할 준비가 된' 각도에서 '보는' 경향이 있다." },
    reflect: { word:"reflect", tag:"[동사 reflect · 반영하다]", meaning:"reflect를 '반사하다'나 '숙고하다'로 옮기면 어색해요. 여기서는 '~을 반영하다, 보여주다'라는 뜻이에요. hierarchies that reflect our functional relationship은 '우리의 기능적 관계를 반영하는 위계'라고 해석해요.", ex:"In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities.", exko:"한 장면을 볼 때, 우리는 대상과의 기능적 관계와 순간적인 우선순위를 반영하는 무의식적인 위계를 확립한다." },

  passage: `Vision is influenced by our [[preconceptions::preconceptions]] about reality. In viewing a scene, we establish unconscious [[hierarchies::hierarchies]] that reflect our functional relationship to objects and our momentary [[priorities::priorities]]. For example, when visualizing a hammer in our mind's eye, we tend to "see" it in profile or at some other "ready for use" angle. One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer's head. The functional relationship we have with objects creates visual expectations that [[interfere::interfere]] with our ability to see "like a camera." The camera, like the human eye, sees only shapes and colors. It documents the world [[impartially::impartially]] through a lens that is similar to the eye. When we look at them carefully, photographs are often surprising because they don't interpret confusing details but simply serve them up to us with a mechanical [[indifference::indifference]]. And because of their [[flatness::flatness]], photographs often contain areas that appear as [[unrecognizable::unrecognizable]] colors and shapes.`,
  translation: `시각은 현실에 대한 우리의 선입견에 영향을 받는다. 한 장면을 볼 때, 우리는 대상과의 기능적 관계와 순간적인 우선순위를 반영하는 무의식적인 위계를 확립한다. 예를 들어, 마음속으로 망치를 시각화할 때, 우리는 그것을 옆모습이나 어떤 '사용할 준비가 된' 각도에서 '보는' 경향이 있다. 손잡이가 망치의 머리에 가려지도록 위에서 본 모습으로 망치를 시각화하지는 않을 것이다. 우리가 사물과 맺는 기능적 관계는 우리가 '카메라처럼' 보는 능력을 방해하는 시각적 기대를 만들어낸다. 카메라는 인간의 눈처럼 오직 형태와 색깔만을 본다. 그것은 눈과 비슷한 렌즈를 통해 세상을 공정하게 기록한다. 우리가 사진을 자세히 볼 때, 사진은 종종 놀라운데, 왜냐하면 사진은 혼란스러운 세부사항을 해석하지 않고 단지 기계적인 무관심으로 우리에게 그것을 제공하기 때문이다. 그리고 그 평면성 때문에, 사진은 종종 인식할 수 없는 색깔과 형태로 나타나는 영역들을 포함한다.`,

    rejects: { word:"rejects", tag:"[문맥상 낱말 쓰임 · 어휘 오류 포인트]", meaning:"rejects는 사전적으로 '거부하다'라는 뜻이지만, 이 자리는 문맥상 낱말 쓰임이 적절한지 묻는 42번 문제의 정답 포인트예요. '도와드릴까요?'라는 질문의 진짜 의미는 고객이 곤란에 처했다는 것을 '거부하는(rejects)' 것이 아니라 '암시하는(implies)' 것이 자연스러우므로, 이 자리에는 rejects가 아니라 implies가 와야 문맥이 맞아요.", ex:"The very meaning of the question \"May I help you?\" (c) rejects that the customer is in trouble of some sort and needs rescuing.", exko:"'도와드릴까요?'라는 질문의 진짜 의미는 고객이 어떤 종류의 곤란에 처해 있어서 구조가 필요하다는 것을 (c)거부한다." },

    care: { word:"care", tag:"[동사 care · 신경 쓰다]", meaning:"여기서 care는 '돌보다'가 아니라 '신경 쓰다, 관심을 가지다'라는 뜻이에요. didn't care는 '신경 쓰지 않았다'라고 해석해요.", ex:"If a fashion salesperson approached you with \"May I help you?\" chances are you would feel the salesperson didn't (b) care.", exko:"만약 패션 판매원이 당신에게 '도와드릴까요?'라고 다가온다면, 아마도 당신은 그 판매원이 신경 쓰지 (b)않는다고 느낄 것이다." },
    line: { word:"line", tag:"[명사 · 의미 확인]", meaning:"line은 '선, 줄'이라는 뜻이 먼저 떠오르지만, 여기서는 '(정해진) 말, 문구, 대사'라는 뜻으로 쓰였어요. 'This line is a rote approach'는 '이 말은 기계적인 접근법이다'로 해석되며, 앞 문장의 'May I help you?'라는 표현 자체를 가리켜요.", ex:"This line is a rote approach that is so overused by untrained and uninterested salespeople.", exko:"이 말은 훈련받지 않고 무관심한 판매원들에게 너무 남용되는 기계적인 접근법이다." },

    on: { word:"on", tag:"[전치사 on + 동명사 · ~하자마자]", meaning:"'on + 동명사'는 '~위에'가 아니라 '~하자마자, ~할 때'라는 뜻이에요. on hearing these words는 '이 말을 듣자마자(들으면)'라고 해석해요. 앞부분의 'put them on the defensive(그들을 방어적으로 만들다)'와는 쓰임이 다르니 뒤에 오는 형태를 확인하세요.", ex:"In fact, most of us shudder in horror on hearing these words.", exko:"실제로, 우리 대부분은 이 말을 들으면 몸서리를 친다." },
    figure: { word:"figure", tag:"[구동사 figure out · 알아내다]", meaning:"figure를 '수치, 인물, 모양'이라는 명사로 보면 문장이 이해되지 않아요. 'figure out'은 '~을 알아내다, 이해하다'라는 뜻의 구동사예요. figure out what I want는 '내가 원하는 것을 알아내다'라고 해석해요.", ex:"The subconscious thought by the customer is often \"I'm smart enough to figure out what I want, and I don't need your help!\"", exko:"고객의 잠재의식적인 생각은 종종 '나는 내가 원하는 것을 알아낼 만큼 충분히 똑똑해요, 당신의 도움은 필요 없어요!'이다." },

  },
  passage: `"May I help you?" are the worst four words that a [[retail::retail]] salesperson can [[utter::utter]] because they don't [[encourage::encourage]] the customer to talk and put them on the defensive. The four words usually draw out a negative response that stops cold a sales transaction. Examples of (a) ‹better› questions to use when approaching customers are "Is there anything in particular that you are looking for?" and "Are you shopping for a gift?" If a fashion salesperson approached you with "May I help you?" chances are you would feel the salesperson didn't (b) ‹care›. This line is a [[rote::rote]] approach that is so overused by untrained and uninterested salespeople. In fact, most of us [[shudder::shudder]] in horror on hearing these words. The very meaning of the question "May I help you?" (c) ‹rejects› that the customer is in trouble of some sort and needs rescuing. This almost always puts the customer on the defense. "No, thank you" is usually the immediate response, even if the customer is actually in need of assistance. The [[subconscious::subconscious]] thought by the customer is often "I'm smart enough to figure out what I want, and I don't need your help!"

If customers feel pressured or [[cornered::cornered]], then salespeople won't make any sales. The approach has to [[promote::promote]] a (d) ‹comfortable› environment that makes customers feel there is no rush. Furthermore, if customers just want to look around, they should feel that it is all right to do so. In situations where customers really do want to look around on their own, salespeople should give customers their business cards and keep themselves (e) ‹accessible› in case customers have questions or concerns.`,
  translation: `'도와드릴까요?'는 소매 판매원이 할 수 있는 최악의 네 단어인데, 이는 고객이 말을 하도록 유도하지 않고 그들을 방어적으로 만들기 때문이다. 이 네 단어는 대개 판매 거래를 딱 멈추게 하는 부정적인 반응을 이끌어낸다. 고객에게 다가갈 때 사용할 (a)더 나은 질문의 예로는 '특별히 찾으시는 것이 있나요?'와 '선물을 사고 계신가요?'가 있다. 만약 패션 판매원이 당신에게 '도와드릴까요?'라고 다가온다면, 아마도 당신은 그 판매원이 신경 쓰지 (b)않는다고 느낄 것이다. 이 말은 훈련받지 않고 무관심한 판매원들에게 너무 남용되는 기계적인 접근법이다. 실제로, 우리 대부분은 이 말을 들으면 몸서리를 친다. '도와드릴까요?'라는 질문의 진짜 의미는 고객이 어떤 종류의 곤란에 처해 있어서 구조가 필요하다는 것을 (c)거부한다. 이것은 거의 항상 고객을 방어적으로 만든다. '아니요, 괜찮아요'가 대개 즉각적인 반응인데, 고객이 실제로 도움이 필요한 경우에도 그렇다. 고객의 잠재의식적인 생각은 종종 '나는 내가 원하는 것을 알아낼 만큼 충분히 똑똑해요, 당신의 도움은 필요 없어요!'이다.

만약 고객이 압박감을 느끼거나 궁지에 몰린 느낌을 받으면, 판매원은 어떤 판매도 성사시키지 못할 것이다. 그 접근법은 고객이 서두를 필요가 없다고 느끼게 만드는 (d)편안한 환경을 조성해야 한다. 게다가, 만약 고객이 그냥 둘러보고 싶어 한다면, 그들은 그렇게 해도 괜찮다고 느껴야 한다. 고객이 정말로 스스로 둘러보고 싶어 하는 상황에서는, 판매원은 고객에게 명함을 주고 질문이나 우려 사항이 있을 경우를 대비해 (e)연락이 닿을 수 있는 상태를 유지해야 한다.`,

  passage: `(A) While the [[cafeteria::cafeteria]] was full of high school students on that afternoon, Dave was [[thirsty::thirsty]]. We sat near yet away from him, fixing our hair and worrying about the test next period we hadn't studied for. (a)‹He› was far away from our world, yet forced to be a part of it.

(B) Although it was clear that they were from very different worlds, for one moment, they'd shared a real understanding. As I walked away from my lunch table that day, I looked at Dave. I thought he and the dollar were very much alike. They both weren't accepted where the world said they were supposed to be. But just as the dollar had found a place in a warm-hearted senior's pocket, I was sure (b)‹he› would eventually find his, too.

(C) But for some reason, he decided against it. He wasn't leaving until he got a drink. With a [[determined::determined]] expression, (c)‹he› kept [[aimlessly::aimlessly]] pushing the dollar bill into the machine. Just then a popular senior boy stood up from his seat, and walked over to the boy. (d)‹He› calmly explained how the machine often had trouble accepting dollar bills. After that, he pulled some coins from his pocket and put them into the machine. Dave gave him his dollar and chose a flavor of fruit juice. Then the two walked off in different directions.

(D) He stood at the drink machine with purpose, [[fumbling::fumbling]] through his fake leather wallet for some change. He came up with a [[wrinkled::wrinkled]] dollar bill, and [[nervously::nervously]] glanced back at his table where other students in (e)‹his› class were sitting. Dave tried to make the machine accept his money. After he failed a few times, some students began to laugh at him. He started shaking, and tears began to form in his eyes. I saw him turn to sit down, looking like he had [[given_up::given up]].`,
  translation: `(A) 그날 오후 구내식당이 고등학생들로 가득 차 있는 동안, Dave는 목이 말랐다. 우리는 그와 가까이 있으면서도 멀리 앉아, 머리를 매만지고 공부하지 못한 다음 시간 시험을 걱정하고 있었다. (a)그는 우리의 세계에서 멀리 떨어져 있었지만, 그 일부가 되도록 강요받았다.

(B) 그들이 매우 다른 세계에서 왔다는 것은 분명했지만, 잠깐 동안 그들은 진정한 이해를 공유했다. 그날 점심 식탁에서 걸어 나오면서, 나는 Dave를 바라보았다. 나는 그와 그 지폐가 매우 닮았다고 생각했다. 그 둘 다 세상이 있어야 한다고 말하는 곳에서 받아들여지지 않았다. 하지만 그 지폐가 마음씨 따뜻한 상급생의 주머니에서 자리를 찾은 것처럼, 나는 (b)그도 결국 자신의 자리를 찾을 것이라고 확신했다.

(C) 하지만 어떤 이유에서인지, 그는 포기하지 않기로 했다. 그는 음료수를 얻을 때까지 떠나지 않을 생각이었다. 단호한 표정으로, (c)그는 계속 목적 없이 지폐를 기계에 밀어 넣었다. 바로 그때 인기 많은 상급생 남학생이 자리에서 일어나 그 소년에게 걸어갔다. (d)그는 그 기계가 종종 지폐를 받아들이는 데 문제가 있다고 차분하게 설명해 주었다. 그 후, 그는 주머니에서 동전을 꺼내 기계에 넣었다. Dave는 그에게 자신의 지폐를 주고 과일 주스 맛을 골랐다. 그러고 나서 둘은 서로 다른 방향으로 걸어갔다.

let current = 0;
let activeVocabKey = null;
let currentSpeakWord = null;
let activeSheetWord = null;
let currentSheetWordData = null;
let quizState = [];

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) {
  try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; }
}
function setStarred(gid, list) {
  localStorage.setItem(starKey(gid), JSON.stringify(list));
}
function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var gid = String(problems[current].num);
  var starred = getStarred(gid);
  var isStarred = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = isStarred ? '★' : '☆';
  btn.classList.toggle('starred', isStarred);
}
function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = String(problems[current].num);
  var starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) {
    starred.splice(idx, 1);
  } else {
    starred.push({
      word: currentSheetWordData.word,
      pron: currentSheetWordData.pron || '',
      meaning: currentSheetWordData.meaning || '뜻 정보 없음',
      en: currentSheetWordData.en || '',
      ko: currentSheetWordData.ko || ''
    });
  }
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var placeholders = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      placeholders.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (placeholders.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      placeholders.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (placeholders.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, idx) { return placeholders[idx]; });
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    html = html.replace(/\n/g, '<br>');
    return '<p>' + html + '</p>';
  }).join('');
}

function buildTabs() {
  var el = document.getElementById('problem-tabs');
  el.innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" data-i="' + i + '" onclick="selectProblem(' + i + ')">' + p.label + '</div>';
  }).join('');
}

const circled = ['①', '②', '③', '④', '⑤'];

function renderNote(p) {
  var card = document.getElementById('note-card');
  if (!p.note) { card.classList.remove('show'); return; }
  card.classList.add('show');
  document.getElementById('note-label').textContent = p.noteLabel || '📌 참고';
  document.getElementById('note-text').textContent = p.note;
  document.getElementById('note-text-ko').textContent = p.noteKo || '';
}

function choiceLabel(c, i) {
  return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c;
}

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

function renderQuiz(p) {
  quizState = p.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = p.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var p = problems[current];
  var q = p.questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var result = document.getElementById('qresult-' + qi);
  var isCorrect = quizState[qi].selected === q.answer;
  if (window.studyStats) window.studyStats.record('quiz', isCorrect);
  result.classList.add('show', isCorrect ? 'ok' : 'no');
  var head = isCorrect ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.';
  result.innerHTML = '<b>' + head + '</b><br>' + q.explanation;
  var btn = document.getElementById('qcheck-' + qi);
  btn.textContent = '다시 풀기';
  btn.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var p = problems[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(p.questions[qi], qi);
  var result = document.getElementById('qresult-' + qi);
  result.classList.remove('show', 'ok', 'no');
  result.innerHTML = '';
  var btn = document.getElementById('qcheck-' + qi);
  btn.textContent = '정답 확인';
  btn.onclick = function() { checkAnswer(qi); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.label + ' · ' + p.type;
  renderNote(p);
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  var keys = Object.keys(p.vocab);
  vg.innerHTML = keys.map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');

  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) {
    return '<div class="tip-item"><p>' + t + '</p></div>';
  }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) {
    t.classList.toggle('active', i === current);
  });

  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';

  switchTab('grammar');
}

function selectProblem(i) {
  current = i;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function go(delta) {
  if (current === problems.length - 1 && delta === 1) {
    current = 0;
  } else {
    current = Math.max(0, Math.min(problems.length - 1, current + delta));
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleTranslation() {
  var box = document.getElementById('translation-box');
  var btn = document.getElementById('btn-trans');
  var show = !box.classList.contains('show');
  box.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var grid = document.getElementById('vocab-grid');
  var btn = document.getElementById('btn-vocab');
  var show = !grid.classList.contains('show');
  grid.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-t') === name);
  });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key;
  activeSheetWord = null;
  currentSpeakWord = v.word;
  currentSheetWordData = { word: v.word, pron: v.pron, meaning: v.meaning, en: v.ex, ko: v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() {
  if (currentSpeakWord) speak(currentSpeakWord);
}

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var loadTtsVoices = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  loadTtsVoices();
  window.speechSynthesis.onvoiceschanged = loadTtsVoices;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var synth = window.speechSynthesis;
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  var voices = (ttsVoices && ttsVoices.length) ? ttsVoices : synth.getVoices();
  if (voices && voices.length) {
    var enVoice = voices.find(function(v) { return v.lang === 'en-US'; }) || voices.find(function(v) { return v.lang && v.lang.indexOf('en') === 0; });
    if (enVoice) utter.voice = enVoice;
  }
  synth.cancel();
  setTimeout(function() { synth.speak(utter); }, 80);
}

buildTabs();
render();
</script>
<script src="study-stats.js"></script>

</body>
