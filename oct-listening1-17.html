  translation:"M: Stonehaven 고등학교 학생 여러분, 주목해 주세요. 저는 체육 교사 Palmer입니다. 아시다시피, 어제 비가 많이 내렸습니다. 학교 운동장 바닥이 젖어 있어서, 평소처럼 야외에서 스포츠 활동을 하는 것이 불가능합니다. 매우 미끄럽고 위험합니다. 그래서 오늘은 여러분의 안전을 위해 체육 수업 장소를 변경하기로 결정했습니다. 학교 운동장 대신 실내 체육관에서 체육 수업을 하겠습니다. 수업 시간은 그대로입니다. 이 중요한 변경 사항을 기억하시고, 제시간에 와 주세요. 감사합니다.",
  vocab:[
    { word:"slippery", pron:"[슬리퍼리]", meaning:"미끄러운", ex:"The wet floor is very slippery.", ko:"젖은 바닥은 매우 미끄럽다." },
    { word:"impossible", pron:"[임파서블]", meaning:"불가능한", ex:"It's impossible to play outside today.", ko:"오늘 밖에서 노는 것은 불가능하다." },
    { word:"indoor gym", pron:"[인도어 짐]", meaning:"실내 체육관", ex:"We'll meet in the indoor gym.", ko:"우리는 실내 체육관에서 만날 것이다." },
    { word:"on time", pron:"[온 타임]", meaning:"제시간에", ex:"Please be there on time.", ko:"제시간에 그곳에 와 주세요." }

{ label:"2번", type:"의견 파악",

  translation:"M: 좋은 아침이야, Mia. 너 정말 상쾌해 보인다.\nW: 안녕, Mathew. 그렇게 보여?\nM: 물론이지. 비결이 뭐야?\nW: 사실 최근에 면 소재 잠옷을 입기 시작했어. 그게 잠자는 데 도움이 되는 것 같아.\nM: 면 잠옷? 정말?\nW: 응. 공기가 잘 통하게 해줘서 피부가 숨 쉴 공간을 더 많이 줘.\nM: 흥미롭네. 나는 밤에 자주 덥고 땀이 나.\nW: 그렇다면, 면 잠옷을 입으면 더 잘 자는 데 도움이 될 거야.\nM: 음, 네 말이 맞는 것 같아.\nW: 그리고 면은 땀을 잘 흡수해. 밤새 쾌적하게 지낼 수 있을 거야.\nM: 그렇구나. 나에게 도움이 될 것 같네.\nW: 응. 면 잠옷을 입고 자는 건 숙면에 정말 좋아.\nM: 알겠어, 한번 시도해 볼게.",

{ label:"3번", type:"요지 파악",
  lines:[{spk:"M", text:"Welcome to my show, Smart Talk. I'm Arthur, your friendly show host. Today, we'll talk about the importance of facing challenges to build confidence. Sometimes, we're too afraid to challenge ourselves and try something new. But remember, when you try something that you're not familiar with and face difficulties, you'll find strength you didn't even know you had. Through this process, you'll have valuable experience to learn more about yourself. As a result, you'll start to think that you can achieve anything. So, if you face challenges, you'll find yourself more confident than ever. Thank you for listening."}],
  translation:"M: 제 쇼 Smart Talk에 오신 것을 환영합니다. 저는 여러분의 친근한 진행자 Arthur입니다. 오늘은 자신감을 기르기 위해 도전에 직면하는 것의 중요성에 대해 이야기하겠습니다. 때때로 우리는 스스로에게 도전하고 새로운 것을 시도하기를 너무 두려워합니다. 하지만 기억하세요, 익숙하지 않은 것을 시도하고 어려움에 직면할 때, 여러분은 자신에게 있는 줄도 몰랐던 힘을 발견하게 될 것입니다. 이 과정을 통해 여러분은 자신에 대해 더 많이 알게 되는 값진 경험을 하게 될 것입니다. 그 결과, 여러분은 무엇이든 해낼 수 있다고 생각하기 시작할 것입니다. 그러니 도전에 직면한다면, 여러분은 그 어느 때보다 더 자신감 있는 자신을 발견하게 될 것입니다. 들어주셔서 감사합니다.",
  vocab:[
    { word:"face challenges", pron:"[페이스 챌린지스]", meaning:"도전에 직면하다", ex:"If you face challenges, you'll grow.", ko:"도전에 직면하면 성장할 것이다." },
    { word:"confidence", pron:"[컨피던스]", meaning:"자신감", ex:"Facing difficulties builds confidence.", ko:"어려움에 직면하는 것은 자신감을 길러준다." },

{ label:"16~17번", type:"주제 · 언급되지 않은 것",
  lines:[{spk:"W", text:"Welcome to the Healthy Vibe Up show! Have you heard of the recent detox trend? It's all about helping the body's process of removing harmful stuff. So today, let's find out how various detox juices can help support your health. First, beet juice can strengthen your heart. Beet improves blood flow and lowers blood pressure. Second, celery juice can be a great option to help digestion. Celery's high fiber assists in getting rid of extra water in your body. Next, cucumber juice keeps your skin hydrated. Due to its vitamin B6 content, it flushes out toxins and makes your skin brighter. Last but not least, kale juice is known as an immune booster because it's rich in vitamin K. Kale protects cells from damage and keeps your body strong. Now you've discovered how different detox juices can be helpful to your health. Try them and feel the advantages yourself!"}],
  translation:"W: Healthy Vibe Up 쇼에 오신 것을 환영합니다! 최근의 디톡스 유행에 대해 들어보셨나요? 그것은 해로운 물질을 제거하는 신체의 과정을 돕는 것에 관한 것입니다. 그래서 오늘은 다양한 디톡스 주스가 여러분의 건강을 어떻게 도울 수 있는지 알아보겠습니다. 첫째, 비트 주스는 심장을 튼튼하게 해줍니다. 비트는 혈류를 개선하고 혈압을 낮춥니다. 둘째, 셀러리 주스는 소화를 돕는 훌륭한 선택이 될 수 있습니다. 셀러리의 풍부한 섬유질은 몸속의 여분의 수분을 제거하는 데 도움을 줍니다. 다음으로, 오이 주스는 피부를 촉촉하게 유지해 줍니다. 비타민 B6 함량 덕분에, 독소를 배출하고 피부를 더 밝게 만들어 줍니다. 마지막으로 중요한 것은, 케일 주스는 비타민 K가 풍부해서 면역력 증진제로 알려져 있습니다. 케일은 세포를 손상으로부터 보호하고 몸을 튼튼하게 유지해 줍니다. 이제 여러분은 다양한 디톡스 주스가 건강에 어떻게 도움이 될 수 있는지 알게 되었습니다. 한번 드셔보고 그 이점을 직접 느껴보세요!",
  vocab:[
    { word:"detox", pron:"[디톡스]", meaning:"해독, 디톡스", ex:"Have you heard of the detox trend?", ko:"디톡스 유행에 대해 들어보셨나요?" },
    { word:"digestion", pron:"[다이제스천]", meaning:"소화", ex:"Celery juice helps digestion.", ko:"셀러리 주스는 소화를 돕는다." },
    { word:"hydrated", pron:"[하이드레이티드]", meaning:"수분이 유지된", ex:"Cucumber juice keeps your skin hydrated.", ko:"오이 주스는 피부를 촉촉하게 유지해 준다." },
    { word:"immune booster", pron:"[이뮨 부스터]", meaning:"면역력 증진제", ex:"Kale juice is known as an immune booster.", ko:"케일 주스는 면역력 증진제로 알려져 있다." }
  ],
  questions:[
    { qNum:16, question:"여자가 하는 말의 주제로 가장 적절한 것은?",
      choices:["problems caused by consuming detox juices","the origin of detox juices made with vegetables","difficulties in making detox juices with vegetables","healthy vegetable juices to aid recovery after surgery","the positive effects of vegetable detox juices on health"],
      answer:4, explanation:"여자는 비트·셀러리·오이·케일 주스가 건강에 주는 이점을 차례로 소개하고 있으므로 ⑤번이 정답입니다." },
    { qNum:17, question:"언급된 주스가 아닌 것은?",
      choices:["beet juice","celery juice","cucumber juice","carrot juice","kale juice"],
      answer:3, explanation:"비트, 셀러리, 오이, 케일 주스는 언급되었지만 당근 주스(carrot juice)는 언급되지 않았으므로 ④번이 정답입니다." }
  ]
}
];

let current = 0;
let currentRate = 1;
let realAudio = null;

function formatTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function buildPlayer() {
  var card = document.getElementById('player-card');
  if (!AUDIO_URL) {
    card.innerHTML = '<div class="audio-missing">🎧 10월 회차는 EBSi 원본 듣기 파일 주소가 아직 연결되지 않았어요. 파일 주소를 알려주시면 바로 넣어드릴게요. 그때까지는 아래 <b>대본 보기</b>로 학습해 주세요.</div>';
    return;
  }
  card.innerHTML =
    '<div class="player-note">🎧 EBSi 원본 듣기 파일 (1~17번 전체, 순서대로 재생돼요)</div>' +
    '<div class="player-row">' +
      '<button class="player-playbtn" id="player-playbtn" onclick="toggleRealAudio()">▶️</button>' +
      '<div class="player-info">' +
        '<input type="range" class="seek-bar" id="seek-bar" min="0" max="100" value="0" oninput="seekRealAudio(this.value)">' +
        '<div class="player-time"><span id="time-current">0:00</span><span id="time-total">0:00</span></div>' +
      '</div>' +
    '</div>';

  realAudio = new Audio(AUDIO_URL);
  realAudio.preload = 'none';
  realAudio.addEventListener('play', function() { document.getElementById('player-playbtn').textContent = '⏸️'; });
  realAudio.addEventListener('pause', function() { document.getElementById('player-playbtn').textContent = '▶️'; });
  realAudio.addEventListener('ended', function() { document.getElementById('player-playbtn').textContent = '▶️'; });
  realAudio.addEventListener('loadedmetadata', function() {
    document.getElementById('time-total').textContent = formatTime(realAudio.duration);
  });
  realAudio.addEventListener('timeupdate', function() {
    var bar = document.getElementById('seek-bar');
    if (realAudio.duration) bar.value = (realAudio.currentTime / realAudio.duration) * 100;
    document.getElementById('time-current').textContent = formatTime(realAudio.currentTime);
  });
}

function toggleRealAudio() {
  if (!realAudio) return;
  if (realAudio.paused) { realAudio.play(); } else { realAudio.pause(); }
}

function seekRealAudio(pct) {
  if (realAudio && realAudio.duration) realAudio.currentTime = (pct / 100) * realAudio.duration;
}

function buildRateRow() {
  var rates = [0.5, 0.7, 1, 1.2, 1.5];
  document.getElementById('rate-row').innerHTML = rates.map(function(r) {
    return '<button class="rate-btn' + (r === 1 ? ' active' : '') + '" onclick="setRate(' + r + ', this)">' + r + '배</button>';
  }).join('');
}

function setRate(r, btnEl) {
  currentRate = r;
  if (realAudio) realAudio.playbackRate = r;
  document.querySelectorAll('.rate-btn').forEach(function(b) { b.classList.remove('active'); });
  btnEl.classList.add('active');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = items.map(function(it, i) {
    return '<div class="p-tab" onclick="selectItem(' + i + ')">' + it.label + '</div>';
  }).join('');
}

const circled = ['①', '②', '③', '④', '⑤'];

function choiceLabel(c, i) {
  return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c;
}

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

let quizState = [];

function renderQuiz(it) {
  quizState = it.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = it.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var it = items[current];
  var q = it.questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var result = document.getElementById('qresult-' + qi);
  var isCorrect = quizState[qi].selected === q.answer;
  result.classList.add('show', isCorrect ? 'ok' : 'no');
  var head = isCorrect ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.';
  result.innerHTML = '<b>' + head + '</b><br>' + q.explanation;
  var btn = document.getElementById('qcheck-' + qi);
  btn.textContent = '다시 풀기';
  btn.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var it = items[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(it.questions[qi], qi);
  var result = document.getElementById('qresult-' + qi);
  result.classList.remove('show', 'ok', 'no');
  result.innerHTML = '';
  var btn = document.getElementById('qcheck-' + qi);
  btn.textContent = '정답 확인';
  btn.onclick = function() { checkAnswer(qi); };
}

function renderGiven(it) {
  var card = document.getElementById('given-card');
  if (it.image) {
    card.classList.add('show');
    card.innerHTML = '<img src="' + it.image + '" alt="문제 자료 그림">';
  } else if (it.table) {
    card.classList.add('show');
    var thead = '<tr>' + it.table.headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr>';
    var rows = it.table.rows.map(function(r) {
      return '<tr>' + r.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
    }).join('');
    card.innerHTML = '<table class="given-table">' + thead + rows + '</table>';
  } else {
    card.classList.remove('show');
    card.innerHTML = '';
  }
}

function render() {
  var it = items[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + items.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / items.length * 100) + '%';
  document.getElementById('type-badge').textContent = it.label + ' · ' + it.type;

  renderGiven(it);
  renderQuiz(it);

  document.getElementById('script-box').innerHTML = it.lines.map(function(l) {
    return '<div class="script-line"><span class="script-spk">' + l.spk + ':</span>' + l.text + '</div>';
  }).join('');
  document.getElementById('script-box').classList.remove('show');
  document.getElementById('btn-script').classList.remove('on');
  document.getElementById('btn-script').textContent = '📄 대본 보기';

  document.getElementById('translation-box').textContent = it.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 해석 보기';

  document.getElementById('vocab-list').innerHTML = it.vocab.map(function(v) {
    return '<div class="example-item"><div class="example-text"><div class="example-en">' + v.word + '</div><div class="example-pron">' + v.pron + ' ' + v.meaning + '</div><div class="example-ko">' + v.ex + '<br>' + v.ko + '</div></div><button class="example-speak" onclick="speak(\'' + v.word.replace(/'/g, "\\'") + '\')">🔊</button></div>';
  }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) {
    t.classList.toggle('active', i === current);
  });

  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === items.length - 1;
  document.getElementById('btn-next').textContent = current === items.length - 1 ? '처음으로' : '다음 문제 →';
}

function selectItem(i) {
  current = i;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function go(delta) {
  if (current === items.length - 1 && delta === 1) current = 0;
  else current = Math.max(0, Math.min(items.length - 1, current + delta));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleScript() {
  var box = document.getElementById('script-box');
  var btn = document.getElementById('btn-script');
  var show = !box.classList.contains('show');
  box.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '📄 대본 숨기기' : '📄 대본 보기';
}

function toggleTranslation() {
  var box = document.getElementById('translation-box');
  var btn = document.getElementById('btn-trans');
  var show = !box.classList.contains('show');
  box.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '🇰🇷 해석 숨기기' : '🇰🇷 해석 보기';
}

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var loadTtsVoices = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  loadTtsVoices();
  window.speechSynthesis.onvoiceschanged = loadTtsVoices;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var synth = window.speechSynthesis;
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  var voices = (ttsVoices && ttsVoices.length) ? ttsVoices : synth.getVoices();
  if (voices && voices.length) {
    var enVoice = voices.find(function(v) { return v.lang === 'en-US'; }) || voices.find(function(v) { return v.lang && v.lang.indexOf('en') === 0; });
    if (enVoice) utter.voice = enVoice;
  }
  synth.cancel();
  setTimeout(function() { synth.speak(utter); }, 80);
}

buildPlayer();
buildRateRow();
buildTabs();
render();
</script>
</body>
</html>
