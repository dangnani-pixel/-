<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모의고사 영어 지문 완전정복</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5F4F0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; color: #1a1a1a; }
.wrap { max-width: 420px; width: 100%; text-align: center; }
.badge { display: inline-block; font-size: 12px; color: #534AB7; background: #EEEDFE; border-radius: 99px; padding: 5px 14px; margin-bottom: 18px; font-weight: 600; }
h1 { font-size: 24px; margin-bottom: 8px; line-height: 1.4; }
.motto { font-size: 12.5px; color: #999; font-style: italic; margin-bottom: 40px; letter-spacing: 0.02em; }
.grades { display: flex; flex-direction: column; gap: 12px; }
.grade-btn { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px; border-radius: 16px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.07); text-decoration: none; color: #1a1a1a; cursor: pointer; border: none; width: 100%; font-family: inherit; -webkit-tap-highlight-color: transparent; transition: transform 0.1s ease; }
.grade-btn:active { transform: scale(0.98); }
.grade-btn.active-grade { background: #7F77DD; color: #fff; }
.grade-main { text-align: left; }
.grade-title { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
.grade-sub { font-size: 12.5px; opacity: 0.75; }
.grade-arrow { font-size: 20px; opacity: 0.5; }
.grade-btn.disabled { opacity: 0.55; cursor: not-allowed; }
.soon-tag { font-size: 10.5px; background: #E0DED8; color: #777; padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">📚 전국연합학력평가 영어 학습지</div>
  <h1>몇 학년 학습지가<br>필요하신가요?</h1>
  <p class="motto">Habits shape destiny.</p>

  <div class="grades">
    <a class="grade-btn active-grade" href="grade1.html">
      <div class="grade-main">
        <div class="grade-title">고1</div>
        <div class="grade-sub">2025년 9월 모의고사 · 18~31번</div>
      </div>
      <div class="grade-arrow">→</div>
    </a>
    <button class="grade-btn disabled" type="button" onclick="soon(this)">
      <div class="grade-main">
        <div class="grade-title">고2 <span class="soon-tag">준비 중</span></div>
        <div class="grade-sub">추후 업데이트될 예정이에요</div>
      </div>
      <div class="grade-arrow">→</div>
    </button>
    <button class="grade-btn disabled" type="button" onclick="soon(this)">
      <div class="grade-main">
        <div class="grade-title">고3 <span class="soon-tag">준비 중</span></div>
        <div class="grade-sub">추후 업데이트될 예정이에요</div>
      </div>
      <div class="grade-arrow">→</div>
    </button>
  </div>
</div>
<script>
function soon(el) {
  var sub = el.querySelector('.grade-sub');
  var original = sub.textContent;
  sub.textContent = '조금만 기다려주세요! 🙏';
  setTimeout(function() { sub.textContent = original; }, 1500);
}
</script>
</body>
</html>
