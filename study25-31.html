<script>
const problems = [
{
  num: 25, type: "도표 내용 불일치",
  question: "다음 도표의 내용과 일치하지 않는 것은?",
  choices: [
    "In Germany, the UK and Finland, reading was the most preferred way of consuming online news, with its percentage over 60 percent across the three countries.",
    "The interesting point is that the Philippines, Thailand and India all preferred to watch online news the most.",
    "In terms of preference to watching online news, the Philippines showed the highest percentage and Finland showed the lowest preference among all six countries.",
    "Four out of ten preferred to watch online news in both Thailand and India, and that percentage was more than three times as high as that of Finland.",
    "For listening, the least preferred way of consuming online news, the percentage of people who preferred it in Finland was a third of that of Thailand."
  ],
  answer: 4,
  explanation: "듣기를 선호하는 비율은 핀란드가 6%, 태국이 22%로, 6은 22의 3분의 1(약 7.3%)이 아닙니다. 태국의 3분의 1에 가까운 것은 오히려 영국(7%)이므로, 핀란드가 태국의 3분의 1이라는 ⑤번 진술은 도표와 일치하지 않습니다.",
  chart: {
    title: "Percentage of Online News Consumption Preferences in 2020",
    data: [
      { label: "Philippines", read: 36, watch: 52, listen: 12 },
      { label: "Thailand", read: 38, watch: 40, listen: 22 },
      { label: "India", read: 39, watch: 40, listen: 21 },
      { label: "Germany", read: 67, watch: 23, listen: 10 },
      { label: "UK", read: 78, watch: 15, listen: 7 },
      { label: "Finland", read: 82, watch: 12, listen: 6 }
    ]
  },
  vocab: {
    consumption: { word:"consumption", pron:"[컨섬션]", meaning:"소비", ex:"News consumption habits are changing.", exko:"뉴스 소비 습관이 변화하고 있다." },
    preferences: { word:"preferences", pron:"[프레퍼런시즈]", meaning:"선호(도)", ex:"The survey shows different preferences.", exko:"그 설문은 서로 다른 선호도를 보여준다." },
    percentage: { word:"percentage", pron:"[퍼센티지]", meaning:"비율, 백분율", ex:"The percentage increased sharply.", exko:"그 비율이 급격히 증가했다." },
    preferred: { word:"preferred", pron:"[프리퍼드]", meaning:"선호된", ex:"Reading was the preferred method.", exko:"읽기가 선호되는 방법이었다." },
    interesting_point: { word:"interesting point", pron:"[인터레스팅 포인트]", meaning:"흥미로운 점", ex:"The interesting point is the gap between countries.", exko:"흥미로운 점은 국가 간의 격차이다." },
    in_terms_of: { word:"in terms of", pron:"[인 텀즈 오브]", meaning:"~의 측면에서", ex:"In terms of cost, this option is better.", exko:"비용 측면에서 이 옵션이 더 낫다." },
    among: { word:"among", pron:"[어멍]", meaning:"~중에서, ~사이에서", ex:"Finland showed the lowest rate among six countries.", exko:"핀란드는 여섯 나라 중 가장 낮은 비율을 보였다." },
    least: { word:"least", pron:"[리스트]", meaning:"가장 적은", ex:"Listening was the least preferred way.", exko:"듣기는 가장 덜 선호되는 방법이었다." }
  },
  passage: `The graph above shows the [[consumption::percentage of online news consumption]] [[preferences::preferences]] in three ways for six countries in 2020. In Germany, the UK and Finland, reading was the most [[preferred::preferred]] way of consuming online news, with its [[percentage::percentage]] over 60 percent across the three countries. The [[interesting_point::interesting point]] is that the Philippines, Thailand and India all preferred to watch online news the most. [[in_terms_of::In terms of]] preference to watching online news, the Philippines showed the highest percentage and Finland showed the lowest preference [[among::among]] all six countries. Four out of ten preferred to watch online news in both Thailand and India, and that percentage was more than three times as high as that of Finland. For listening, the [[least::least]] preferred way of consuming online news, the percentage of people who preferred it in Finland was a third of that of Thailand.`,
  translation: `위 도표는 2020년 여섯 개 국가의 온라인 뉴스 소비 선호도를 세 가지 방식으로 보여준다. 독일, 영국, 핀란드에서는 읽기가 온라인 뉴스를 소비하는 가장 선호되는 방식이었으며, 세 나라 모두에서 그 비율이 60퍼센트를 넘었다. 흥미로운 점은 필리핀, 태국, 인도는 모두 온라인 뉴스를 시청하는 것을 가장 선호했다는 것이다. 시청 선호도 측면에서는 필리핀이 여섯 개 국가 중 가장 높은 비율을 보였고 핀란드가 가장 낮은 선호도를 보였다. 태국과 인도 모두에서 10명 중 4명이 온라인 뉴스를 시청하는 것을 선호했으며, 그 비율은 핀란드의 세 배가 넘었다. 청취의 경우, 온라인 뉴스를 소비하는 가장 덜 선호되는 방식으로, 핀란드에서 그것을 선호하는 사람들의 비율은 태국의 3분의 1이었다.`,
  grammar: [
    { title:"배수 비교: as ~ as", desc:"'…보다 몇 배 더 ~한'이라는 뜻으로, more than + 배수 + as + 형용사/부사 + as 형태로 씁니다.", ex:"more than three times as high as Finland's (핀란드보다 세 배 넘게 높은)" },
    { title:"분수 표현: a third of", desc:"'~의 3분의 1'이라는 뜻이에요. a quarter of(4분의 1), half of(2분의 1)처럼 분수를 나타냅니다.", ex:"a third of that of Thailand (태국의 것의 3분의 1)" },
    { title:"최상급 the + most/lowest", desc:"여러 대상 중 정도가 가장 큰/작은 것을 나타낼 때 씁니다.", ex:"Finland showed the lowest preference among all six countries. (핀란드가 여섯 나라 중 가장 낮은 선호도를 보였다.)" }
  ],
  tips: [
    "도표 문제는 선택지를 도표의 수치와 하나씩 직접 대조하며 계산해보는 것이 가장 확실해요.",
    "'more than ~ times as ~ as', 'a third of'처럼 배수·분수 표현이 나오면 반드시 실제 숫자로 계산해서 검증하세요.",
    "국가명이나 항목이 많을 때는 도표에 표시해가며 읽어야 헷갈리지 않아요."
  ]
},
{
  num: 26, type: "내용 불일치 (전기문)",
  question: "Roger Payne에 관한 다음 글의 내용과 일치하지 않는 것은?",
  choices: ["하버드 대학교에서 생물학을 공부했다.", "혹등고래가 길고 복잡한 소리를 낸다는 것을 발견했다.", "그의 앨범 Songs of the Humpback Whale은 인기를 얻지 못했다.", "고래와 지구의 해양을 보호하기 위해 Ocean Alliance를 설립했다.", "그의 연구는 해양 포유류를 보호하는 법 제정에 도움을 주었다."],
  answer: 2,

  passage: `Roger Payne was born in Manhattan in 1935. He studied biology at Harvard University and [[eventually::eventually]] earned his Ph.D. from Cornell University in 1961. In 1967, he [[discovered::discovered]] that humpback whales make long and [[complex::complex]] sounds. They're known as "whale songs," and he showed that whales use them to [[communicate::communicate]]. Then in 1970, he released an album Songs of the Humpback Whale, which became a [[surprise_hit::surprise hit]] and helped start the global "Save the Whales" movement. The following year, he [[founded::founded]] Ocean Alliance to protect whales and the earth's oceans, and he used new, safe methods to study whales without [[harming::harming]] them. Over his career, he led more than 100 [[research_trips::research trips]] worldwide, including the Voyage of the Odyssey from 2000 to 2005, which studied ocean [[pollution::pollution]]. His work helped make laws that protect [[marine_mammals::marine mammals]], which finally led to the global ban on [[commercial_whaling::commercial whaling]] in 1986.`,
  translation: `Roger Payne은 1935년 맨해튼에서 태어났다. 그는 하버드 대학교에서 생물학을 공부했고 결국 1961년 코넬 대학교에서 박사 학위를 받았다. 1967년, 그는 혹등고래가 길고 복잡한 소리를 낸다는 것을 발견했다. 그것은 '고래의 노래'로 알려져 있으며, 그는 고래들이 그것을 이용해 의사소통한다는 것을 보여주었다. 그 후 1970년, 그는 앨범 Songs of the Humpback Whale을 발매했는데, 이는 뜻밖의 히트를 기록했고 전 세계적인 '고래를 구하자' 운동이 시작되는 데 도움을 주었다. 이듬해, 그는 고래와 지구의 해양을 보호하기 위해 Ocean Alliance를 설립했고, 고래에게 해를 끼치지 않으면서 연구하는 새롭고 안전한 방법들을 사용했다. 그의 경력 동안, 그는 전 세계에서 100회가 넘는 연구 여행을 이끌었으며, 여기에는 해양 오염을 연구한 2000년부터 2005년까지의 Voyage of the Odyssey도 포함된다. 그의 연구는 해양 포유류를 보호하는 법을 만드는 데 도움을 주었고, 이는 결국 1986년 상업 포경에 대한 전 세계적인 금지로 이어졌다.`,

  },
  passage: `Big [[mammalian::mammalian]] [[herbivore::herbivore]] species react to danger from [[predators::predators]] or humans in different ways. Some species are nervous, fast, and programmed for [[instant_flight::instant flight]] when they [[perceive::perceive]] a [[threat::threat]]. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don't run until necessary. Naturally, the nervous species are difficult to keep in [[captivity::captivity]]. If putting into an [[enclosure::enclosure]], they are likely to [[panic::panic]], and either die of shock or hit themselves [[repeatedly::repeatedly]] to death against the fence in their attempts to [[escape::escape]]. That's true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to [[domesticate::domesticate]] than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can [[leap::leap]] up to nearly 30 feet, and can run at a speed of 50 miles per hour!`,
  translation: `대형 포유류 초식동물 종들은 포식자나 인간으로부터의 위험에 서로 다른 방식으로 반응한다. 어떤 종들은 예민하고, 빠르며, 위협을 감지하면 즉각 도주하도록 프로그램되어 있다. 다른 종들은 더 느리고, 덜 예민하며, 무리 지어 보호받고, 위협받을 때 자리를 지키며, 필요할 때까지 도망가지 않는다. 당연히, 예민한 종들은 가두어 기르기 어렵다. 만약 (그것들이) 우리에 넣어지면, 그것들은 공황 상태에 빠지기 쉬우며, 충격으로 죽거나 탈출을 시도하다가 울타리에 반복적으로 부딪혀 죽기도 한다. 예를 들어 가젤이 그러한데, 가젤은 수천 년 동안 비옥한 초승달 지대의 일부 지역에서 가장 자주 사냥된 사냥감 종이었다. 그 지역의 초기 정착민들이 가젤보다 길들일 기회가 더 많았던 포유류 종은 없었다. 하지만 어떤 가젤 종도 길들여진 적이 없다. 도망치고, 앞뒤 가리지 않고 벽에 스스로 부딪히며, 거의 30피트까지 뛰어오를 수 있고, 시속 50마일로 달릴 수 있는 동물을 몰고 다닌다고 상상해 보라!`,
  grammar: [
    { title:"병렬구조 (동사 나열)", desc:"and로 연결된 동사들은 형태를 통일해야 해요. seek, stand가 모두 원형이므로 병렬을 이룹니다.", ex:"seek protection, stand their ground (보호를 구하다, 자리를 지키다 — 둘 다 원형 동사)" },

{
  num: 30, type: "문맥상 낱말 쓰임 파악",
  question: "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?",

  explanation: "부유해질수록 '평범한 사람들'과의 물리적 접촉이 줄어들면서 현실과의 단절이 생긴다는 것이 문맥상 자연스러우므로, increased(증가된)가 아니라 decreased(감소된)가 되어야 합니다. 따라서 정답은 ⑤번입니다.",
  vocab: {
    tendency: { word:"tendency", pron:"[텐던시]", meaning:"경향, 성향", ex:"We have a tendency to share.", exko:"우리는 나누려는 경향이 있다." },

    blindness: { word:"blindness", pron:"[블라인드니스]", meaning:"무지, 눈이 멂", ex:"It creates blindness to reality.", exko:"그것은 현실에 대한 무지를 만든다." }
  },
  passage: `For a species born in a time when resources were limited and dangers were great, our natural [[tendency::tendency]] to share and [[cooperate::cooperate]] is complicated when resources are plenty and outside dangers are few. When we have less, we tend to be more open to sharing what we have. Certain [[nomadic_tribes::nomadic tribes]] don't have much, yet they are happy to share because it is in their interest to do so. If you happen upon them in your travels, they will open up their homes and give you their food and [[hospitality::hospitality]]. It's not just because they are nice people; it's because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. [[ironically::Ironically]], the more we have, the bigger our fences, the more [[sophisticated::sophisticated]] our security to keep people away and the less we want to share. Our desire for more, [[combined_with::combined with]] our increased physical interaction with the "common folk," starts to create a [[disconnection::disconnection]] or [[blindness::blindness]] to reality.`,
  translation: `자원이 한정되고 위험이 컸던 시대에 태어난 종에게 있어, 공유하고 협력하려는 우리의 타고난 성향은 자원이 풍부하고 외부의 위험이 적을 때 복잡해진다. 우리는 가진 것이 적을 때 가진 것을 더 기꺼이 나누려는 경향이 있다. 어떤 유목 부족들은 가진 것이 많지 않지만, 그렇게 하는 것이 그들에게 이익이 되기 때문에 기꺼이 나눈다. 만약 여행 중에 그들을 우연히 만난다면, 그들은 자신의 집을 열어주고 음식과 환대를 베풀 것이다. 그것은 단지 그들이 착한 사람들이기 때문만이 아니라, 그들의 생존이 나눔에 달려 있기 때문이다. 그들은 언젠가 자신들이 음식과 잠자리가 필요한 여행자가 될 수도 있다는 것을 알기 때문이다. 아이러니하게도, 우리가 더 많이 가질수록, 우리의 울타리는 더 커지고, 사람들을 멀리하기 위한 보안은 더 정교해지며, 나누고 싶은 마음은 더 줄어든다. 더 많은 것을 원하는 우리의 욕구는 '평범한 사람들'과의 늘어난(→실제로는 줄어든) 물리적 접촉과 결합하여 현실과의 단절이나 무지를 만들어내기 시작한다.`,
  grammar: [

    { title:"it is in one's interest to R", desc:"'~하는 것이 …에게 이익이다'라는 뜻이에요.", ex:"it is in their interest to share (나누는 것이 그들에게 이익이다)" },

  tips: [
    "어휘 문맥 문제는 반의어로 바꿔치기된 단어가 정답인 경우가 많아요. 문장의 논리 흐름(원인-결과, 대조)이 앞뒤와 맞는지 확인하세요.",

    "밑줄 단어를 반의어로 바꿔서 읽어보고 문맥이 더 자연스러워지면 그 단어가 정답일 가능성이 높아요."

{
  num: 31, type: "빈칸 추론",
  question: "다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
  choices: ["adapt", "regret", "explore", "struggle", "celebrate"],
  answer: 0,
  explanation: "글 전체가 좋은 일이든 나쁜 일이든 결국 원래의 행복 기준선(baseline)으로 돌아간다는 '쾌락 적응(hedonic adaptation)'을 설명하고 있어요. 앞서 나온 adjust(적응하다), return to our baseline(기준선으로 돌아가다)과 같은 의미이므로 빈칸에는 '적응하다'라는 뜻의 adapt가 들어가야 합니다. 정답은 ①번입니다.",

    longed_for: { word:"longed for", pron:"[롱드 포]", meaning:"간절히 바랐던", ex:"They finally got what they longed for.", exko:"그들은 마침내 간절히 바라던 것을 얻었다." }
  },
  passage: `Whether we feel happy or sad, [[content::content]] or [[discontent::discontent]], is not determined merely by each individual [[successive::successive]] moment of life experience — a good thing happens and I'm happy, a bad thing happens and I'm sad. While our experiences affect our mood, we are not blown in a completely new direction by each [[gust_of_wind::gust of wind]]. As humans, we [[adjust::adjust]] — to new information and events both good and bad — and return to our personal default level of well-being. There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our [[baseline::baseline]] — back up after bad news and back down after good. The [[euphoria::euphoria]] of first love fades, and so does the [[despair::despair]] of a [[break_up::break-up]]. This tendency is best seen with little kids and their toy joy: When they get what they've [[longed_for::longed for]], they believe they will be happy for the rest of their lives. And for the first few minutes of the rest of their lives, they are. But then the kids — like adults — adapt.`,
  translation: `우리가 행복한지 슬픈지, 만족스러운지 불만족스러운지는 삶의 경험의 매 순간순간에 의해서만 결정되는 것이 아니다 — 좋은 일이 생기면 행복하고, 나쁜 일이 생기면 슬프다는 식으로만 결정되지 않는다는 것이다. 우리의 경험이 기분에 영향을 미치기는 하지만, 우리는 한 줄기 바람에 완전히 새로운 방향으로 날아가 버리지는 않는다. 인간으로서 우리는 좋고 나쁜 새로운 정보와 사건들에 적응하며, 우리 개인의 기본적인 행복 수준으로 되돌아간다. 오르내림은 있겠지만, 시간이 지나면 마치 물이 스스로 수평을 찾아가듯, 우리는 우리의 기준선으로 이끌려간다 — 나쁜 소식 후에는 다시 올라가고, 좋은 소식 후에는 다시 내려온다. 첫사랑의 행복감은 사라지고, 이별의 절망감도 마찬가지로 사라진다. 이러한 경향은 어린아이들과 그들의 장난감에 대한 기쁨에서 가장 잘 나타난다: 아이들은 그토록 바라던 것을 얻으면, 남은 평생 행복할 것이라고 믿는다. 그리고 남은 평생의 첫 몇 분 동안은, 실제로 그렇다. 하지만 그 후 아이들은 — 어른들처럼 — 적응한다.`,

  ],
  tips: [
    "빈칸추론은 글의 처음과 끝에 있는 핵심 주제문을 먼저 찾고, 빈칸 문장이 그것을 어떻게 재진술하는지 확인하세요.",
    "이 글의 adjust, return to our baseline 같은 표현이 빈칸의 정답 adapt와 같은 의미를 반복하고 있어요. 반복되는 핵심 개념어를 찾는 것이 핵심이에요.",
    "선택지가 모두 짧은 동사 하나로 제시될 때는 글 전체의 주제를 한 단어로 요약한다는 느낌으로 골라야 해요."
  ]
}
];

let current = 0;
let activeVocabKey = null;
let currentSpeakWord = null;
let activeSheetWord = null;
let currentSheetWordData = null;
let selectedChoice = null;
let answerChecked = false;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) {
  try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; }
}
function setStarred(gid, list) {
  localStorage.setItem(starKey(gid), JSON.stringify(list));
}
function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var gid = String(problems[current].num);
  var starred = getStarred(gid);
  var isStarred = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = isStarred ? '★' : '☆';
  btn.classList.toggle('starred', isStarred);
}
function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = String(problems[current].num);
  var starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) {
    starred.splice(idx, 1);
  } else {
    starred.push({
      word: currentSheetWordData.word,
      pron: currentSheetWordData.pron || '',
      meaning: currentSheetWordData.meaning || '뜻 정보 없음',
      en: currentSheetWordData.en || '',
      ko: currentSheetWordData.ko || ''
    });
  }
  setStarred(gid, starred);
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var placeholders = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      placeholders.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '' + (placeholders.length - 1) + '';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/(\d+)/g, function(m, idx) { return placeholders[idx]; });
    html = html.replace(/\n/g, '<br>');
    return '<p>' + html + '</p>';
  }).join('');
}

function buildTabs() {
  var el = document.getElementById('problem-tabs');
  el.innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" data-i="' + i + '" onclick="selectProblem(' + i + ')">' + p.num + '번</div>';
  }).join('');
}

const circled = ['①', '②', '③', '④', '⑤'];

function renderChart(p) {
  var card = document.getElementById('chart-card');
  if (!p.chart) { card.classList.remove('show'); return; }
  card.classList.add('show');
  document.getElementById('chart-title').textContent = p.chart.title;
  document.getElementById('chart-wrap').innerHTML = p.chart.data.map(function(d) {
    return '<div class="chart-col">' +
      '<div class="chart-bar" style="height:' + (d.read + d.watch + d.listen) * 2 + 'px;">' +
        '<div class="chart-seg listen" style="height:' + (d.listen * 2) + 'px;">' + d.listen + '</div>' +
        '<div class="chart-seg watch" style="height:' + (d.watch * 2) + 'px;">' + d.watch + '</div>' +
        '<div class="chart-seg read" style="height:' + (d.read * 2) + 'px;">' + d.read + '</div>' +
      '</div>' +
      '<div class="chart-label">' + d.label + '</div>' +
    '</div>';
  }).join('');
}

function renderQuiz(p) {
  selectedChoice = null;
  answerChecked = false;
  document.getElementById('quiz-q').textContent = p.num + '. ' + p.question;
  document.getElementById('quiz-choices').innerHTML = p.choices.map(function(c, i) {
    var label = /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c;
    return '<div class="quiz-choice" id="choice-' + i + '" onclick="selectChoice(' + i + ')"><span>' + label + '</span></div>';
  }).join('');
  document.getElementById('quiz-check-btn').textContent = '정답 확인';
  document.getElementById('quiz-check-btn').disabled = false;
  var result = document.getElementById('quiz-result');
  result.classList.remove('show', 'ok', 'no');
  result.textContent = '';
}

function selectChoice(i) {
  if (answerChecked) return;
  selectedChoice = i;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer() {
  if (answerChecked) return;
  var p = problems[current];
  if (selectedChoice === null) {
    document.getElementById('quiz-q').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  answerChecked = true;
  document.querySelectorAll('.quiz-choice').forEach(function(el, idx) {
    if (idx === p.answer) el.classList.add('correct');
    else if (idx === selectedChoice) el.classList.add('wrong');
  });
  var result = document.getElementById('quiz-result');
  var isCorrect = selectedChoice === p.answer;
  result.classList.add('show', isCorrect ? 'ok' : 'no');
  var head = isCorrect ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.';
  result.innerHTML = '<b>' + head + '</b><br>' + p.explanation;
  document.getElementById('quiz-check-btn').textContent = '다시 풀기';
  document.getElementById('quiz-check-btn').disabled = false;
  document.getElementById('quiz-check-btn').onclick = function() { renderQuiz(p); document.getElementById('quiz-check-btn').onclick = checkAnswer; };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  renderChart(p);
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  var keys = Object.keys(p.vocab);
  vg.innerHTML = keys.map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');

  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) {
    return '<div class="tip-item"><p>' + t + '</p></div>';
  }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) {
    t.classList.toggle('active', i === current);
  });

  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';

  switchTab('grammar');
}

function selectProblem(i) {
  current = i;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function go(delta) {
  if (current === problems.length - 1 && delta === 1) {
    current = 0;
  } else {
    current = Math.max(0, Math.min(problems.length - 1, current + delta));
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleTranslation() {
  var box = document.getElementById('translation-box');
  var btn = document.getElementById('btn-trans');
  var show = !box.classList.contains('show');
  box.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var grid = document.getElementById('vocab-grid');
  var btn = document.getElementById('btn-vocab');
  var show = !grid.classList.contains('show');
  grid.classList.toggle('show', show);
  btn.classList.toggle('on', show);
  btn.textContent = show ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-t') === name);
  });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key;
  activeSheetWord = null;
  currentSpeakWord = v.word;
  currentSheetWordData = { word: v.word, pron: v.pron, meaning: v.meaning, en: v.ex, ko: v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: '', ko: '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = '';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower);
}

function lookupWord(lower) {
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      var meaning = entry.meanings && entry.meanings[0];
      var def = meaning && meaning.definitions && meaning.definitions[0];
      if (def) {
        var exHtml = def.example ? def.example + '<br>' : '';
        document.getElementById('sheet-example').innerHTML = exHtml + '(영영풀이) ' + def.definition;
        if (currentSheetWordData && def.example) currentSheetWordData.en = def.example;
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = data && data.responseData && data.responseData.translatedText;
      var meaningText = ko ? ko : '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
      document.getElementById('sheet-meaning').textContent = meaningText;
      if (currentSheetWordData) { currentSheetWordData.meaning = meaningText; currentSheetWordData.ko = ko || ''; }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      var meaningText = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
      document.getElementById('sheet-meaning').textContent = meaningText;
      if (currentSheetWordData) currentSheetWordData.meaning = meaningText;
    });
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() {
  if (currentSpeakWord) speak(currentSpeakWord);
}

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var loadTtsVoices = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  loadTtsVoices();
  window.speechSynthesis.onvoiceschanged = loadTtsVoices;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var synth = window.speechSynthesis;
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  var voices = (ttsVoices && ttsVoices.length) ? ttsVoices : synth.getVoices();
  if (voices && voices.length) {
    var enVoice = voices.find(function(v) { return v.lang === 'en-US'; }) || voices.find(function(v) { return v.lang && v.lang.indexOf('en') === 0; });
    if (enVoice) utter.voice = enVoice;
  }
  synth.cancel();
  setTimeout(function() { synth.speak(utter); }, 80);
}

buildTabs();
render();
</script>
</body>
</html>
