<script>
const problems = [
{
  num: "22", label: "22번", type: "문장 삽입",
  insertSentence: "These involve responsible efforts to seek to restore one's relationship with the sacred, seek to make amends, and seek to repair psychological or moral injury to oneself.",
  insertSentenceKo: "이것에는 신성한 존재와의 관계를 회복하고자 하고, 변상을 하고자 하며, 자신에 대한 심리적 또는 도덕적 상처를 치료하고자 하는 책임감 있는 노력이 포함된다.",
  vocab: {
    psyche: { word:"psyche", pron:"[사이키]", meaning:"마음, 정신", ex:"can repair damage to one's own psyche", exko:"자기 마음의 상처를 치유할 수 있다" },
    self_condemnation: { word:"self-condemnation", pron:"[셀프 칸뎀네이션]", meaning:"자기 비난, 자책", ex:"Often a dominant experience is one's experience of self-condemnation.", exko:"흔히 주된 경험은 자기 비난의 경험이다." },
    dominant: { word:"dominant", pron:"[다미넌트]", meaning:"주된, 지배적인", ex:"Often a dominant experience is one's experience of self-condemnation.", exko:"흔히 주된 경험은 자기 비난의 경험이다." },
    accompany: { word:"accompany", pron:"[어컴퍼니]", meaning:"수반하다, 동반하다", ex:"with accompanying guilt, shame, and regret", exko:"죄책감, 수치심, 후회를 수반하는" },
    commitment: { word:"make a commitment", pron:"[메이크 어 커밋먼트]", meaning:"~하겠다고 다짐하다", ex:"people make commitments to live into the future without repeating moral mistakes.", exko:"사람들은 도덕적 실수를 반복하지 않고 미래로 살아가겠다는 다짐을 한다." },
    compensation: { word:"compensation", pron:"[캄펜세이션]", meaning:"보상", ex:"self-punishment, compensation, letting oneself off of the moral hook", exko:"자기 처벌, 보상, 도덕적 책임에서 벗어나기" }
  },
  funcWords: {
    taking: { word:"taking", tag:"[숙어 take A out on B · A를 B에게 화풀이하다]", meaning:"take는 '가져가다'가 기본 뜻이지만, 'take anger out on others'는 '다른 사람들에게 화풀이하다'라는 숙어예요.", ex:"lead to defensively taking anger out on others.", exko:"방어적으로 타인에게 분노를 표출하게 할 수도 있다." },
    hook: { word:"hook", tag:"[숙어 let oneself off the hook · 책임(곤경)에서 벗어나다]", meaning:"hook은 '갈고리'예요. 'off the hook'은 갈고리에서 풀려난 상태, 즉 '책임·곤경에서 벗어난'이라는 뜻이에요.", ex:"letting oneself off of the moral hook", exko:"도덕적 책임에서 스스로 벗어나기" },
    amends: { word:"amends", tag:"[숙어 make amends · 변상하다, 보상하다]", meaning:"amends는 단독으로 잘 쓰이지 않고 'make amends'로 '(잘못을) 변상하다, 보상하다'라는 뜻이에요.", ex:"seeking to restore justice by making amends", exko:"변상함으로써 정당성 회복을 추구하기" },
    deal: { word:"deal", tag:"[숙어 deal with · 처리하다, 다루다]", meaning:"deal은 '거래'라는 명사로 익숙하지만, 'deal with ~'는 '~을 처리하다, 다루다'라는 숙어예요.", ex:"Many methods are available to deal with such experiences.", exko:"그러한 경험을 처리하기 위해 많은 방법을 이용할 수 있다." },
    seeking: { word:"seeking", tag:"[숙어 seek to · ~하려고 애쓰다]", meaning:"seek은 '찾다, 구하다'예요. 'seeking to restore justice'는 '정의를 회복하려고 애쓰는 것', 'seeking absolution'은 '용서를 구하는 것'이에요.", ex:"such as seeking to restore justice by making amends", exko:"보상을 함으로써 정의를 회복하려고 애쓰는 것과 같은" }
  },
  passage: `Personal virtues like self-compassion and self-forgiveness can repair damage to one's own [[psyche::psyche]] that might produce self-condemnation and lead to defensively taking anger out on others. (  ①  ) Often a [[dominant::dominant]] experience is one's experience of [[self_condemnation::self-condemnation]], with [[accompany::accompanying]] guilt, shame, and regret. (  ②  ) Many methods are available to deal with such experiences and remove or reduce self-condemnation. (  ③  ) They also involve self-forgiveness and the related but different experience of self-acceptance. (  ④  ) In addition, people [[commitment::make commitments]] to live into the future without repeating moral mistakes. (  ⑤  ) But there are other ways to reduce one's sense of injustice — such as seeking to restore justice by making amends, self-punishment, [[compensation::compensation]], letting oneself off of the moral hook, or seeking absolution from the one harmed or from an authority such as a priest.`,
  translation: `자기 연민과 자기 용서와 같은 개인적 덕목은 자기 비난을 낳아 방어적으로 타인에게 분노를 표출하게 할 수도 있는 자기 마음의 상처를 치유할 수 있다. 흔히 주된 경험은 죄책감, 수치심, 후회를 수반하는 자기 비난의 경험이다. 그러한 경험을 처리하고 자기 비난을 없애거나 줄이기 위해 많은 방법을 이용할 수 있다. [이것에는 신성한 존재와의 관계를 회복하고자 하고, 변상을 하고자 하며, 자신에 대한 심리적 또는 도덕적 상처를 치료하고자 하는 책임감 있는 노력이 포함된다.] 그것에는 또한 자기 용서 및 이와 관련이 있지만 다른 자기 수용의 경험도 포함된다. 게다가 사람들은 도덕적 실수를 반복하지 않고 미래로 살아가겠다는 다짐을 한다. 그러나 변상함으로써 정당성 회복 추구하기, 자기 처벌, 보상, 도덕적 책임에서 벗어나기, 해를 입은 사람으로부터 또는 성직자와 같은 권위자로부터 용서 구하기와 같이 부당함의 느낌을 줄이는 다른 방법이 있다.`,

  passage: `Values of [[collectivism::collectivism]] can be reflected in many aspects of behavior. Traditional Asian American and Latinx elders, for example, tend to greet one another with the question, “How is your family today?” [[contrast::Contrast]] this with how most Americans tend to greet each other: “How are you?” The first [[emphasize::emphasizes]] the family (or group) perspective, while the second emphasizes the two individuals speaking to each other. Likewise, [[affective::affective]] expressions in therapy can be strongly influenced by the particular [[orientation::orientation]] one takes. When individuals engage in [[wrongful::wrongful]] behaviors in the United States, they are most likely to experience feelings of guilt. In societies that emphasize collectivism, however, the most dominant affective response to follow a wrongful behavior is [[shame::shame]] rather than guilt. The two are related, but are different: guilt is more an individual affect, whereas shame appears to have additional group connotations (i.e., it reflects broadly on the family or group).`,
  translation: `‘집단주의’의 가치는 행동의 여러 측면에 반영될 수 있다. 예를 들어, 전통적인 아시아계 미국인과 라틴계 연장자들은 “오늘 당신의 가족은 어떻게 지내십니까?”라는 질문으로 서로 인사하는 경향이 있다. 이것을 대부분의 미국인들이 서로 인사하는 방식인 “당신은 어떻게 지내세요?”와 대조해 보라. 첫 번째는 가족(또는 집단) 관점을 강조하는 반면, 두 번째는 서로 대화하는 두 개인을 강조한다. 마찬가지로, 치료에서의 정서적 표현은 자신이 취하는 특정한 지향에 의해 강하게 영향을 받을 수 있다. 미국에서 개인이 잘못된 행동을 할 때, 그들은 아마도 죄책감을 경험할 것이다. 그러나 ‘집단주의’를 강조하는 사회에서는 잘못된 행동 이후에 따라오는 가장 지배적인 정서적 반응은 죄책감보다는 수치심이다. 둘은 관련이 있지만 다르다. 죄책감은 더 개인적인 감정인 반면, 수치심은 추가적인 집단적 함의를 갖는 것으로 보인다(즉, 그것은 가족이나 집단에 광범위하게 영향을 미친다).
→ 사회적 행동의 문화적 차이는 집단주의 사회가 인사와 감정적 반응에서 공동체적 고려를 우선시하는 반면, 개별성을 가치 있게 생각하는 사회는 개인적 상호 작용에 초점을 맞추고 개인적 책임을 강조한다는 것을 보여 준다.`,

  passage: `To understand how [[empathy::empathy]] for an individual can lead to empathic social policy may at first seem like a slippery slope. But such a [[trajectory::trajectory]] can be ‹(a) justified›. Individuals suffer a collection of biases in judgment — systematically [[flawed::flawed]] patterns of reasoning. Because we can see how such biases are shared by many, we can also appreciate how they lead to decisions that contribute to ‹(b) poor› policies. For example, we are too optimistic about our future health, and as a result we too readily [[dismiss::dismiss]] risks to our health from everything from HIV to heart disease to cancer. We treat our future self as too much of a stranger. And we also ‹(c) discount› the risks to others. After all, that's not me — the poor guy living off frozen pot pies in retirement — that's a stranger. As a result, we [[undervalue::undervalue]] future resources and badly undersave for some of the most important and [[foreseeable::foreseeable]] events in our lives, ranging from the costs of health care to retirement. These biases of reason and emotion are not ‹(d) exotic›; they afflict normal people in their daily routines. Their effects are both familiar and expensive: needless suffering from illness, poverty, and a group of less severe problems, such as hunger and loneliness. Individuals want good strategies to block these harmful effects. This ‹(e) pessimistic› bias and [[irrational::irrational]] discounting cost our health care and social welfare systems billions of dollars annually in uninsured treatment and services for the poor. When we plan for our future, it looks as if we often treat our future self not as a later instance of “me,” but as a stranger.`,
  translation: `한 개인에 대한 공감이 어떻게 공감적인 사회 정책으로 이어질 수 있는지를 이해하는 것은 처음에는 미끄러운 비탈처럼 느껴질 수도 있다. 그러나 그러한 궤적은 (a) 정당화될 수 있다. 개인은 판단에 있어 편향의 모음, 즉 체계적으로 결함이 있는 추론 패턴들에 시달린다. 많은 사람에 의해 그러한 편향이 공유된다는 것을 우리가 알 수 있기 때문에, 우리는 또한 그것들이 (b) 잘못된 정책의 원인인 결정을 어떻게 초래하는지도 헤아릴 수 있다. 예를 들어, 우리는 자신의 미래 건강에 대해 지나치게 낙관적이어서, 그 결과 우리는 HIV부터 심장병, 암에 이르기까지 모든 것으로부터 오는 우리 건강에 대한 위협을 너무 쉽게 묵살한다. 우리는 미래의 자신을 지나치게 남[모르는 사람]으로 대한다. 그리고 우리는 다른 사람들에게 닥칠 위험도 (c) 무시한다. 결국 저건 내가 아니고, 은퇴하여 냉동 고기 파이를 주식으로 하는 그 가난한 녀석, 그건 남이다. 그 결과 우리는 미래의 재원을 과소평가하고, 의료비에서 은퇴에 이르기까지 우리 삶에서 가장 중요하고 예측 가능한 몇 가지 사건들을 위한 저축을 매우 부족하게 한다. 이러한 이성과 감정의 편향은 (d) 특이한 것이 아니라, 그것은 매일의 일상에서 보통의 사람들에게 피해를 입힌다. 그것의 영향은 질병, 빈곤, 그리고 굶주림과 외로움 같은 일단의 덜 심각한 문제들로 인한 불필요한 고통으로, 익숙하면서도 비용이 많이 든다. 개인은 이러한 해로운 영향을 막을 좋은 전략을 원한다. 이 (e) 비관적인(→ 낙관적인) 편향과 비이성적인 무시는 무보험 치료와 빈곤층을 위한 서비스를 위해 매년 수십억 달러를 우리의 의료 및 사회 복지 시스템에 부담시키고 있다. 우리는 미래를 계획할 때, 흔히 미래의 자신을 ‘나’의 나중 사례가 아니라 남으로 대하는 것처럼 보인다.`,

  passage: `(A) For thirteen years, I [[coordinate::coordinated]] the Philadelphia Phillies' chapel services in the clubhouse before games. One day, I arranged for Dr. Stephen Olford to be our speaker. Olford was a [[preacher::preacher]] from England, whom Billy Graham had once called “‹(a) the man› who most influenced my ministry.” After Olford delivered his message, [[legendary::legendary]] Phillies third baseman Mike Schmidt was deeply moved and ultimately became a Christian. Mike and Olford continued their conversation afterward.

(D) The more Mike talked with him, the more [[convinced::convinced]] he seemed. Although Mike wanted to keep talking, as game time approached, he headed out to the field. The Phillies had arranged for Dr. Olford and me to sit in the front row, right next to the dugout. In the bottom of the first, with two men on base, Mike Schmidt came up to bat. The next thing we knew, ‹(e) he› hammered one far and deep into the left field seats. Fifty thousand Phillies fans went wild as Mike rounded the bases and headed for home.

(C) While I watched all this, Olford leaped out of his seat and started climbing over the [[railing::railing]]. For a moment, I was too shocked to move. There was the learned Olford in his suit and tie — and ‹(c) he› was making a dive for the dugout! He wanted to go into the dugout and embrace his new friend, Mike Schmidt! The stadium security guards ran to Olford and pushed him back toward the stands, and I tried to grab him and pull him from behind. I shouted to him, “Dr. Olford! The fans aren't allowed on the field! I'll take ‹(d) you› to the locker room after the game.”

(B) After several attempts to persuade ‹(b) him›, I managed to get Olford back into his seat. But for a few moments, I got to see a [[reserved::reserved]] English clergyman go mad at a Phillies game. He simply wanted to celebrate his new friend Mike — nothing more. No wonder even Billy Graham [[look_up_to::looked up to]] this “dugout diver” as a friend and mentor. Stephen Olford was a man who truly, enthusiastically cheered the success and accomplishments of others.`,
  translation: `(A) 나는 13년 동안 필라델피아 필리스의 클럽 하우스에서 경기 전 예배를 주관했다. 어느 날, 나는 Stephen Olford 박사를 우리의 설교자로 주선했다. Olford는 영국 출신의 목사로, Billy Graham이 한때 “나의 사역에 가장 영향을 준 (a) 그 사람”이라고 불렀던 인물이다. Olford가 자신의 메시지를 전한 후, 필리스의 전설적인 3루수 Mike Schmidt는 깊이 감명을 받아 결국 크리스천이 되었다. 이후 Mike와 Olford는 자신들의 대화를 계속했다.

(D) Mike는 그와 대화를 나눌수록 점점 더 독실해 보였다. Mike는 계속 이야기하고 싶었지만, 경기 시간이 다가오자 그는 경기장으로 향했다. 필리스 측은 Olford 박사와 내가 더그아웃 바로 옆에, 앞 열에 앉도록 준비해 주었다. 1회 말, 두 명의 주자가 베이스에 있는 상황에서 Mike Schmidt가 타석에 들어섰다. 어느 틈엔가 (e) 그는 공을 좌측 외야석으로 멀리 깊숙하게 날려 버렸다. Mike가 베이스를 돌아 홈 플레이트로 향할 때 5만 명의 필리스 팬들이 열광했다.

(C) 내가 이 모든 것을 지켜보는 동안, Olford는 자신의 자리에서 벌떡 일어나더니 난간 위로 기어오르기 시작했다. 잠시 나는 충격에 얼어붙었다. 정장에 넥타이까지 갖춘 그 박식한 Olford가 있었고, (c) 그가 더그아웃으로 뛰어들고 있었다! 그는 더그아웃으로 들어가 자신의 새 친구 Mike Schmidt를 끌어안고 싶어 했다. 경기장 보안 요원들이 Olford에게 달려가 그를 스탠드 쪽으로 다시 밀어냈고, 나는 그를 붙잡아 뒤로 당기려고 애썼다. 나는 그에게 소리쳤다. “Olford 박사님! 팬들은 경기장에 들어갈 수 없어요! 제가 경기 이후 (d) 당신을 라커 룸으로 데려가 줄게요.”

(B) (b) 그를 설득하는 몇 번의 시도 후에, 나는 간신히 Olford를 본인의 자리로 다시 앉혔다. 하지만 그 짧은 순간 동안 나는 속마음을 드러내지 않는 영국인 목사가 필리스 경기에 광분하는 것을 보았다. 그는 단지 자신의 새 친구 Mike를 축하하기를 원했던 것이었고 그 이상도 아니었다. Billy Graham조차도 이 ‘더그아웃 다이버’를 친구이자 멘토로 존경한 것은 놀랄 일이 아니었다. Stephen Olford는 다른 사람의 성공과 성취를 진정으로, 열정적으로 응원했던 사람이었다.`,

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;
let currentSheetWordData = null;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g2paper2' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      ph.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {
  document.getElementById('problem-tabs').innerHTML = problems.map(function(p, i) {
    return '<div class="p-tab" onclick="selectProblem(' + i + ')">' + p.label + '</div>';
  }).join('');
}

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

let quizState = [];

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

function renderQuiz(p) {
  quizState = p.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = p.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var q = problems[current].questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var r = document.getElementById('qresult-' + qi);
  var ok = quizState[qi].selected === q.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.') + '</b><br>' + q.explanation;
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '다시 풀기';
  b.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var p = problems[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(p.questions[qi], qi);
  var r = document.getElementById('qresult-' + qi);
  r.classList.remove('show','ok','no'); r.innerHTML = '';
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '정답 확인';
  b.onclick = function() { checkAnswer(qi); };
}

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });

function selectProblem(i, skipHistory) {

var SYN_LABEL = { S:'주어', V:'동사', O:'목적어', C:'보어', M:'수식어', J:'연결어' };
function synLabel(r) {
  return r.split('+').map(function(x) { return SYN_LABEL[x.toUpperCase()] || x; }).join('+');
}
function renderSyntax(p) {
  var el = document.getElementById('syntax-list');
  if (!p.syntax || !p.syntax.length) { el.innerHTML = '<div class="syn-legend-note">이 지문의 구문분석은 준비 중이에요.</div>'; return; }
  var legend = '<div class="syn-legend">' +
    ['S','V','O','C','M','J'].map(function(r) { return '<span class="r-' + r + '">' + SYN_LABEL[r] + ' ' + r + '</span>'; }).join('') + '</div>' +
    '<div class="syn-legend-note">점선 밑줄과 * 표시는 종속절·준동사구 안의 성분이에요. 수식어(M)는 문장 성분이 아닌 꾸미는 말, 연결어(J)는 접속사·연결 표현이에요.</div>';
  el.innerHTML = legend + p.syntax.map(function(s, i) {
    var line = s.c.map(function(c) {
      var first = c[0].split('+')[0];
      var sub = first === first.toLowerCase();
      return '<span class="syn-ch r-' + first.toUpperCase() + (sub ? ' sub' : '') + '"><span class="t">' + c[1] + '</span><span class="l">' + synLabel(c[0]) + '</span></span>';
    }).join('');
    var slash = s.c.map(function(c) { return c[1].replace(/\s+$/, ''); }).join(' <b>/</b> ');
    var ko = s.c.map(function(c) { return c[2]; }).join(' <b>/</b> ');
    return '<div class="syn-card"><div class="syn-num">문장 ' + (i + 1) + '</div><div class="syn-line">' + line + '</div>' +
      '<div class="syn-slash">' + slash + '</div><div class="syn-ko">' + ko + '</div>' +
      '<div class="syn-note">💡 ' + s.n + '</div></div>';
  }).join('');
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-syntax').classList.toggle('active', name === 'syntax');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
