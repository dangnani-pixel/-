<script>
const problems = [
{
  num: "98", label: "98번", type: "문장 삽입",
  insertSentence: "But the industry wants to create lifelong gamers: people who can balance their favorite games with full and active lives.",
  insertSentenceKo: "하지만 이 산업은 '평생 게이머' 즉, 자신이 좋아하는 게임과 충실하고 활기찬 삶의 균형을 잡을 수 있는 사람들을 만들어 내길 원한다.",
  vocab: {
    addiction: { word:"addiction", pron:"[어딕션]", meaning:"중독", ex:"Gamer addiction is a frequent topic at game industry conferences.", exko:"게이머 중독은 게임 산업 회의에서 빈번히 논의되는 주제이다." },
    dilemma: { word:"dilemma", pron:"[딜레마]", meaning:"딜레마, 심각한 문제", ex:"So we have what is perhaps the central dilemma of the game industry over the past thirty years.", exko:"그래서 우리는 어쩌면 지난 삼십 년 동안 게임 산업이 겪은 핵심적인 딜레마를 마주하게 된다." },
    diminish: { word:"diminish", pron:"[디미니시]", meaning:"위축시키다, 줄이다", ex:"how to enable gamers to play more without diminishing their real lives.", exko:"게이머들이 자신의 현실의 삶을 위축시키지 않으면서도 어떻게 더 많이 게임을 즐기게 할 수 있는가" },
    threshold: { word:"threshold", pron:"[쓰레스홀드]", meaning:"한계점", ex:"beyond a certain playing threshold, they start to wonder if they're perhaps missing out on real life.", exko:"플레이 시간의 정해진 한계를 넘어서면 그들은 혹시 자신이 현실의 삶을 놓치고 있는 건 아닌가 하는 생각을 하기 시작한다." },
    miss_out_on: { word:"miss out on", pron:"[미스 아웃 온]", meaning:"~을 놓치다", ex:"they start to wonder if they're perhaps missing out on real life.", exko:"그들은 혹시 자신이 현실의 삶을 놓치고 있는 건 아닌가 하는 생각을 하기 시작한다." }
  },
  passage: `Gamer [[addiction::addiction]] is a frequent topic at game industry conferences: what causes gamer addiction, and how can you help your players avoid it? (  ①  ) This might at first seem surprising: doesn't the industry want gamers to spend more time and money playing games, not less? (  ②  ) And it's true: more gaming by more people is the primary goal of the industry. (  ③  ) So we have what is perhaps the central [[dilemma::dilemma]] of the game industry over the past thirty years: how to enable gamers to play more without [[diminish::diminishing]] their real lives. (  ④  ) The industry knows that gamers want flow and fiero — and the more game developers give it to them, the more time and money gamers will spend on their favorite games. (  ⑤  ) But beyond a certain playing [[threshold::threshold]] — for most gamers, it seems to be somewhere around twenty hours a week — they start to wonder if they're perhaps [[miss_out_on::missing out on]] real life.`,
  translation: `게이머 중독은 게임 산업 회의에서 빈번히 논의되는 주제로, 무엇이 게이머 중독을 일으키는가, 그리고 플레이어들이 그것을 피하도록 어떻게 도울 수 있는가가 논의된다. 이는 처음에는 놀랍게 들릴 수 있는데, 게임 산업은 게이머들이 게임을 하면서 더 적게가 아니라 '더 많은' 시간과 돈을 쓰는 것을 원하지 않는가? 그리고 이것은 사실인데, 즉 더 많은 사람이 더 많이 게임을 하는 것이 이 산업의 주요 목표가 '맞다'. 하지만 이 산업은 '평생 게이머' 즉, 자신이 좋아하는 게임과 충실하고 활기찬 삶의 균형을 잡을 수 있는 사람들을 만들어 내길 원한다. 그래서 우리는 어쩌면 지난 삼십 년 동안 게임 산업이 겪은 핵심적인 딜레마를 마주하게 되는데, 그것은 게이머들이 자신의 현실의 삶을 위축시키지 않으면서도 어떻게 더 많이 게임을 즐기게 할 수 있는 가이다. 그 산업은 게이머들이 몰입감과 성취감을 원한다는 것을 알고 있으며, 게임 개발자들이 게이머들에게 그것을 더 많이 제공하면 할수록, 그들은 자신이 좋아하는 게임에 더욱더 많은 시간과 돈을 쓸 것이다. 하지만 대부분의 게이머의 경우 플레이 시간의 정해진 한계가 일주일에 대략 스무 시간 정도로 보이는데, 그것을 넘어서면 그들은 혹시 자신이 현실의 삶을 놓치고 있는 건 아닌가 하는 생각을 하기 시작한다.`,
  grammar: [
    { title:"동격 명사구 (lifelong gamers: people who ~)", desc:"콜론 뒤에 동격 설명이 이어지는 구조입니다.", ex:"lifelong gamers: people who can balance their favorite games with full and active lives." },
    { title:"the 비교급 ~, the 비교급 …", desc:"'~할수록 더 …하다'라는 구문입니다.", ex:"the more game developers give it to them, the more time and money gamers will spend on their favorite games." }
  ],
  tips: [
    "문장 삽입은 대명사(it, this)가 가리키는 대상이 앞 문장에 있는지 확인하세요.",
    "'But'으로 시작하는 문장은 직전 내용과 반대되는 내용 뒤, 그 반대 설명이 이어지는 문장 앞에 위치합니다."
  ],
  questions: [{ qNum:98, question:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.",
    choices:["①","②","③","④","⑤"],
    answer:2,
    explanation:"주어진 문장은 게임과 삶의 균형을 유지하는 '평생 게이머' 개념을 제시하므로, 균형을 유지하지 못하는 경우를 설명한 문장 뒤이자 그 구체적 설명이 이어지는 문장 앞인 ③이 가장 적절합니다." }]
},
{
  num: "99", label: "99번", type: "요약문 완성",
  insertSentence: "Children's play represents _____(A)_____ work, with no clear line between play and work, and it _____(B)_____ its importance in adult relationships and responsibilities.",
  insertSentenceKo: "어린이의 놀이는 놀이와 일 사이에 분명한 선이 없이 (A) 일을 나타내고, 그것은 어른의 관계와 책임에서 그 중요성을 (B)한다.",
  vocab: {
    opposite: { word:"opposite", pron:"[아퍼짓]", meaning:"반대", ex:"human play is not the opposite of supposedly adult seriousness.", exko:"인간의 놀이는 어른의 진지함으로 추정되는 것과 반대되는 것이 아니다." },
    mean: { word:"mean", pron:"[민]", meaning:"비열한", ex:"Play is not only serious but capable of turning nasty and mean.", exko:"놀이는 진지할 뿐만 아니라 불쾌하고 비열하게 변할 수 있다." },
    politics: { word:"politics", pron:"[팔러틱스]", meaning:"정치", ex:"adults too can see how there may be a sense of play in their jobs, relations, culture, and politics.", exko:"어른들도 또한 그들의 직업, 인간관계, 문화, 정치에 놀이의 의미가 존재할 수 있음을 볼 수 있다." },
    fulfill: { word:"fulfill", pron:"[풀필]", meaning:"충족하다", ex:"however little this sense is fulfilled.", exko:"이러한 의미가 거의 충족되지 않더라도" },
    supposedly: { word:"supposedly", pron:"[서포우저들리]", meaning:"추정상", ex:"human play is not the opposite of supposedly adult seriousness.", exko:"인간의 놀이는 어른의 진지함으로 추정되는 것과 반대되는 것이 아니다." },
    point_of_view: { word:"point of view", pron:"[포인트 오브 뷰]", meaning:"관점", ex:"From the point of view of the child herself, play is the epitome of seriousness.", exko:"어린이 자신의 관점에서 볼 때, 놀이는 진지함의 전형이다." },
    get_into_fights: { word:"get into fights", pron:"[겟 인투 파이츠]", meaning:"싸움에 휘말리다", ex:"Few get into more frequent fights than children playing a game.", exko:"게임을 하고 있는 어린이들보다 더 자주 싸우는 사람은 거의 없다." }
  },
  passage: `It must be noted that human play is not the [[opposite::opposite]] of [[supposedly::supposedly]] adult seriousness. Just watch a child drawing. From the [[point_of_view::point of view]] of the child herself, play is the epitome of seriousness. It is generally taken more seriously by children than is work by adults. Play is not only serious but capable of turning nasty and [[mean::mean]]. Few [[get_into_fights::get into more frequent fights]] than children playing a game. Play is a kind of work. As Freud rightly says, play is a condition for the possibility of healthy work in life. However, this is not because children later develop separate capabilities for work; rather, it is because play is work, the very same activity. For children, there is not a sharp dividing line between play and not-play. Much of children's play is indeed playing at working: being a nurse, teaching, fire-fighting, caring for dolls, and so on. It is considered important and necessary. Likewise, adults too can see how there may be a sense of play in their jobs, relations, culture, and [[politics::politics]], however little this sense is [[fulfill::fulfilled]].`,
  translation: `인간의 놀이는 어른의 진지함으로 추정되는 것과 반대되는 것이 아니라는 점에 주목해야 한다. 그저 어린이가 그림을 그리고 있는 것을 보라. 어린이 자신의 관점에서 볼 때, 놀이는 진지함의 전형이다. 일반적으로 어린이는 놀이를 어른이 일을 받아들이는 것보다 더 진지하게 받아들인다. 놀이는 진지할 뿐만 아니라 불쾌하고 비열하게 변할 수 있다. 게임을 하고 있는 어린이들보다 더 자주 싸우는 사람은 거의 없다. 놀이는 일종의 일이다. 프로이트가 올바르게 말하듯이, 놀이는 인생에서 건강한 일을 가능하게 하는 조건이다. 하지만 이는 아이들이 나중에 일을 위한 별도의 능력을 개발하기 때문이 아니라, 오히려 놀이가 일, 바로 그 동일한 활동'이기' 때문이다. 어린이에게, 놀이와 놀이가 아닌 것 사이에는 뚜렷한 구분 선이 존재하지 않는다. 간호사가 되는 것, 가르치는 것, 불을 끄는 것, 인형을 돌보는 것 등 어린이가 하는 놀이의 대부분은 실제로 일을 하면서 하는 놀이이다. 그것은 중요하고 필요한 것으로 여겨진다. 마찬가지로, 어른들도 또한 그들의 직업, 인간관계, 문화, 정치에 어떻게 놀이의 의미가 존재할 수 있는지를 볼 수 있는데, 이는 이러한 의미가 거의 충족되지 않더라도 그러하다.`,

  passage: `Humans began [[transform::transforming]] the biosphere long before agriculture. Even before the Holocene, hunting and foraging pressures on terrestrial, fresh water, and marine species caused local populations to decline and caused a number of global species ‹(a) extinctions›. As human populations spread and grew, hunting and foraging pressures generally increased, though the rise of agriculture displaced these pressures to some degree. With the spread of agriculture, terrestrial species retreated to shrinking [[habitat::habitats]], and habitat loss became the ‹(b) primary› driver of population declines and extinctions for non-prey species. The story for [[aquatic::aquatic]] species is ‹(c) similar›.

Increasing societal demands for seafood, including freshwater species, have continued to [[put_pressure_on::put intense harvest pressures on]] wild species dwelling in freshwater, coastal, and marine environments. Outside of a few freshwater and coastal habitats, traditional hunting and foraging pressures were generally ‹(d) [[insufficient::insufficient]]› to cause major population declines and extinctions, and the open ocean remained only lightly influenced. All of that changed with industrial-scale fishing, as fleets of 'factory ships' expanded across the oceans. As populations and demands for seafood grew after 1950, fishing also grew in scale and intensity, including the use of massive nets dragged across the seafloor. At the same time, coastal habitats were increasingly transformed by agricultural runoff and the construction of urban areas and other infrastructure, including the removal of mangroves and other wetland systems, ‹(e) [[alter::altering]]› areas [[key_to::key to]] reproduction for many species.`,
  translation: `인간은 농업 훨씬 이전부터 생물권을 변화시키기 시작했다. 심지어 홀로세 이전에도, 육생종, 담수종, 해양종에 대한 수렵과 채집 압박이 지역 개체군을 감소시키고 다수의 지구에 존재하는 종의 멸종을 초래했다. 인간 집단이 퍼지고 성장하면서 수렵과 채집 압박은 일반적으로 증가했는데, 농업의 출현이 이러한 압박을 어느 정도 대체했는데도 그랬다. 농업의 확산과 함께 육생종은 줄어드는 서식지로 후퇴했고, 서식지 손실이 피식자가 아닌 종의 개체군 감소와 멸종의 주요 원인이 되었다. 수생종의 이야기는 유사하다(→ 다르다).

담수종을 포함하여 해산물에 대한 증가하는 사회적 수요는 담수, 연안, 그리고 해양 환경에 서식하는 야생종에 강한 어획 압박을 지속적으로 가해 왔다. 몇몇 담수와 연안 서식지를 제외하고는, 전통적인 수렵과 채집 압박은 일반적으로 주요한 개체군 감소와 멸종을 야기하기에는 불충분했고 외해는 가벼운 영향만 받은 채로 남아 있었다. '공장 선박' 선단들이 바다 전체로 확장되면서, 산업 규모 어업이 들어서며 그 모든 것이 바뀌었다. 1950년 이후 인구와 해산물에 대한 수요가 증가하면서, 어업 또한 규모와 강도에서 커졌는데, 이는 바다 밑바닥을 끌어당기는 거대한 그물의 사용을 포함했다. 동시에, 연안 서식지들은 농업 유출수와 맹그로브와 기타 습지 체계의 제거를 포함하여, 도시 지역 및 기타 사회 기반 시설의 건설에 의해 점점 더 변형되었는데, 이는 많은 종의 번식에 핵심적인 지역들을 변화시켰다.`,

      explanation:"인간이 농업 이전부터 수렵과 채집으로 생물종 멸종을 야기했고, 농업 확산으로 서식지 손실이 주된 멸종 요인이 되었으며, 1950년 이후 산업 규모 어업으로 해양 생태계에도 큰 변화가 일어났다는, 시간의 흐름에 따른 인간 활동의 변화와 그 영향을 다룬 내용이므로 제목으로 가장 적절한 것은 ⑤ 'From Hunting to Fishing: Human Impacts on Earth's Species Over Time'입니다." },

{

  vocab: {
    break_into: { word:"break into", pron:"[브레이크 인투]", meaning:"~에 발을 들이다", ex:"one way to break into publishing was as a secretary, so she studied touch-typing and shorthand.", exko:"출판업계에 발을 들일 수 있는 한 가지 방법은 비서로서 일하는 것이어서, 타이프 치기와 속기를 배웠다." },

    expand_on: { word:"expand on", pron:"[익스팬드 온]", meaning:"~에 대해 부연하다", ex:"Ms. Nordstrom asked her to expand on the memo.", exko:"Nordstrom 씨는 그녀에게 그 메모에 대해 부연해 달라고 요청했다." },
    assistant: { word:"assistant", pron:"[어시스턴트]", meaning:"조수, 보조", ex:"she passed the test and soon became the assistant to Ursula Nordstrom.", exko:"그녀는 시험에 통과해서 곧 Ursula Nordstrom의 조수가 되었다." },
    adore: { word:"adore", pron:"[어도어]", meaning:"무척 좋아하다", ex:"Ms. Zolotow adored Ms. Brown, and once she had a story idea for her.", exko:"Zolotow 씨는 Brown 씨를 무척 좋아했고, 한 번은 그녀를 위한 이야기 아이디어가 있었다." }
  },
  passage: `(A) When she was a young woman, Charlotte Zolotow needed a job during the Great Depression. She wanted to be in publishing, and one way to [[break_into::break into]] publishing was as a [[secretary::secretary]], so she studied touch-typing and shorthand. She applied for a job at Harper's and immediately failed a secretarial test that the personnel manager Marianne Brindwell gave ‹(a) her›.

(C) Fortunately, Ms. Brindwell was a kind woman who told her, "Dear, I think you're nervous. Why don't you come back tomorrow and try again?" (Ms. Zolotow says, "Imagine anyone doing this today!") ‹(d) She› did come back the next day, and this time she passed the test and soon became the [[assistant::assistant]] to Ursula Nordstrom, editor and publisher of books for children at Harper's. One of the people whom Ms. Nordstrom published was Margaret Wise Brown, author of Goodnight Moon.

(D) Ms. Brown was a kind woman. Harper's offices were not air conditioned back then and so the offices were sweltering on hot summer days. Whenever Ms. Brown came in for a summer meeting with Ms. Nordstrom, she always brought three ice-cold soft drinks for Ms. Nordstrom, Ms. Zolotow, and herself. As you may expect, Ms. Zolotow [[adore::adored]] Ms. Brown, and once she had a story idea for ‹(e) her›. Ms. Zolotow lived near Washington Square Park in Greenwich Village. At different times of the day, different groups of people went to the park.

(B) Ms. Zolotow wanted Ms. Brown to write a story about the park, so ‹(b) she› wrote a memo to Ms. Nordstrom about giving this idea for a book to Ms. Brown. Ms. Nordstrom asked her to [[expand_on::expand on]] the memo. Ms. Zolotow did so, and Ms. Nordstrom told ‹(c) her›, "Congratulations! You've just written your first children's book!" She then added, "You must never, ever, ever tell a writer what you think would make a wonderful book. The idea has to come from the writer. What you have here is your book, not Margaret's."`,
  translation: `(A) Charlotte Zolotow는 젊었을 때, 대공황 동안에 일이 필요했다. 그녀는 출판업계에서 일하고 싶었고, 출판업계에 발을 들일 수 있는 한 가지 방법은 비서로서 일하는 것이어서, 타이프 치기와 속기를 배웠다. 그녀는 Harper's에서의 일자리에 지원했고 인사 담당 관리자 Marianne Brindwell이 그녀에게 낸 비서 시험에서 곧바로 떨어졌다.

(C) 다행히도 Brindwell 씨는 그녀에게 "아가씨, 긴장한 것 같네요. 내일 다시 와서 다시 시도하는 게 어때요?"라고 말한 친절한 여성이었다. (Zolotow 씨는 "오늘날 누군가가 이런 일을 하는 것을 상상해 보세요!"라고 말한다.) 그녀는 다음 날 정말로 돌아왔고, 이번에는 시험에 통과해서 곧 Harper's에서 아동 도서 편집자이자 출판인이었던 Ursula Nordstrom의 조수가 되었다. Nordstrom 씨가 출판한 사람 중 한 명이 Goodnight Moon의 저자 Margaret Wise Brown이었다.

(D) Brown 씨는 친절한 여성이었다. 당시 Harper's 사무실에는 에어컨이 없었기 때문에 더운 여름날 사무실은 무더위에 시달렸다. Brown 씨는 여름에 Nordstrom 씨와 회의하러 올 때마다 항상 Nordstrom 씨와 Zolotow 씨, 그리고 자신을 위해 얼음처럼 차가운 청량 음료를 세 개 가져왔다. 여러분이 예상할 수도 있듯이, Zolotow 씨는 Brown 씨를 무척 좋아했고, 한 번은 그녀를 위한 이야기 아이디어가 있었다. Zolotow 씨는 Greenwich Village의 Washington Square 공원 근처에 살았다. 하루 중 다른 시간대마다 서로 다른 사람들 무리가 그 공원에 왔다.

let current = 0, activeVocabKey = null, currentSpeakWord = null, activeSheetWord = null;

function starKey(gid) { return 'vocabStar_' + gid; }
function getStarred(gid) { try { return JSON.parse(localStorage.getItem(starKey(gid)) || '[]'); } catch(e) { return []; } }
function setStarred(gid, list) { localStorage.setItem(starKey(gid), JSON.stringify(list)); }
function gidOf() { return 'g2paper1' + problems[current].num; }

function updateSheetStarBtn() {
  var btn = document.getElementById('sheet-star');
  if (!currentSheetWordData) { btn.textContent = '☆'; btn.classList.remove('starred'); return; }
  var starred = getStarred(gidOf());
  var is = starred.some(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  btn.textContent = is ? '★' : '☆';
  btn.classList.toggle('starred', is);
}

function toggleSheetStar() {
  if (!currentSheetWordData) return;
  var gid = gidOf(), starred = getStarred(gid);
  var idx = starred.findIndex(function(w) { return w.word.toLowerCase() === currentSheetWordData.word.toLowerCase(); });
  if (idx >= 0) starred.splice(idx, 1);
  else starred.push({ word: currentSheetWordData.word, pron: currentSheetWordData.pron || '', meaning: currentSheetWordData.meaning || '뜻 정보 없음', en: currentSheetWordData.en || '', ko: currentSheetWordData.ko || '' });
  setStarred(gid, starred);
  if (window.starSync) window.starSync.notifyStarChange(starKey(gid));
  if (idx < 0 && window.studyStats) window.studyStats.record('star', true);
  else if (idx >= 0 && window.studyStats) window.studyStats.unrecord('star');
  updateSheetStarBtn();
}

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/^\(([A-D])\)/, function(m, letter) {
      ph.push('<span class="plabel">(' + letter + ')</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    html = html.replace(/‹(.+?)›/g, '<u class="uline">$1</u>');
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function buildTabs() {

const circled = ['①','②','③','④','⑤'];
function choiceLabel(c, i) { return /^[①②③④⑤]/.test(c) ? c : circled[i] + ' ' + c; }

let quizState = [];

function renderChoicesHtml(q, qi) {
  return q.choices.map(function(c, i) {
    return '<div class="quiz-choice" onclick="selectChoice(' + qi + ',' + i + ')"><span>' + choiceLabel(c, i) + '</span></div>';
  }).join('');
}

function renderQuiz(p) {
  quizState = p.questions.map(function() { return { selected: null, checked: false }; });
  document.getElementById('quiz-container').innerHTML = p.questions.map(function(q, qi) {
    return '<div class="quiz-card">' +
      '<div class="quiz-q">' + q.qNum + '. ' + q.question + '</div>' +
      '<div id="qchoices-' + qi + '">' + renderChoicesHtml(q, qi) + '</div>' +
      '<button class="quiz-check-btn" id="qcheck-' + qi + '" onclick="checkAnswer(' + qi + ')">정답 확인</button>' +
      '<div class="quiz-result" id="qresult-' + qi + '"></div>' +
    '</div>';
  }).join('');
}

function selectChoice(qi, i) {
  if (quizState[qi].checked) return;
  quizState[qi].selected = i;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer(qi) {
  var q = problems[current].questions[qi];
  if (quizState[qi].checked) return;
  if (quizState[qi].selected === null) {
    document.getElementById('qchoices-' + qi).scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  quizState[qi].checked = true;
  document.querySelectorAll('#qchoices-' + qi + ' .quiz-choice').forEach(function(el, idx) {
    if (idx === q.answer) el.classList.add('correct');
    else if (idx === quizState[qi].selected) el.classList.add('wrong');
  });
  var r = document.getElementById('qresult-' + qi);
  var ok = quizState[qi].selected === q.answer;
  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[q.answer] + '번이에요.') + '</b><br>' + q.explanation;
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '다시 풀기';
  b.onclick = function() { retryQuestion(qi); };
}

function retryQuestion(qi) {
  var p = problems[current];
  quizState[qi] = { selected: null, checked: false };
  document.getElementById('qchoices-' + qi).innerHTML = renderChoicesHtml(p.questions[qi], qi);
  var r = document.getElementById('qresult-' + qi);
  r.classList.remove('show','ok','no'); r.innerHTML = '';
  var b = document.getElementById('qcheck-' + qi);
  b.textContent = '정답 확인';
  b.onclick = function() { checkAnswer(qi); };
}

function showWord(key) {

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
(function() {
  var m = /^#p(\d+)$/.exec(location.hash);
  var idx = m ? parseInt(m[1], 10) : -1;
  if (idx >= 0 && idx < problems.length) current = idx;
  render();
  history.replaceState({ pIdx: current }, '', '#p' + current);
  window.addEventListener('popstate', function(e) {
    var i = (e.state && typeof e.state.pIdx === 'number') ? e.state.pIdx : -1;
    if (i < 0) {
      var mm = /^#p(\d+)$/.exec(location.hash);
      i = mm ? parseInt(mm[1], 10) : 0;
    }
    if (i >= 0 && i < problems.length && i !== current) selectProblem(i, true);
  });
})();
</script>
