<script>
const problems = [
{
  num: 18, type: "글의 목적 파악",
  question: "다음 글의 목적으로 가장 적절한 것은?",
  choices: ["탁구 대회 운영을 위한 물품 기부를 요청하려고","탁구 센터 재개장 일정 연기를 알리려고","탁구 센터 이전 소식을 안내하려고","탁구 강습 프로그램을 홍보하려고","탁구 강습비 인상을 공지하려고"],
  answer: 1,
  explanation: "'We regret to inform you that the center's reopening must be delayed.'와 '원래 4월 1일 → 5월 1일로 변경'이라는 내용이 핵심이므로, 재개장 일정 연기를 알리는 ②번이 정답입니다.",
  vocab: {
    upcoming: { word:"upcoming", pron:"[업커밍]", meaning:"다가오는", ex:"the upcoming reopening of the center", exko:"다가오는 센터의 재개장" },
    reopening: { word:"reopening", pron:"[리오프닝]", meaning:"재개장", ex:"The center's reopening must be delayed.", exko:"센터의 재개장이 연기되어야 합니다.", etym:"re-(다시) + open(열다) + -ing → '다시 여는 것' → '재개장'. 같은 re- 접두사를 쓰는 단어: return(re-다시 + turn-돌다 → 돌아가다), rebuild(re-다시 + build-짓다 → 다시 짓다), renew(re-다시 + new-새로운 → 새롭게 하다)." },
    unexpected: { word:"unexpected", pron:"[언익스펙티드]", meaning:"예상치 못한", ex:"unexpected electrical issues were discovered", exko:"예상치 못한 전기 문제가 발견되었다", etym:"un-(부정) + ex-(밖으로) + spect(보다, Latin spectare) + -ed → '밖을 내다보며 미리 예상하지 못한' → '예상치 못한'. 같은 spect 어근을 쓰는 다른 접두사 단어: inspect(in-안으로 + spect → 안을 들여다보다 → 조사하다), respect(re-다시 + spect → 다시 보다 → 존중하다), prospect(pro-앞으로 + spect → 앞을 내다보다 → 전망)." },
    electrical: { word:"electrical", pron:"[일렉트리컬]", meaning:"전기의", ex:"There were electrical issues.", exko:"전기 문제가 있었다.", etym:"electr(그리스어 elektron-호박, 정전기) + -ic + -al(형용사 접미사) → '전기의'. 같은 electr- 어근을 쓰는 단어: electricity(electr + -icity → 전기), electrician(electr + -ician → 전기 기술자)." },
    regret: { word:"regret to inform", pron:"[리그렛 투 인폼]", meaning:"유감스럽게도 알리다", ex:"We regret to inform you of the delay.", exko:"유감스럽게도 지연을 알려드립니다." },
    delayed: { word:"delayed", pron:"[딜레이드]", meaning:"연기된", ex:"The reopening must be delayed.", exko:"재개장이 연기되어야 한다." },
    originally: { word:"originally", pron:"[오리지널리]", meaning:"원래", ex:"It was originally scheduled to reopen on April 1st.", exko:"원래 4월 1일에 재개장할 예정이었다.", etym:"origin(oriri-일어나다, 생겨나다, Latin) + -al + -ly → '근원으로부터' → '원래는'. 같은 origin 어근을 쓰는 다른 접두사 단어: aboriginal(ab-~로부터 + origin → 원래 그 자리에서 생겨난 → 원주민의)." },
    patience: { word:"patience", pron:"[페이션스]", meaning:"인내, 양해", ex:"Thank you for your patience.", exko:"양해해 주셔서 감사합니다.", etym:"pati(견디다, 고통을 겪다, Latin pati) + -ence(명사 접미사) → '견뎌내는 성질' → '인내'. 같은 pati 어근을 쓰는 단어: patient(pati + -ent → 견디는 → 참을성 있는; 환자), passion(pati의 변형 passio → 겪는 것 → 열정, 수난)." }
  },
  funcWords: {
    take: { word:"take", tag:"[동사 take · take longer]", meaning:"take를 '가져가다, 잡다'로 외운 학생은 여기서 막혀요. take가 시간과 함께 쓰이면 '(시간이) 걸리다'라는 뜻이에요. take longer than we planned는 '우리가 계획했던 것보다 더 오래 걸리다'로 해석돼요.", ex:"Unfortunately, during the repair process, unexpected electrical issues were discovered, causing the work to take longer than we planned.", exko:"안타깝게도, 보수 과정에서 예상치 못한 전기 문제가 발견되어 작업이 저희가 계획했던 것보다 더 오래 걸리게 되었습니다." },
    forward: { word:"forward", tag:"[관용구 look forward to ~ing]", meaning:"forward를 '앞으로'라고만 알면 뜻이 통하지 않아요. 'look forward to + 동사ing'는 '~하기를 기대하다, 고대하다'라는 관용 표현이에요. 여기서 to는 to부정사가 아니라 전치사라서 뒤에 seeing이 온 점도 함께 기억하세요.", ex:"We look forward to seeing you back on the court soon.", exko:"곧 코트에서 여러분을 다시 뵙기를 기대합니다." },
    causing: { word:"causing", tag:"[분사구문 · 결과]", meaning:"동사 discovered 뒤에 콤마 없이 이어지는 causing은 '그래서 ~하게 만들다'라는 결과를 나타내는 분사구문이에요. 문제가 발견된 것이 원인이 되어 작업이 더 오래 걸리게 되었다는 인과관계를 나타내며, '~해서 …하게 되다'로 해석하면 자연스러워요.", ex:"Unfortunately, during the repair process, unexpected electrical issues were discovered, causing the work to take longer than we planned.", exko:"안타깝게도, 보수 과정에서 예상치 못한 전기 문제가 발견되어 작업이 저희가 계획했던 것보다 더 오래 걸리게 되었습니다." },
    to: { word:"to", tag:"[to부정사 · 목적]", meaning:"to는 여기서 '~하기 위해(목적)'라는 뜻의 to부정사 부사적 용법이에요. it will now reopen on May 1st to ensure the safety of all members는 '모든 회원의 안전을 보장하기 위해 5월 1일에 재개장할 것이다'라고 해석돼요.", ex:"However, it will now reopen on May 1st to ensure the safety of all members.", exko:"그러나 모든 회원의 안전을 보장하기 위해 이제 5월 1일에 재개장할 것입니다." },
    back: { word:"back", tag:"[부사 back · 문맥 확인 필요]", meaning:"back은 여기서 '뒤로'가 아니라 '다시, 원래 상태로'라는 뜻의 부사예요. 'seeing you back on the court'는 '코트에서 여러분을 다시 보다'라는 의미로, 회원들이 다시 탁구장에 돌아오는 것을 가리켜요. 사전에서 back을 찾으면 '뒤로'가 먼저 나오지만 이 문맥에서는 어울리지 않으니 주의하세요.", ex:"We look forward to seeing you back on the court soon.", exko:"곧 코트에서 여러분을 다시 뵙기를 기대합니다." },
    however: { word:"However", tag:"[접속부사 however]", meaning:"however는 앞 문장(재개장이 연기되었다는 안 좋은 소식)과 반대·대조되는 내용을 이어줄 때 쓰는 접속부사로 '그러나, 하지만'이라고 해석해요. 문장 맨 앞에 쓰이며 뒤에 콤마가 옵니다.", ex:"However, it will now reopen on May 1st to ensure the safety of all members.", exko:"그러나 모든 회원의 안전을 보장하기 위해 이제 5월 1일에 재개장할 것입니다." }
  },
  passage: `Dear Connexa Point Table Tennis Center members,

I am the manager of the Connexa Point Table Tennis Center. Thank you for your interest in the [[upcoming::upcoming]] [[reopening::reopening]] of the center. Unfortunately, during the repair process, [[unexpected::unexpected]] [[electrical::electrical]] issues were discovered, causing the work to take longer than we planned. We [[regret::regret to inform]] you that the center's reopening must be [[delayed::delayed]]. The center was [[originally::originally]] scheduled to reopen on April 1st. However, it will now reopen on May 1st to ensure the safety of all members. We look forward to seeing you back on the court soon. Thank you for your [[patience::patience]] and understanding.

Sincerely,
Manager of the Table Tennis Center`,
  translation: `Connexa Point 탁구 센터 회원 여러분께,

    by: { word:"by", tag:"[전치사 by · 수단]", meaning:"by는 두 곳에서 모두 '~함으로써(수단)'라는 뜻으로 쓰였어요. 'than by opening up to them'은 '그들에게 마음을 엶으로써'라는 뜻이고, 'By sharing a revealing story'는 '이야기를 공유함으로써'라는 뜻이에요. by 뒤에는 동명사(-ing)가 와서 수단·방법을 나타냅니다.", ex:"There is simply no better way to influence or stir an audience — instantly, powerfully, authentically — than by opening up to them with a personal story or anecdote.", exko:"청중에게 영향을 주거나 그들의 마음을 움직이는 데 있어 — 즉각적이고, 강력하며, 진정성 있게 — 개인적인 이야기나 일화로 그들에게 마음을 여는 것보다 더 나은 방법은 단연코 없다." },
    to: { word:"to", tag:"[to부정사 · 형용사적 용법]", meaning:"to는 앞의 명사를 꾸며주는 형용사적 용법의 to부정사로 두 번 쓰였어요. 'groundwork for you to then persuade them'은 '그들을 설득하기 위한 기반'이라는 뜻이고, 'a way to identify with you'는 '당신에게 공감할 수 있는 방법(길)'이라는 뜻이에요. 둘 다 앞의 명사(groundwork, way)를 꾸며줍니다.", ex:"By sharing a revealing story or a personal flaw, you allow audience members a way to identify with you.", exko:"자신을 드러내는 이야기나 개인적인 결점을 공유함으로써, 여러분은 청중이 여러분에게 공감할 수 있는 길을 열어준다." },
    that: { word:"that", tag:"[접속사 that · 명사절]", meaning:"that은 여기서 관계대명사가 아니라 '~라는 것'이라는 뜻으로 명사절을 이끄는 접속사예요. 'The harsh reality is that people won't bond ~'는 '냉혹한 현실은 사람들이 ~하지 않는다는 것이다'로 해석돼요.", ex:"The harsh reality is that people won't bond with your arguments, but they will, says speech coach Bas van den Beld, \"bond with you\" — the person making those arguments.", exko:"냉혹한 현실은 사람들이 여러분의 주장과 유대를 맺지는 않지만, 화술 코치 Bas van den Beld가 말하듯이 그들은 그 주장을 하는 사람인 \"여러분과 유대를 맺을 것\"이라는 점이다." },
    of: { word:"of", tag:"[전치사 of · a way of -ing]", meaning:"of는 '~의'라는 소유격 의미가 아니라, 'a way of bonding', 'of laying the groundwork'처럼 앞의 명사(way)의 구체적인 내용을 설명하는 동명사와 함께 쓰여 '~하는 (방법)'이라고 해석돼요.", ex:"It is a tried-and-tested way of bonding with an audience of strangers — and of laying the groundwork for you to then persuade them.", exko:"그것은 낯선 청중과 유대를 형성하는, 그리고 그런 다음 그들을 설득하기 위한 기반을 놓는 검증된 방법이다." },
    says: { word:"says", tag:"[삽입절 says]", meaning:"says speech coach Bas van den Beld는 인용문 중간에 삽입된 절로, '화술 코치 Bas van den Beld가 말하듯이'라는 뜻이에요. 원래 순서라면 'speech coach Bas van den Beld says that they will bond with you'이지만, 강조를 위해 says와 주어가 문장 중간에 삽입되었어요.", ex:"The harsh reality is that people won't bond with your arguments, but they will, says speech coach Bas van den Beld, \"bond with you\" — the person making those arguments.", exko:"냉혹한 현실은 사람들이 여러분의 주장과 유대를 맺지는 않지만, 화술 코치 Bas van den Beld가 말하듯이 그들은 그 주장을 하는 사람인 \"여러분과 유대를 맺을 것\"이라는 점이다." },
    key: { word:"key", tag:"[형용사 key · 품사 확인 필요]", meaning:"key는 명사로 '열쇠'라는 뜻이 가장 먼저 떠오르지만, 여기 a key biographical detail에서는 명사 detail을 꾸며주는 형용사로 '핵심적인, 중요한'이라는 뜻이에요. '열쇠가 되는 신상 정보'가 아니라 '핵심적인 신상 정보'라고 해석해야 자연스러워요.", ex:"I'm saying that you can share a key biographical detail, or an emotion that you're feeling in the moment, or a self-deprecating joke.", exko:"내가 말하는 것은 핵심적인 신상의 세부 내용이나, 그 순간 느끼고 있는 감정, 혹은 자기 비하적인 농담을 공유할 수 있다는 것이다." },
    stage: { word:"stage", tag:"[명사 stage · 의미 확인 필요]", meaning:"stage는 '단계, 시기'라는 뜻으로 흔히 알려져 있지만, 여기 baby pictures from the stage에서는 강연자가 서는 '무대'라는 뜻이에요. '발달 단계에서'가 아니라 '무대에서'라고 해석해야 문맥에 맞아요.", ex:"To be clear: I'm not saying you need to tell them long stories about your family vacations or show them baby pictures from the stage.", exko:"분명히 하자면, 나는 여러분이 가족 여행에 대한 긴 이야기를 하거나 무대에서 아기 사진을 보여줘야 한다고 말하는 것이 아니다." }
  },
  passage: `There is simply no better way to influence or [[stir::stir]] an audience — instantly, powerfully, authentically — than by opening up to them with a personal story or [[anecdote::anecdote]]. To be clear: I'm not saying you need to tell them long stories about your family vacations or show them baby pictures from the stage. I'm saying that you can share a key [[biographical::biographical]] detail, or an emotion that you're feeling in the moment, or a [[self_deprecating::self-deprecating]] joke. It is a [[tried_and_tested::tried-and-tested]] way of [[bonding::bonding]] with an audience of strangers — and of laying the [[groundwork::groundwork]] for you to then persuade them. The harsh reality is that people won't bond with your arguments, but they will, says speech coach Bas van den Beld, "bond with you" — the person making those arguments. By sharing a revealing story or a personal flaw, you allow audience members a way to [[identify_with::identify with]] you.`,
  translation: `청중에게 영향을 주거나 그들의 마음을 움직이는 데 있어 — 즉각적이고, 강력하며, 진정성 있게 — 개인적인 이야기나 일화로 그들에게 마음을 여는 것보다 더 나은 방법은 단연코 없다. 분명히 하자면, 나는 여러분이 가족 여행에 대한 긴 이야기를 하거나 무대에서 아기 사진을 보여줘야 한다고 말하는 것이 아니다. 내가 말하는 것은 핵심적인 신상의 세부 내용이나, 그 순간 느끼고 있는 감정, 혹은 자기 비하적인 농담을 공유할 수 있다는 것이다. 그것은 낯선 청중과 유대를 형성하는, 그리고 그런 다음 그들을 설득하기 위한 기반을 놓는 검증된 방법이다. 냉혹한 현실은 사람들이 여러분의 주장과 유대를 맺지는 않지만, 화술 코치 Bas van den Beld가 말하듯이 그들은 그 주장을 하는 사람인 "여러분과 유대를 맺을 것"이라는 점이다. 자신을 드러내는 이야기나 개인적인 결점을 공유함으로써, 여러분은 청중이 여러분에게 공감할 수 있는 길을 열어준다.`,
  grammar: [
    { title:"There is no better way to A than by B", desc:"'B하는 것보다 A하는 더 나은 방법은 없다'라는 최상급 의미의 비교 표현이에요.", ex:"no better way to influence an audience than by opening up (마음을 여는 것보다 청중에게 영향을 주는 더 나은 방법은 없다)" },

  funcWords: {
    people: { word:"people", tag:"[명사 people · 다의어]", meaning:"people은 보통 '사람들'이지만, the Iroquois people처럼 민족 이름 뒤에 오면 '~족, 민족'이라는 뜻이에요. leaders of the native North American Iroquois people은 '북미 원주민 이로쿼이족의 지도자들'로 해석돼요. 같은 문장 뒤쪽의 instructing people은 평범한 '사람들'이라는 뜻이니 문맥으로 구분하세요.", ex:"Centuries ago, leaders of the native North American Iroquois people created \"seven generation stewardship,\" instructing people to consider the impact of every decision on their children, seven generations into the future.", exko:"수 세기 전, 북미 원주민 이로쿼이족의 지도자들은 '일곱 세대 관리'라는 것을 만들어, 사람들에게 모든 결정이 미래 일곱 세대 후의 자손들에게 미칠 영향을 고려하도록 가르쳤다." },

    while: { word:"while", tag:"[접속사 while · 양보]", meaning:"while은 '~하는 동안'이 아니라 여기서는 '~하는 한편, ~하면서도'라는 대조·양보의 뜻으로 쓰였어요. 조상이 남긴 혜택을 누리는 것과 동시에 후손을 생각해야 한다는 대조를 나타내요.", ex:"In the precious few decades that Earth is ours, while we enjoy the gardens planted by our ancestors, we must not steal the shade from our descendants.", exko:"지구가 우리의 것인 그 소중한 몇십 년 동안, 우리가 조상들이 심어 놓은 정원을 누리는 한편, 우리는 후손들로부터 그늘을 훔쳐서는 안 된다." },
    as: { word:"as", tag:"[전치사 as · 자격]", meaning:"as는 '~로서(자격)'이라는 뜻의 전치사예요. 'power as a species'는 '하나의 종으로서(가지는) 힘'이라고 해석돼요.", ex:"We are now at a point of unprecedented genetic, cultural, and environmental power as a species, and we are linked to nearly every other person on Earth.", exko:"우리는 지금 하나의 종으로서 전례 없는 유전적, 문화적, 환경적 힘을 가진 시점에 있으며, 지구상의 거의 모든 다른 사람들과 연결되어 있다." },
    to: { word:"to", tag:"[to부정사 · 형용사적 용법 · 병렬]", meaning:"앞의 명사 responsibility를 꾸며주는 형용사적 용법의 to부정사가 병렬로 이어져요. 'to become good ancestors', '(to) take the long view', '(to) time travel forward to imagine ~'가 모두 '~해야 할 (책임)'이라는 의미로 연결됩니다.", ex:"Our decisions today have far-reaching impacts that place a responsibility on us to become good ancestors, to take the long view and time travel forward to imagine the well-being of billions of people whose lives will be lived in the world we are currently making.", exko:"오늘 우리의 결정은 멀리까지 미치는 영향을 갖고 있으며, 그것은 우리에게 좋은 조상이 될 책임, 즉 장기적인 안목을 갖고 미래로 시간 여행을 하여 우리가 현재 만들어가고 있는 세상에서 살아갈 수십억 명의 안녕을 상상해야 할 책임을 지운다." },
    into: { word:"into", tag:"[전치사 into · 시간]", meaning:"into는 보통 '~안으로(공간)'라는 뜻이지만, 'seven generations into the future'에서는 시간적으로 '미래로 (일곱 세대만큼) 들어가서' 즉 '미래 일곱 세대 후'라는 뜻으로 쓰였어요.", ex:"Centuries ago, leaders of the native North American Iroquois people created \"seven generation stewardship,\" instructing people to consider the impact of every decision on their children, seven generations into the future.", exko:"수 세기 전, 북미 원주민 이로쿼이족의 지도자들은 '일곱 세대 관리'라는 것을 만들어, 사람들에게 모든 결정이 미래 일곱 세대 후의 자손들에게 미칠 영향을 고려하도록 가르쳤다." },
    point: { word:"point", tag:"[명사 point · 의미 확인 필요]", meaning:"point는 '요점, 점수'라는 뜻으로 흔히 알려져 있지만, 여기 at a point of unprecedented ... power에서는 '시점(어떤 시기)'이라는 뜻이에요. '전례 없는 힘의 요점에'가 아니라 '전례 없는 힘을 가진 시점에'라고 해석해야 자연스러워요.", ex:"We are now at a point of unprecedented genetic, cultural, and environmental power as a species, and we are linked to nearly every other person on Earth.", exko:"우리는 지금 하나의 종으로서 전례 없는 유전적, 문화적, 환경적 힘을 가진 시점에 있으며, 지구상의 거의 모든 다른 사람들과 연결되어 있다." },
    place: { word:"place", tag:"[동사 place · 품사 확인 필요]", meaning:"place는 명사로 '장소'라는 뜻이 가장 먼저 떠오르지만, 여기 impacts that place a responsibility on us에서는 '(책임 등을) 지우다, 부과하다'라는 뜻의 동사예요. '우리에게 책임을 놓는다'가 아니라 '우리에게 책임을 지운다'라고 해석해야 자연스러워요.", ex:"Our decisions today have far-reaching impacts that place a responsibility on us to become good ancestors, to take the long view and time travel forward to imagine the well-being of billions of people whose lives will be lived in the world we are currently making.", exko:"오늘 우리의 결정은 멀리까지 미치는 영향을 갖고 있으며, 그것은 우리에게 좋은 조상이 될 책임, 즉 장기적인 안목을 갖고 미래로 시간 여행을 하여 우리가 현재 만들어가고 있는 세상에서 살아갈 수십억 명의 안녕을 상상해야 할 책임을 지운다." },

  passage: `We are now at a point of [[unprecedented::unprecedented]] genetic, cultural, and environmental power as a species, and we are linked to nearly every other person on Earth. We are [[embodied::embodied]] individuals trapped within limited time, but we are also [[networked::networked]] data streams, memories, and influencers, and part of a grander humanity. Our decisions today have [[far_reaching::far-reaching]] impacts that place a responsibility on us to become good [[ancestors::ancestors]], to [[take_the_long_view::take the long view]] and time travel forward to imagine the well-being of billions of people whose lives will be lived in the world we are currently making. Centuries ago, leaders of the native North American Iroquois people created "seven generation [[stewardship::stewardship]]," instructing people to consider the impact of every decision on their children, seven generations into the future. In the precious few decades that Earth is ours, while we enjoy the gardens planted by our ancestors, we must not steal the shade from our [[descendants::descendants]].`,
  translation: `우리는 지금 하나의 종으로서 전례 없는 유전적, 문화적, 환경적 힘을 가진 시점에 있으며, 지구상의 거의 모든 다른 사람들과 연결되어 있다. 우리는 제한된 시간 안에 갇힌 육신을 가진 개인이지만, 또한 연결된 데이터 흐름이자 기억이며 영향력을 미치는 존재이고, 더 큰 인류의 일부이기도 하다. 오늘 우리의 결정은 멀리까지 미치는 영향을 갖고 있으며, 그것은 우리에게 좋은 조상이 될 책임, 즉 장기적인 안목을 갖고 미래로 시간 여행을 하여 우리가 현재 만들어가고 있는 세상에서 살아갈 수십억 명의 안녕을 상상해야 할 책임을 지운다. 수 세기 전, 북미 원주민 이로쿼이족의 지도자들은 '일곱 세대 관리'라는 것을 만들어, 사람들에게 모든 결정이 미래 일곱 세대 후의 자손들에게 미칠 영향을 고려하도록 가르쳤다. 지구가 우리의 것인 그 소중한 몇십 년 동안, 우리가 조상들이 심어 놓은 정원을 누리는 한편, 우리는 후손들로부터 그늘을 훔쳐서는 안 된다.`,

  passage: `Despite learned eating behaviors that are formed in early childhood and [[inborn::inborn]] biological differences, taste [[preferences::preferences]] can be changed throughout our lives due to [[neuroplasticity::neuroplasticity]], our brain's amazing [[adaptability::adaptability]]: There is far more [[flexibility::flexibility]] in our food behaviors than most think, even as we age. This is terrific news for [[adventurous::adventurous]] eaters who want to expand their dinner menu — it's a big, tasty world out there! — but it's amazing news for those eager to break poor diet habits. Just as kids gradually learn to like nutritious foods, so, too, can adults [[readjust::readjust]] their taste. Many who switch from processed grain foods like white bread and white rice to whole grain types, for instance, gradually learn to prefer the nutty flavors and chewy textures. Repeated [[exposure::exposure]] — and a willingness to change — is the key.`,
  translation: `어린 시절에 형성된 학습된 식행동과 타고난 생물학적 차이에도 불구하고, 미각 선호는 신경 가소성, 즉 우리 뇌의 놀라운 적응력 덕분에 평생에 걸쳐 바뀔 수 있다. 우리가 나이를 먹어가더라도, 우리의 식행동에는 대부분의 사람들이 생각하는 것보다 훨씬 더 많은 유연성이 있다. 이것은 저녁 메뉴를 넓히고 싶어 하는 모험적인 식성을 가진 사람들에게 굉장한 소식이지만 — 저 바깥에는 크고 맛있는 세상이 있다! — 형편없는 식습관을 고치고 싶어 안달인 사람들에게는 놀라운 소식이다. 아이들이 점차 영양가 있는 음식을 좋아하게 되는 법을 배우는 것처럼, 성인들도 마찬가지로 자신의 미각을 다시 조정할 수 있다. 예를 들어, 흰 빵이나 흰쌀 같은 가공된 곡물 식품에서 통곡물 종류로 바꾸는 많은 사람들이 점차 고소한 풍미와 쫄깃한 식감을 선호하게 되는 법을 배운다. 반복된 노출, 그리고 변화하려는 의지가 핵심이다.`,

  passage: `[[conformity::Conformity]] in the teenage years has been studied by putting young people in situations where they are asked to make a choice or decision where that appears to [[go_against::go against]] what everyone else in the group is saying. The [[fascinating::fascinating]] thing about the results of these studies is that conformity is not [[spread::spread]] equally across all age groups. Thus, the [[willingness::willingness]] to go along with others reaches a [[peak::peak]] around the age of 14. After that, this tendency decreases, so that by 16 or 17, young people are much more able to disagree with the group and to [[stand_up_for::stand up for]] their own opinion. This is an important finding. It demonstrates that the influence of the peer group is not the same across all ages. As young people mature, they become more [[resilient::resilient]], and more able to defend their opinions as individuals.`,

function renderPassage(text) {
  return text.split('\n\n').map(function(para) {
    var ph = [];
    var html = para.replace(/\[\[(.+?)::(.+?)\]\]/g, function(m, key, disp) {
      ph.push('<span class="w" onclick="showWord(\'' + key + '\')">' + disp + '</span>');
      return '§' + (ph.length - 1) + '§';
    });
    html = html.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g, function(w) {
      return '<span class="p" onclick="showPlain(\'' + w.replace(/'/g, "\\'") + '\')">' + w + '</span>';
    });
    html = html.replace(/§(\d+)§/g, function(m, i) { return ph[i]; });
    return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

  if (window.studyStats) window.studyStats.record('quiz', ok);
  r.classList.add('show', ok ? 'ok' : 'no');
  r.innerHTML = '<b>' + (ok ? '🎉 정답이에요!' : '아쉬워요, 정답은 ' + circled[p.answer] + '번이에요.') + '</b><br>' + p.explanation;
  var b = document.getElementById('quiz-check-btn');
  b.textContent = '다시 풀기';
  b.onclick = function() { renderQuiz(p); };
}

function render() {
  closeWord();
  var p = problems[current];
  document.getElementById('prog-text').textContent = (current + 1) + ' / ' + problems.length;
  document.getElementById('prog-fill').style.width = ((current + 1) / problems.length * 100) + '%';
  document.getElementById('type-badge').textContent = p.num + '번 · ' + p.type;
  document.getElementById('passage-text').innerHTML = renderPassage(p.passage);
  renderQuiz(p);
  document.getElementById('translation-box').textContent = p.translation;
  document.getElementById('translation-box').classList.remove('show');
  document.getElementById('btn-trans').classList.remove('on');
  document.getElementById('btn-trans').textContent = '🇰🇷 전체 해석 보기';

  var vg = document.getElementById('vocab-grid');
  vg.innerHTML = Object.keys(p.vocab).map(function(k) {
    var v = p.vocab[k];
    return '<div class="vocab-chip" onclick="showWord(\'' + k + '\')"><b>' + v.word + '</b><span>' + v.meaning + '</span></div>';
  }).join('');
  vg.classList.remove('show');
  document.getElementById('btn-vocab').classList.remove('on');
  document.getElementById('btn-vocab').textContent = '📖 핵심 단어 목록';

  document.getElementById('grammar-list').innerHTML = p.grammar.map(function(g) {
    return '<div class="grammar-item"><div class="grammar-title">' + g.title + '</div><div class="grammar-desc">' + g.desc + '</div><div class="grammar-ex">' + g.ex + '</div></div>';
  }).join('');
  document.getElementById('tip-list').innerHTML = p.tips.map(function(t) { return '<div class="tip-item"><p>' + t + '</p></div>'; }).join('');

  document.querySelectorAll('.p-tab').forEach(function(t, i) { t.classList.toggle('active', i === current); });
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === problems.length - 1;
  document.getElementById('btn-next').textContent = current === problems.length - 1 ? '처음으로' : '다음 문제 →';
  switchTab('grammar');
}

function selectProblem(i) { current = i; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function go(d) {
  if (current === problems.length - 1 && d === 1) current = 0;
  else current = Math.max(0, Math.min(problems.length - 1, current + d));
  render(); window.scrollTo({top:0, behavior:'smooth'});
}

function toggleTranslation() {
  var box = document.getElementById('translation-box'), btn = document.getElementById('btn-trans');
  var s = !box.classList.contains('show');
  box.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '🇰🇷 해석 숨기기' : '🇰🇷 전체 해석 보기';
}

function toggleVocabGrid() {
  var g = document.getElementById('vocab-grid'), btn = document.getElementById('btn-vocab');
  var s = !g.classList.contains('show');
  g.classList.toggle('show', s); btn.classList.toggle('on', s);
  btn.textContent = s ? '📖 목록 숨기기' : '📖 핵심 단어 목록';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-t') === name); });
  document.getElementById('tab-grammar').classList.toggle('active', name === 'grammar');
  document.getElementById('tab-tip').classList.toggle('active', name === 'tip');
}

function showWord(key) {
  var v = problems[current].vocab[key];
  if (!v) return;
  activeVocabKey = key; activeSheetWord = null; currentSpeakWord = v.word;
  currentSheetWordData = { word:v.word, pron:v.pron, meaning:v.meaning, en:v.ex, ko:v.exko };
  document.getElementById('sheet-word').textContent = v.word;
  document.getElementById('sheet-pron').textContent = v.pron;
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = v.meaning;
  document.getElementById('sheet-example').innerHTML = v.ex + '<br>' + v.exko;
  var etymEl = document.getElementById('sheet-etym');
  if (v.etym) { etymEl.innerHTML = '<b>🔤 어원</b><br>' + v.etym; etymEl.classList.add('show'); }
  else { etymEl.innerHTML = ''; etymEl.classList.remove('show'); }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
}

function splitSentences(text) {
  var flat = text.replace(/\s+/g, ' ').trim();
  var parts = flat.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [flat];
  return parts.map(function(s) { return s.trim(); }).filter(Boolean);
}

function findSentenceForWord(word) {
  var p = problems[current];
  var plain = p.passage.replace(/\[\[(.+?)::(.+?)\]\]/g, '$2');
  var enSentences = splitSentences(plain);
  var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  for (var i = 0; i < enSentences.length; i++) {
    if (re.test(enSentences[i])) {
      var koSentences = splitSentences(p.translation || '');
      var ko = (koSentences.length === enSentences.length) ? koSentences[i] : null;
      return { en: enSentences[i], ko: ko };
    }
  }
  return null;
}

var POS_KO = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', preposition:'전치사', conjunction:'접속사', pronoun:'대명사', interjection:'감탄사', determiner:'한정사', numeral:'수사', article:'관사', exclamation:'감탄사' };

function cleanKoMeaning(data) {
  var cands = [];
  if (data && data.responseData && data.responseData.translatedText) cands.push(data.responseData.translatedText);
  if (data && data.matches) for (var j = 0; j < data.matches.length; j++) { if (data.matches[j] && data.matches[j].translation) cands.push(data.matches[j].translation); }
  for (var i = 0; i < cands.length; i++) {
    var t = String(cands[i]).trim();
    if (/[가-힣]/.test(t) && !/[一-鿿぀-ヿ]/.test(t) && t.length <= 40) return t;
  }
  for (var i2 = 0; i2 < cands.length; i2++) {
    var t2 = String(cands[i2]).replace(/[一-鿿぀-ヿ]/g, '').replace(/\s+/g, ' ').trim();
    if (/[가-힣]/.test(t2)) return t2;
  }
  return null;
}

function showFuncWord(displayWord, entry) {
  activeVocabKey = null;
  activeSheetWord = null;
  currentSpeakWord = displayWord;
  currentSheetWordData = null;
  document.getElementById('sheet-word').textContent = displayWord;
  document.getElementById('sheet-pron').textContent = entry.tag || '문법 포인트';
  document.getElementById('sheet-pron').classList.add('tag-mode');
  document.getElementById('sheet-star').classList.add('hide');
  document.getElementById('sheet-meaning').textContent = entry.meaning;
  document.getElementById('sheet-example').innerHTML = entry.ex + '<br>' + entry.exko;
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function showPlain(rawWord) {
  var clean = rawWord.replace(/[^A-Za-z']/g, '');
  if (!clean) return;
  var lower = clean.toLowerCase();
  var p = problems[current];
  for (var k in p.vocab) {
    if (p.vocab[k].word.toLowerCase() === lower) { showWord(k); return; }
  }
  if (p.funcWords && p.funcWords[lower]) { showFuncWord(clean, p.funcWords[lower]); return; }
  activeVocabKey = null;
  currentSpeakWord = clean;
  activeSheetWord = lower;
  var found = findSentenceForWord(clean);
  var sentence = found ? found.en : null;
  var koSentence = found ? found.ko : null;
  currentSheetWordData = { word: clean, pron: '', meaning: '뜻을 찾는 중...', en: sentence || '', ko: koSentence || '' };
  document.getElementById('sheet-word').textContent = clean;
  document.getElementById('sheet-pron').textContent = '';
  document.getElementById('sheet-pron').classList.remove('tag-mode');
  document.getElementById('sheet-star').classList.remove('hide');
  document.getElementById('sheet-meaning').textContent = '뜻을 찾는 중...';
  document.getElementById('sheet-example').innerHTML = sentence ? (sentence + '<br>' + (koSentence || '해석을 불러오는 중...')) : '';
  document.getElementById('sheet-etym').innerHTML = '';
  document.getElementById('sheet-etym').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  updateSheetStarBtn();
  lookupWord(lower, sentence, koSentence);
}

function lookupWord(lower, sentence, koSentence) {
  var posText = '';
  var koMeaning = '';
  function renderMeaning() {
    if (!koMeaning) return;
    var full = (posText ? '[' + posText + '] ' : '') + koMeaning;
    document.getElementById('sheet-meaning').textContent = full;
    if (currentSheetWordData) currentSheetWordData.meaning = full;
  }

  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(lower))
    .then(function(r) { if (!r.ok) throw new Error('no entry'); return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var entry = data[0];
      var phonetic = entry.phonetic || '';
      if (!phonetic && entry.phonetics) {
        for (var i = 0; i < entry.phonetics.length; i++) {
          if (entry.phonetics[i].text) { phonetic = entry.phonetics[i].text; break; }
        }
      }
      if (phonetic) document.getElementById('sheet-pron').textContent = phonetic;
      if (currentSheetWordData) currentSheetWordData.pron = phonetic;
      if (entry.meanings) {
        var seen = {};
        var list = [];
        for (var m = 0; m < entry.meanings.length; m++) {
          var ko = POS_KO[entry.meanings[m].partOfSpeech];
          if (ko && !seen[ko]) { seen[ko] = true; list.push(ko); }
        }
        if (list.length) { posText = list.slice(0, 2).join('·'); renderMeaning(); }
      }
    })
    .catch(function() {});

  fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(lower) + '&langpair=en|ko')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (activeSheetWord !== lower) return;
      var ko = cleanKoMeaning(data);
      if (ko) { koMeaning = ko; renderMeaning(); }
      else {
        document.getElementById('sheet-meaning').textContent = '뜻을 찾을 수 없어요. 🔊 버튼으로 발음만 들어보세요.';
        if (currentSheetWordData) currentSheetWordData.meaning = '뜻 정보 없음';
      }
    })
    .catch(function() {
      if (activeSheetWord !== lower) return;
      document.getElementById('sheet-meaning').textContent = '인터넷 연결을 확인해주세요. 🔊 버튼으로 발음은 들을 수 있어요.';
    });

  if (sentence && !koSentence) {
    fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentence) + '&langpair=en|ko')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (activeSheetWord !== lower) return;
        var ko = data && data.responseData && data.responseData.translatedText;
        document.getElementById('sheet-example').innerHTML = sentence + (ko ? ('<br>' + ko) : '');
        if (currentSheetWordData) { currentSheetWordData.en = sentence; currentSheetWordData.ko = ko || ''; }
      })
      .catch(function() {
        if (activeSheetWord !== lower) return;
        document.getElementById('sheet-example').innerHTML = sentence;
      });
  }
}

function closeWord() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  activeSheetWord = null;
}

function speakCurrent() { if (currentSpeakWord) speak(currentSpeakWord); }

var ttsVoices = [];
if ('speechSynthesis' in window) {
  var lv = function() { ttsVoices = window.speechSynthesis.getVoices(); };
  lv(); window.speechSynthesis.onvoiceschanged = lv;
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  var s = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  var vs = (ttsVoices && ttsVoices.length) ? ttsVoices : s.getVoices();
  if (vs && vs.length) {
    var v = vs.find(function(x) { return x.lang === 'en-US'; }) || vs.find(function(x) { return x.lang && x.lang.indexOf('en') === 0; });
    if (v) u.voice = v;
  }
  s.cancel();
  setTimeout(function() { s.speak(u); }, 80);
}

buildTabs();
render();
</script>
<script src="study-stats.js"></script>
